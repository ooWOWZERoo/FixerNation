<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Choice Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="brain-games.css?v=7">
</head>
<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=17"></script>
<script src="site-auth.js?v=11"></script>
<script src="footer.js?v=10"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js?v=3"></script>
<script src="engine-sdk.js?v=5"></script>
<script src="engine-branching-scenario.js?v=6"></script>
<script>
  // Choice Quest - catalog scaling slice (Explore band). The same
  // Issues-to-Answers 5-step cycle as Decision Point, adventure-framed
  // per the Explore band's developmental design (friendship repair,
  // inclusion, cooperation - roadmap section 6.5) rather than Decision
  // Point's older-band peer/digital scenario.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'explore';

  const contentPack = {
    title: 'Choice Quest',
    steps: [
      {
        "key": "recognize",
        "prompt": "Your team is making a diorama. Mia has not finished her part, and it is due tomorrow.",
        "choices": [
          {
            "id": "notice-mia",
            "text": "Maybe Mia is stuck and needs some help with her part.",
            "type": "responsible",
            "feedback": "Good noticing. There may be more going on than you can see."
          },
          {
            "id": "assume-lazy",
            "text": "Mia is lazy and does not care about the project.",
            "type": "plausible_incomplete",
            "feedback": "Maybe, but that is only a guess. Ask her first."
          },
          {
            "id": "only-deadline",
            "text": "The project is due soon, so only finishing it matters.",
            "type": "plausible_incomplete",
            "feedback": "Finishing matters, but you would miss what is going on with Mia."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "If Mia's part is not finished, what happens?",
        "choices": [
          {
            "id": "team-and-mia",
            "text": "The project stays unfinished, and Mia may feel upset.",
            "type": "responsible",
            "feedback": "Right. It hurts the whole team, including Mia."
          },
          {
            "id": "only-mia",
            "text": "Only Mia is in trouble, so it is not the team's problem.",
            "type": "plausible_incomplete",
            "feedback": "A team project means a team result. It is everyone's problem."
          },
          {
            "id": "more-time",
            "text": "The teacher will give more time, so nobody needs to worry.",
            "type": "plausible_incomplete",
            "feedback": "Maybe, but extra time is only a guess. The problem would still be there."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What could your team do about this?",
        "choices": [
          {
            "id": "ask-and-plan",
            "text": "Ask Mia if she needs help and make a plan together.",
            "type": "responsible",
            "feedback": "A plan made together beats guessing what to do."
          },
          {
            "id": "do-it-quietly",
            "text": "Finish her part tonight yourself and do not tell her.",
            "type": "plausible_incomplete",
            "feedback": "That solves the deadline, but it skips Mia and what she needs."
          },
          {
            "id": "tell-team",
            "text": "Tell the team that Mia is the one holding things up.",
            "type": "plausible_incomplete",
            "feedback": "It puts Mia on the spot and gives no way forward."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What is the best next step?",
        "choices": [
          {
            "id": "check-in-privately",
            "text": "Ask Mia privately if she is okay and offer to help.",
            "type": "responsible",
            "feedback": "A private check-in is kind and tells you what is really wrong."
          },
          {
            "id": "team-redivide",
            "text": "Suggest the team share Mia's work fairly, with her say.",
            "type": "multiple_defensible",
            "feedback": "Also a good move. Including Mia keeps it from feeling like a punishment."
          },
          {
            "id": "blame-to-teacher",
            "text": "Tell the teacher Mia is ruining it before you talk to her.",
            "type": "unsafe",
            "feedback": "Blaming her before asking could embarrass her for no reason."
          },
          {
            "id": "flag-if-overwhelmed",
            "text": "If Mia seems very upset, tell the teacher to get her help.",
            "type": "seek_help",
            "feedback": "Asking a trusted adult is wise when something bigger may be wrong."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "How can you check in with a stuck teammate?",
        "freeReflection": true
      }
    ],
  };

  // Choice Quest stories: Mia (above), the borrowed markers, the rules that keep changing, a secret that is not yours.
  // Phase 3: the original story above plus three more. The game picks one whole story per run (FnEngineSDK variants).
  // Step 4 offers four choices; steps 1 to 3 offer three. Option lengths are balanced on purpose (see server/scripts/audit-brain-games.js).
  contentPack.variants = [
    { steps: contentPack.steps },
    { steps: [
      {
        "key": "recognize",
        "prompt": "You borrowed Dev's new markers for a poster. At home, you find one uncapped and dried out.",
        "choices": [
          {
            "id": "cq2-1-1",
            "text": "You feel worried, and Dev will probably find the dry marker.",
            "type": "responsible",
            "feedback": "Good noticing. Worry tells you this matters, and facing it early helps."
          },
          {
            "id": "cq2-1-2",
            "text": "It is one marker in a big set. Dev will not mind.",
            "type": "plausible_incomplete",
            "feedback": "It may be small, but it is Dev's new set."
          },
          {
            "id": "cq2-1-3",
            "text": "Maybe it was dry when Dev lent it. Not your problem.",
            "type": "plausible_incomplete",
            "feedback": "That could be true, but you do not know it. Check first."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "If you return the set and say nothing, what could happen?",
        "choices": [
          {
            "id": "cq2-2-1",
            "text": "Dev may find it later, and lending you things gets harder.",
            "type": "responsible",
            "feedback": "Yes. Honesty about small things builds trust, and surprises break it."
          },
          {
            "id": "cq2-2-2",
            "text": "Nothing much, since Dev has other markers and will not check.",
            "type": "plausible_incomplete",
            "feedback": "He might not check. But you would carry the secret."
          },
          {
            "id": "cq2-2-3",
            "text": "Dev will be upset for a day, then he will forget it.",
            "type": "plausible_incomplete",
            "feedback": "He may forget. He is more likely to remember you said nothing."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What could you do about it?",
        "choices": [
          {
            "id": "cq2-3-1",
            "text": "Tell Dev what happened, say sorry, and ask how to fix it.",
            "type": "responsible",
            "feedback": "Telling him first shows respect and lets you fix it together."
          },
          {
            "id": "cq2-3-2",
            "text": "Buy a new marker and slip it in so Dev never knows.",
            "type": "plausible_incomplete",
            "feedback": "Replacing it is kind, but Dev never hears it from you."
          },
          {
            "id": "cq2-3-3",
            "text": "Return the set and let Dev find the marker on his own.",
            "type": "plausible_incomplete",
            "feedback": "That leaves Dev to find the problem alone. It may feel like hiding."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What is the best thing to do now?",
        "choices": [
          {
            "id": "cq2-4-1",
            "text": "Tell Dev about the dry marker, and say you are sorry.",
            "type": "responsible",
            "feedback": "You are honest and Dev hears it from you. That builds trust."
          },
          {
            "id": "cq2-4-2",
            "text": "Offer to buy a new marker and ask which color he wants.",
            "type": "multiple_defensible",
            "feedback": "Also good. Offering to fix it and asking Dev shows you respect his choice."
          },
          {
            "id": "cq2-4-3",
            "text": "Return the set quietly and hope Dev never finds the marker.",
            "type": "unsafe",
            "feedback": "Hoping nobody notices rarely works. If Dev finds it first, silence looks worse."
          },
          {
            "id": "cq2-4-4",
            "text": "Ask a parent or teacher how to start talking to Dev.",
            "type": "seek_help",
            "feedback": "A trusted adult can help you find words when you feel nervous."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "What could you say after a mistake with something not yours?",
        "freeReflection": true
      }
    ] },
    { steps: [
      {
        "key": "recognize",
        "prompt": "At recess you play tag. Ravi keeps changing the rules so he is never \"it\". Friends are annoyed, and one walks away.",
        "choices": [
          {
            "id": "cq3-1-1",
            "text": "The game feels unfair to several friends at once.",
            "type": "responsible",
            "feedback": "Good noticing. When many people feel the same, it matters."
          },
          {
            "id": "cq3-1-2",
            "text": "Ravi is just competitive, so that is how he plays.",
            "type": "plausible_incomplete",
            "feedback": "Some people play hard to win. Changing rules for one person is different."
          },
          {
            "id": "cq3-1-3",
            "text": "It is only a game, so just play something else.",
            "type": "plausible_incomplete",
            "feedback": "Leaving is one choice. But it leaves the problem for friends who stay."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "If the rules keep changing, what will happen to the game?",
        "choices": [
          {
            "id": "cq3-2-1",
            "text": "More friends may quit, and Ravi may never learn why.",
            "type": "responsible",
            "feedback": "Yes. The game suffers, and Ravi cannot fix what he does not know."
          },
          {
            "id": "cq3-2-2",
            "text": "Ravi will notice soon and fix it, so nobody needs to act.",
            "type": "plausible_incomplete",
            "feedback": "He might. People often miss their own habits unless someone kindly says so."
          },
          {
            "id": "cq3-2-3",
            "text": "The friends will get over it, since tag ends in minutes.",
            "type": "plausible_incomplete",
            "feedback": "The feeling may fade, but it can return. Recess happens most days."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What could you do about it?",
        "choices": [
          {
            "id": "cq3-3-1",
            "text": "Suggest the group agree on the rules before the next round.",
            "type": "responsible",
            "feedback": "Agreeing first takes blame off one person and helps every game."
          },
          {
            "id": "cq3-3-2",
            "text": "Say loudly that Ravi is cheating so he has to stop.",
            "type": "plausible_incomplete",
            "feedback": "Calling someone out makes them defend themselves instead of listening."
          },
          {
            "id": "cq3-3-3",
            "text": "Start a new game with the annoyed friends and leave Ravi out.",
            "type": "plausible_incomplete",
            "feedback": "That fixes today's game. But Ravi is left out and does not know why."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What is the best next step?",
        "choices": [
          {
            "id": "cq3-4-1",
            "text": "Say, \"Can we pick the rules together before we start again?\"",
            "type": "responsible",
            "feedback": "A request that includes everyone lets Ravi say yes without feeling attacked."
          },
          {
            "id": "cq3-4-2",
            "text": "Talk to Ravi alone later and tell him how it felt.",
            "type": "multiple_defensible",
            "feedback": "A private talk spares Ravi embarrassment. It is slower, though, and the game may be over."
          },
          {
            "id": "cq3-4-3",
            "text": "Tell the group Ravi is a cheater and nobody should play.",
            "type": "unsafe",
            "feedback": "Labeling Ravi turns a rule problem into a personal one."
          },
          {
            "id": "cq3-4-4",
            "text": "Ask the recess helper to help the group agree on fair rules.",
            "type": "seek_help",
            "feedback": "A helper keeps things calm and fair when a group is stuck."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "How can a group fairly decide the rules before a game?",
        "freeReflection": true
      }
    ] },
    { steps: [
      {
        "key": "recognize",
        "prompt": "Lena told you she is nervous about reading aloud tomorrow. At lunch, a classmate asks if she is scared.",
        "choices": [
          {
            "id": "cq4-1-1",
            "text": "Lena told you in trust, and you are asked to share.",
            "type": "responsible",
            "feedback": "Good noticing. Seeing that it was shared in trust helps you keep it."
          },
          {
            "id": "cq4-1-2",
            "text": "It is only a feeling about reading, so sharing it is fine.",
            "type": "plausible_incomplete",
            "feedback": "Lena chose you to tell. Feelings like nerves are personal."
          },
          {
            "id": "cq4-1-3",
            "text": "The classmate wants to help, so it is nice to tell them.",
            "type": "plausible_incomplete",
            "feedback": "They may mean well. Even so, how Lena feels is hers to share."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "If Lena finds out you told, what could happen?",
        "choices": [
          {
            "id": "cq4-2-1",
            "text": "Lena may feel embarrassed and stop telling you things.",
            "type": "responsible",
            "feedback": "Yes. Trust is hard to rebuild, and tomorrow could feel harder."
          },
          {
            "id": "cq4-2-2",
            "text": "Lena will not mind, since many kids feel nervous too.",
            "type": "plausible_incomplete",
            "feedback": "Many people feel nervous. That does not mean she wants others to know."
          },
          {
            "id": "cq4-2-3",
            "text": "Lena may be upset, but she will know you meant to help.",
            "type": "plausible_incomplete",
            "feedback": "She might forgive you. She might also wonder what else you will share."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "How could you answer the classmate?",
        "choices": [
          {
            "id": "cq4-3-1",
            "text": "Say, \"That is Lena's to share,\" and kindly change the subject.",
            "type": "responsible",
            "feedback": "It is honest and kind, and you do not speak for Lena."
          },
          {
            "id": "cq4-3-2",
            "text": "Say \"I don't know\" even though you do, so they stop asking.",
            "type": "plausible_incomplete",
            "feedback": "That ends the questions, but it is untrue. You can be honest and protect her."
          },
          {
            "id": "cq4-3-3",
            "text": "Say a little, like \"She is a bit worried,\" to seem honest.",
            "type": "plausible_incomplete",
            "feedback": "A little still counts as telling. The rest is easy to guess."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What is the best next step?",
        "choices": [
          {
            "id": "cq4-4-1",
            "text": "Say it is Lena's to share, then offer her practice help.",
            "type": "responsible",
            "feedback": "That protects her privacy, keeps you honest, and offers help."
          },
          {
            "id": "cq4-4-2",
            "text": "Say you are not sure, then tell Lena someone asked about her.",
            "type": "multiple_defensible",
            "feedback": "Her feelings stay private, and Lena can decide. Saying it is hers to share is more honest."
          },
          {
            "id": "cq4-4-3",
            "text": "Tell the classmate Lena is nervous, since it is no big deal.",
            "type": "unsafe",
            "feedback": "Calling it no big deal decides for Lena. She trusted you to keep it."
          },
          {
            "id": "cq4-4-4",
            "text": "Ask a teacher how to support Lena without sharing her feelings.",
            "type": "seek_help",
            "feedback": "A teacher can help you support her and keep her feelings private."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "What helps you know whether something is yours to share?",
        "freeReflection": true
      }
    ] }
  ];

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'branchingScenario',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'choice-quest-team-project',
    header: {
      icon: '🗺️',
      title: 'Choice Quest',
      description: 'Work through what is happening with your team, who it affects, and what to do about it.',
    },
  });
</script>
</body>
</html>
