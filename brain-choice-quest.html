<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Choice Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="brain-games.css?v=3">
</head>
<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=16"></script>
<script src="site-auth.js?v=10"></script>
<script src="footer.js?v=9"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js"></script>
<script src="engine-sdk.js?v=2"></script>
<script src="engine-branching-scenario.js?v=4"></script>
<script>
  // Choice Quest - catalog scaling slice (Explore band). The same
  // Issues-to-Answers 5-step cycle as Decision Point, adventure-framed
  // per the Explore band's developmental design (friendship repair,
  // inclusion, cooperation - roadmap section 6.5) rather than Decision
  // Point's older-band peer/digital scenario.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'explore';

  const contentPack = {
    title: 'Choice Quest',
    steps: [
      {
        "key": "recognize",
        "prompt": "Your team is building a diorama for the class project. Mia has not finished her part, and the project is due tomorrow.",
        "choices": [
          {
            "id": "notice-mia",
            "text": "Notice that Mia might be stuck or need help, not just that she is not trying.",
            "type": "responsible",
            "feedback": "Good noticing. There could be more going on than it first looks like."
          },
          {
            "id": "assume-lazy",
            "text": "Mia is being lazy and does not really care about how the project turns out.",
            "type": "plausible_incomplete",
            "feedback": "Maybe, but that is a guess. It is worth finding out what is really going on first."
          },
          {
            "id": "only-deadline",
            "text": "The project is due soon, so the only thing that matters is getting it finished.",
            "type": "plausible_incomplete",
            "feedback": "Finishing matters. If you only look at the deadline, though, you miss what is going on with Mia and how the team can get there together."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "If Mia's part is not finished, what happens?",
        "choices": [
          {
            "id": "team-and-mia",
            "text": "The whole team's project could be unfinished, and Mia might feel embarrassed or stressed too.",
            "type": "responsible",
            "feedback": "Right. This affects the whole team, including Mia."
          },
          {
            "id": "only-mia",
            "text": "Only Mia will be in trouble for it, so this is not really a problem for the rest of the team.",
            "type": "plausible_incomplete",
            "feedback": "A team project usually means a team result. It is everyone's problem, not just Mia's."
          },
          {
            "id": "more-time",
            "text": "The teacher will probably give the team more time, so there is nothing to worry about yet.",
            "type": "plausible_incomplete",
            "feedback": "A teacher might. Counting on extra time is a guess, though, and the team and Mia would still have the same problem tomorrow."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What are some ways your team could handle this?",
        "choices": [
          {
            "id": "ask-and-plan",
            "text": "Ask Mia if she needs help, and work out a plan together that fits the time left.",
            "type": "responsible",
            "feedback": "Having a real plan, made together, beats guessing what to do."
          },
          {
            "id": "do-it-quietly",
            "text": "Finish her part yourself tonight so the project is done on time, without telling her.",
            "type": "plausible_incomplete",
            "feedback": "This solves the deadline, but it skips Mia entirely and does not find out what she actually needs."
          },
          {
            "id": "tell-team",
            "text": "Tell the whole team that Mia has not finished, so everyone knows who is holding things up.",
            "type": "plausible_incomplete",
            "feedback": "Everyone would know, but it puts Mia on the spot before anyone has asked what is wrong, and it does not give the team a way forward."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What is the most constructive next step right now?",
        "choices": [
          {
            "id": "check-in-privately",
            "text": "Ask Mia privately if everything is okay and offer to help with her part of the project.",
            "type": "responsible",
            "feedback": "A private check-in respects Mia and gets you real information before anyone decides anything."
          },
          {
            "id": "team-redivide",
            "text": "Suggest that the team divide up Mia's remaining work fairly, with her input.",
            "type": "multiple_defensible",
            "feedback": "Also a solid move. Fair redivision, with Mia included, keeps this from feeling like a punishment."
          },
          {
            "id": "blame-to-teacher",
            "text": "Tell the teacher that Mia is ruining the project before you have talked to her.",
            "type": "unsafe",
            "feedback": "Going straight to blame, without ever asking Mia what is going on, could embarrass her for something that might not even be her fault."
          },
          {
            "id": "flag-if-overwhelmed",
            "text": "If Mia seems really upset or overwhelmed, let the teacher know so an adult can help.",
            "type": "seek_help",
            "feedback": "Asking a trusted adult for help is a reasonable choice, especially if something bigger than a school project seems to be going on."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "What is one way you could check in with a teammate who seems stuck, next time it happens?",
        "freeReflection": true
      }
    ],
  };

  // Choice Quest stories: Mia (above), the borrowed markers, the rules that keep changing, a secret that is not yours.
  // Phase 3: the original story above plus three more. The game picks one whole story per run (FnEngineSDK variants).
  // Step 4 offers four choices; steps 1 to 3 offer three. Option lengths are balanced on purpose (see server/scripts/audit-brain-games.js).
  contentPack.variants = [
    { steps: contentPack.steps },
    { steps: [
      {
        "key": "recognize",
        "prompt": "You borrowed Dev's brand-new marker set to finish a poster. When you open the case at home, one marker has been left uncapped and it has dried out.",
        "choices": [
          {
            "id": "cq2-1-1",
            "text": "Notice that you feel worried, and that Dev will probably find the dried marker.",
            "type": "responsible",
            "feedback": "Good noticing. Worry is a clue that this matters to you, and facing it early gives you more choices."
          },
          {
            "id": "cq2-1-2",
            "text": "It is only one marker out of many in a big set, so it probably will not matter to Dev.",
            "type": "plausible_incomplete",
            "feedback": "It might be small, but the set is new and it is Dev's. How big a mistake feels depends on whose thing it is."
          },
          {
            "id": "cq2-1-3",
            "text": "Maybe the marker was already dry when Dev lent you the set, so it is not your problem.",
            "type": "plausible_incomplete",
            "feedback": "That could be true, but you do not know it. Guessing that the blame belongs somewhere else can keep you from checking."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "If you say nothing and return the set, what is likely to happen?",
        "choices": [
          {
            "id": "cq2-2-1",
            "text": "Dev may find it later and wonder what happened, and lending you things could get harder.",
            "type": "responsible",
            "feedback": "Yes. Trust grows when people are honest about small things, and it gets harder to rebuild after a surprise."
          },
          {
            "id": "cq2-2-2",
            "text": "Nothing much, since Dev has other markers and probably will not check every one in the case.",
            "type": "plausible_incomplete",
            "feedback": "He might not check. But you would be carrying the secret, and the next time he looks, it could be a bigger deal."
          },
          {
            "id": "cq2-2-3",
            "text": "Dev will be upset for a day, but things will go back to normal once he forgets about it.",
            "type": "plausible_incomplete",
            "feedback": "He may forget. It is more likely he would remember that you knew and said nothing."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What are some ways you could handle this?",
        "choices": [
          {
            "id": "cq2-3-1",
            "text": "Tell Dev what happened, say sorry, and ask what he would like you to do about it.",
            "type": "responsible",
            "feedback": "Telling him first lets Dev feel respected, and it gives the two of you a chance to fix it together."
          },
          {
            "id": "cq2-3-2",
            "text": "Buy a new marker and slip it into the case so Dev never has to know.",
            "type": "plausible_incomplete",
            "feedback": "Replacing it is kind, but doing it in secret skips the honest part. Dev still does not get to hear it from you."
          },
          {
            "id": "cq2-3-3",
            "text": "Return the set, say it was great to use, and let Dev notice the marker on his own.",
            "type": "plausible_incomplete",
            "feedback": "This sounds friendly, but it leaves Dev to find the problem alone, and it may feel like you hid it."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What is the most constructive thing to do right now?",
        "choices": [
          {
            "id": "cq2-4-1",
            "text": "Tell Dev about the dried marker when you return the set, and say sorry.",
            "type": "responsible",
            "feedback": "You are honest, you take responsibility, and Dev hears it from you. That is hard to do and it builds trust."
          },
          {
            "id": "cq2-4-2",
            "text": "Offer to replace the marker, and ask Dev if he wants the same color.",
            "type": "multiple_defensible",
            "feedback": "Also a good move. Offering to make it right, and asking what Dev wants, treats him as the owner of the decision."
          },
          {
            "id": "cq2-4-3",
            "text": "Return the set quietly and hope he never opens that particular marker.",
            "type": "unsafe",
            "feedback": "Hoping nobody notices a mistake rarely works, and if Dev finds it first, the silence looks worse than the dried marker."
          },
          {
            "id": "cq2-4-4",
            "text": "Ask a parent or a teacher how to start the conversation with Dev about it.",
            "type": "seek_help",
            "feedback": "Asking a trusted adult for help finding the words is a good idea, especially when you feel nervous about it."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "What is one thing you could say to someone when you have made a mistake with something that is not yours?",
        "freeReflection": true
      }
    ] },
    { steps: [
      {
        "key": "recognize",
        "prompt": "At recess you are playing tag. Ravi keeps changing the rules so that he is never \"it\". A couple of friends are getting annoyed, and one has started to walk away.",
        "choices": [
          {
            "id": "cq3-1-1",
            "text": "Notice that the game feels unfair to several people at once, and not only to one of them.",
            "type": "responsible",
            "feedback": "Good noticing. When more than one person feels the same way, it is worth taking seriously."
          },
          {
            "id": "cq3-1-2",
            "text": "Ravi is just very competitive, so this is how he always plays and there is nothing to do.",
            "type": "plausible_incomplete",
            "feedback": "Some people play hard to win. A rule that changes for only one person is a different thing, though."
          },
          {
            "id": "cq3-1-3",
            "text": "It is only a game, so the best thing is to stop thinking about it and play something else.",
            "type": "plausible_incomplete",
            "feedback": "Leaving is one choice. It leaves the problem for the friends who stay and for Ravi, who may not see it."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "If the rules keep changing, what is likely to happen to the game?",
        "choices": [
          {
            "id": "cq3-2-1",
            "text": "More friends may quit, the game may fall apart, and Ravi may never learn why people are upset.",
            "type": "responsible",
            "feedback": "Yes. Both the game and the friendships are affected, and Ravi cannot fix what he does not know about."
          },
          {
            "id": "cq3-2-2",
            "text": "Ravi will notice sooner or later and fix it himself, so nobody needs to do anything yet.",
            "type": "plausible_incomplete",
            "feedback": "He might. People often do not see their own habits unless someone tells them kindly."
          },
          {
            "id": "cq3-2-3",
            "text": "The annoyed friends will get over it, because tag is over in a few minutes anyway.",
            "type": "plausible_incomplete",
            "feedback": "The feeling may fade, but it can come back the next time, and this happens at recess most days."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What are some ways you could handle this?",
        "choices": [
          {
            "id": "cq3-3-1",
            "text": "Suggest that the group agrees on the rules before the next round starts.",
            "type": "responsible",
            "feedback": "Agreeing on rules ahead of time takes the blame off one person and helps every game after this one."
          },
          {
            "id": "cq3-3-2",
            "text": "Tell everyone loudly that Ravi is cheating so that he has to stop right now.",
            "type": "plausible_incomplete",
            "feedback": "It would be noticed, but calling someone out in front of others often makes them defend themselves instead of listen."
          },
          {
            "id": "cq3-3-3",
            "text": "Quietly start a different game with the friends who are annoyed and leave Ravi out.",
            "type": "plausible_incomplete",
            "feedback": "That fixes today's game, but Ravi is left out without knowing why, and the problem may come back with someone else."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What is the most constructive next step right now?",
        "choices": [
          {
            "id": "cq3-4-1",
            "text": "Say, \"Can we pick the rules together before we start again?\"",
            "type": "responsible",
            "feedback": "A clear request that includes everyone gives Ravi a way to say yes without feeling attacked."
          },
          {
            "id": "cq3-4-2",
            "text": "Talk to Ravi alone later and tell him how the rule changes felt.",
            "type": "multiple_defensible",
            "feedback": "A private talk can work well, since Ravi will not feel embarrassed. It is slower, and the game may be over by then."
          },
          {
            "id": "cq3-4-3",
            "text": "Tell the group that Ravi is a cheater and nobody should play with him.",
            "type": "unsafe",
            "feedback": "Labeling Ravi turns a rule problem into a problem about who he is, and a label like that can follow him around."
          },
          {
            "id": "cq3-4-4",
            "text": "Ask the recess helper to help the group agree on fair rules.",
            "type": "seek_help",
            "feedback": "A helper can keep things calm and fair when a group cannot settle it alone. That is a good use of an adult."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "What is one fair way to decide the rules before a game starts?",
        "freeReflection": true
      }
    ] },
    { steps: [
      {
        "key": "recognize",
        "prompt": "Your friend Lena tells you she is nervous about reading aloud tomorrow. At lunch, another classmate asks you, \"Is Lena scared about the reading?\"",
        "choices": [
          {
            "id": "cq4-1-1",
            "text": "Notice that Lena told you this in trust, and that the question asks you to pass it on.",
            "type": "responsible",
            "feedback": "Good noticing. Spotting that something was shared in trust is the first step to keeping it that way."
          },
          {
            "id": "cq4-1-2",
            "text": "It is only a feeling about reading, so it is not really a secret and sharing it would be fine.",
            "type": "plausible_incomplete",
            "feedback": "Lena did not say it was a secret, but she chose you to tell. Feelings like nerves are personal."
          },
          {
            "id": "cq4-1-3",
            "text": "The classmate probably just wants to help, so it is nice to tell them what you know.",
            "type": "plausible_incomplete",
            "feedback": "They might mean well. Even so, how Lena feels is hers to share, and you would be answering for her."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "If Lena finds out you told, what is likely to happen?",
        "choices": [
          {
            "id": "cq4-2-1",
            "text": "Lena may feel embarrassed, stop telling you things, and feel more nervous about reading tomorrow.",
            "type": "responsible",
            "feedback": "Yes. Trust is hard to rebuild, and sharing her feeling could make tomorrow harder for her."
          },
          {
            "id": "cq4-2-2",
            "text": "Lena will probably not mind, since lots of people feel nervous about reading aloud.",
            "type": "plausible_incomplete",
            "feedback": "It is common to feel nervous, but that does not mean she wants other people to know."
          },
          {
            "id": "cq4-2-3",
            "text": "Lena may be upset for a bit, but she will understand that you were only trying to help.",
            "type": "plausible_incomplete",
            "feedback": "She might forgive you. She might also wonder what else you will share, and good intentions do not undo the hurt."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What are some ways you could answer the classmate?",
        "choices": [
          {
            "id": "cq4-3-1",
            "text": "Say, \"That is Lena's to share,\" and then change the subject kindly.",
            "type": "responsible",
            "feedback": "It is honest and kind. You are not hiding anything, and you are not speaking for Lena."
          },
          {
            "id": "cq4-3-2",
            "text": "Say, \"I don't know,\" even though you do, so the classmate stops asking.",
            "type": "plausible_incomplete",
            "feedback": "It ends the question, but it is not true. Being honest and protecting a friend can go together."
          },
          {
            "id": "cq4-3-3",
            "text": "Say a little, like \"She is a bit worried,\" so it feels like you are being honest.",
            "type": "plausible_incomplete",
            "feedback": "A little still counts as telling. Once part of it is out, the rest is easy to guess."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What is the most constructive next step right now?",
        "choices": [
          {
            "id": "cq4-4-1",
            "text": "Tell the classmate it is Lena's to share, then ask Lena if she wants help practicing.",
            "type": "responsible",
            "feedback": "You protect her privacy, you stay honest, and you offer help. That is what a trusted friend does."
          },
          {
            "id": "cq4-4-2",
            "text": "Tell the classmate you are not sure, then let Lena know someone was asking about her.",
            "type": "multiple_defensible",
            "feedback": "This keeps her feelings private and lets Lena decide what to do. Saying \"That is Lena's to share\" would be more honest than \"I'm not sure.\""
          },
          {
            "id": "cq4-4-3",
            "text": "Tell the classmate that Lena is nervous, since it is probably not a big deal anyway.",
            "type": "unsafe",
            "feedback": "Deciding it is not a big deal is making a choice for Lena. She trusted you to keep it."
          },
          {
            "id": "cq4-4-4",
            "text": "Ask a teacher for ideas on how to support Lena without sharing her feelings with anyone.",
            "type": "seek_help",
            "feedback": "A teacher can help you support Lena in ways that keep her feelings private. Asking is a smart move."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "What helps you know whether something is yours to share?",
        "freeReflection": true
      }
    ] }
  ];

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'branchingScenario',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'choice-quest-team-project',
    header: {
      icon: '🗺️',
      title: 'Choice Quest',
      description: 'Work through what is happening with your team, who it affects, and what to do about it.',
    },
  });
</script>
</body>
</html>
