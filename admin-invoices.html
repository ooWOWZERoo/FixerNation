<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Invoices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<script>(function(){var t=localStorage.getItem('fnTheme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="admin-common.css?v=21">
</head>
<body class="fn-mission-admin">

<div class="a-shell">
  <aside class="a-sidebar"></aside>
<script src="admin-nav.js?v=23"></script>

  <div class="a-main">
    <div class="a-topbar">
      <h1>Invoices</h1>
      <div class="a-theme-toggle" onclick="fnToggleTheme()" title="Toggle light/dark theme"><span class="ic-sun">☀️</span><span class="ic-moon">🌙</span></div>
      <div class="a-user"><div class="avatar">A</div> admin</div>
    </div>

    <div class="a-content">
      <div class="a-card">
        <div class="a-card-head">
          <h2>Purchase Order Invoices</h2>
          <select id="statusFilter" class="a-filter-select" onchange="applyStatusFilter()">
            <option value="">All Statuses</option>
            <option value="paid">Paid</option>
            <option value="unpaid">Unpaid</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <table class="a-table" id="invoicesTable">
          <thead><tr><th>Invoice #</th><th>Quote #</th><th>School / Buyer</th><th>PO Number</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="a-empty" id="invoicesEmpty" style="display:none;">
          <div class="big">🧾</div>
          No invoices yet — these are created automatically when a school checks out with a Purchase Order.
        </div>
      </div>
    </div>
  </div>
</div>

<script src="admin-common.js?v=16"></script>
<script>
fnRequireAuth();

let invoicesCache = [];

async function loadInvoices(status) {
  const params = new URLSearchParams();
  if (status) params.set('status', status);
  const r = await fetch(`/api/invoices?${params}`, { credentials: 'include' });
  if (fnHandleUnauthorized(r)) return;
  invoicesCache = (await r.json()).invoices || [];

  const tbody = document.querySelector('#invoicesTable tbody');
  tbody.innerHTML = '';
  document.getElementById('invoicesTable').style.display = invoicesCache.length ? 'table' : 'none';
  document.getElementById('invoicesEmpty').style.display = invoicesCache.length ? 'none' : 'block';

  invoicesCache.forEach(inv => {
    const tr = document.createElement('tr');
    const paid = inv.status === 'paid';
    const cancelled = inv.status === 'cancelled';
    const statusLabel = cancelled ? 'Cancelled' : (paid ? 'Paid' : 'Unpaid');
    const statusPill = cancelled ? 'a-pill-danger' : (paid ? 'a-pill-success' : 'a-pill-neutral');
    // PO Received is a separate signal from Paid -- it's what actually
    // activates the school license (POST /:id/po-received); Paid tracks the
    // financial obligation independently. Shown for any PO invoice
    // (every row here is one today, but this stays correct if that
    // changes) -- matches the "Mark PO received" action button below,
    // which is also available regardless of amount, so the status pill
    // and the action that sets it stay consistent with each other.
    const poPill = inv.paymentMethod !== 'po' ? '' : (
      inv.poReceivedDate
        ? '<span class="a-pill a-pill-success">PO Received</span>'
        : '<span class="a-pill a-pill-warning">PO Pending</span>'
    );
    tr.innerHTML = `
      <td class="a-cell-title"><a href="admin-invoice-print.html?id=${inv.id}" target="_blank">${inv.invoiceNumber}</a></td>
      <td>${inv.quoteNumber ? `#${inv.quoteNumber}` : '—'}</td>
      <td>${(inv.buyer && (inv.buyer.company || inv.buyer.name)) || '—'}<div class="a-note">${(inv.buyer && inv.buyer.email) || ''}</div></td>
      <td>${inv.poNumber || '—'}</td>
      <td>${inv.itemCount}</td>
      <td>${fnFormatCurrency(inv.total)}</td>
      <td>${poPill}${poPill ? '<br>' : ''}<span class="a-pill ${statusPill}" style="margin-top:4px;display:inline-block;">${statusLabel}</span></td>
      <td>${fnFormatDate(inv.createdAt)}</td>
      <td>
        <div class="a-row-actions">
          <a class="a-icon-btn" title="View / Print" href="admin-invoice-print.html?id=${inv.id}" target="_blank">🖨️</a>
          <button class="a-icon-btn" title="Resend invoice email" onclick="resendInvoice(${inv.id})">📧</button>
          ${cancelled ? '' : `<button class="a-icon-btn" title="${paid ? 'Mark unpaid' : 'Mark paid'}" onclick="toggleInvoiceStatus(${inv.id}, '${paid ? 'unpaid' : 'paid'}')">${paid ? '↺' : '✅'}</button>`}
          ${(!cancelled && inv.paymentMethod === 'po' && !inv.poReceivedDate) ? `<button class="a-icon-btn" title="Mark PO received — activates the school license" onclick="markPoReceived(${inv.id})">📬</button>` : ''}
          ${cancelled ? '' : `<button class="a-icon-btn" title="Cancel invoice" onclick="cancelInvoice(${inv.id})">🚫</button>`}
          <button class="a-icon-btn danger" title="Delete invoice" onclick="deleteInvoice(${inv.id})">🗑️</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

async function toggleInvoiceStatus(id, newStatus) {
  const r = await fetch(`/api/invoices/${id}`, {
    method: 'PUT',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: newStatus }),
  });
  if (fnHandleUnauthorized(r)) return;
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    fnToast(err.error || 'Could not update invoice');
    return;
  }
  loadInvoices(document.getElementById('statusFilter').value);
  fnToast(newStatus === 'paid' ? 'Marked as paid' : 'Marked as unpaid');
}

async function resendInvoice(id) {
  const r = await fetch(`/api/invoices/${id}/resend`, {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: '{}',
  });
  if (fnHandleUnauthorized(r)) return;
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    fnToast(err.error || 'Could not resend invoice');
    return;
  }
  fnToast('Invoice emailed');
}

async function markPoReceived(id) {
  if (!confirm('Mark this PO as received? This activates the school license and grants teacher access.')) return;
  const r = await fetch(`/api/invoices/${id}/po-received`, {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: '{}',
  });
  if (fnHandleUnauthorized(r)) return;
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    fnToast(err.error || 'Could not mark PO received');
    return;
  }
  loadInvoices(document.getElementById('statusFilter').value);
  fnToast('PO received — license activated');
}

async function cancelInvoice(id) {
  if (!confirm('Cancel this invoice? It will be kept for records but marked as cancelled. This does not remove any seats or licenses already granted.')) return;
  const r = await fetch(`/api/invoices/${id}`, {
    method: 'PUT',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'cancelled' }),
  });
  if (fnHandleUnauthorized(r)) return;
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    fnToast(err.error || 'Could not cancel invoice');
    return;
  }
  loadInvoices(document.getElementById('statusFilter').value);
  fnToast('Invoice cancelled');
}

async function deleteInvoice(id) {
  if (!confirm('Permanently delete this invoice? This cannot be undone. The underlying purchases (seats, licenses, book orders) are kept — only the invoice document is removed.')) return;
  const r = await fetch(`/api/invoices/${id}`, {
    method: 'DELETE',
    credentials: 'include',
  });
  if (fnHandleUnauthorized(r)) return;
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    fnToast(err.error || 'Could not delete invoice');
    return;
  }
  loadInvoices(document.getElementById('statusFilter').value);
  fnToast('Invoice deleted');
}

function applyStatusFilter() {
  const status = document.getElementById('statusFilter').value;
  loadInvoices(status);
}

(function init() {
  const status = new URLSearchParams(window.location.search).get('status') || '';
  document.getElementById('statusFilter').value = status;
  loadInvoices(status);
})();
</script>

<script src="admin-shell.js?v=1"></script>
</body>
</html>
