<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/api/settings/favicon?size=32">
<link rel="icon" type="image/png" sizes="16x16" href="/api/settings/favicon?size=16">
<link rel="apple-touch-icon" href="/api/settings/favicon?size=180">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Feelings Detective</title>
<link rel="stylesheet" href="fonts.css?v=1">

</head>
<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=22"></script>
<script src="site-auth.js?v=12"></script>
<script src="footer.js?v=18"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js?v=3"></script>
<script src="engine-sdk.js?v=6"></script>
<script src="assets/audio/discover/feelings-detective.js?v=454f6ce7"></script>
<script src="engine-voice.js?v=1"></script>
<script src="engine-scenario-choice.js?v=9"></script>
<script>
  // Feelings Detective - Tune Your Brain SEL scaling slice (Discover band).
  // Closes the last CASEL gap: the first genuine Self-awareness game in
  // any band, using the new Scenario Choice engine (multi-select, two
  // stages per scenario: notice cues, then pick feeling(s)). See
  // docs/tune-your-brain/SCENARIO_CHOICE_ENGINE_SPIKE.md for the design
  // rationale. Per the acceptance rule, more than one feeling is often
  // plausible per scenario - the content below deliberately tags 2
  // plausible feelings in every scenario, never just 1. Per the
  // developmental-design rule, facial expression alone never proves a
  // feeling - every scenario's cues mix body/situation cues, not just a
  // face description.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'discover';

  const contentPack = {
    title: 'Feelings Detective',
    roundsPerRun: 3,
    // Discover wording (Release 87): short lines, pictures on the clues and feelings, everything spoken. Plain defaults for
    // the shared prompts live in engine-scenario-choice.js; this game supplies its own.
    prompts: {
      cues: 'What do you see?',
      afterCues: 'Good looking! Now think about the feeling.',
      pick: 'How might they feel? Pick one or more.',
      confirmCues: 'I see these',
      confirmPick: 'I picked these',
      multiLabel: 'Times you picked two feelings',
    },
    scenarios: [
      {
        context: "Maya's friend did not save her a seat.",
        illustration: '🍽️',
        cues: [
          { id: 'looking-down', text: '👀 She looks down at her tray.', present: true },
          { id: 'laughing', text: '😂 She laughs loudly.', present: false },
          { id: 'sat-alone', text: '🪑 She sits all alone.', present: true },
        ],
        feelings: [
          { id: 'sad', text: '😢 Sad', tag: 'plausible' },
          { id: 'left-out', text: '😔 Left out', tag: 'plausible' },
          { id: 'excited', text: '🤩 Excited', tag: 'less_fitting',
            note: 'Excited looks bouncy and loud.' },
        ],
        reinforcement: 'Sad and left out can both be true.',
        seekHelp: {
          prompt: 'If a friend leaves you out again, what could you do?',
          text: 'Tell a grown-up you trust, like a teacher.',
        },
      },
      {
        context: 'Sam is getting a puppy this weekend!',
        illustration: '🐶',
        cues: [
          { id: 'jumping', text: '🦘 He jumps up and down.', present: true },
          { id: 'covering-ears', text: '🙉 He covers his ears.', present: false },
          { id: 'talking-fast', text: '😁 He talks fast and smiles big.', present: true },
        ],
        feelings: [
          { id: 'excited', text: '😆 Excited', tag: 'plausible' },
          { id: 'happy', text: '😊 Happy', tag: 'plausible' },
          { id: 'nervous', text: '😟 Nervous', tag: 'less_fitting',
            note: 'Nervous looks quiet and still. Sam is full of energy.' },
        ],
        reinforcement: 'Excited and happy can go together.',
      },
      {
        context: "Jordan's team lost the game.",
        illustration: '🏀',
        cues: [
          { id: 'slumped', text: '😞 His shoulders slump.', present: true },
          { id: 'kicked-ground', text: '🦶 He kicks the ground.', present: true },
          { id: 'high-fives', text: '🤝 He high-fives the other team.', present: false },
        ],
        feelings: [
          { id: 'frustrated', text: '😠 Frustrated', tag: 'plausible' },
          { id: 'disappointed', text: '😢 Disappointed', tag: 'plausible' },
          { id: 'proud', text: '😎 Proud', tag: 'less_fitting',
            note: 'Proud feels good. Jordan looks upset.' },
        ],
        reinforcement: 'Frustrated and disappointed can both happen after a loss. It fades.',
        seekHelp: {
          prompt: 'If losing makes you want to quit, what could help?',
          text: 'Talk to a coach, a teacher or a family member.',
        },
      },
      {
        context: 'Priya starts at a new school today.',
        illustration: '🎒',
        cues: [
          { id: 'holding-hand', text: "🤝 She holds her mom's hand tight.", present: true },
          { id: 'looking-around', text: '👀 She looks at everything.', present: true },
          { id: 'running-ahead', text: '🏃 She runs ahead alone.', present: false },
        ],
        feelings: [
          { id: 'nervous', text: '😬 Nervous', tag: 'plausible' },
          { id: 'curious', text: '🧐 Curious', tag: 'plausible' },
          { id: 'bored', text: '🥱 Bored', tag: 'less_fitting',
            note: 'Bored looks sleepy. Priya is watching closely.' },
        ],
        reinforcement: 'Nervous and curious can both be true on a first day.',
      },
      {
        context: "Ella dropped her ice cream.",
        illustration: "🍦",
        cues: [
          { id: "looking-at-ground", text: "🍦 She stares at the ground.", present: true },
          { id: "lip-shakes", text: "😢 Her lip shakes.", present: true },
          { id: "giggles", text: "😄 She giggles and claps.", present: false },
        ],
        feelings: [
          { id: "sad", text: "😢 Sad", tag: "plausible" },
          { id: "disappointed", text: "😞 Disappointed", tag: "plausible" },
          { id: "thrilled", text: "🤩 Thrilled", tag: "less_fitting", note: "Thrilled looks bouncy and bright. Ella is quiet." },
        ],
        reinforcement: "Sad and disappointed can happen together.",
      },
      {
        context: "Marcus was picked first for the team.",
        illustration: "🏅",
        cues: [
          { id: "smiles-wide", text: "😁 He smiles wide.", present: true },
          { id: "raises-arms", text: "🙌 He raises his arms.", present: true },
          { id: "looks-at-shoes", text: "😔 He looks at his shoes.", present: false },
        ],
        feelings: [
          { id: "proud", text: "😃 Proud", tag: "plausible" },
          { id: "happy", text: "😊 Happy", tag: "plausible" },
          { id: "sad", text: "😢 Sad", tag: "less_fitting", note: "Sad looks slow and quiet. Marcus is full of energy." },
        ],
        reinforcement: "Proud and happy often come together.",
      },
      {
        context: "Zoe hears a loud noise in the dark.",
        illustration: "🌙",
        cues: [
          { id: "eyes-wide", text: "😳 Her eyes open wide.", present: true },
          { id: "pulls-blanket", text: "🛏️ She pulls the blanket up.", present: true },
          { id: "snores", text: "😴 She snores softly.", present: false },
        ],
        feelings: [
          { id: "scared", text: "😨 Scared", tag: "plausible" },
          { id: "worried", text: "😟 Worried", tag: "plausible" },
          { id: "silly", text: "😄 Silly", tag: "less_fitting", note: "Silly looks giggly and loose. Zoe is tense." },
        ],
        reinforcement: "Scared and worried can go together.",
        seekHelp: { prompt: "If you feel scared at night, what could you do?", text: "Tell a grown-up you trust." },
      },
      {
        context: "Omar's friend moved far away.",
        illustration: "🚚",
        cues: [
          { id: "old-photos", text: "🖼️ He looks at old photos.", present: true },
          { id: "quiet-lunch", text: "😶 He is quiet at lunch.", present: true },
          { id: "cartwheels", text: "🤸 He cartwheels across the room.", present: false },
        ],
        feelings: [
          { id: "sad", text: "😢 Sad", tag: "plausible" },
          { id: "lonely", text: "💔 Lonely", tag: "plausible" },
          { id: "excited", text: "😆 Excited", tag: "less_fitting", note: "Excited looks bouncy and loud. Omar is quiet." },
        ],
        reinforcement: "Sad and lonely can both be true when you miss someone.",
        seekHelp: { prompt: "If you miss someone, what could help?", text: "Draw a picture for them, or tell a grown-up." },
      },
      {
        context: "Lily's drawing was hung on the wall.",
        illustration: "🖼️",
        cues: [
          { id: "beams", text: "😊 She beams at it.", present: true },
          { id: "bounces", text: "🦘 She bounces on her toes.", present: true },
          { id: "frowns", text: "😠 She frowns and crosses her arms.", present: false },
        ],
        feelings: [
          { id: "proud", text: "😃 Proud", tag: "plausible" },
          { id: "happy", text: "😊 Happy", tag: "plausible" },
          { id: "angry", text: "😡 Angry", tag: "less_fitting", note: "Angry looks tight and cross. Lily is glowing." },
        ],
        reinforcement: "Proud and happy can go together.",
      },
      {
        context: "Ben has a big test today.",
        illustration: "📝",
        cues: [
          { id: "bites-nails", text: "😬 He bites his nails.", present: true },
          { id: "sweaty-hands", text: "💧 His hands feel sweaty.", present: true },
          { id: "yawns", text: "🥱 He yawns and stretches.", present: false },
        ],
        feelings: [
          { id: "nervous", text: "😰 Nervous", tag: "plausible" },
          { id: "worried", text: "😟 Worried", tag: "plausible" },
          { id: "relaxed", text: "😌 Relaxed", tag: "less_fitting", note: "Relaxed looks loose and calm. Ben looks tense." },
        ],
        reinforcement: "Nervous and worried often come before a test.",
        seekHelp: { prompt: "If you feel nervous, what could help?", text: "Take slow breaths and tell your teacher." },
      },
      {
        context: "Aisha shared her snack with a friend.",
        illustration: "🍪",
        cues: [
          { id: "smiles-softly", text: "😊 She smiles softly.", present: true },
          { id: "hugs-friend", text: "🤗 She hugs her friend.", present: true },
          { id: "rolls-eyes", text: "🙄 She rolls her eyes.", present: false },
        ],
        feelings: [
          { id: "kind", text: "🥰 Kind", tag: "plausible" },
          { id: "happy", text: "😊 Happy", tag: "plausible" },
          { id: "grumpy", text: "😒 Grumpy", tag: "less_fitting", note: "Grumpy looks scrunched and sour. Aisha looks warm." },
        ],
        reinforcement: "Kind and happy often go together.",
      },
      {
        context: "Theo's balloon floated away.",
        illustration: "🎈",
        cues: [
          { id: "watches-it-go", text: "👀 He watches it go up.", present: true },
          { id: "chin-wobbles", text: "😢 His chin wobbles.", present: true },
          { id: "laughs-loudly", text: "😂 He laughs out loud.", present: false },
        ],
        feelings: [
          { id: "sad", text: "😢 Sad", tag: "plausible" },
          { id: "upset", text: "😞 Upset", tag: "plausible" },
          { id: "excited", text: "🤩 Excited", tag: "less_fitting", note: "Excited looks bouncy and bright. Theo looks small and quiet." },
        ],
        reinforcement: "Sad and upset can both fit when something is lost.",
      },
    ],
    // After each story the child gets one private tap about their own life (NY SEL 1A). Their answer is never logged or sent
    // anywhere; see the note at the top of engine-scenario-choice.js.
    selfCheck: {
      prompt: 'Has this happened to you?',
      options: [
        { id: 'yes', text: 'Yes' },
        { id: 'no', text: 'No' },
        { id: 'not-sure', text: 'Not sure' },
      ],
      privateNote: 'Only you see your answers.',
      summaryLabel: 'Times you checked in',
    },
    // Your turn (Release 139): after the stories the child says how THEY feel, where they feel it and what helps, then sees and hears a
    // feeling card built from those picks. Nothing picked is logged, sent or saved; see engine-scenario-choice.js (ownTurn).
    // Every spoken line here has a recorded clip (server/scripts/build-discover-audio.js reads this block).
    ownTurn: {
      intro: 'Now it is your turn. Only you see what you pick.',
      illustration: '🪞',
      stepWord: 'Your turn',
      summaryLabel: 'Questions about you',
      privateNote: 'Only you see your answers.',
      steps: [
        {
          id: 'f1', type: 'pickMany', max: 2,
          prompt: 'How do you feel right now? Pick one or two.',
          confirm: 'I picked these',
          options: [
            { id: 'happy', text: '😊 Happy', card: 'I feel happy.' },
            { id: 'sad', text: '😢 Sad', card: 'I feel sad.' },
            { id: 'angry', text: '😡 Angry', card: 'I feel angry.' },
            { id: 'scared', text: '😨 Scared', card: 'I feel scared.' },
            { id: 'nervous', text: '😟 Nervous', card: 'I feel nervous.' },
            { id: 'excited', text: '🤩 Excited', card: 'I feel excited.' },
            { id: 'proud', text: '😎 Proud', card: 'I feel proud.' },
            { id: 'calm', text: '😌 Calm', card: 'I feel calm.' },
          ],
          notSure: { id: 'not-sure', text: "I'm not sure" },
        },
        {
          id: 'f2', type: 'pickOne',
          prompt: 'Where do you feel it in your body?',
          options: [
            { id: 'tummy', text: 'My tummy', card: 'I feel it in my tummy.' },
            { id: 'chest', text: 'My chest', card: 'I feel it in my chest.' },
            { id: 'face', text: 'My face', card: 'I feel it in my face.' },
            { id: 'hands', text: 'My hands', card: 'I feel it in my hands.' },
            { id: 'elsewhere', text: 'Somewhere else', card: 'I feel it somewhere else.' },
          ],
          notSure: { id: 'not-sure', text: "I'm not sure" },
        },
        {
          id: 'f3', type: 'pickOne',
          prompt: 'What helps you with this feeling? Pick one.',
          options: [
            { id: 'breaths', text: '🌬️ Slow breaths', card: 'Slow breaths help me.' },
            { id: 'grownup', text: '🗣️ Tell a grown-up', card: 'Telling a grown-up helps me.' },
            { id: 'move', text: '🏃 Move around', card: 'Moving around helps me.' },
            { id: 'quiet', text: '🤫 Sit somewhere quiet', card: 'Sitting somewhere quiet helps me.' },
          ],
          notSure: { id: 'not-sure', text: "I'm not sure" },
        },
      ],
      result: {
        heading: 'My feeling card',
        lines: [
          { text: '{item}', each: 'f1', needs: 'f1' },
          { text: '{f2}', needs: ['f1', 'f2'] },
          { text: '{f3}', needs: 'f3' },
        ],
        emptyLine: 'That is okay. Feelings can be hard to name.',
        closing: 'Only you see this card. Grown-ups you trust can help with big feelings.',
        finish: 'Finish',
      },
    },
  };

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'scenarioChoice',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'feelings-detective-emotion-recognition',
    header: {
      icon: '🕵️',
      title: 'Feelings Detective',
      description: 'Look at the clues. Then pick how they feel.',
    },
  });
</script>
<script src="game-backlink.js?v=1" defer></script>
</body>
</html>
