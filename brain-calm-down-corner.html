<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Calm Down Corner</title>
<link rel="stylesheet" href="fonts.css?v=1">
<link rel="stylesheet" href="brain-games.css?v=7">
</head>
<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=18"></script>
<script src="site-auth.js?v=11"></script>
<script src="footer.js?v=12"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js?v=3"></script>
<script src="engine-sdk.js?v=5"></script>
<script src="engine-audio-choice.js?v=4"></script>
<script>
  // Calm Down Corner - first Tune Your Brain game targeting the
  // Self-management CASEL competency (roadmap section 6.4), and the
  // first SEL & Character game for the Discover band, which had zero
  // SEL coverage before this (see
  // docs/tune-your-brain/GAP_ANALYSIS_2026-09-17.md's SEL x band table).
  // Uses engine-audio-choice.js rather than engine-branching-scenario.js
  // because Discover requires no reading and spoken support (section
  // 7.2) - Branching Scenario's 5-step cycle is text-only. Placeholder
  // browser-TTS narration pending the ElevenLabs decision (D1), same as
  // Sound Safari.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'discover';

  const contentPack = {
    title: 'Calm Down Corner',
    items: [
      {
        stimulusType: 'audio',
        stimulusText: "Your tower fell down. You feel mad. What helps you feel calm?",
        transcript: "Your tower fell down. You feel mad. What helps you feel calm?",
        choices: [
          { id: "breathe", label: "😮‍💨", caption: "Deep breaths", aria: "take slow deep breaths" },
          { id: "yell", label: "😠", caption: "Yell", aria: "yell about it" },
          { id: "knock-more", label: "🧱", caption: "Knock more down", aria: "knock down more blocks" },
        ],
        correctId: "breathe",
      },
      {
        stimulusType: 'audio',
        stimulusText: "A puzzle piece will not fit. You feel grumpy. What helps you feel calm?",
        transcript: "A puzzle piece will not fit. You feel grumpy. What helps you feel calm?",
        choices: [
          { id: "count", label: "🔢", caption: "Count to five", aria: "count slowly to five" },
          { id: "throw", label: "😤", caption: "Throw it", aria: "throw the puzzle" },
          { id: "give-up", label: "🙅", caption: "Give up", aria: "give up and stop trying" },
        ],
        correctId: "count",
      },
      {
        stimulusType: 'audio',
        stimulusText: "Someone took your turn on the swing. You feel upset. What helps you feel calm?",
        transcript: "Someone took your turn on the swing. You feel upset. What helps you feel calm?",
        choices: [
          { id: "ask-help", label: "🙋", caption: "Ask a grown-up", aria: "ask a grown-up for help" },
          { id: "push", label: "😢", caption: "Push and cry", aria: "push and cry loudly" },
          { id: "keep-inside", label: "🤐", caption: "Keep it inside", aria: "keep the feeling inside" },
        ],
        correctId: "ask-help",
      },
      {
        stimulusType: 'audio',
        stimulusText: "You spilled your juice. Your face feels hot. What helps you feel calm?",
        transcript: "You spilled your juice. Your face feels hot. What helps you feel calm?",
        choices: [
          { id: "calm-spot", label: "🪴", caption: "Calm spot", aria: "take a break in a calm spot" },
          { id: "yell-unfair", label: "😭", caption: "Yell \"Not fair\"", aria: "yell that it is not fair" },
          { id: "kick", label: "💥", caption: "Kick something", aria: "kick something" },
        ],
        correctId: "calm-spot",
      },
    ],
  };

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'audioChoice',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'calm-down-corner-strategies',
    header: {
      icon: '🐢',
      title: 'Calm Down Corner',
      description: 'Listen. Pick what helps you feel calm.',
    },
  });
</script>
</body>
</html>
