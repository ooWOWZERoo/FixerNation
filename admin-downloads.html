<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Downloads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<script>(function(){var t=localStorage.getItem('fnTheme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="admin-common.css?v=17">
<style>
  .dl-tabs{display:flex;gap:0;border-bottom:2px solid var(--a-border);margin-bottom:20px;}
  .dl-tab{padding:10px 20px;border:none;background:transparent;font-family:inherit;font-weight:600;font-size:14px;color:var(--a-text-soft);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;}
  .dl-tab.active{color:var(--a-accent);border-bottom-color:var(--a-accent);}
  .dl-tab:hover:not(.active){color:var(--a-text);}
  .dl-search-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .dl-search-input{flex:1;min-width:200px;padding:7px 12px;border:1px solid var(--a-border);border-radius:8px;font-size:13px;background:var(--a-surface);color:var(--a-text);outline:none;}
  .dl-search-input:focus{border-color:var(--a-accent);}
  .dl-search-hint{font-size:11px;color:var(--a-text-soft);padding:0 0 10px;}
  .dl-pagination{display:flex;align-items:center;gap:10px;padding:14px 0 4px;font-size:13px;color:var(--a-text-soft);}
  .dl-pagination-info{flex:1;}
  .dl-count-bar{display:flex;align-items:center;gap:6px;margin-top:3px;}
  .dl-bar-track{flex:1;min-width:40px;height:6px;background:var(--a-border);border-radius:3px;overflow:hidden;}
  .dl-bar-fill{height:100%;background:var(--a-accent);border-radius:3px;transition:width .3s;}
  .dl-bar-fill.full{background:var(--a-danger,#e05252);}
  .dl-count-text{font-size:11px;color:var(--a-text-soft);white-space:nowrap;margin-top:2px;}
  .dl-reset-btn{background:none;border:1px solid var(--a-border);border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--a-text-soft);}
  .dl-reset-btn:hover{border-color:var(--a-accent);color:var(--a-accent);}
  .dl-reset-btn:disabled{opacity:.45;cursor:default;}
  .dl-count-input{width:60px;padding:3px 6px;border:1px solid var(--a-accent);border-radius:5px;font-size:13px;background:var(--a-surface);color:var(--a-text);}
  .a-table td.teacher-name{font-weight:600;}
  .a-table td.no-data{color:var(--a-text-soft);font-style:italic;}
  .dl-students-note{padding:32px 0;text-align:center;color:var(--a-text-soft);font-size:14px;}
</style>
</head>
<body>

<div class="a-shell">
  <aside class="a-sidebar"></aside>
<script src="admin-nav.js?v=15"></script>

  <div class="a-main">
    <div class="a-topbar">
      <h1>Downloads</h1>
      <div class="a-theme-toggle" onclick="fnToggleTheme()" title="Toggle light/dark theme"><span class="ic-sun">☀️</span><span class="ic-moon">🌙</span></div>
      <div class="a-user"><div class="avatar">A</div> admin</div>
    </div>

    <div class="a-content">
      <div class="a-card">
        <div class="a-card-head">
          <h2>All Downloads</h2>
          <div class="dl-search-wrap">
            <input type="text" id="searchInput" class="dl-search-input" placeholder="Search name, email, school, curriculum…">
            <button class="a-btn a-btn-outline" id="clearBtn" onclick="clearSearch()" style="display:none;font-size:13px;">Clear</button>
            <div class="dl-search-hint" style="flex-basis:100%;padding:4px 0 0;">Use * as wildcard — e.g. <code>smith*</code> or <code>*algebra*</code></div>
          </div>
          <button class="a-btn a-btn-outline" id="resetAllBtn" onclick="resetAllVisible()">Reset All</button>
        </div>

        <div class="dl-tabs">
          <button class="dl-tab active" id="tab-teachers" onclick="switchTab('teacher')">Teachers</button>
          <button class="dl-tab" id="tab-parents" onclick="switchTab('parent')">Parents</button>
          <button class="dl-tab" id="tab-students" onclick="switchTab('students')">Students</button>
        </div>

        <div id="dlTableWrap">
          <table class="a-table" id="dlTable" style="display:none;">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>School</th>
                <th>Curriculum</th>
                <th>Resource</th>
                <th>Downloads</th>
                <th>Last Download</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="dlTbody"></tbody>
          </table>

          <div class="a-empty" id="dlEmpty" style="display:none;">
            <div class="big">&#128229;</div>
            No downloads found.
          </div>

          <div class="dl-students-note" id="dlStudentsNote" style="display:none;">
            Student downloads are not tracked.
          </div>

          <div class="dl-pagination" id="dlPagination" style="display:none;">
            <span class="dl-pagination-info" id="dlPageInfo"></span>
            <button class="dl-reset-btn" id="prevBtn" onclick="goPage(currentPage - 1)">&#8592; Prev</button>
            <button class="dl-reset-btn" id="nextBtn" onclick="goPage(currentPage + 1)">Next &#8594;</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="admin-common.js?v=15"></script>
<script>
fnRequireAuth();

var activeDownloads = [];
var currentPage    = 1;
var totalPages     = 1;
var totalRecords   = 0;
var currentQuery   = '';
var currentTab     = 'teacher';
var searchTimer    = null;
var PAGE_SIZE      = 25;

// ── Tabs ──────────────────────────────────────────────────────

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.dl-tab').forEach(function(btn) { btn.classList.remove('active'); });
  var tabId = tab === 'students' ? 'tab-students' : (tab === 'parent' ? 'tab-parents' : 'tab-teachers');
  document.getElementById(tabId).classList.add('active');

  var isStudents = tab === 'students';
  document.getElementById('dlStudentsNote').style.display = isStudents ? '' : 'none';
  document.getElementById('dlTable').style.display       = 'none';
  document.getElementById('dlEmpty').style.display       = 'none';
  document.getElementById('dlPagination').style.display  = 'none';
  document.getElementById('searchInput').disabled        = isStudents;
  document.getElementById('resetAllBtn').disabled         = isStudents;

  if (!isStudents) {
    loadDownloads(currentQuery, 1);
  }
}

// ── Fetch ─────────────────────────────────────────────────────

async function loadDownloads(q, page) {
  q    = (q || '').trim();
  page = page || 1;
  currentQuery = q;
  currentPage  = page;

  var params = new URLSearchParams({ page: page, limit: PAGE_SIZE, userType: currentTab });
  if (q) params.set('q', q);

  var r = await fetch('/api/curricula/downloads?' + params, { credentials: 'include' });
  if (fnHandleUnauthorized(r)) return;
  if (!r.ok) { fnToast('Could not load downloads'); return; }
  var data = await r.json();

  activeDownloads = data.downloads || [];
  totalPages      = data.pages    || 1;
  totalRecords    = data.total    || 0;

  document.getElementById('clearBtn').style.display = q ? '' : 'none';
  renderTable();
  renderPagination();
}

// ── Render table ──────────────────────────────────────────────

function renderTable() {
  var tbody = document.getElementById('dlTbody');
  var empty = document.getElementById('dlEmpty');
  var table = document.getElementById('dlTable');

  if (!activeDownloads.length) {
    table.style.display = 'none';
    empty.style.display = '';
    return;
  }
  table.style.display = '';
  empty.style.display = 'none';

  tbody.innerHTML = activeDownloads.map(function(d, i) {
    var name = (d.firstName || d.lastName)
      ? fnEsc((d.firstName || '') + ' ' + (d.lastName || '')).trim()
      : '';
    var resourceLabel = d.resourceType === 'any'
      ? '<span style="color:var(--a-text-soft);font-style:italic;">All (legacy)</span>'
      : fnEsc(d.resourceType || '');
    return '<tr>' +
      '<td class="' + (name ? 'teacher-name' : 'no-data') + '">' + (name || '(unregistered)') + '</td>' +
      '<td>' + fnEsc(d.userEmail) + '</td>' +
      '<td class="' + (d.school ? '' : 'no-data') + '">' + (d.school ? fnEsc(d.school) : '&mdash;') + '</td>' +
      '<td>' + fnEsc(d.curriculumTitle || '') + '</td>' +
      '<td>' + resourceLabel + '</td>' +
      '<td id="dlcount_' + i + '">' +
        '<span style="font-variant-numeric:tabular-nums;">' + d.count + '</span>' +
      '</td>' +
      '<td>' + (d.lastDownload ? fnFormatDate(d.lastDownload) : '&mdash;') + '</td>' +
      '<td>' +
        '<button class="dl-reset-btn" onclick="editCount(' + i + ')">Edit</button> ' +
        '<button class="dl-reset-btn" onclick="resetOne(' + i + ')">Reset</button>' +
      '</td>' +
      '</tr>';
  }).join('');
}

// ── Pagination ────────────────────────────────────────────────

function renderPagination() {
  var pag     = document.getElementById('dlPagination');
  var info    = document.getElementById('dlPageInfo');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');

  if (totalRecords === 0) { pag.style.display = 'none'; return; }
  pag.style.display = '';

  var start = (currentPage - 1) * PAGE_SIZE + 1;
  var end   = Math.min(currentPage * PAGE_SIZE, totalRecords);
  info.textContent = 'Showing ' + start + '–' + end + ' of ' + totalRecords;

  prevBtn.disabled = currentPage <= 1;
  nextBtn.disabled = currentPage >= totalPages;
}

function goPage(page) {
  if (page < 1 || page > totalPages) return;
  loadDownloads(currentQuery, page);
}

// ── Search ────────────────────────────────────────────────────

function doSearch() {
  loadDownloads(document.getElementById('searchInput').value, 1);
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  loadDownloads('', 1);
}

document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(doSearch, 350);
});

document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { clearTimeout(searchTimer); doSearch(); }
});

// ── Inline edit ───────────────────────────────────────────────

function editCount(idx) {
  var d = activeDownloads[idx];
  if (!d) return;
  document.getElementById('dlcount_' + idx).innerHTML =
    '<input class="dl-count-input" type="number" min="0" id="dlcount_input_' + idx + '" value="' + d.count + '">' +
    '<button class="dl-reset-btn" style="margin-left:4px;" onclick="saveCount(' + idx + ')">Save</button>' +
    '<button class="dl-reset-btn" onclick="renderTable()">✕</button>';
  var inp = document.getElementById('dlcount_input_' + idx);
  inp.focus();
  inp.select();
}

async function saveCount(idx) {
  var d = activeDownloads[idx];
  if (!d) return;
  var newCount = parseInt(document.getElementById('dlcount_input_' + idx).value, 10);
  if (isNaN(newCount) || newCount < 0) { fnToast('Enter a valid number (0 or more)'); return; }
  var r = await fetch('/api/curricula/' + d.curriculumId + '/downloads', {
    method: 'PUT',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userEmail: d.userEmail, userType: d.userType, resourceType: d.resourceType, count: newCount }),
  });
  if (!r.ok) { fnToast('Could not update count'); return; }
  fnToast('Count updated');
  activeDownloads[idx].count = newCount;
  renderTable();
}

// ── Reset (per-row + bulk) ──────────────────────────────────────

async function resetOne(idx) {
  var d = activeDownloads[idx];
  if (!d) return;
  var params = new URLSearchParams({ userEmail: d.userEmail, userType: d.userType, resourceType: d.resourceType || 'any' });
  await fetch('/api/curricula/' + d.curriculumId + '/downloads?' + params, {
    method: 'DELETE',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: '{}',
  });
  fnToast('Reset for ' + d.userEmail);
  loadDownloads(currentQuery, currentPage);
}

async function resetAllVisible() {
  var scope = currentQuery
    ? 'every ' + currentTab + ' download matching "' + currentQuery + '"'
    : 'every ' + currentTab + ' download';
  if (!confirm('Reset ' + scope + '? This cannot be undone.')) return;

  var params = new URLSearchParams({ userType: currentTab });
  if (currentQuery) params.set('q', currentQuery);

  var r = await fetch('/api/curricula/downloads?' + params, {
    method: 'DELETE',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: '{}',
  });
  if (fnHandleUnauthorized(r)) return;
  if (!r.ok) { fnToast('Could not reset downloads'); return; }
  var data = await r.json();
  fnToast('Reset ' + data.deleted + ' download record' + (data.deleted === 1 ? '' : 's'));
  loadDownloads(currentQuery, 1);
}

// ── Helpers ───────────────────────────────────────────────────

function fnEsc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

switchTab('teacher');
</script>
</body>
</html>
