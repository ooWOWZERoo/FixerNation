<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Memberships — Fixer Nation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --cream:#FBF5EC; --teal:#164F4A; --teal-dark:#0E3733;
    --coral:#F26B4D; --coral-dark:#D9502F; --gold:#EBA657; --ink:#2A2420; --ink-soft:#6B5F55; --border:rgba(22,79,74,0.15);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Plus Jakarta Sans', sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; padding:0;}
  .wrap{max-width:720px; margin:0 auto; padding:24px 20px 60px;}
  header .wrap{max-width:none;margin:0;padding:0;}
  .account-nav{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:32px; padding-bottom:20px; border-bottom:1px solid var(--border);}
  .account-nav a{padding:7px 14px; border-radius:999px; font-size:13px; font-weight:600; text-decoration:none; color:var(--ink-soft); background:#fff; box-shadow:0 2px 8px -4px rgba(22,79,74,0.15); transition:all .15s;}
  .account-nav a:hover{color:var(--teal-dark);}
  .account-nav a.active{background:var(--teal-dark); color:#fff; box-shadow:none;}
  h1{font-family:'Fraunces', serif; color:var(--teal-dark); font-size:28px; margin-bottom:6px;}
  p.sub{font-size:14.5px; color:var(--ink-soft); margin-bottom:32px;}
  .card{background:#fff; border-radius:18px; box-shadow:0 16px 40px -20px rgba(22,79,74,0.25); padding:26px 28px; margin-bottom:14px;}
  .card-title{font-weight:700; font-size:16px; margin-bottom:4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .card-sub{font-size:13px; color:var(--ink-soft);}
  .card-sub:last-child{margin-bottom:0;}
  .card-detail{font-size:13.5px; margin-top:10px; color:var(--ink-soft);}
  .badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; vertical-align:middle;}
  .badge-active{background:#d1fae5; color:#065f46;}
  .badge-trialing{background:#dbeafe; color:#1e40af;}
  .badge-past_due{background:#fef3c7; color:#92400e;}
  .badge-cancelled,.badge-expired{background:#f3f4f6; color:#6b7280;}
  .type-pill{font-size:11.5px; font-weight:700; color:var(--ink-soft); background:var(--cream); padding:3px 9px; border-radius:999px; border:1px solid var(--border);}
  .empty{text-align:center; color:var(--ink-soft); font-size:14.5px; padding:48px 20px; background:#fff; border-radius:18px; box-shadow:0 16px 40px -20px rgba(22,79,74,0.25);}
  .empty-icon{font-size:30px; margin-bottom:14px;}
  .empty a{color:var(--coral-dark); font-weight:600; text-decoration:none;}
  .back-link{display:inline-block; margin-top:6px; font-size:13.5px; font-weight:600; color:var(--teal-dark); text-decoration:none;}
  .back-link:hover{text-decoration:underline;}
</style>
</head>
<body>
<header></header>
<div class="wrap">
  <nav class="account-nav">
    <a href="my-profile.html">My Profile</a>
    <a href="my-memberships.html" class="active">My Memberships</a>
    <a href="my-license.html">My Licenses</a>
    <a href="teacher-classrooms.html">My Classrooms</a>
    <a href="my-purchases.html">Purchase History</a>
  </nav>

  <h1>My Memberships</h1>
  <p class="sub">Your active and past Fixer Nation membership plans.</p>

  <div id="membershipWrap"></div>

  <a href="index.html" class="back-link">← Back to Fixer Nation</a>
</div>

<script src="nav.js?v=5"></script>
<script src="site-auth.js"></script>
<script src="admin-common.js?v=15"></script>
<script>fnTrackPageview();</script>
<script>
function formatDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function statusBadge(status) {
  const labels = { active: 'Active', trialing: 'Free Trial', past_due: 'Past Due', cancelled: 'Cancelled', expired: 'Expired' };
  return `<span class="badge badge-${status}">${labels[status] || status}</span>`;
}

async function loadData() {
  const r = await fetch('/api/site-auth/my-purchases', { credentials: 'include' });
  if (r.status === 401) { window.location.href = 'index.html'; return; }
  const data = await r.json().catch(() => ({}));
  render(data.memberships || []);
}

function render(memberships) {
  const wrap = document.getElementById('membershipWrap');

  if (!memberships.length) {
    wrap.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🎟️</div>
        <p>You don't have any memberships on file.<br>
        <a href="join.html">Browse membership plans →</a></p>
      </div>`;
    return;
  }

  wrap.innerHTML = memberships.map(m => {
    let detail = '';
    if (m.status === 'trialing' && m.endsAt) detail = `Free trial ends ${formatDate(m.endsAt)}`;
    else if (m.endsAt && (m.status === 'active' || m.status === 'past_due')) detail = `Renews ${formatDate(m.endsAt)}`;
    else if (m.endsAt && (m.status === 'cancelled' || m.status === 'expired')) detail = `Ended ${formatDate(m.endsAt)}`;

    const typeLabel = m.memberType === 'teacher' ? 'Teacher' : m.memberType === 'ambassador' ? 'Brand Ambassador' : m.memberType === 'provider' ? 'Service Provider' : m.memberType || '';

    return `<div class="card">
      <div class="card-title">
        🎟️ ${m.planName}
        ${statusBadge(m.status)}
        ${typeLabel ? `<span class="type-pill">${typeLabel}</span>` : ''}
      </div>
      ${detail ? `<div class="card-detail">${detail}</div>` : ''}
    </div>`;
  }).join('');
}

loadData();
</script>

<footer></footer>
<script src="footer.js?v=1"></script>
</body>
</html>
