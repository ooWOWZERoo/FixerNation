                {
                  "id": "g3",
                  "text": "Tell the truth when you make a mistake."
                }
              ],
              "listening": [
                {
                  "id": "g1",
                  "text": "Look at the speaker and wait until they finish."
                },
                {
                  "id": "g2",
                  "text": "Say back what you heard before you answer."
                },
                {
                  "id": "g3",
                  "text": "Ask one question about what someone just said."
                }
              ],
              "creativity": [
                {
                  "id": "g1",
                  "text": "Draw, build or write something new this week."
                },
                {
                  "id": "g2",
                  "text": "Make up a second way to solve a problem."
                },
                {
                  "id": "g3",
                  "text": "Change one thing in a game or story to make it yours."
                }
              ]
            },
            "fallback": [
              {
                "id": "g1",
                "text": "Notice one thing you did well today."
              },
              {

              {

      "result": {
        "heading": "My strength card",
        "lines": [
          {
            "text": "My strength: {s1|lower}.",
            "needs": "s1"
          },
          {
            "text": "{s2}",

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =

  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'scenarioChoice',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'strength-spotter-identity',
    header: {
      icon: '🌟',
      title: 'Strength Spotter',
      description: 'Notice what someone does, spot the strengths it shows, then think about your own.',
