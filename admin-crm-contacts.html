<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/api/settings/favicon?size=32">
<link rel="icon" type="image/png" sizes="16x16" href="/api/settings/favicon?size=16">
<link rel="apple-touch-icon" href="/api/settings/favicon?size=180">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Fixer Nation Education - Customer Hub Contacts</title>
<link rel="stylesheet" href="fonts.css?v=1">
<script>(function(){var t=localStorage.getItem('fnTheme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="admin-common.css?v=22">
<link rel="stylesheet" href="crm-common.css?v=3">
</head>
<body class="fn-mission-admin">

<div class="a-shell">
  <aside class="a-sidebar"></aside>
<script src="admin-nav.js?v=39"></script>

  <div class="a-main">
    <div class="a-topbar">
      <h1 id="pageTitle">Contacts</h1>
      <div class="a-theme-toggle" onclick="fnToggleTheme()" title="Toggle light/dark theme"><span class="ic-sun">☀️</span><span class="ic-moon">🌙</span></div>
      <div class="a-user"><div class="avatar">A</div> admin</div>
    </div>

    <div class="a-content">
      <div id="crmRoot"></div>
    </div>
  </div>
</div>

<script src="admin-common.js?v=17"></script>
<script src="crm-common.js?v=2"></script>
<script>
(function () {
  var C = FnCrm, esc = C.esc, root = document.getElementById('crmRoot');
  var q = C.readQuery();
  var staff = [];
  var st = { view: q.view === 'duplicates' ? 'duplicates' : q.view === 'review' ? 'review' : 'list', q: q.q || '', classification: q.classification || '', assigned: q.assigned || '', role: q.role || '', license: q.license || '', organization: q.organization || '', accountId: q.accountId || '', locked: q.locked === 'true', sort: q.sort || 'changed', dir: q.dir || 'desc', test: q.includeTest === 'true', page: Math.max(1, Number(q.page) || 1) };
  var VIEWS = [['All people', {}], ['Suspects', { classification: 'suspect' }], ['Prospects', { classification: 'prospect' }], ['Customers', { classification: 'customer' }], ['Mine', { assigned: 'me' }], ['No owner', { assigned: 'none' }]];
  var ROLES = { champion: 'Champion', decision_maker: 'Decision maker', procurement: 'Procurement', finance: 'Finance' };
  var LICENSES = { paid: 'Has a live paid license', trial: 'Has a live trial', ended_trial: 'Only an ended trial', none: 'No license or trial' };
  var SORTS = { changed: 'Label changed', name: 'Name', email: 'Email', contacted: 'Last contacted', signup: 'Signed up' };

  C.boot(root).then(function (me) {
    if (!me) return;
    C.staff().then(function (list) { staff = list; shell(); st.view === 'duplicates' ? fetchDupes() : st.view === 'review' ? fetchReview() : fetchList(); });
  });

  function viewHref(v) { return 'admin-crm-contacts.html' + C.qstr(v[1]); }
  function viewActive(v) { return (v[1].classification || '') === st.classification && (v[1].assigned || '') === st.assigned; }

  function shell() {
    var dupTab = '<a href="admin-crm-contacts.html?view=duplicates"' + (st.view === 'duplicates' ? ' aria-current="true"' : '') + '>Possible duplicates</a>';
    var reviewTab = '<a href="admin-crm-contacts.html?view=review"' + (st.view === 'review' ? ' aria-current="true"' : '') + '>Import review</a>'; // G22
    root.innerHTML = '<div class="a-card"><div class="a-card-head"><h2>' + (st.view === 'duplicates' ? 'Possible duplicates' : st.view === 'review' ? 'Import review' : 'Contacts') + '</h2>' +
      (C.can('write') ? '<button type="button" class="a-btn a-btn-outline" id="importPeople">Import people</button>' : '') +
      (C.can('write') ? '<button type="button" class="a-btn a-btn-primary" id="addContact">+ Add a person</button>' : '') + '</div>' +
      '<ul class="crm-views" aria-label="Saved views">' + VIEWS.map(function (v) { return '<li><a href="' + esc(viewHref(v)) + '"' + (st.view === 'list' && viewActive(v) ? ' aria-current="true"' : '') + '>' + esc(v[0]) + '</a></li>'; }).join('') + '<li>' + dupTab + '</li><li>' + reviewTab + '</li></ul>' +
      (st.view === 'list' ?
        '<div class="crm-toolbar" role="search"><div class="grow"><label class="crm-sr" for="fQ">Search contacts</label><input type="search" id="fQ" placeholder="Search by name, email or company" value="' + esc(st.q) + '"></div>' +
        // G19: buying role, licence status and organization. Plain facts from the CRM (what a person holds on an account or deal, what they have bought, where they are), never a score.
        '<label class="crm-sr" for="fRole">Buying role</label><select id="fRole" class="a-filter-select">' + C.options(ROLES, st.role, 'Any buying role') + '</select>' +
        '<label class="crm-sr" for="fLicense">Licence</label><select id="fLicense" class="a-filter-select">' + C.options(LICENSES, st.license, 'Any licence status') + '</select>' +
        '<div><label class="crm-sr" for="fOrg">Organization</label><input type="search" id="fOrg" placeholder="Organization name" value="' + esc(st.organization) + '"></div>' +
        '<label class="crm-sr" for="fSort">Sort by</label><select id="fSort" class="a-filter-select">' + C.options(SORTS, st.sort) + '</select>' +
        '<label class="crm-sr" for="fDir">Order</label><select id="fDir" class="a-filter-select"><option value="desc"' + (st.dir === 'desc' ? ' selected' : '') + '>Newest first</option><option value="asc"' + (st.dir === 'asc' ? ' selected' : '') + '>Oldest first</option></select>' +
        '<label class="crm-check" style="margin:0;"><input type="checkbox" id="fTest"' + (st.test ? ' checked' : '') + '> Include test addresses</label></div>' : '') +
      '<div id="cBody" aria-live="polite"></div><div id="cPager"></div></div>';
    var qEl = document.getElementById('fQ');
    if (qEl) {
      var go = C.debounce(function () { st.page = 1; fetchList(); }, 250);
      qEl.addEventListener('input', function (e) { st.q = e.target.value; go(); });
      document.getElementById('fRole').addEventListener('change', function (e) { st.role = e.target.value; st.page = 1; fetchList(); });
      document.getElementById('fLicense').addEventListener('change', function (e) { st.license = e.target.value; st.page = 1; fetchList(); });
      document.getElementById('fOrg').addEventListener('input', C.debounce(function (e) { st.organization = e.target.value; st.accountId = ''; st.page = 1; fetchList(); }, 250));
      document.getElementById('fSort').addEventListener('change', function (e) { st.sort = e.target.value; st.page = 1; fetchList(); });
      document.getElementById('fDir').addEventListener('change', function (e) { st.dir = e.target.value; st.page = 1; fetchList(); });
      document.getElementById('fTest').addEventListener('change', function (e) { st.test = e.target.checked; st.page = 1; fetchList(); });
    }
    var add = document.getElementById('addContact');
    if (add) add.addEventListener('click', addContact);
    var imp = document.getElementById('importPeople');
    if (imp) imp.addEventListener('click', importPeople);
  }

  function fetchList() {
    var params = { q: st.q, classification: st.classification, assigned: st.assigned, role: st.role, license: st.license, organization: st.organization, accountId: st.accountId, locked: st.locked ? 'true' : '', today: C.todayLocal(), sort: st.sort === 'changed' ? '' : st.sort, dir: st.dir === 'desc' ? '' : st.dir, includeTest: st.test ? 'true' : '', page: st.page > 1 ? st.page : '' };
    C.writeQuery(params);
    var body = document.getElementById('cBody');
    C.loading(body);
    params.sort = st.sort; params.dir = st.dir; params.pageSize = 25; params.page = st.page;
    C.api('GET', '/api/crm/contacts' + C.qstr(params)).then(function (r) {
      if (!r.ok) { C.errorBox(body, C.problem(r)); return; }
      if (!r.data.total) { body.innerHTML = C.empty(st.q || st.classification || st.assigned || st.role || st.license || st.organization || st.accountId || st.locked ? 'Nobody matches those filters.' : 'No contacts yet.', '👤'); document.getElementById('cPager').innerHTML = ''; return; }
      body.innerHTML = '<table class="a-table" aria-label="Contacts"><thead><tr><th scope="col">Name</th><th scope="col">Label</th><th scope="col">Company</th><th scope="col">Owner</th><th scope="col">Last contacted</th><th scope="col">Email list</th></tr></thead><tbody>' +
        r.data.contacts.map(function (c) {
          return '<tr><td><a class="crm-link" href="admin-crm-contact.html?id=' + esc(c.id) + '">' + esc(c.name || c.email) + '</a><div class="crm-small crm-muted">' + esc(c.email) + '</div></td><td>' + C.classPill(c.classification) + (c.classificationLocked ? ' <span class="crm-small crm-muted" title="A CRM Admin set this label by hand, so it will not change on its own.">Set by hand</span>' : '') + '</td><td>' + esc(c.company || '') + '</td><td>' + (c.assignedAdminId ? esc(C.staffName(staff, c.assignedAdminId) || 'Former staff') : '<span class="crm-muted">Nobody yet</span>') + '</td><td>' + (c.lastContactedAt ? esc(C.date(c.lastContactedAt)) : '<span class="crm-muted">Never</span>') + '</td><td><span class="crm-small crm-muted">' + esc(c.subscriptionStatus || '') + '</span></td></tr>';
        }).join('') + '</tbody></table>';
      C.pager(document.getElementById('cPager'), r.data, function (n) { st.page = n; fetchList(); window.scrollTo(0, 0); });
    });
  }

  // ---- G22: the prospect import ----------------------------------------------------------------------------------------------------------------------------
  // The CSV is read here in the browser; the server plans and writes it. Everyone imported is a Suspect and is NOT subscribed to the newsletter. Nothing is merged or overwritten.
  function parseCsv(text) {
    var rows = [], row = [], cell = '', inq = false, i, ch;
    text = String(text || '').replace(/^﻿/, '');
    for (i = 0; i < text.length; i++) {
      ch = text[i];
      if (inq) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inq = false; } else cell += ch; }
      else if (ch === '"') inq = true;
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.some(function (c) { return c.trim(); })) rows.push(row); row = []; }
      else cell += ch;
    }
    row.push(cell); if (row.some(function (c) { return c.trim(); })) rows.push(row);
    return rows;
  }
  var ALIASES = { name: ['name', 'full name', 'contact', 'contact name'], first: ['first name', 'first', 'firstname'], last: ['last name', 'last', 'lastname', 'surname'], email: ['email', 'e-mail', 'email address'],
    organization: ['organization', 'organisation', 'school', 'district', 'account', 'school or district', 'organization name'], company: ['company'], title: ['title', 'role', 'position', 'job title'], phone: ['phone', 'telephone', 'phone number'], state: ['state'] };
  function toRows(table) {
    if (!table.length) return [];
    var head = table[0].map(function (h) { return h.trim().toLowerCase(); }), hasHead = head.indexOf('email') >= 0 || head.indexOf('e-mail') >= 0 || head.indexOf('email address') >= 0;
    var idx = {};
    if (hasHead) Object.keys(ALIASES).forEach(function (k) { for (var j = 0; j < head.length; j++) if (ALIASES[k].indexOf(head[j]) >= 0) { idx[k] = j; break; } });
    else idx = { name: 0, email: 1, organization: 2 };
    var body = hasHead ? table.slice(1) : table;
    return body.map(function (r) {
      var get = function (k) { return idx[k] === undefined ? '' : (r[idx[k]] || '').trim(); };
      return { name: get('name') || (get('first') + ' ' + get('last')).trim(), email: get('email'), organization: get('organization'), company: get('company'), title: get('title'), phone: get('phone'), state: get('state') };
    });
  }
  var DECISION = { new: 'Will be added', exists: 'Already there: only blanks filled in', review: 'Looks like someone already here: goes to Import review', invalid: 'Left out', repeated: 'Left out' };
  function importPeople() {
    C.dialog({
      title: 'Import people', submit: 'Check the list',
      body: '<p class="crm-small">Choose a CSV file, or paste it below. It needs an email column; name, organization, title, phone and state are used when they are there. Everyone imported becomes a <strong>Suspect</strong> and is <strong>not subscribed</strong> to the newsletter. Nobody already in the CRM is changed except to fill in what was blank, and rows that look like someone already here wait in Import review for you to decide.</p>' +
        C.field('CSV file', '<input type="file" id="ipFile" accept=".csv,.txt,text/csv,text/plain">', '', 'ipFile') + C.field('Or paste the rows', '<textarea id="ipText" rows="5" placeholder="name,email,organization"></textarea>', '', 'ipText') +
        C.field('Name for this import', '<input type="text" id="ipName" maxlength="120" placeholder="For example, Spring conference list">', 'So you can find these people later.', 'ipName'),
      onSubmit: function (f) {
        var name = f.querySelector('#ipName').value.trim(); if (!name) return 'Give this import a short name.';
        var file = f.querySelector('#ipFile').files[0], pasted = f.querySelector('#ipText').value;
        function go(text) {
          var rows = toRows(parseCsv(text));
          if (!rows.length) return 'There are no rows to import.';
          return C.api('POST', '/api/crm/import/preview', { rows: rows }).then(function (r) { if (!r.ok) return C.problem(r); confirmImport(name, rows, r.data); });
        }
        if (file) { if (file.size > 600000) return 'That file is too big. Import up to 400 people at a time.'; return new Promise(function (resolve) { var fr = new FileReader(); fr.onload = function () { resolve(go(String(fr.result))); }; fr.onerror = function () { resolve('That file could not be read.'); }; fr.readAsText(file); }); }
        if (!pasted.trim()) return 'Choose a file or paste the rows.';
        return go(pasted);
      }
    });
  }
  function confirmImport(name, rows, preview) {
    var c = preview.counts;
    var issues = preview.rows.filter(function (r) { return r.decision !== 'new'; }).slice(0, 12);
    C.dialog({
      title: 'Ready to import?', submit: c.new + c.exists + c.review ? 'Import' : null,
      body: '<p><strong>' + esc(C.num(c.total)) + '</strong> rows: <strong>' + esc(C.num(c.new)) + '</strong> will be added as Suspects, <strong>' + esc(C.num(c.exists)) + '</strong> are already here (only blanks are filled in), <strong>' + esc(C.num(c.review)) + '</strong> look like someone already here and will wait in Import review, and <strong>' + esc(C.num(c.left_out)) + '</strong> are left out.</p>' +
        (issues.length ? '<table class="a-table" aria-label="Rows that need a look"><thead><tr><th scope="col">Row</th><th scope="col">Email</th><th scope="col">What happens</th></tr></thead><tbody>' + issues.map(function (r) {
          return '<tr><td>' + esc(r.index + 1) + '</td><td>' + esc(r.email || '') + '<div class="crm-small crm-muted">' + esc(r.name || '') + '</div></td><td>' + esc(DECISION[r.decision] || r.decision) + (r.problem ? '<div class="crm-small crm-muted">' + esc(r.problem) + '</div>' : '') + (r.candidates && r.candidates.length ? '<div class="crm-small crm-muted">May be ' + esc(r.candidates.map(function (x) { return (x.name || x.email); }).join(', ')) + '</div>' : '') + '</td></tr>';
        }).join('') + '</tbody></table>' + (c.total > preview.rows.length ? '<p class="crm-small crm-muted">Showing the first rows that need a look.</p>' : '') : '') +
        '<p class="crm-small crm-muted">Import name: ' + esc(name) + '. Nothing has been changed yet.</p>',
      onSubmit: function () { return C.api('POST', '/api/crm/import/run', { batchName: name, rows: rows }).then(function (r) { if (!r.ok) return C.problem(r); C.toast(r.data.counts.added + ' added, ' + r.data.counts.already_there + ' already there, ' + r.data.counts.queued + ' to review'); st.view === 'list' ? fetchList() : fetchReview(); }); }
    });
  }

  // The queue of rows that looked like someone already here. Staff decide each one; nothing is merged for them.
  function fetchReview() {
    C.writeQuery({ view: 'review', page: st.page > 1 ? st.page : '' });
    var body = document.getElementById('cBody');
    C.loading(body);
    C.api('GET', '/api/crm/import/review' + C.qstr({ page: st.page, pageSize: 20 })).then(function (r) {
      if (!r.ok) { C.errorBox(body, C.problem(r)); return; }
      if (!r.data.total) { body.innerHTML = C.empty('Nothing is waiting. Rows from an import that look like someone already here will appear on this tab.', '✅'); document.getElementById('cPager').innerHTML = ''; return; }
      body.innerHTML = '<p class="crm-small crm-muted">These rows came from an import and look like someone already in the CRM, so they were not added. Decide each one. "Same person" only fills in what the existing person was missing.</p>' + r.data.items.map(function (it) {
        return '<div class="a-card" style="margin-bottom:12px;"><p class="crm-small crm-muted" style="margin:0 0 6px;">From import: ' + esc(it.batchName) + ' · ' + esc(it.reason === 'same_mailbox' ? 'the same mailbox once a + tag is removed' : 'the same full name') + '</p>' +
          '<p style="margin:0;"><strong>' + esc(it.row.name || it.row.email) + '</strong> <span class="crm-muted">' + esc(it.row.email) + (it.row.company ? ' · ' + esc(it.row.company) : '') + (it.row.title ? ' · ' + esc(it.row.title) : '') + '</span></p>' +
          '<p class="crm-small" style="margin:8px 0 4px;">Could be:</p><ul class="crm-list" aria-label="People it could be">' + it.candidates.map(function (c) {
            return '<li><div><a class="crm-link" href="admin-crm-contact.html?id=' + esc(c.id) + '">' + esc(c.name || c.email) + '</a><div class="crm-small crm-muted">' + esc(c.email) + '</div></div>' + (C.can('write') ? '<button type="button" class="a-btn a-btn-outline a-btn-sm" data-same="' + esc(it.id) + '" data-contact="' + esc(c.id) + '">Same person</button>' : '') + '</li>';
          }).join('') + '</ul>' + (C.can('write') ? '<div class="crm-row-actions" style="margin-top:8px;"><button type="button" class="a-btn a-btn-outline a-btn-sm" data-diff="' + esc(it.id) + '">Different person: add them</button><button type="button" class="a-btn a-btn-outline a-btn-sm" data-skip="' + esc(it.id) + '">Skip</button></div>' : '') + '</div>';
      }).join('');
      function decide(id, body2) { C.api('POST', '/api/crm/import/review/' + id + '/resolve', body2).then(function (x) { C.toast(x.ok ? 'Saved' : C.problem(x)); fetchReview(); }); }
      body.querySelectorAll('[data-same]').forEach(function (b) { b.addEventListener('click', function () { decide(b.getAttribute('data-same'), { action: 'same_person', contactId: Number(b.getAttribute('data-contact')) }); }); });
      body.querySelectorAll('[data-diff]').forEach(function (b) { b.addEventListener('click', function () { decide(b.getAttribute('data-diff'), { action: 'different_person' }); }); });
      body.querySelectorAll('[data-skip]').forEach(function (b) { b.addEventListener('click', function () { decide(b.getAttribute('data-skip'), { action: 'skip' }); }); });
      C.pager(document.getElementById('cPager'), r.data, function (n) { st.page = n; fetchReview(); window.scrollTo(0, 0); });
    });
  }

  function fetchDupes() {
    C.writeQuery({ view: 'duplicates', page: st.page > 1 ? st.page : '' });
    var body = document.getElementById('cBody');
    C.loading(body);
    C.api('GET', '/api/crm/contacts/review/duplicates' + C.qstr({ page: st.page, pageSize: 10 })).then(function (r) {
      if (!r.ok) { C.errorBox(body, C.problem(r)); return; }
      var intro = '<p class="crm-notice">These are suggestions to check, never a verdict. Two people at the same school share an email domain, so a shared domain alone is never used. Nothing is merged until a CRM Admin chooses which record to keep.</p>';
      if (!r.data.total) { body.innerHTML = intro + C.empty('No likely duplicates found.', '✅'); document.getElementById('cPager').innerHTML = ''; return; }
      body.innerHTML = intro + r.data.groups.map(function (g, gi) {
        return '<div class="a-card" style="margin-bottom:16px;"><div class="a-card-head"><h2 style="font-size:14px;">' + esc(g.reason) + '</h2></div><ul class="crm-list">' +
          g.contacts.map(function (c) {
            return '<li><div><a href="admin-crm-contact.html?id=' + esc(c.id) + '">' + esc(c.name || c.email) + '</a><div class="crm-small crm-muted">' + esc(c.email) + (c.company ? ' · ' + esc(c.company) : '') + '</div></div><div class="crm-row-actions">' + C.classPill(c.classification) +
              (C.can('merge') ? g.contacts.filter(function (o) { return o.id !== c.id; }).map(function (o) { return '<button type="button" class="a-btn a-btn-outline a-btn-sm" data-keep="' + esc(c.id) + '" data-drop="' + esc(o.id) + '" data-keepname="' + esc(c.name || c.email) + '" data-dropname="' + esc(o.name || o.email) + '">Keep this, remove ' + esc(o.name || o.email) + '</button>'; }).join('') : '') + '</div></li>';
          }).join('') + '</ul></div>';
      }).join('');
      body.querySelectorAll('[data-keep]').forEach(function (b) {
        b.addEventListener('click', function () { confirmMerge(Number(b.getAttribute('data-drop')), b.getAttribute('data-dropname'), Number(b.getAttribute('data-keep')), b.getAttribute('data-keepname')); });
      });
      C.pager(document.getElementById('cPager'), r.data, function (n) { st.page = n; fetchDupes(); window.scrollTo(0, 0); });
    });
  }

  function confirmMerge(dropId, dropName, keepId, keepName) {
    C.dialog({
      title: 'Merge these two people?', submit: 'Merge', danger: true,
      body: '<p>Keep <strong>' + esc(keepName) + '</strong> and remove <strong>' + esc(dropName) + '</strong>. Their places on accounts and deals, their quotes and their email lists move to the one you keep. The email list status of the one you keep does not change.</p><p>This cannot be undone. It is refused if the person you remove has purchases, a sign-in account or a hand-set Customer label.</p>' +
        C.field('Why', '<input type="text" id="mReason" maxlength="255" placeholder="Optional, kept in the audit trail">', '', 'mReason'),
      onSubmit: function (f) {
        return C.api('POST', '/api/crm/contacts/' + dropId + '/merge', { intoId: keepId, reason: f.querySelector('#mReason').value }).then(function (r) { if (r.ok) { C.toast('Merged'); fetchDupes(); return; } return C.problem(r); });
      }
    });
  }

  function addContact() {
    C.dialog({
      title: 'Add a person', submit: 'Add as a Suspect',
      body: '<p class="crm-small crm-muted">They start as a Suspect. They are not put on the newsletter unless you tick the box.</p>' +
        '<div class="a-form-row">' + C.field('Name', '<input type="text" id="nName" maxlength="255">', '', 'nName') + C.field('Email', '<input type="email" id="nEmail" maxlength="254" required>', '', 'nEmail') + '</div>' +
        '<div class="a-form-row">' + C.field('Company', '<input type="text" id="nCompany" maxlength="255">', '', 'nCompany') + C.field('State', '<input type="text" id="nState" maxlength="64">', '', 'nState') + '</div>' +
        '<div class="crm-check"><input type="checkbox" id="nSub"><label for="nSub">They agreed to get the newsletter</label></div>',
      onSubmit: function (f) {
        return C.api('POST', '/api/crm/contacts', { name: f.querySelector('#nName').value, email: f.querySelector('#nEmail').value, company: f.querySelector('#nCompany').value, state: f.querySelector('#nState').value, subscribe: f.querySelector('#nSub').checked }).then(function (r) {
          if (r.ok) { window.location.href = 'admin-crm-contact.html?id=' + r.data.id; return; }
          if (r.data.code === 'duplicate_email' && r.data.existingContactId) return r.data.error + ' (It is person number ' + r.data.existingContactId + '.)';
          return C.problem(r);
        });
      }
    });
  }
})();
