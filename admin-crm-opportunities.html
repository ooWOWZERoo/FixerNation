<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/api/settings/favicon?size=32">
<link rel="icon" type="image/png" sizes="16x16" href="/api/settings/favicon?size=16">
<link rel="apple-touch-icon" href="/api/settings/favicon?size=180">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Fixer Nation Education - Customer Hub Opportunities</title>
<link rel="stylesheet" href="fonts.css?v=1">
<script>(function(){var t=localStorage.getItem('fnTheme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="admin-common.css?v=22">
<link rel="stylesheet" href="crm-common.css?v=3">
</head>
<body class="fn-mission-admin">

<div class="a-shell">
  <aside class="a-sidebar"></aside>
<script src="admin-nav.js?v=35"></script>

  <div class="a-main">
    <div class="a-topbar">
      <h1 id="pageTitle">Opportunities</h1>
      <div class="a-theme-toggle" onclick="fnToggleTheme()" title="Toggle light/dark theme"><span class="ic-sun">☀️</span><span class="ic-moon">🌙</span></div>
      <div class="a-user"><div class="avatar">A</div> admin</div>
    </div>

    <div class="a-content">
      <div id="crmRoot"></div>
    </div>
  </div>
</div>

<script src="admin-common.js?v=17"></script>
<script src="crm-common.js?v=2"></script>
<script>
(function () {
  var C = FnCrm, esc = C.esc, root = document.getElementById('crmRoot');
  var q = C.readQuery();
  var staff = [], stages = [];
  var st = { view: q.view === 'board' ? 'board' : 'table', q: q.q || '', stage: q.stage || '', owner: q.owner || '', state: q.state || 'open', overdue: q.overdue === 'true', noNextStep: q.noNextStep === 'true', staleDays: q.staleDays || '', sort: q.sort || 'updated', dir: q.dir || 'desc', page: Math.max(1, Number(q.page) || 1) };
  // A saved view is only a set of filters in the page address, so it can be bookmarked or sent to a colleague.
  var VIEWS = [
    ['All open deals', {}],
    ['My opportunities', { owner: 'me' }],
    ['Open procurement', { stage: 'procurement' }],
    ['Stale quotes', { stage: 'proposal_sent', staleDays: '14' }],
    ['Needs a next step', { noNextStep: 'true' }],
    ['Overdue next step', { overdue: 'true' }],
    ['Won', { state: 'won' }],
    ['Lost', { state: 'lost' }]
  ];
  var STATE_OPTS = { open: 'Open', won: 'Won', lost: 'Lost', inactive: 'Inactive', all: 'Every state' };

  C.boot(root).then(function (me) {
    if (!me) return;
    Promise.all([C.staff(), C.api('GET', '/api/crm/stages')]).then(function (res) {
      staff = res[0]; stages = (res[1].data.stages || []).filter(function (s) { return s.isActive; });
      shell(); fetchList();
    });
  });

  function filterParams() {
    return { q: st.q, stage: st.stage, owner: st.owner, state: st.state === 'open' ? '' : st.state, overdue: st.overdue ? 'true' : '', noNextStep: st.noNextStep ? 'true' : '', staleDays: st.staleDays };
  }
  function viewActive(v) {
    var p = filterParams(), want = v[1], keys = ['stage', 'owner', 'state', 'overdue', 'noNextStep', 'staleDays'];
    return !p.q && keys.every(function (k) { return (p[k] || '') === (want[k] || ''); });
  }

  function shell() {
    root.innerHTML = '<div class="a-card"><div class="a-card-head"><h2>Opportunities</h2><div class="crm-row-actions">' +
      '<div class="crm-tabs" style="margin:0;border:0;padding:0;" role="group" aria-label="How to show deals"><button type="button" data-view="table" aria-pressed="' + (st.view === 'table') + '"' + (st.view === 'table' ? ' aria-selected="true"' : '') + '>List</button><button type="button" data-view="board" aria-pressed="' + (st.view === 'board') + '"' + (st.view === 'board' ? ' aria-selected="true"' : '') + '>Board</button></div>' +
      (C.can('edit_deal') ? '<button type="button" class="a-btn a-btn-primary" id="addDeal">+ New deal</button>' : '') + '</div></div>' +
      '<ul class="crm-views" aria-label="Saved views">' + VIEWS.map(function (v) { return '<li><a href="admin-crm-opportunities.html' + esc(C.qstr(Object.assign({}, v[1], st.view === 'board' ? { view: 'board' } : {}))) + '"' + (viewActive(v) ? ' aria-current="true"' : '') + '>' + esc(v[0]) + '</a></li>'; }).join('') + '</ul>' +
      '<div class="crm-toolbar" role="search"><div class="grow"><label class="crm-sr" for="fQ">Search deals</label><input type="search" id="fQ" placeholder="Search by deal or organization" value="' + esc(st.q) + '"></div>' +
      '<label class="crm-sr" for="fStage">Stage</label><select id="fStage" class="a-filter-select"><option value="">Every stage</option>' + stages.map(function (s) { return '<option value="' + esc(s.key) + '"' + (s.key === st.stage ? ' selected' : '') + '>' + esc(s.label) + '</option>'; }).join('') + '</select>' +
      '<label class="crm-sr" for="fOwner">Owner</label><select id="fOwner" class="a-filter-select"><option value="">Every owner</option><option value="me"' + (st.owner === 'me' ? ' selected' : '') + '>Me</option><option value="none"' + (st.owner === 'none' ? ' selected' : '') + '>Nobody yet</option>' + staff.map(function (s) { return '<option value="' + esc(s.id) + '"' + (String(s.id) === st.owner ? ' selected' : '') + '>' + esc(s.username) + '</option>'; }).join('') + '</select>' +
      (st.view === 'table' ? '<label class="crm-sr" for="fState">State</label><select id="fState" class="a-filter-select">' + C.options(STATE_OPTS, st.state) + '</select>' : '') + '</div>' +
      '<div id="oSummary" class="crm-small crm-muted" style="margin-bottom:12px;" aria-live="polite"></div><div id="oBody" aria-live="polite"></div><div id="oPager"></div></div>';
    var go = C.debounce(function () { st.page = 1; fetchList(); }, 250);
    document.getElementById('fQ').addEventListener('input', function (e) { st.q = e.target.value; go(); });
    document.getElementById('fStage').addEventListener('change', function (e) { st.stage = e.target.value; st.page = 1; fetchList(); });
    document.getElementById('fOwner').addEventListener('change', function (e) { st.owner = e.target.value; st.page = 1; fetchList(); });
    var fs = document.getElementById('fState'); if (fs) fs.addEventListener('change', function (e) { st.state = e.target.value; st.page = 1; fetchList(); });
    root.querySelectorAll('[data-view]').forEach(function (b) { b.addEventListener('click', function () { st.view = b.getAttribute('data-view'); st.page = 1; if (st.view === 'board') st.state = 'open'; shell(); fetchList(); }); });
    var ad = document.getElementById('addDeal'); if (ad) ad.addEventListener('click', function () { C.newDealDialog({}); });
  }

  function fetchList() {
    var p = Object.assign(filterParams(), { view: st.view === 'board' ? 'board' : '', sort: st.sort === 'updated' ? '' : st.sort, dir: st.dir === 'desc' ? '' : st.dir, page: st.page > 1 ? st.page : '' });
    C.writeQuery(p);
    var body = document.getElementById('oBody');
    C.loading(body);
    var req = Object.assign(filterParams(), { sort: st.sort, dir: st.dir, page: st.page, pageSize: st.view === 'board' ? 200 : 25 });
    if (st.view === 'board') { req.state = 'open'; req.stage = ''; }
    C.api('GET', '/api/crm/opportunities' + C.qstr(req)).then(function (r) {
      if (!r.ok) { C.errorBox(body, C.problem(r)); return; }
      var s = r.data.summary;
      document.getElementById('oSummary').textContent = s.openCount + ' open deal' + (s.openCount === 1 ? '' : 's') + ' in this view · ' + C.money(s.grossCents, '$0') + ' total · ' + C.money(s.weightedCents, '$0') + ' weighted' + (s.openWithoutValue ? ' · ' + s.openWithoutValue + ' with no value yet' : '');
      if (st.view === 'board') drawBoard(r.data); else drawTable(r.data);
    });
  }

  function mayEdit(d) { return C.can('edit_deal') && (C.role === 'admin' || !d.ownerAdminId || Number(d.ownerAdminId) === Number(C.adminId)); }

  function th(label, key) {
    var on = st.sort === key;
    return '<th scope="col" aria-sort="' + (on ? (st.dir === 'asc' ? 'ascending' : 'descending') : 'none') + '"><button type="button" class="a-btn-text" style="color:inherit;font-weight:700;text-transform:inherit;letter-spacing:inherit;font-size:inherit;margin:0;padding:0;" data-sort="' + key + '">' + esc(label) + (on ? (st.dir === 'asc' ? ' ▲' : ' ▼') : '') + '</button></th>';
  }

  function drawTable(data) {
    var body = document.getElementById('oBody'), pg = document.getElementById('oPager');
    if (!data.total) { body.innerHTML = C.empty(st.q || st.stage || st.owner || st.overdue || st.noNextStep || st.staleDays ? 'No deal matches this view.' : 'No deals yet. Start one from an account, or from a quote on the Overview.', '🎯'); pg.innerHTML = ''; return; }
    body.innerHTML = '<table class="a-table" aria-label="Deals"><thead><tr>' + th('Deal', 'name') + th('Stage', 'stage') + '<th scope="col">Owner</th>' + th('Value', 'amount') + '<th scope="col">Chance</th>' + th('Days in stage', 'daysinstage') + th('Next step', 'nextstep') + th('Expected close', 'close') + '</tr></thead><tbody>' +
      data.opportunities.map(function (o) {
        var late = o.state === 'open' && o.nextStepDueAt && C.isOverdue(o.nextStepDueAt);
        return '<tr><td><a class="crm-link" href="admin-crm-opportunity.html?id=' + esc(o.id) + '">' + esc(o.name) + '</a><div class="crm-small crm-muted">' + esc(o.accountName) + '</div></td><td>' + esc(o.stageLabel) + (o.state !== 'open' ? '<div class="crm-small">' + C.statePill(o.state) + '</div>' : '') + '</td><td>' + (o.ownerName ? esc(o.ownerName) : '<span class="crm-muted">Nobody yet</span>') + '</td><td>' + esc(C.money(o.amountCents, '—')) + '</td><td>' + esc(o.probability) + '%</td><td>' + esc(o.state === 'open' ? C.days(o.daysInStage) : '') + '</td><td>' + (o.nextStep ? esc(o.nextStep) + (o.nextStepDueAt ? '<div class="crm-small ' + (late ? 'crm-flag' : 'crm-muted') + '">' + (late ? 'Overdue · ' : '') + esc(C.date(o.nextStepDueAt)) + '</div>' : '') : (o.state === 'open' ? '<span class="crm-flag">None set</span>' : '')) + '</td><td>' + esc(o.expectedCloseDate ? C.date(o.expectedCloseDate) : '') + '</td></tr>';
      }).join('') + '</tbody></table>';
    body.querySelectorAll('[data-sort]').forEach(function (b) {
      b.addEventListener('click', function () {
        var k = b.getAttribute('data-sort');
        if (st.sort === k) st.dir = st.dir === 'asc' ? 'desc' : 'asc'; else { st.sort = k; st.dir = k === 'name' ? 'asc' : 'desc'; }
        st.page = 1; fetchList();
      });
    });
    C.pager(pg, data, function (n) { st.page = n; fetchList(); window.scrollTo(0, 0); });
  }

  /* ---- Board ---------------------------------------------------------------------------------------------------------------------- */
  function drawBoard(data) {
    var body = document.getElementById('oBody'), pg = document.getElementById('oPager');
    pg.innerHTML = data.total > data.opportunities.length ? '<p class="crm-notice">The board shows the first ' + data.opportunities.length + ' of ' + C.num(data.total) + ' open deals. Use the filters, or switch to the list.</p>' : '';
    var cols = stages.filter(function (s) { return s.key !== 'won'; });
    var by = {}; cols.forEach(function (s) { by[s.key] = []; });
    data.opportunities.forEach(function (o) { (by[o.stage] || (by[o.stage] = [])).push(o); });
    body.innerHTML = '<p class="crm-small crm-muted">Drag a card to another column, or use the “Move to” menu on a card (works with a keyboard and on a phone).</p><div class="crm-board">' +
      cols.map(function (s) {
        var list = by[s.key] || [], total = list.reduce(function (n, o) { return n + (o.amountCents || 0); }, 0);
        return '<section class="crm-col" data-stage="' + esc(s.key) + '" aria-label="' + esc(s.label) + '"><h3><span>' + esc(s.label) + '</span><span>' + list.length + '</span></h3><div class="sum">' + esc(C.money(total, '$0')) + ' · ' + s.defaultProbability + '% chance</div>' +
          (list.length ? list.map(card).join('') : '<div class="crm-empty-col">No deals here.</div>') + '</section>';
      }).join('') + '</div>';
    var byId = {}; data.opportunities.forEach(function (o) { byId[o.id] = o; });
    body.querySelectorAll('.crm-deal[draggable=true]').forEach(function (el) {
      el.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', el.getAttribute('data-id')); e.dataTransfer.effectAllowed = 'move'; el.classList.add('dragging'); });
      el.addEventListener('dragend', function () { el.classList.remove('dragging'); });
    });
    body.querySelectorAll('.crm-col').forEach(function (col) {
      col.addEventListener('dragover', function (e) { e.preventDefault(); col.classList.add('over'); });
      col.addEventListener('dragleave', function () { col.classList.remove('over'); });
      col.addEventListener('drop', function (e) {
        e.preventDefault(); col.classList.remove('over');
        var o = byId[e.dataTransfer.getData('text/plain')];
        if (o && o.stage !== col.getAttribute('data-stage')) moveDeal(o, col.getAttribute('data-stage'));
      });
    });
    body.querySelectorAll('select[data-move]').forEach(function (sel) {
      sel.addEventListener('change', function () { var o = byId[sel.getAttribute('data-move')]; var to = sel.value; sel.value = ''; if (o && to) moveDeal(o, to); });
    });
  }

  function card(o) {
    var editable = mayEdit(o), late = o.nextStepDueAt && C.isOverdue(o.nextStepDueAt);
    return '<div class="crm-deal" data-id="' + esc(o.id) + '"' + (editable ? ' draggable="true"' : '') + '><a class="nm" href="admin-crm-opportunity.html?id=' + esc(o.id) + '">' + esc(o.name) + '</a><div class="meta">' + esc(o.accountName) + '<br>' + esc(C.money(o.amountCents, 'No value')) + ' · ' + esc(C.days(o.daysInStage)) + ' in stage<br>' + (o.ownerName ? esc(o.ownerName) : 'No owner') + '<br>' +
      (o.nextStep ? '<span class="' + (late ? 'crm-flag' : '') + '">' + esc(o.nextStep) + (o.nextStepDueAt ? ' (' + esc(C.date(o.nextStepDueAt)) + ')' : '') + '</span>' : '<span class="crm-flag">No next step</span>') + '</div>' +
      (editable ? '<label class="crm-sr" for="mv' + esc(o.id) + '">Move ' + esc(o.name) + ' to another stage</label><select id="mv' + esc(o.id) + '" data-move="' + esc(o.id) + '"><option value="">Move to…</option>' + stages.filter(function (s) { return s.key !== 'won' && s.key !== o.stage; }).map(function (s) { return '<option value="' + esc(s.key) + '">' + esc(s.label) + '</option>'; }).join('') + '</select>' : '') + '</div>';
  }

  function moveDeal(o, stageKey, extra) {
    C.api('POST', '/api/crm/opportunities/' + o.id + '/stage', Object.assign({ stageKey: stageKey }, extra || {})).then(function (r) {
      if (r.ok) { C.toast('Moved'); fetchList(); return; }
      if (r.data.code === 'next_step_required') { nextStepPrompt(o, stageKey); return; }
      C.toast(C.problem(r)); fetchList();
    });
  }

  // Past Qualified a deal needs a next step. Either say what it is, or say why there is none (that reason is saved with the move).
  function nextStepPrompt(o, stageKey) {
    C.dialog({
      title: 'This deal needs a next step', submit: 'Move the deal',
      body: '<p class="crm-small crm-muted">“' + esc(o.name) + '” has no next step. Say what happens next, or explain why there is none.</p>' +
        C.field('Next step', '<input type="text" id="nsText" maxlength="255" placeholder="e.g. Send the revised quote">', '', 'nsText') + C.field('Due', '<input type="date" id="nsDue">', '', 'nsDue') +
        C.field('Or: why there is no next step', '<input type="text" id="nsWhy" maxlength="200">', 'Saved with the stage change.', 'nsWhy'),
      onSubmit: function (f) {
        var text = f.querySelector('#nsText').value.trim(), why = f.querySelector('#nsWhy').value.trim(), due = f.querySelector('#nsDue').value;
        if (!text && !why) return 'Add a next step or a reason.';
        if (text) {
          var put = { nextStep: text }; if (due) put.nextStepDueAt = due;
          return C.api('PUT', '/api/crm/opportunities/' + o.id, put).then(function (r1) {
            if (!r1.ok) return C.problem(r1);
            return C.api('POST', '/api/crm/opportunities/' + o.id + '/stage', { stageKey: stageKey }).then(function (r2) { if (r2.ok) { C.toast('Moved'); fetchList(); return; } return C.problem(r2); });
          });
        }
        return C.api('POST', '/api/crm/opportunities/' + o.id + '/stage', { stageKey: stageKey, overrideReason: why }).then(function (r2) { if (r2.ok) { C.toast('Moved'); fetchList(); return; } return C.problem(r2); });
      }
    });
  }
})();
</script>
<script src="admin-shell.js?v=8"></script>
</body>
</html>
