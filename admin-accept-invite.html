<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Set Admin Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --cream:#FBF5EC; --teal:#164F4A; --teal-dark:#0E3733;
    --coral:#F26B4D; --coral-dark:#D9502F; --gold:#EBA657; --ink:#2A2420; --ink-soft:#6B5F55;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Plus Jakarta Sans', sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  h1{font-family:'Fraunces', serif; color:var(--teal-dark); font-size:26px; margin-bottom:8px;}
  a{color:var(--teal-dark);}
  .card{background:#fff; border-radius:22px; box-shadow:0 20px 45px -18px rgba(22,79,74,0.28); padding:38px; max-width:420px; width:100%;}
  .brand{display:flex; align-items:center; margin-bottom:24px;}
  .brand img{height:72px; width:auto; display:block;}
  p.sub{font-size:14px; color:var(--ink-soft); margin-bottom:22px;}
  label{display:block; font-size:12px; font-weight:700; margin-bottom:6px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.03em;}
  input{width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); font-size:14px; margin-bottom:16px; font-family:inherit;}
  button{width:100%; padding:13px; border-radius:999px; border:none; background:var(--coral); color:#fff; font-weight:700; font-size:14.5px; cursor:pointer;}
  button:hover{background:var(--coral-dark);}
  .message{display:none; font-size:13px; font-weight:600; padding:10px 14px; border-radius:10px; margin-bottom:16px;}
  .message.error{background:#FDECEA; color:#B3261E;}
  .message.success{background:#E4F3EE; color:var(--teal-dark);}
  .back-link{display:block; text-align:center; margin-top:18px; font-size:13.5px; font-weight:600;}
</style>
</head>
<body>

<div class="card">
  <div class="brand"><img src="logo-fne.png" alt="Fixer Nation Education"></div>
  <h1>Set Your Admin Password</h1>
  <p class="sub">Enter a new password for your Fixer Nation Education admin account.</p>

  <div class="message" id="message"></div>

  <form id="acceptForm">
    <label>New Password</label>
    <input type="password" id="newPassword" required minlength="8">
    <label>Confirm New Password</label>
    <input type="password" id="confirmPassword" required minlength="8">
    <button type="submit">Set Password</button>
  </form>

  <a href="admin-login.html" class="back-link">← Back to Admin Login</a>
</div>

<script>
function showMessage(text, kind) {
  const box = document.getElementById('message');
  box.textContent = text;
  box.className = 'message ' + (kind === 'error' ? 'error' : 'success');
  box.style.display = 'block';
}

const token = new URLSearchParams(window.location.search).get('token');
if (!token) {
  showMessage('This link is missing its token. Please use the link from your email.', 'error');
  document.getElementById('acceptForm').style.display = 'none';
}

document.getElementById('acceptForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (newPassword !== confirmPassword) {
    showMessage('Passwords do not match.', 'error');
    return;
  }

  const r = await fetch('/api/auth/accept-invite', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, password: newPassword }),
  });
  const result = await r.json().catch(() => ({}));
  if (!r.ok) {
    showMessage(result.error || 'Could not set your password.', 'error');
    return;
  }
  document.getElementById('acceptForm').style.display = 'none';
  showMessage('Your password has been set! You can now log in.', 'success');
});
</script>

</body>
</html>
