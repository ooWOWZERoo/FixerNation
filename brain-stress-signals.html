<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/api/settings/favicon?size=32">
<link rel="icon" type="image/png" sizes="16x16" href="/api/settings/favicon?size=16">
<link rel="apple-touch-icon" href="/api/settings/favicon?size=180">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Stress Signals</title>
<link rel="stylesheet" href="fonts.css?v=1">
<link rel="stylesheet" href="brain-games.css?v=7">
</head>
<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=22"></script>
<script src="site-auth.js?v=12"></script>
<script src="footer.js?v=18"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js?v=3"></script>
<script src="engine-sdk.js?v=6"></script>
<script src="engine-voice.js?v=1"></script>
<script src="engine-scenario-choice.js?v=9"></script>
<script>
  // Stress Signals - Tune Your Brain (advance band). GENERATED by server/scripts/build-core-games.js: change the content there, not here.
  // Engine: Scenario Choice (a "Your turn" check-in with no stories). Focus: self awareness. Release 141.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'advance';

  const contentPack = {
    "title": "Stress Signals",
    "scenarios": [],
    "ownTurn": {
      "intro": "This check-in is about you. Only you see your answers.",
      "illustration": "🪞",
      "stepWord": "Your turn",
      "summaryLabel": "Questions you answered about yourself",
      "privateNote": "Your answers here are private and are not saved.",
      "steps": [
        {
          "id": "s1",
          "type": "pickMany",
          "max": 3,
          "prompt": "Which signs show up when stress builds? Pick up to three.",
          "confirm": "These show up",
          "options": [
            {
              "id": "shoulders",
              "text": "Tight shoulders or jaw"
            },
            {
              "id": "stomach",
              "text": "Headaches or a tight stomach"
            },
            {
              "id": "racing",
              "text": "Thoughts that will not slow down"
            },
            {
              "id": "worst",
              "text": "Thinking the worst will happen"
            },
            {
              "id": "snapping",
              "text": "Snapping at people"
            },
            {
              "id": "pulling",
              "text": "Pulling away from friends"
            },
            {
              "id": "putting-off",
              "text": "Putting things off"
            },
            {
              "id": "scrolling",
              "text": "Scrolling to avoid it"
            }
          ],
          "notSure": {
            "id": "not-sure",
            "text": "I'm not sure yet"
          }
        },
        {
          "id": "s2",
          "type": "pickOne",
          "prompt": "Which kind of sign is easiest for you to miss?",
          "options": [
            {
              "id": "body",
              "text": "Signs in my body"
            },
            {
              "id": "thoughts",
              "text": "Signs in my thoughts"
            },
            {
              "id": "actions",
              "text": "Signs in what I do"
            }
          ],
          "notSure": {
            "id": "not-sure",
            "text": "I'm not sure"
          }
        },
        {
          "id": "s3",
          "type": "pickOne",
          "prompt": "What could help you check in earlier?",
          "options": [
            {
              "id": "daily",
              "text": "A two minute check-in each day"
            },
            {
              "id": "friend",
              "text": "A friend who knows my signs"
            },
            {
              "id": "note",
              "text": "A note on my phone"
            },
            {
              "id": "breath",
              "text": "Slow breathing before big tasks"
            }
          ],
          "notSure": {
            "id": "not-sure",
            "text": "I'm not sure"
          }
        }
      ],
      "result": {
        "heading": "My stress signals",
        "lines": [
          {
            "text": "Signs I notice: {s1|lower}.",
            "needs": "s1"
          },
          {
            "text": "The easiest kind for me to miss: {s2|lower}.",
            "needs": "s2"
          },
          {
            "text": "What could help me check in earlier: {s3|lower}.",
            "needs": "s3"
          }
        ],
        "emptyLine": "That is fine. Signs can take time to spot.",
        "closing": "Everyone feels stress. If it is hard to handle, talk to a trusted adult or a counselor.",
        "finish": "Finish"
      }
    }
  };

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'scenarioChoice',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'stress-signals-checkin',
    header: {
      icon: '📡',
      title: 'Stress Signals',
      description: 'Notice how stress shows up for you.',
    },
  });
</script>
<script src="game-backlink.js?v=1" defer></script>
</body>
</html>
