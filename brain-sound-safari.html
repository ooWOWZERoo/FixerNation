<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Sound Safari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="brain-games.css?v=6">
</head>
<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=16"></script>
<script src="site-auth.js?v=10"></script>
<script src="footer.js?v=9"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js?v=2"></script>
<script src="engine-sdk.js?v=5"></script>
<script src="engine-audio-choice.js?v=4"></script>
<script>
  // Sound Safari — Tune Your Brain, Phase 5 pilot slice (Discover band).
  // Placeholder content: phonemic-awareness (initial-sound) rounds, narrated
  // by browser text-to-speech pending D1 (whether the real ElevenLabs
  // pipeline is live — see docs/tune-your-brain/LEADERSHIP_DECISIONS_REQUIRED.md).
  // Per §7.8, browser TTS must not be the ONLY source for real phonics
  // content long-term — this placeholder is explicitly not production audio.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'discover';

  const contentPack = {
    title: 'Sound Safari',
    items: [
      {
        stimulusType: 'audio',
        stimulusText: "Mmm. Moon starts with mmm. Which picture starts with mmm?",
        words: "Which picture starts with the same sound as \"moon\"?",
        transcript: "Which picture starts with the same sound as \"moon\"?",
        choices: [
          { id: "monkey", label: "🐵", aria: "monkey" },
          { id: "cat", label: "🐱", aria: "cat" },
          { id: "fish", label: "🐟", aria: "fish" },
        ],
        correctId: "monkey",
      },
      {
        stimulusType: 'audio',
        stimulusText: "Sss. Sun starts with sss. Which picture starts with sss?",
        words: "Which picture starts with the same sound as \"sun\"?",
        transcript: "Which picture starts with the same sound as \"sun\"?",
        choices: [
          { id: "dog", label: "🐶", aria: "dog" },
          { id: "snake", label: "🐍", aria: "snake" },
          { id: "bird", label: "🐦", aria: "bird" },
        ],
        correctId: "snake",
      },
      {
        stimulusType: 'audio',
        stimulusText: "Tuh. Tiger starts with tuh. Which picture starts with tuh?",
        words: "Which picture starts with the same sound as \"tiger\"?",
        transcript: "Which picture starts with the same sound as \"tiger\"?",
        choices: [
          { id: "turtle", label: "🐢", aria: "turtle" },
          { id: "lion", label: "🦁", aria: "lion" },
          { id: "frog", label: "🐸", aria: "frog" },
        ],
        correctId: "turtle",
      },
      {
        stimulusType: 'audio',
        stimulusText: "Buh. Ball starts with buh. Which picture starts with buh?",
        words: "Which picture starts with the same sound as \"ball\"?",
        transcript: "Which picture starts with the same sound as \"ball\"?",
        choices: [
          { id: "butterfly", label: "🦋", aria: "butterfly" },
          { id: "elephant", label: "🐘", aria: "elephant" },
          { id: "owl", label: "🦉", aria: "owl" },
        ],
        correctId: "butterfly",
      },
    ],
  };

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login — progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'audioChoice',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'sound-safari-initial-sounds',
    header: {
      icon: '🦁',
      title: 'Sound Safari',
      description: 'Listen. Find the picture that starts the same.',
    },
  });
</script>
</body>
</html>
