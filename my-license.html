<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My License — Fixer Nation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --cream:#FBF5EC; --teal:#164F4A; --teal-dark:#0E3733;
    --coral:#F26B4D; --coral-dark:#D9502F; --gold:#EBA657; --ink:#2A2420; --ink-soft:#6B5F55; --border:rgba(22,79,74,0.15);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Plus Jakarta Sans', sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; padding:40px 20px;}
  .wrap{max-width:720px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:28px;}
  .brand-mark{width:38px; height:38px; border-radius:12px; background:linear-gradient(135deg, var(--coral), var(--gold)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800;}
  .brand-word{font-family:'Fraunces',serif; font-weight:700; font-size:18px; color:var(--teal-dark);}
  h1{font-family:'Fraunces', serif; color:var(--teal-dark); font-size:28px; margin-bottom:6px;}
  p.sub{font-size:14.5px; color:var(--ink-soft); margin-bottom:28px;}
  a{color:var(--teal-dark);}
  .card{background:#fff; border-radius:18px; box-shadow:0 16px 40px -20px rgba(22,79,74,0.25); padding:26px 28px; margin-bottom:18px;}
  .card-title{font-weight:700; font-size:16px; margin-bottom:2px;}
  .card-sub{font-size:13px; color:var(--ink-soft); margin-bottom:14px;}
  .seat-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--border);}
  .seat-row:first-of-type{border-top:none;}
  .seat-status{font-size:13px;}
  .seat-row input{flex:1; padding:9px 12px; border-radius:8px; border:1px solid var(--border); font-size:13.5px; font-family:inherit;}
  .seat-row button{padding:9px 14px; border-radius:8px; border:none; background:var(--teal); color:#fff; font-weight:600; font-size:13px; cursor:pointer; white-space:nowrap;}
  .seat-row button:hover{background:var(--teal-dark);}
  .empty{text-align:center; color:var(--ink-soft); font-size:14px; padding:40px 20px;}
  .back-link{display:inline-block; margin-top:6px; font-size:13.5px; font-weight:600;}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--teal-dark); color:#fff; padding:11px 20px; border-radius:999px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:all .25s;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand"><div class="brand-mark">FN</div><div class="brand-word">Fixer Nation</div></div>
  <h1>My License</h1>
  <p class="sub">Books, licenses, and teacher seats tied to your account.</p>

  <div id="purchasesWrap"></div>
  <div class="empty" id="emptyState" style="display:none;">
    You don't have any purchases on file yet. If you've bought a book or a teacher license, make sure you're logged in with the same email you used to purchase it.
  </div>

  <a href="index.html" class="back-link">← Back to Fixer Nation</a>
</div>

<div class="toast" id="toast"></div>

<script src="admin-common.js?v=14"></script>
<script>fnTrackPageview();</script>
<script>
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

function formatDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

async function loadPurchases() {
  const r = await fetch('/api/site-auth/my-purchases', { credentials: 'include' });
  if (r.status === 401) {
    window.location.href = 'index.html';
    return;
  }
  const data = await r.json().catch(() => ({}));
  render(data.purchases || []);
}

function render(purchases) {
  const wrap = document.getElementById('purchasesWrap');
  document.getElementById('emptyState').style.display = purchases.length === 0 ? 'block' : 'none';

  wrap.innerHTML = purchases.map(p => {
    const dateLabel = formatDate(p.purchasedAt);
    if (p.productType === 'book') {
      return card(`📗 ${p.bookTitle || 'Book'}`, `Purchased ${dateLabel}`, '');
    }
    if (p.productType === 'single_license') {
      const seat = p.seats[0];
      const status = seat && seat.status === 'registered' ? 'Active' : 'Pending activation';
      return card('🔑 Single Teacher License', `Purchased ${dateLabel} · ${status}`, '');
    }
    const registeredCount = p.seats.filter(s => s.status === 'registered').length;
    const rows = p.seats.map(s => `
      <div class="seat-row">
        ${s.status === 'registered'
          ? `<div class="seat-status">✅ <strong>${s.registeredName}</strong> <span style="color:var(--ink-soft);">(${s.invitedEmail})</span></div>`
          : `<input type="email" placeholder="teacher@school.org" value="${s.invitedEmail || ''}" data-purchase="${p.id}" data-seat="${s.id}">
             <button onclick="saveSeatEmail(this)">Save</button>`}
      </div>
    `).join('');
    return card(
      `🏫 Group License — ${registeredCount}/${p.seatCount} seats used`,
      `Purchased ${dateLabel} · give a seat to a teacher by entering their email below`,
      rows
    );
  }).join('');
}

function card(title, sub, rowsHtml) {
  return `<div class="card"><div class="card-title">${title}</div><div class="card-sub">${sub}</div>${rowsHtml}</div>`;
}

async function saveSeatEmail(btn) {
  const input = btn.previousElementSibling;
  const purchaseId = input.dataset.purchase;
  const seatId = input.dataset.seat;
  const email = input.value.trim();

  const r = await fetch(`/api/site-auth/my-purchases/${purchaseId}/seats/${seatId}`, {
    method: 'PUT',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ invitedEmail: email }),
  });
  const result = await r.json().catch(() => ({}));
  if (!r.ok) {
    toast(result.error || 'Could not save that email');
    return;
  }
  toast('Seat updated — the teacher can now sign up with that email');
  loadPurchases();
}

loadPurchases();
</script>

</body>
</html>
