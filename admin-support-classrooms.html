<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/api/settings/favicon?size=32">
<link rel="icon" type="image/png" sizes="16x16" href="/api/settings/favicon?size=16">
<link rel="apple-touch-icon" href="/api/settings/favicon?size=180">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Classrooms &amp; Parents</title>
<link rel="stylesheet" href="fonts.css?v=1">
<script>(function(){var t=localStorage.getItem('fnTheme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="admin-common.css?v=22">
</head>
<body class="fn-mission-admin">

<div class="a-shell">
  <aside class="a-sidebar"></aside>
<script src="admin-nav.js?v=32"></script>

  <div class="a-main">
    <div class="a-topbar">
      <h1>Classrooms &amp; Parents</h1>
      <div class="a-theme-toggle" onclick="fnToggleTheme()" title="Toggle light/dark theme"><span class="ic-sun">☀️</span><span class="ic-moon">🌙</span></div>
      <div class="a-user"><div class="avatar">A</div> admin</div>
    </div>

    <div class="a-content">

      <div id="lockNotice" class="a-note" style="display:none;"></div>

      <div class="a-card" style="max-width:900px; margin-top:24px;">
        <div class="a-card-head"><h2>Classroom lookup</h2></div>
        <div class="a-note" style="margin:0 0 12px;">
          Find a classroom by teacher email, classroom code or student username. Student names are hidden after
          <span id="lockMinutes">5</span> minutes without activity.
        </div>
        <form id="classroomForm" onsubmit="classroomLookup(event)" style="display:flex; gap:10px;">
          <input type="text" id="classroomQuery" placeholder="teacher@school.edu, ABCD2345 or a username" style="flex:1;" maxlength="255" required>
          <button type="submit" class="a-btn a-btn-primary">Find classroom</button>
        </form>
        <div id="pinResult" class="a-note" style="display:none; margin-top:14px; border-left:4px solid var(--a-success,#1f7a4d);"></div>
        <div id="classroomResults" style="margin-top:14px;"></div>
      </div>

      <div class="a-card" style="max-width:900px; margin-top:24px;">
        <div class="a-card-head"><h2>Parent view</h2></div>
        <div class="a-note" style="margin:0 0 12px;">See the children linked to a parent's account and the invitations sent to their email.</div>
        <form id="parentForm" onsubmit="parentLookup(event)" style="display:flex; gap:10px;">
          <input type="email" id="parentEmail" placeholder="parent@email.com" style="flex:1;" maxlength="255" required>
          <button type="submit" class="a-btn a-btn-primary">Find parent</button>
        </form>
        <div id="parentResults" style="margin-top:14px;"></div>
      </div>

    </div>
  </div>
</div>

<script src="admin-common.js?v=17"></script>
<script src="admin-privacy-lock.js?v=1"></script>
<script>
let lastClassroomQuery = '';
let lastParentEmail = '';
async function postJson(url) {
  const r = await fetch(url, { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  if (fnHandleUnauthorized(r)) return null;
  const d = await r.json().catch(function () { return {}; });
  if (!r.ok) { fnToast(d.error || 'That did not work', 'error'); return null; }
  return d;
}
function fmtDate(d) { return d ? new Date(d).toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' }) : '—'; }
function esc(str) { return fnEscape(str); }

// ---- Student names: classroom lookup and parent view (hidden again after the idle time set in Settings) ----
const lock = fnPrivacyLock({
  notice: document.getElementById('lockNotice'),
  clear: function () {
    document.getElementById('classroomResults').textContent = '';
    document.getElementById('parentResults').textContent = '';
    const pr = document.getElementById('pinResult'); pr.textContent = ''; pr.style.display = 'none';
  },
  reload: function () {
    if (lastClassroomQuery) runClassroomLookup(lastClassroomQuery);
    if (lastParentEmail) runParentLookup(lastParentEmail);
  }
});
lock.ready.then(function () { document.getElementById('lockMinutes').textContent = String(lock.minutes()); });

function classroomLookup(e) {
  e.preventDefault();
  lastClassroomQuery = document.getElementById('classroomQuery').value.trim();
  if (lastClassroomQuery) runClassroomLookup(lastClassroomQuery);
}

async function runClassroomLookup(q) {
  const r = await fetch('/api/admin/support-console/classrooms?q=' + encodeURIComponent(q), { credentials: 'include' });
  if (fnHandleUnauthorized(r)) return;
  const d = await r.json().catch(function () { return {}; });
  if (!r.ok) { fnToast(d.error || 'Lookup failed', 'error'); return; }
  const box = document.getElementById('classroomResults');
  box.innerHTML = (d.classrooms || []).map(function (c) {
    const rows = c.students.map(function (s) {
      const status = (s.active ? '<span class="a-pill a-pill-success">Active</span>' : '<span class="a-pill a-pill-neutral">Inactive</span>') +
        (s.locked ? ' <span class="a-pill a-pill-danger">Locked, ' + esc(s.lockedMinutes) + ' min left</span>' : '');
      return '<tr><td>' + esc(s.displayName) + '</td><td><code>' + esc(s.username) + '</code></td><td>' + status + '</td><td style="white-space:nowrap;">' +
        '<button class="a-btn a-btn-outline a-btn-sm" data-v="' + esc(s.displayName) + '" onclick="resetStudentPin(' + Number(s.id) + ', this.dataset.v)">Reset PIN</button> ' +
        (s.locked ? '<button class="a-btn a-btn-outline a-btn-sm" onclick="unlockStudent(' + Number(s.id) + ')">Unlock</button>' : '') + '</td></tr>';
    }).join('') || '<tr><td colspan="4">No students in this classroom.</td></tr>';
    return '<div style="margin-bottom:18px;"><div style="font-weight:700;">' + esc(c.name) + (c.archived ? ' (archived)' : '') + '</div>' +
      '<div style="font-size:13px; color:var(--a-text-soft); margin-bottom:6px;">Teacher: ' + esc(c.teacher.name) + ' · ' + esc(c.teacher.email) + '</div>' +
      '<table class="a-table"><thead><tr><th>Name</th><th>Username</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }).join('') || '<div class="a-note">No classroom found for that search.</div>';
  lock.arm();
}

async function resetStudentPin(id, name) {
  if (!confirm('Make a new PIN for this student? The old PIN stops working.')) return;
  const d = await postJson('/api/admin/support-console/students/' + id + '/reset-pin');
  if (!d) return;
  const box = document.getElementById('pinResult');
  box.textContent = 'New PIN for ' + name + ': ' + d.pin + '. It is shown once. Give it to the teacher or the student.' + (d.active ? '' : ' (This student is marked inactive and cannot sign in until reactivated.)');
  box.style.display = 'block';
  lock.arm();
  if (lastClassroomQuery) runClassroomLookup(lastClassroomQuery);
}

async function unlockStudent(id) {
  if (await postJson('/api/admin/support-console/students/' + id + '/clear-lock')) { fnToast('Unlocked'); if (lastClassroomQuery) runClassroomLookup(lastClassroomQuery); }
}

function parentLookup(e) {
  e.preventDefault();
  lastParentEmail = document.getElementById('parentEmail').value.trim().toLowerCase();
  if (lastParentEmail) runParentLookup(lastParentEmail);
}

async function runParentLookup(email) {
  const r = await fetch('/api/admin/support-console/parents?email=' + encodeURIComponent(email), { credentials: 'include' });
  if (fnHandleUnauthorized(r)) return;
  const d = await r.json().catch(function () { return {}; });
  if (!r.ok) { fnToast(d.error || 'Lookup failed', 'error'); return; }
  const box = document.getElementById('parentResults');
  const acct = d.account
    ? '<div style="font-weight:700;">' + esc(d.account.name) + ' ' + (d.account.verified ? '<span class="a-pill a-pill-success">Verified</span>' : '<span class="a-pill a-pill-warning">Unverified</span>') + (d.account.closed ? ' <span class="a-pill a-pill-danger">Closed</span>' : '') + '</div>'
    : '<div class="a-note">No account exists for this email.</div>';
  const kids = (d.children || []).map(function (c) {
    return '<tr><td>' + esc(c.student) + '</td><td>' + esc(c.className) + '</td><td>' + esc(c.teacher) + '</td></tr>';
  }).join('') || '<tr><td colspan="3">No children linked.</td></tr>';
  const invs = (d.invitations || []).map(function (i) {
    const state = i.status === 'pending' ? (i.expired ? '<span class="a-pill a-pill-warning">Expired</span>' : '<span class="a-pill">Pending</span>') : '<span class="a-pill a-pill-neutral">' + esc(i.status) + '</span>';
    const acts = i.status === 'pending'
      ? '<button class="a-btn a-btn-outline a-btn-sm" onclick="changeParentInvite(' + Number(i.id) + ', \'extend\')">Extend 14 days</button> <button class="a-btn a-btn-danger a-btn-sm" onclick="changeParentInvite(' + Number(i.id) + ', \'revoke\')">Revoke</button>'
      : '';
    return '<tr><td>' + esc(i.student) + '</td><td>' + esc(i.className) + '</td><td>' + state + '</td><td>' + esc(fmtDate(i.expiresAt)) + '</td><td style="white-space:nowrap;">' + acts + '</td></tr>';
  }).join('') || '<tr><td colspan="5">No invitations sent to this email.</td></tr>';
  box.innerHTML = acct +
    '<h3 style="margin:14px 0 6px; font-size:14px;">Linked children</h3><table class="a-table"><thead><tr><th>Child</th><th>Classroom</th><th>Teacher</th></tr></thead><tbody>' + kids + '</tbody></table>' +
    '<h3 style="margin:14px 0 6px; font-size:14px;">Invitations</h3><table class="a-table"><thead><tr><th>Child</th><th>Classroom</th><th>Status</th><th>Expires</th><th></th></tr></thead><tbody>' + invs + '</tbody></table>';
  lock.arm();
}

async function changeParentInvite(id, action) {
  const r = await fetch('/api/admin/support-console/parent-invitations/' + id + '/' + action, { method: 'PUT', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  if (fnHandleUnauthorized(r)) return;
  const d = await r.json().catch(function () { return {}; });
  if (!r.ok) { fnToast(d.error || 'That did not work', 'error'); return; }
  fnToast(action === 'extend' ? 'Extended by 14 days' : 'Invitation revoked');
  if (lastParentEmail) runParentLookup(lastParentEmail);
}


// Links from Account Lookup and the Inbox: ?q= runs a classroom search, ?parent= runs a parent lookup.
(function () {
  const p = new URLSearchParams(location.search);
  const q = (p.get('q') || '').trim().slice(0, 255);
  const parent = (p.get('parent') || '').trim().toLowerCase().slice(0, 255);
  if (q) { document.getElementById('classroomQuery').value = q; lastClassroomQuery = q; runClassroomLookup(q); }
  if (parent) { document.getElementById('parentEmail').value = parent; lastParentEmail = parent; runParentLookup(parent); }
})();
</script>
<script src="admin-shell.js?v=5"></script>
</body>
</html>
