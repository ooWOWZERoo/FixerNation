<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=20"></script>

<script src="engine-scenario-choice.js?v=9"></script>
<script>
  // Know Yourself - Tune Your Brain (advance band). GENERATED by server/scripts/build-core-games.js: change the content there, not here.
  // Engine: Scenario Choice (a "Your turn" check-in with no stories). Focus: self awareness. Release 141.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'advance';

  const contentPack = {
    "title": "Know Yourself",
    "scenarios": [],
    "ownTurn": {
      "intro": "This is about what matters to you. Only you see what you pick.",
      "illustration": "🧭",
      "stepWord": "Your turn",
      "summaryLabel": "Questions you answered about yourself",
      "privateNote": "Your answers here are private and are not saved.",
      "steps": [
        {
          "id": "top",
          "type": "rank",
          "max": 3,
          "prompt": "Pick the three priorities that matter most to you right now, in order.",
          "confirm": "These are my top three",
          "options": [
            {
              "id": "health",
              "text": "Health"
            },
            {
              "id": "family",
              "text": "Family"
            },
            {
              "id": "school",
              "text": "School"
            },
            {
              "id": "friends",
              "text": "Friends"
            },
            {
              "id": "money",
              "text": "Money"
            },
            {
              "id": "fun",
              "text": "Fun"
            },
            {
              "id": "helping",
              "text": "Helping others"
            },
            {
              "id": "independence",
              "text": "Independence"
            }
          ],
          "notSure": {
            "id": "not-sure",
            "text": "I'm not sure yet"
          }
        },
        {
          "id": "trade",
          "type": "tradeoff",
          "fromStep": "top",
          "prompt": "Which would you protect?",
          "dependsText": "It depends",
          "pairs": [
            {
              "a": "health",
              "b": "school",
              "context": "It is the night before a big exam. You can sleep or keep studying until midnight.",
              "optionA": {
                "text": "Get a full night of sleep.",
                "card": "When health and school pulled apart, I leaned toward health."
              },
              "optionB": {
                "text": "Keep studying a few more hours.",
                "card": "When health and school pulled apart, I leaned toward school."
              },
              "depends": "When health and school pulled apart, I said it depends."
            },
            {
              "a": "family",
              "b": "friends",
              "context": "Your family dinner and a friend's party are on the same Saturday night.",
              "optionA": {
                "text": "Go to the family dinner.",
                "card": "When family and friends pulled apart, I leaned toward family."
              },
              "optionB": {
                "text": "Go to the party.",
                "card": "When family and friends pulled apart, I leaned toward friends."
              },
              "depends": "When family and friends pulled apart, I said it depends."
            },
            {
              "a": "money",
              "b": "fun",
              "context": "You have a free weekend. You can work an extra shift or go on a trip with friends.",
              "optionA": {
                "text": "Work the extra shift.",
                "card": "When money and fun pulled apart, I leaned toward money."
              },
              "optionB": {
                "text": "Go on the trip.",
                "card": "When money and fun pulled apart, I leaned toward fun."
              },
              "depends": "When money and fun pulled apart, I said it depends."
            },
            {
              "a": "helping",
              "b": "independence",
              "context": "A neighbor asks for help all afternoon. You planned that time for your own project.",
              "optionA": {
                "text": "Help your neighbor.",
                "card": "When helping and independence pulled apart, I leaned toward helping."
              },
              "optionB": {
                "text": "Keep the time for your project.",
                "card": "When helping and independence pulled apart, I leaned toward independence."
              },
              "depends": "When helping and independence pulled apart, I said it depends."

            {
              "a": "school",
              "b": "fun",
              "context": "A game night is on the same evening as a big assignment.",
              "optionA": {
                "text": "Finish the assignment first.",
                "card": "When school and fun pulled apart, I leaned toward school."
              },
              "optionB": {
                "text": "Go to game night.",
                "card": "When school and fun pulled apart, I leaned toward fun."
              },
              "depends": "When school and fun pulled apart, I said it depends."
            },
            {
              "a": "family",
              "b": "independence",
              "context": "Your family wants you home. You have a chance to try something new on your own.",
              "optionA": {
                "text": "Stay close to your family.",
                "card": "When family and independence pulled apart, I leaned toward family."
              },
              "optionB": {
                "text": "Take the chance to go it alone.",
                "card": "When family and independence pulled apart, I leaned toward independence."
              },
              "depends": "When family and independence pulled apart, I said it depends."
            }
          ]
        },
        {
          "id": "week",
          "type": "pickOne",
          "dependsOn": "top",
          "prompt": "How did your week match {top.first|lower}?",
          "promptIfNone": "How did your week match what matters to you?",
          "options": [
            {
              "id": "big",
              "text": "A big choice did",
              "card": "This week a big choice matched {top.first|lower}."
            },
            {
              "id": "small",
              "text": "A small choice did",
              "card": "This week a small choice matched {top.first|lower}."
            },
            {
              "id": "none",
              "text": "Not yet",
              "card": "My week did not match {top.first|lower} yet, and that is okay."
            }
          ],
          "notSure": {
            "id": "not-sure",
            "text": "I'm not sure"
          }
        }
      ],
      "result": {
        "heading": "My priorities",
        "lines": [
          {
            "text": "My top three: {top|lower}.",
            "needs": "top"
          },
          {
            "text": "{trade}",
            "needs": "trade"
          },
          {
            "text": "{week}",
            "needs": [
              "top",
              "week"
            ]
          }
        ],
        "emptyLine": "That is fine. Priorities can take time to sort out.",
        "closing": "Priorities change as you do. Only you see this.",
        "finish": "Finish"
      }
    }
  };

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'scenarioChoice',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'know-yourself-checkin',
    header: {
      icon: '🔭',
      title: 'Know Yourself',
      description: 'See what matters to you.',
    },
  });
</script>
<script src="game-backlink.js?v=1" defer></script>
