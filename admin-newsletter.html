<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Fixer Nation Education - Contacts have moved</title>
<!--
  The older CRM page is retired (contact screens merge, phase 6: docs/reference/contact-pages-merge-requirements.md). Everything it did now lives on the Customer Hub Contacts list
  (admin-crm-contacts.html) and a person's page (admin-crm-contact.html). This stub stays so a bookmark, an old link or a saved e-mail still lands somewhere useful:
    admin-newsletter.html           -> the Contacts list
    admin-newsletter.html?edit=<id> -> that person's page with Edit details open
  It does no work of its own: no fetch, no data, no script beyond the redirect.
-->
<meta http-equiv="refresh" content="3; url=admin-crm-contacts.html">
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; max-width:34rem; margin:12vh auto; padding:0 1.25rem; color:#2A2420; line-height:1.5;} a{color:#164F4A;}</style>
</head>
<body>
<h1>Contacts have moved</h1>
<p>The older CRM page is now the <a href="admin-crm-contacts.html" id="go">Contacts list</a> in the Customer Hub. Taking you there now.</p>
<script>
(function () {
  var edit = Number(new URLSearchParams(window.location.search).get('edit'));
  var to = Number.isInteger(edit) && edit > 0 ? 'admin-crm-contact.html?id=' + edit + '&edit=1' : 'admin-crm-contacts.html';
  document.getElementById('go').setAttribute('href', to);
  window.location.replace(to);
})();
</script>
</body>
</html>
