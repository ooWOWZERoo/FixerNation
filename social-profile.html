<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Profile — Fixer Nation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
  :root{--cream:#FBF5EC;--cream-soft:#F3EBDD;--teal:#164F4A;--teal-dark:#0E3733;--coral:#F26B4D;--coral-dark:#D9502F;--gold:#EBA657;--ink:#2A2420;--ink-soft:#6B5F55;--radius-md:18px;--shadow:0 20px 45px -18px rgba(22,79,74,0.28);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;}
  h1,h2,h3,h4{font-family:'Fraunces',serif;color:var(--teal-dark);line-height:1.15;font-weight:600;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;border:none;transition:transform .18s ease;}
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:var(--coral);color:#fff;box-shadow:0 14px 28px -10px rgba(242,107,77,0.55);}
  .btn-sm{padding:7px 15px;font-size:13px;}
  .btn-outline{background:transparent;color:var(--teal-dark);border:2px solid var(--teal-dark);}
  header{position:sticky;top:0;z-index:80;background:rgba(251,245,236,0.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(22,79,74,0.08);}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;}
  .brand{display:flex;align-items:center;gap:12px;font-family:'Fraunces',serif;font-weight:700;font-size:21px;color:var(--teal-dark);}
  .brand-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--coral),var(--gold));color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;}
  .nav-links{display:flex;align-items:center;gap:22px;font-size:14px;font-weight:600;}
  .nav-links a{opacity:0.8;}
  .nav-links a:hover{opacity:1;color:var(--coral-dark);}
  .nav-cta{display:flex;align-items:center;gap:16px;}

  .profile-page{max-width:680px;margin:48px auto 80px;padding:0 24px;}
  .profile-card{background:#fff;border-radius:22px;box-shadow:var(--shadow);overflow:hidden;}
  .profile-banner{height:120px;background:linear-gradient(135deg,var(--teal),var(--gold));}
  .profile-body{padding:0 32px 32px;}
  .profile-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--gold));color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;border:4px solid #fff;margin-top:-40px;margin-bottom:12px;}
  .profile-name{font-size:24px;margin-bottom:4px;}
  .profile-meta{font-size:14px;color:var(--ink-soft);margin-bottom:18px;}
  .profile-bio{font-size:15px;line-height:1.65;color:var(--ink);background:var(--cream-soft);border-radius:12px;padding:16px 18px;margin-bottom:20px;}
  .profile-no-bio{font-size:14px;color:var(--ink-soft);font-style:italic;margin-bottom:20px;}
  .profile-actions{display:flex;gap:12px;flex-wrap:wrap;}

  /* Own profile / edit mode */
  .edit-form{background:var(--cream-soft);border-radius:14px;padding:20px;margin-top:20px;}
  .edit-form label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);margin-bottom:6px;}
  .edit-form textarea{width:100%;border:2px solid rgba(22,79,74,0.15);border-radius:10px;padding:12px 14px;font-family:inherit;font-size:14px;resize:vertical;min-height:100px;background:#fff;}
  .edit-form textarea:focus{outline:none;border-color:var(--teal);}
  .consent-row{display:flex;align-items:flex-start;gap:10px;margin-top:14px;padding:14px;background:#fff;border-radius:10px;border:2px solid rgba(22,79,74,0.12);}
  .consent-row input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--teal);flex-shrink:0;}
  .consent-text{font-size:13px;color:var(--ink);}
  .consent-text strong{display:block;margin-bottom:4px;}
  .save-btn{margin-top:14px;}
  .success-msg{display:none;background:#E4F3EE;color:var(--teal-dark);border-radius:10px;padding:12px 16px;font-weight:600;font-size:14px;margin-top:12px;}

  .loading-msg{text-align:center;color:var(--ink-soft);padding:60px 0;font-size:15px;}
  .error-msg{text-align:center;color:var(--coral-dark);padding:60px 0;font-size:15px;}

  .gate-panel{background:#fff;border-radius:20px;padding:48px 40px;text-align:center;max-width:480px;margin:60px auto;box-shadow:var(--shadow);}
  .gate-panel h2{margin-bottom:12px;font-size:26px;}
  .gate-panel p{color:var(--ink-soft);font-size:15px;margin-bottom:24px;}
  footer{background:var(--teal-dark);color:rgba(255,255,255,0.82);padding:40px 0 24px;}
  .footer-bottom{border-top:1px solid rgba(255,255,255,0.12);padding-top:18px;font-size:12.5px;opacity:0.65;text-align:center;}
  .footer-links{display:flex;justify-content:center;gap:24px;margin-bottom:18px;font-size:14px;}

  @media(max-width:600px){.nav-links{display:none;}.profile-body{padding:0 20px 24px;}}
</style>
</head>
<body>

<header></header>

<div id="gatePanel" class="gate-panel" style="display:none;">
  <h2>Members-Only Community</h2>
  <p id="gateMsg"></p>
  <div id="gateBtns401" style="display:none;gap:12px;justify-content:center;flex-wrap:wrap;">
    <a href="#" onclick="fnAuthOpenModal('login'); return false;" class="btn btn-primary">Log In</a>
    <a href="licenses.html" class="btn btn-outline">Get a License</a>
  </div>
  <div id="gateBtns403" style="display:none;gap:12px;justify-content:center;flex-wrap:wrap;">
    <a href="licenses.html" class="btn btn-primary">Get a License</a>
  </div>
</div>

<div class="profile-page" id="profilePage">
  <div class="loading-msg">Loading profile…</div>
</div>

<footer></footer>

<div class="fn-auth-modal-overlay" id="fnAuthModalOverlay" style="position:fixed; inset:0; background:rgba(14,55,51,0.55); display:none; align-items:center; justify-content:center; z-index:400; padding:24px;">
  <div class="fn-auth-modal" style="background:#fff; border-radius:22px; max-width:420px; width:100%; box-shadow:0 40px 80px -20px rgba(0,0,0,0.4); padding:32px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <div style="display:flex; gap:18px;">
        <button type="button" id="fnAuthTabLogin" onclick="fnAuthSwitchTab('login')" style="border:none; background:none; font-family:'Fraunces',serif; font-size:19px; font-weight:700; cursor:pointer; padding:0; color:#164F4A;">Log In</button>
        <button type="button" id="fnAuthTabSignup" onclick="fnAuthSwitchTab('signup')" style="border:none; background:none; font-family:'Fraunces',serif; font-size:19px; font-weight:700; cursor:pointer; padding:0; color:#B8AFA6;">Sign Up</button>
      </div>
      <button type="button" onclick="fnAuthCloseModal()" style="border:none; background:#F3EBDD; width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:14px;">✕</button>
    </div>
    <div id="fnAuthMessage" style="display:none; font-size:13px; font-weight:600; padding:10px 14px; border-radius:10px; margin-bottom:14px;"></div>
    <div id="fnAuthLoginView">
      <form id="fnAuthLoginForm">
        <div style="margin-bottom:12px;"><label style="display:block; font-size:12px; font-weight:700; margin-bottom:5px; color:#6B5F55;">Email</label><input type="email" id="fnAuthLoginEmail" required style="width:100%; padding:11px 14px; border-radius:10px; border:1px solid rgba(22,79,74,0.15); font-size:14px;"></div>
        <div style="margin-bottom:8px;"><label style="display:block; font-size:12px; font-weight:700; margin-bottom:5px; color:#6B5F55;">Password</label><input type="password" id="fnAuthLoginPassword" required style="width:100%; padding:11px 14px; border-radius:10px; border:1px solid rgba(22,79,74,0.15); font-size:14px;"></div>
        <div style="text-align:right; margin-bottom:16px;"><a href="#" onclick="fnAuthShowForgotPassword(); return false;" style="font-size:12.5px; color:#D9502F; font-weight:600;">Forgot password?</a></div>
        <button type="submit" style="width:100%; padding:13px; border-radius:999px; border:none; background:#F26B4D; color:#fff; font-weight:700; font-size:14.5px; cursor:pointer;">Log In</button>
      </form>
      <div id="fnAuthResendWrap" style="display:none; text-align:center; margin-top:12px;"><a href="#" onclick="fnAuthResendVerification(); return false;" style="font-size:12.5px; color:#164F4A; font-weight:600;">Resend verification email</a></div>
    </div>
    <div id="fnAuthForgotView" style="display:none;">
      <p style="font-size:13.5px; color:#6B5F55; margin-bottom:14px;">Enter your email and we'll send you a link to reset your password.</p>
      <form id="fnAuthForgotForm">
        <div style="margin-bottom:16px;"><label style="display:block; font-size:12px; font-weight:700; margin-bottom:5px; color:#6B5F55;">Email</label><input type="email" id="fnAuthForgotEmail" required style="width:100%; padding:11px 14px; border-radius:10px; border:1px solid rgba(22,79,74,0.15); font-size:14px;"></div>
        <button type="submit" style="width:100%; padding:13px; border-radius:999px; border:none; background:#F26B4D; color:#fff; font-weight:700; font-size:14.5px; cursor:pointer;">Send Reset Link</button>
      </form>
      <div style="text-align:center; margin-top:12px;"><a href="#" onclick="fnAuthShowLoginForm(); return false;" style="font-size:12.5px; color:#164F4A; font-weight:600;">← Back to Log In</a></div>
    </div>
    <div id="fnAuthSignupView" style="display:none;">
      <form id="fnAuthSignupForm">
        <div style="display:flex; gap:10px; margin-bottom:12px;">
          <div style="flex:1;"><label style="display:block; font-size:12px; font-weight:700; margin-bottom:5px; color:#6B5F55;">First Name</label><input type="text" id="fnAuthSignupFirstName" required style="width:100%; padding:11px 14px; border-radius:10px; border:1px solid rgba(22,79,74,0.15); font-size:14px;"></div>
          <div style="flex:1;"><label style="display:block; font-size:12px; font-weight:700; margin-bottom:5px; color:#6B5F55;">Last Name</label><input type="text" id="fnAuthSignupLastName" required style="width:100%; padding:11px 14px; border-radius:10px; border:1px solid rgba(22,79,74,0.15); font-size:14px;"></div>
        </div>
        <div style="margin-bottom:12px;"><label style="display:block; font-size:12px; font-weight:700; margin-bottom:5px; color:#6B5F55;">Email</label><input type="email" id="fnAuthSignupEmail" required style="width:100%; padding:11px 14px; border-radius:10px; border:1px solid rgba(22,79,74,0.15); font-size:14px;"></div>
        <div style="margin-bottom:16px;"><label style="display:block; font-size:12px; font-weight:700; margin-bottom:5px; color:#6B5F55;">Password</label><input type="password" id="fnAuthSignupPassword" required minlength="8" style="width:100%; padding:11px 14px; border-radius:10px; border:1px solid rgba(22,79,74,0.15); font-size:14px;"></div>
        <button type="submit" style="width:100%; padding:13px; border-radius:999px; border:none; background:#F26B4D; color:#fff; font-weight:700; font-size:14.5px; cursor:pointer;">Sign Up</button>
      </form>
    </div>
  </div>
</div>

<script src="site-auth.js"></script>
<script src="cart.js"></script>
<script>
const API = '/api/social';
const params = new URLSearchParams(location.search);
const viewId = params.get('id');
const isMe = params.get('me') === '1' || !viewId;

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function initials(fn,ln){ return ((fn||'')[0]||'') + ((ln||'')[0]||''); }

async function init(){
  const page = document.getElementById('profilePage');

  // Verify social access by fetching own profile first
  const meRes = await fetch(`${API}/profile`,{credentials:'include'});
  if(meRes.status === 401){
    page.style.display='none';
    document.getElementById('gateMsg').textContent="Fixer Nation Education's Community is available to licensed teachers and active members. Sign in to continue, or get started below.";
    document.getElementById('gateBtns401').style.display='flex';
    document.getElementById('gatePanel').style.display='';
    return;
  }
  if(meRes.status === 403){
    page.style.display='none';
    document.getElementById('gateMsg').textContent='Community access requires an active Fixer Nation license or membership. Get started with one of the options below.';
    document.getElementById('gateBtns403').style.display='flex';
    document.getElementById('gatePanel').style.display='';
    return;
  }
  const meData = await meRes.json();
  const me = meData.profile;

  if(isMe){
    renderOwnProfile(me, page);
  } else {
    const res = await fetch(`${API}/profile/${viewId}`,{credentials:'include'});
    if(res.status === 404){ page.innerHTML = '<div class="error-msg">Member not found.</div>'; return; }
    if(!res.ok){ page.innerHTML = '<div class="error-msg">Failed to load profile.</div>'; return; }
    const data = await res.json();
    renderOtherProfile(data.profile, page, me);
  }
}

function renderOwnProfile(profile, page){
  const av = initials(profile.first_name, profile.last_name).toUpperCase();
  const badgesHtml = renderFeaturedBadges(profile.featuredBadges || [], true);
  page.innerHTML = `
    <div style="margin-bottom:16px;"><a href="social.html" style="font-size:14px;font-weight:700;color:var(--teal-dark);">← Back to Community</a></div>
    <div class="profile-card">
      <div class="profile-banner"></div>
      <div class="profile-body">
        <div class="profile-avatar">${av}</div>
        <h2 class="profile-name">${esc(profile.first_name)} ${esc(profile.last_name)}</h2>
        <div class="profile-meta">
          ${esc(profile.email)}
          ${profile.school_domain ? ' &middot; ' + esc(profile.school_domain) : ''}
        </div>
        ${badgesHtml}
        <div class="edit-form">
          <label for="bioInput">Your Bio</label>
          <textarea id="bioInput" placeholder="Tell other members about yourself — your role, school, interests…">${esc(profile.bio||'')}</textarea>
          <div class="consent-row">
            <input type="checkbox" id="consentCheck" ${profile.bio_consent?'checked':''}>
            <div class="consent-text">
              <strong>Share my profile with community members</strong>
              By checking this box, I authorize Fixer Nation Education to display my name, email, school, and bio to other verified community members. I can withdraw this consent at any time by unchecking this box.
            </div>
          </div>
          <div class="consent-row" style="margin-top:8px;">
            <input type="checkbox" id="badgeCheck" ${profile.show_badges!==0?'checked':''}>
            <div class="consent-text">
              <strong>Show my Brain Game badges on my profile</strong>
              Display your featured badges from Tune Your Brain on your public community profile. You control which badges appear by featuring them in <a href="brain-badges.html" style="color:var(--teal-dark);font-weight:700;">My Badges</a>.
            </div>
          </div>
          <button class="btn btn-primary btn-sm save-btn" onclick="saveProfile()">Save Profile</button>
          <div class="success-msg" id="saveSuccess">Profile saved!</div>
        </div>
        <div style="margin-top:16px;font-size:13px;color:var(--ink-soft);">
          <strong>Note:</strong> Your bio will only be visible to other community members if you check the consent box above.
        </div>
      </div>
    </div>`;
}

function renderFeaturedBadges(badges, isOwn) {
  if (!badges || !badges.length) {
    if (isOwn) {
      return `<div style="font-size:13px;color:var(--ink-soft);margin-bottom:12px;font-style:italic;">No featured badges yet — <a href="brain-badges.html" style="color:var(--teal-dark);font-weight:700;">earn and feature badges</a> in Tune Your Brain.</div>`;
    }
    return '';
  }
  const chips = badges.map(b => `
    <div style="display:inline-flex;align-items:center;gap:7px;background:var(--cream-soft);border:1px solid rgba(22,79,74,0.12);border-radius:10px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--ink);">
      <span>${b.emoji || '🏅'}</span>
      <span>${esc(b.name)}</span>
      <span style="font-size:10px;text-transform:capitalize;color:var(--ink-soft);">${b.rarity}</span>
    </div>`).join('');
  return `
    <div style="margin-bottom:16px;">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin-bottom:8px;">⭐ Brain Game Badges</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">${chips}</div>
    </div>`;
}

function renderOtherProfile(profile, page, me){
  const av = initials(profile.first_name, profile.last_name).toUpperCase();
  const bioSection = profile.bio_consent && profile.bio
    ? `<div class="profile-bio">${esc(profile.bio)}</div>`
    : `<p class="profile-no-bio">This member hasn't shared a bio yet.</p>`;
  const emailLine = profile.bio_consent && profile.email ? `<span>${esc(profile.email)}</span> &middot; ` : '';
  const schoolLine = profile.school_domain ? `<span>${esc(profile.school_domain)}</span>` : '';
  const badgesHtml = renderFeaturedBadges(profile.featuredBadges || [], false);

  page.innerHTML = `
    <div style="margin-bottom:16px;"><a href="social.html" style="font-size:14px;font-weight:700;color:var(--teal-dark);">← Back to Community</a></div>
    <div class="profile-card">
      <div class="profile-banner"></div>
      <div class="profile-body">
        <div class="profile-avatar">${av}</div>
        <h2 class="profile-name">${esc(profile.first_name)} ${esc(profile.last_name)}</h2>
        <div class="profile-meta">${emailLine}${schoolLine}</div>
        ${badgesHtml}
        ${bioSection}
        <div class="profile-actions">
          <button class="btn btn-primary btn-sm" onclick="window.location.href='social.html?dm=${profile.id}'">✉️ Send Message</button>
        </div>
      </div>
    </div>`;
}

async function saveProfile(){
  const bio = document.getElementById('bioInput').value.trim();
  const bioConsent = document.getElementById('consentCheck').checked;
  const showBadges = document.getElementById('badgeCheck').checked;
  const res = await fetch(`${API}/profile`,{
    method:'PUT', credentials:'include',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({bio, bioConsent, showBadges})
  });
  const msg = document.getElementById('saveSuccess');
  if(res.ok){
    msg.style.display='';
    setTimeout(()=>msg.style.display='none',3000);
  } else {
    alert('Failed to save. Please try again.');
  }
}

init();

document.addEventListener('fn-auth-changed', function () {
  document.getElementById('gatePanel').style.display='none';
  document.getElementById('profilePage').style.display='';
  document.getElementById('gateBtns401').style.display='none';
  document.getElementById('gateBtns403').style.display='none';
  init();
});
</script>
<script src="nav.js?v=8"></script>
<script src="footer.js?v=1"></script>
</body>
</html>
