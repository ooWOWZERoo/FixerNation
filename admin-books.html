<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Books — Fixer Nation Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-common.css">
<style>
  .a-tag-check{position:relative;}
</style>
</head>
<body>

<div class="a-shell">
  <aside class="a-sidebar">
    <div class="a-logo"><div class="mark">FN</div><div class="word">FN Admin</div></div>
    <nav class="a-nav">
      <a href="admin-dashboard.html"><span class="ic">📊</span><span class="label">Dashboard</span></a>
      <a href="admin-books.html" class="active"><span class="ic">📚</span><span class="label">Books</span></a>
      <a href="admin-curriculum.html"><span class="ic">🎓</span><span class="label">Curriculum</span></a>
      <a href="admin-blogs.html"><span class="ic">📝</span><span class="label">Blog Posts</span></a>
      <a href="admin-newsletter.html"><span class="ic">✉️</span><span class="label">Newsletter CRM</span></a>
      <a href="admin-campaigns.html"><span class="ic">📣</span><span class="label">Campaigns</span></a>
    </nav>
    <div class="a-sidebar-foot">
      <a href="fixernation-redesign-mockup.html"><span class="ic">↗</span><span class="label">View Site</span></a>
      <a href="#" onclick="fnLogout(); return false;"><span class="ic">⎋</span><span class="label">Log Out</span></a>
    </div>
  </aside>

  <div class="a-main">
    <div class="a-topbar">
      <h1>Books</h1>
      <div class="a-user"><div class="avatar">A</div> admin</div>
    </div>

    <div class="a-content">
      <div class="a-card">
        <div class="a-card-head">
          <h2>Product Catalog</h2>
          <button class="a-btn a-btn-primary" onclick="openBookModal()">+ Add New Book</button>
        </div>
        <table class="a-table" id="booksTable">
          <thead><tr><th></th><th>Title</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="a-empty" id="booksEmpty" style="display:none;">
          <div class="big">📚</div>
          No books yet — click "Add New Book" to create your first one.
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Book Modal -->
<div class="a-modal-overlay" id="bookModalOverlay">
  <div class="a-modal">
    <div class="a-modal-head">
      <h3 id="bookModalTitle">Add New Book</h3>
      <button class="a-modal-close" onclick="closeBookModal()">✕</button>
    </div>
    <div class="a-modal-body">
      <form id="bookForm">
        <input type="hidden" id="bookId">

        <div class="a-field">
          <label>Cover Image</label>
          <div class="a-image-preview" id="imagePreview">No image selected</div>
          <div style="display:flex; gap:10px;">
            <input type="file" id="coverFile" accept="image/*" style="flex:1;">
          </div>
          <div style="margin-top:8px;">
            <input type="text" id="coverUrl" placeholder="...or paste an image URL / filename">
          </div>
        </div>

        <div class="a-form-row">
          <div class="a-field">
            <label>Title *</label>
            <input type="text" id="title" required>
          </div>
          <div class="a-field">
            <label>Author</label>
            <input type="text" id="author" value="Anthony J. Placito">
          </div>
        </div>

        <div class="a-field">
          <label>Short Description <span style="font-weight:400; text-transform:none;">(shown on listing cards)</span></label>
          <textarea id="shortDescription" style="min-height:60px;"></textarea>
        </div>

        <div class="a-field">
          <label>Long Description <span style="font-weight:400; text-transform:none;">(shown on the book's detail page)</span></label>
          <textarea id="longDescription" style="min-height:120px;"></textarea>
        </div>

        <div class="a-form-row">
          <div class="a-field">
            <label>Price (USD) *</label>
            <input type="number" id="price" step="0.01" min="0" required>
          </div>
          <div class="a-field">
            <label>Compare-at Price <span style="font-weight:400; text-transform:none;">(optional)</span></label>
            <input type="number" id="compareAtPrice" step="0.01" min="0">
          </div>
        </div>

        <div class="a-form-row">
          <div class="a-field">
            <label>SKU / ISBN</label>
            <input type="text" id="sku">
          </div>
          <div class="a-field">
            <label>Category / Series</label>
            <input type="text" id="category" value="Short Story Series">
          </div>
        </div>

        <div class="a-form-row">
          <div class="a-field">
            <label>Stock Status</label>
            <select id="stockStatus">
              <option>In Stock</option>
              <option>Coming Soon</option>
              <option>Out of Stock</option>
            </select>
          </div>
          <div class="a-field">
            <label>Amazon Link</label>
            <input type="text" id="amazonUrl" placeholder="https://www.amazon.com/...">
          </div>
        </div>

        <div class="a-field">
          <label>Tags</label>
          <div class="a-tag-row">
            <label class="a-tag-check"><input type="checkbox" value="New Arrival"> New Arrival</label>
            <label class="a-tag-check"><input type="checkbox" value="Also on Amazon Kindle"> Also on Amazon Kindle</label>
            <label class="a-tag-check"><input type="checkbox" value="Available on Kindle"> Available on Kindle</label>
            <label class="a-tag-check"><input type="checkbox" value="Bestseller"> Bestseller</label>
          </div>
        </div>

        <div class="a-field">
          <label>Publish Status</label>
          <div class="a-toggle-row">
            <div class="a-toggle on" id="publishedToggle" onclick="togglePublished()"><div class="knob"></div></div>
            <span id="publishedLabel" style="font-size:14px; font-weight:600;">Published (visible on the site)</span>
          </div>
        </div>
      </form>
    </div>
    <div class="a-modal-foot">
      <button class="a-btn a-btn-outline" onclick="closeBookModal()">Cancel</button>
      <button class="a-btn a-btn-primary" onclick="saveBook()">Save Book</button>
    </div>
  </div>
</div>

<script src="admin-common.js"></script>
<script>
fnRequireAuth();

let currentCoverData = '';
let pendingCoverFile = null;
let editingId = null;
let booksCache = [];

async function fetchBooks() {
  const r = await fetch('/api/books?all=true', { credentials: 'include' });
  if (fnHandleUnauthorized(r)) return [];
  const data = await r.json();
  return data.books || [];
}

async function renderBooks() {
  booksCache = await fetchBooks();
  const tbody = document.querySelector('#booksTable tbody');
  tbody.innerHTML = '';
  if (booksCache.length === 0) {
    document.getElementById('booksTable').style.display = 'none';
    document.getElementById('booksEmpty').style.display = 'block';
    return;
  }
  document.getElementById('booksTable').style.display = 'table';
  document.getElementById('booksEmpty').style.display = 'none';

  booksCache.forEach(b => {
    const tr = document.createElement('tr');
    const stockPillClass = b.stockStatus === 'In Stock' ? 'a-pill-success' : (b.stockStatus === 'Coming Soon' ? 'a-pill-warning' : 'a-pill-danger');
    tr.innerHTML = `
      <td><img class="a-row-thumb" src="${b.coverImage || ''}" alt="${b.title}" onerror="this.style.opacity=0.2;"></td>
      <td><div class="a-cell-title">${b.title}</div><div class="a-cell-sub">${b.sku || 'No SKU'}</div></td>
      <td>${fnFormatCurrency(b.price)}</td>
      <td><span class="a-pill ${stockPillClass}">${b.stockStatus}</span></td>
      <td><span class="a-pill ${b.published ? 'a-pill-success' : 'a-pill-neutral'}">${b.published ? 'Published' : 'Draft'}</span></td>
      <td>
        <div class="a-row-actions">
          <button class="a-icon-btn" title="Edit" onclick="editBook(${b.id})">✏️</button>
          <button class="a-icon-btn danger" title="Delete" onclick="deleteBook(${b.id})">🗑️</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function openBookModal() {
  editingId = null;
  currentCoverData = '';
  pendingCoverFile = null;
  document.getElementById('bookModalTitle').textContent = 'Add New Book';
  document.getElementById('bookForm').reset();
  document.getElementById('author').value = 'Anthony J. Placito';
  document.getElementById('category').value = 'Short Story Series';
  document.getElementById('imagePreview').innerHTML = 'No image selected';
  document.querySelectorAll('.a-tag-check input').forEach(cb => cb.checked = false);
  setPublishedToggle(true);
  document.getElementById('bookModalOverlay').classList.add('show');
}

function closeBookModal() {
  document.getElementById('bookModalOverlay').classList.remove('show');
}

function editBook(id) {
  const b = booksCache.find(x => x.id === id);
  if (!b) return;
  editingId = id;
  currentCoverData = b.coverImage || '';
  pendingCoverFile = null;
  document.getElementById('bookModalTitle').textContent = 'Edit Book';
  document.getElementById('title').value = b.title || '';
  document.getElementById('author').value = b.author || '';
  document.getElementById('shortDescription').value = b.shortDescription || '';
  document.getElementById('longDescription').value = b.longDescription || '';
  document.getElementById('price').value = b.price ?? '';
  document.getElementById('compareAtPrice').value = b.compareAtPrice || '';
  document.getElementById('sku').value = b.sku || '';
  document.getElementById('category').value = b.category || '';
  document.getElementById('stockStatus').value = b.stockStatus || 'In Stock';
  document.getElementById('amazonUrl').value = b.amazonUrl || '';
  document.getElementById('coverUrl').value = b.coverImage || '';
  document.querySelectorAll('.a-tag-check input').forEach(cb => cb.checked = (b.tags || []).includes(cb.value));
  setPublishedToggle(!!b.published);
  if (b.coverImage) {
    document.getElementById('imagePreview').innerHTML = `<img src="${b.coverImage}" onerror="this.parentElement.textContent='Preview unavailable'">`;
  } else {
    document.getElementById('imagePreview').innerHTML = 'No image selected';
  }
  document.getElementById('bookModalOverlay').classList.add('show');
}

async function deleteBook(id) {
  if (!confirm('Delete this book? This cannot be undone.')) return;
  const r = await fetch(`/api/books/${id}`, {
    method: 'DELETE',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: '{}',
  });
  if (fnHandleUnauthorized(r)) return;
  if (!r.ok) { fnToast('Could not delete book'); return; }
  renderBooks();
  fnToast('Book deleted');
}

function togglePublished() {
  const t = document.getElementById('publishedToggle');
  setPublishedToggle(!t.classList.contains('on'));
}
function setPublishedToggle(on) {
  const t = document.getElementById('publishedToggle');
  const l = document.getElementById('publishedLabel');
  if (on) { t.classList.add('on'); l.textContent = 'Published (visible on the site)'; }
  else { t.classList.remove('on'); l.textContent = 'Draft (hidden from the site)'; }
}

document.getElementById('coverFile').addEventListener('change', function(e){
  const file = e.target.files[0];
  if (!file) return;
  pendingCoverFile = file;
  document.getElementById('coverUrl').value = '';
  // Local-only preview until the file is actually uploaded on save.
  const reader = new FileReader();
  reader.onload = function(ev){
    document.getElementById('imagePreview').innerHTML = `<img src="${ev.target.result}">`;
  };
  reader.readAsDataURL(file);
});

document.getElementById('coverUrl').addEventListener('input', function(e){
  const val = e.target.value.trim();
  if (val) {
    pendingCoverFile = null;
    currentCoverData = val;
    document.getElementById('imagePreview').innerHTML = `<img src="${val}" onerror="this.parentElement.textContent='Preview unavailable'">`;
  }
});

async function uploadPendingCover() {
  const formData = new FormData();
  formData.append('file', pendingCoverFile);
  const r = await fetch('/api/uploads', { method: 'POST', credentials: 'include', body: formData });
  if (fnHandleUnauthorized(r)) return null;
  if (!r.ok) { fnToast('Cover image upload failed'); return null; }
  const data = await r.json();
  return data.url;
}

async function saveBook() {
  const title = document.getElementById('title').value.trim();
  const price = document.getElementById('price').value;
  if (!title || price === '') {
    fnToast('Title and price are required');
    return;
  }

  let coverImage = currentCoverData;
  if (pendingCoverFile) {
    const uploadedUrl = await uploadPendingCover();
    if (uploadedUrl === null) return;
    coverImage = uploadedUrl;
  }

  const tags = Array.from(document.querySelectorAll('.a-tag-check input:checked')).map(cb => cb.value);
  const bookData = {
    title,
    author: document.getElementById('author').value.trim(),
    coverImage,
    shortDescription: document.getElementById('shortDescription').value.trim(),
    longDescription: document.getElementById('longDescription').value.trim(),
    price: parseFloat(price),
    compareAtPrice: document.getElementById('compareAtPrice').value ? parseFloat(document.getElementById('compareAtPrice').value) : '',
    sku: document.getElementById('sku').value.trim(),
    category: document.getElementById('category').value.trim(),
    stockStatus: document.getElementById('stockStatus').value,
    amazonUrl: document.getElementById('amazonUrl').value.trim(),
    tags,
    published: document.getElementById('publishedToggle').classList.contains('on'),
  };

  const url = editingId ? `/api/books/${editingId}` : '/api/books';
  const method = editingId ? 'PUT' : 'POST';
  const r = await fetch(url, {
    method,
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(bookData),
  });
  if (fnHandleUnauthorized(r)) return;
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    fnToast(err.error || 'Could not save book');
    return;
  }

  fnToast(editingId ? 'Book updated' : 'Book added');
  closeBookModal();
  renderBooks();
}

renderBooks();
</script>

</body>
</html>
