<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - School Admins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<script>(function(){var t=localStorage.getItem('fnTheme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="admin-common.css?v=17">
<style>
  .a-hint { font-size: 12px; color: var(--a-text-soft); margin-top: 4px; }
  .err-inline { color: var(--a-danger); font-size: 13px; margin-bottom: 12px; display: none; }
  .success-inline { color: var(--a-success, #16a34a); font-size: 13px; margin-bottom: 12px; display: none; }
</style>
</head>
<body>

<div class="a-shell">
  <aside class="a-sidebar"></aside>
  <script src="admin-nav.js?v=19"></script>

  <div class="a-main">
    <div class="a-topbar">
      <h1>School License Admins</h1>
      <div class="a-theme-toggle" onclick="fnToggleTheme()" title="Toggle light/dark theme"><span class="ic-sun">☀️</span><span class="ic-moon">🌙</span></div>
      <div class="a-user"><div class="avatar">A</div> admin</div>
    </div>

    <div class="a-content">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px;">
        <input type="search" id="searchInput" placeholder="Filter by email or domain…"
          oninput="debounceLoad()"
          style="padding:9px 13px;border:1px solid var(--a-border);border-radius:10px;font-size:13.5px;font-family:inherit;background:var(--a-card);color:var(--a-text);flex:1;max-width:320px;">
        <button class="a-btn a-btn-primary" onclick="openAssignModal()">+ Assign School Admin</button>
      </div>

      <div id="toastEl"></div>

      <div class="a-card">
        <div id="tableWrap">
          <div class="a-empty"><div class="big" style="font-size:20px;">⏳</div> Loading…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Assign modal -->
<div class="a-modal-overlay" id="assignModal">
  <div class="a-modal" style="max-width:520px;">
    <div class="a-modal-head">
      <h3>Assign School License Admin</h3>
      <button class="a-modal-close" onclick="closeAssignModal()">✕</button>
    </div>
    <div class="a-modal-body">
      <div class="err-inline" id="assignErr"></div>
      <div class="success-inline" id="assignSuccess"></div>

      <div class="a-field">
        <label>Email Address *</label>
        <input type="email" id="assignEmail" placeholder="admin@school.edu">
        <div class="a-hint">If this email doesn't have an account, one will be created and a setup link emailed to them.</div>
      </div>
      <div class="a-form-row">
        <div class="a-field"><label>First Name *</label><input type="text" id="assignFirst" placeholder="Jane" required></div>
        <div class="a-field"><label>Last Name *</label><input type="text" id="assignLast" placeholder="Smith" required></div>
      </div>
      <div class="a-field">
        <label>School Purchase *</label>
        <select id="assignPurchase"><option value="">Loading purchases…</option></select>
        <div class="a-hint">Only group license purchases are shown.</div>
      </div>
      <div class="a-field">
        <label>Permission Level</label>
        <select id="assignPermission">
          <option value="primary">Full Access — can send invitations, revoke seats, view reports</option>
          <option value="secondary">Secondary — can invite teachers but cannot revoke seats</option>
          <option value="read_only">Read Only — can view reports and teacher list only</option>
        </select>
      </div>
      <div class="a-field">
        <label>Notes <span style="font-weight:400;color:var(--a-text-soft);">(internal)</span></label>
        <textarea id="assignNotes" placeholder="e.g. Primary contact for Lincoln Elementary"></textarea>
      </div>
    </div>
    <div class="a-modal-foot">
      <button class="a-btn a-btn-outline" onclick="closeAssignModal()">Cancel</button>
      <button class="a-btn a-btn-primary" id="assignBtn" onclick="doAssign()">Assign Admin</button>
    </div>
  </div>
</div>

<!-- Edit modal -->
<div class="a-modal-overlay" id="editModal">
  <div class="a-modal" style="max-width:420px;">
    <div class="a-modal-head">
      <h3>Edit Assignment</h3>
      <button class="a-modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <div class="a-modal-body">
      <div class="err-inline" id="editErr"></div>
      <input type="hidden" id="editId">
      <div class="a-field">
        <label>Permission Level</label>
        <select id="editPermission">
          <option value="primary">Full Access</option>
          <option value="secondary">Secondary</option>
          <option value="read_only">Read Only</option>
        </select>
      </div>
      <div class="a-field">
        <label>Status</label>
        <select id="editActive">
          <option value="1">Active</option>
          <option value="0">Inactive</option>
        </select>
      </div>
      <div class="a-field">
        <label>Notes</label>
        <textarea id="editNotes"></textarea>
      </div>
    </div>
    <div class="a-modal-foot">
      <button class="a-btn a-btn-outline" onclick="closeEditModal()">Cancel</button>
      <button class="a-btn a-btn-primary" id="editBtn" onclick="doEdit()">Save Changes</button>
    </div>
  </div>
</div>

<!-- Remove confirm modal -->
<div class="a-modal-overlay" id="removeModal">
  <div class="a-modal" style="max-width:420px;">
    <div class="a-modal-head">
      <h3>Remove Assignment</h3>
      <button class="a-modal-close" onclick="closeRemoveModal()">✕</button>
    </div>
    <div class="a-modal-body">
      <p id="removeMsg" style="font-size:14px;margin-bottom:8px;"></p>
      <div class="err-inline" id="removeErr"></div>
    </div>
    <div class="a-modal-foot">
      <button class="a-btn a-btn-outline" onclick="closeRemoveModal()">Cancel</button>
      <button class="a-btn a-btn-danger" id="removeBtn" onclick="doRemove()">Remove</button>
    </div>
  </div>
</div>

<script src="admin-common.js?v=16"></script>
<script>
fnRequireAuth();

var allAssignments = [], debounceTimer = null, removeId = null;

document.addEventListener('DOMContentLoaded', function () {
  loadAssignments();
  loadPurchases();
});

function debounceLoad() { clearTimeout(debounceTimer); debounceTimer = setTimeout(loadAssignments, 300); }

async function loadAssignments() {
  const q = document.getElementById('searchInput').value.trim();
  const url = '/api/admin/school-admins' + (q ? '?q=' + encodeURIComponent(q) : '');
  const wrap = document.getElementById('tableWrap');
  try {
    const r = await fetch(url, { credentials: 'include' });
    if (fnHandleUnauthorized(r)) return;
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Failed to load');
    allAssignments = d.admins || [];
    renderTable(allAssignments);
  } catch (e) {
    wrap.innerHTML = '<div class="a-empty" style="color:var(--a-danger);">' + esc(e.message) + '</div>';
  }
}

function renderTable(rows) {
  const wrap = document.getElementById('tableWrap');
  if (!rows.length) {
    wrap.innerHTML = '<div class="a-empty"><div class="big">🏫</div>No school admins assigned yet.</div>';
    return;
  }
  wrap.innerHTML =
    '<table class="a-table"><thead><tr><th>Admin</th><th>Email</th><th>School / Purchase</th><th>Permission</th><th>Status</th><th>Actions</th></tr></thead><tbody>' +
    rows.map(function (r) {
      const name = [r.first_name, r.last_name].filter(Boolean).join(' ') || '(new user)';
      const school = r.school_domain || ('Purchase #' + r.purchase_id);
      const permLabel = r.permission_level === 'read_only' ? 'Read Only' : r.permission_level === 'secondary' ? 'Secondary' : 'Full Access';
      const permPill = r.permission_level === 'read_only'
        ? '<span class="a-pill a-pill-neutral">Read Only</span>'
        : r.permission_level === 'secondary'
          ? '<span class="a-pill a-pill-neutral">Secondary</span>'
          : '<span class="a-pill a-pill-success">Full Access</span>';
      const verifiedPill = r.email_verified
        ? ''
        : ' <span class="a-pill a-pill-warn" title="Has not completed account setup">Unverified</span>';
      const statusPill = r.is_active
        ? '<span class="a-pill a-pill-success">Active</span>'
        : '<span class="a-pill a-pill-danger">Inactive</span>';
      const resendBtn = !r.email_verified
        ? '<button class="a-btn a-btn-outline a-btn-sm" onclick="resendWelcome(' + r.id + ',\'' + esc(r.email) + '\',this)">Resend Welcome</button> '
        : '';
      const resetPasswordBtn = r.email_verified
        ? '<button class="a-btn a-btn-outline a-btn-sm" onclick="sendPasswordReset(' + r.site_user_id + ',\'' + esc(r.email) + '\',this)">Reset Password</button> '
        : '';
      return '<tr>' +
        '<td style="font-weight:600;">' + esc(name) + '</td>' +
        '<td style="font-size:13px;color:var(--a-text-soft);">' + esc(r.email) + verifiedPill + '</td>' +
        '<td style="font-size:13px;">' + esc(school) + '</td>' +
        '<td>' + permPill + '</td>' +
        '<td>' + statusPill + '</td>' +
        '<td style="white-space:nowrap;">' +
          resendBtn +
          resetPasswordBtn +
          '<button class="a-btn a-btn-outline a-btn-sm" onclick="openEditModal(' + r.id + ')">Edit</button> ' +
          '<button class="a-btn a-btn-danger a-btn-sm" onclick="openRemoveModal(' + r.id + ',\'' + esc(r.email) + '\')">Remove</button>' +
        '</td></tr>';
    }).join('') +
    '</tbody></table>';
}

async function loadPurchases() {
  try {
    const r = await fetch('/api/newsletter/purchases', { credentials: 'include' });
    if (fnHandleUnauthorized(r)) return;
    const d = await r.json();
    const purchases = (d.purchases || []).filter(function (p) { return p.productType === 'group_license'; });
    const sel = document.getElementById('assignPurchase');
    sel.innerHTML = purchases.length
      ? '<option value="">Select a purchase…</option>' + purchases.map(function (p) {
          const label = p.schoolDomain || ('Purchase #' + p.id);
          const plan = p.licenseProductName ? ' — ' + p.licenseProductName : '';
          const seats = p.seatCount ? ' (' + p.seatCount + ' seats)' : '';
          const status = p.paymentStatus ? ' · ' + p.paymentStatus : '';
          return '<option value="' + p.id + '">' + esc(label + plan + seats + status) + '</option>';
        }).join('')
      : '<option value="">No group license purchases found</option>';
  } catch (e) {
    document.getElementById('assignPurchase').innerHTML = '<option value="">Failed to load purchases</option>';
  }
}

// Assign modal
function openAssignModal() {
  document.getElementById('assignErr').style.display = 'none';
  document.getElementById('assignSuccess').style.display = 'none';
  ['assignEmail','assignFirst','assignLast','assignNotes'].forEach(function (id) { var el = document.getElementById(id); if (el) el.value = ''; });
  document.getElementById('assignPermission').value = 'primary';
  document.getElementById('assignPurchase').selectedIndex = 0;
  document.getElementById('assignModal').classList.add('show');
}
function closeAssignModal() { document.getElementById('assignModal').classList.remove('show'); }

async function doAssign() {
  const btn = document.getElementById('assignBtn');
  const err = document.getElementById('assignErr');
  const success = document.getElementById('assignSuccess');
  err.style.display = 'none'; success.style.display = 'none';
  const email = document.getElementById('assignEmail').value.trim();
  const purchaseId = document.getElementById('assignPurchase').value;
  const firstName = document.getElementById('assignFirst').value.trim();
  const lastName = document.getElementById('assignLast').value.trim();
  if (!email) { err.textContent = 'Email is required.'; err.style.display = 'block'; return; }
  if (!firstName || !lastName) { err.textContent = 'First and last name are required.'; err.style.display = 'block'; return; }
  if (!purchaseId) { err.textContent = 'Please select a purchase.'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Assigning…';
  try {
    const r = await fetch('/api/admin/school-admins/assign', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email,
        firstName: document.getElementById('assignFirst').value.trim(),
        lastName: document.getElementById('assignLast').value.trim(),
        purchaseId: Number(purchaseId),
        permissionLevel: document.getElementById('assignPermission').value,
        notes: document.getElementById('assignNotes').value.trim(),
      }),
    });
    if (fnHandleUnauthorized(r)) return;
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Failed');
    success.textContent = (d.isNewUser ? 'New user created — setup email sent. ' : '') + email + ' assigned as school admin.';
    success.style.display = 'block';
    ['assignEmail','assignFirst','assignLast','assignNotes'].forEach(function (id) { var el = document.getElementById(id); if (el) el.value = ''; });
    loadAssignments();
  } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
  finally { btn.disabled = false; btn.textContent = 'Assign Admin'; }
}

// Edit modal
function openEditModal(id) {
  const r = allAssignments.find(function (a) { return a.id === id; });
  if (!r) return;
  document.getElementById('editId').value = id;
  document.getElementById('editPermission').value = r.permission_level || 'primary';
  document.getElementById('editActive').value = r.is_active ? '1' : '0';
  document.getElementById('editNotes').value = r.notes || '';
  document.getElementById('editErr').style.display = 'none';
  document.getElementById('editModal').classList.add('show');
}
function closeEditModal() { document.getElementById('editModal').classList.remove('show'); }

async function doEdit() {
  const btn = document.getElementById('editBtn');
  const id = document.getElementById('editId').value;
  const err = document.getElementById('editErr');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const r = await fetch('/api/admin/school-admins/' + id, {
      method: 'PUT', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        permissionLevel: document.getElementById('editPermission').value,
        isActive: document.getElementById('editActive').value === '1',
        notes: document.getElementById('editNotes').value.trim(),
      }),
    });
    if (fnHandleUnauthorized(r)) return;
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Failed');
    closeEditModal();
    fnToast('Assignment updated.');
    loadAssignments();
  } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
  finally { btn.disabled = false; btn.textContent = 'Save Changes'; }
}

// Remove modal
function openRemoveModal(id, email) {
  removeId = id;
  document.getElementById('removeMsg').textContent = 'Remove the school admin assignment for ' + email + '? If they have no other assignments, their role reverts to "teacher".';
  document.getElementById('removeErr').style.display = 'none';
  document.getElementById('removeModal').classList.add('show');
}
function closeRemoveModal() { document.getElementById('removeModal').classList.remove('show'); removeId = null; }

async function doRemove() {
  const btn = document.getElementById('removeBtn');
  const err = document.getElementById('removeErr');
  btn.disabled = true; btn.textContent = 'Removing…';
  try {
    const r = await fetch('/api/admin/school-admins/' + removeId, {
      method: 'DELETE', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: '{}',
    });
    if (fnHandleUnauthorized(r)) return;
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Failed');
    closeRemoveModal();
    fnToast('Assignment removed.');
    loadAssignments();
  } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
  finally { btn.disabled = false; btn.textContent = 'Remove'; }
}

function setResendMsg(html) {
  var el = document.getElementById('toastEl');
  if (el) el.innerHTML = html;
}

async function resendWelcome(id, email, btn) {
  if (!confirm('Resend the welcome/setup email to ' + email + '?')) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  setResendMsg('');
  try {
    const r = await fetch('/api/admin/school-admins/' + id + '/resend-welcome', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: '{}',
    });
    if (fnHandleUnauthorized(r)) return;
    let d = {};
    try { d = await r.json(); } catch (_) {}
    if (!r.ok) throw new Error(d.error || 'Server error (' + r.status + ')');
    setResendMsg('<div style="background:#d1fae5;color:#065f46;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;margin-bottom:12px;">✓ Welcome email sent to ' + esc(email) + '.</div>');
    if (btn) {
      const pill = document.createElement('span');
      pill.className = 'a-pill a-pill-success';
      pill.style.cssText = 'font-size:12px;padding:4px 10px;';
      pill.textContent = '✓ Email sent';
      btn.replaceWith(pill);
    }
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Resend Welcome'; }
    setResendMsg('<div style="background:#fee2e2;color:#991b1b;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;margin-bottom:12px;">Failed to send email: ' + esc(e.message) + '</div>');
  }
}

async function sendPasswordReset(siteUserId, email, btn) {
  if (!confirm('Send a password reset email to ' + email + '?')) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  setResendMsg('');
  try {
    const r = await fetch('/api/site-auth/site-users/' + siteUserId + '/send-password-reset', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: '{}',
    });
    if (fnHandleUnauthorized(r)) return;
    let d = {};
    try { d = await r.json(); } catch (_) {}
    if (!r.ok) throw new Error(d.error || 'Server error (' + r.status + ')');
    setResendMsg('<div style="background:#d1fae5;color:#065f46;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;margin-bottom:12px;">✓ Password reset email sent to ' + esc(email) + '.</div>');
    if (btn) { btn.disabled = false; btn.textContent = 'Reset Password'; }
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Reset Password'; }
    setResendMsg('<div style="background:#fee2e2;color:#991b1b;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;margin-bottom:12px;">Failed to send email: ' + esc(e.message) + '</div>');
  }
}

function esc(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
