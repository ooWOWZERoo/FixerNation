<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — Fixer Nation Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<script>(function(){var t=localStorage.getItem('fnTheme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="admin-common.css?v=15">
<style>
  .a-filter-select{padding:9px 12px; border-radius:10px; border:1px solid var(--a-border); font-size:13.5px; font-family:inherit; background:var(--a-card); color:var(--a-text);}
</style>
</head>
<body>

<div class="a-shell">
  <aside class="a-sidebar"></aside>
<script src="admin-nav.js?v=1"></script>

  <div class="a-main">
    <div class="a-topbar">
      <h1>Orders</h1>
      <div class="a-theme-toggle" onclick="fnToggleTheme()" title="Toggle light/dark theme"><span class="ic-sun">☀️</span><span class="ic-moon">🌙</span></div>
      <div class="a-user"><div class="avatar">A</div> admin</div>
    </div>

    <div class="a-content">
      <div class="a-stat-grid" style="grid-template-columns:repeat(2,1fr);">
        <div class="a-stat-card">
          <div class="label">Orders Shown</div>
          <div class="value" id="statOrderCount">—</div>
        </div>
        <div class="a-stat-card">
          <div class="label">Total Value</div>
          <div class="value" id="statOrderTotal">—</div>
        </div>
      </div>

      <div class="a-card">
        <div class="a-card-head">
          <h2>All Orders</h2>
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <input type="date" id="rangeStart" class="a-filter-select">
            <span style="color:var(--a-text-soft); font-size:13px;">to</span>
            <input type="date" id="rangeEnd" class="a-filter-select">
            <button class="a-btn a-btn-outline" onclick="applyRange()">Apply</button>
            <button class="a-btn a-btn-outline" onclick="clearRange()">All Time</button>
          </div>
        </div>
        <table class="a-table" id="ordersTable">
          <thead><tr><th>Date</th><th>Buyer</th><th>Item</th><th>Amount</th><th>Payment</th><th>Status</th><th>Invoice</th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="a-empty" id="ordersEmpty" style="display:none;">
          <div class="big">📦</div>
          No orders in this range.
        </div>
      </div>
    </div>
  </div>
</div>

<script src="admin-common.js?v=15"></script>
<script>
fnRequireAuth();

function describeItem(p) {
  if (p.productType === 'book') return `📗 ${p.bookTitle || 'Book'}`;
  if (p.productType === 'membership') return `🪪 ${p.membershipPlanName || 'Membership'}`;
  const name = p.licenseProductName || (p.productType === 'single_license' ? 'Single Teacher License' : 'Group License');
  return `🏫 ${name}${p.schoolDomain ? ` (${p.schoolDomain})` : ''}${p.seatCount ? ` — ${p.seatCount} seat${p.seatCount === 1 ? '' : 's'}` : ''}`;
}

async function loadOrders(start, end) {
  const params = new URLSearchParams();
  if (start) params.set('start', start);
  if (end) params.set('end', end);
  const [purchaseRes, memRes] = await Promise.all([
    fetch(`/api/newsletter/purchases?${params}`, { credentials: 'include' }),
    fetch('/api/memberships', { credentials: 'include' }),
  ]);
  if (fnHandleUnauthorized(purchaseRes)) return;
  if (!purchaseRes.ok) { fnToast('Could not load orders'); return; }
  const { purchases } = await purchaseRes.json();

  // Memberships that have no purchase record (comped, trialing, or pre-webhook)
  // appear as $0 comped entries so every signup is visible here.
  let extra = [];
  if (memRes.ok) {
    const { memberships } = await memRes.json();
    extra = memberships
      .filter(m => m.purchaseId === null)
      .map(m => ({
        purchasedAt: m.startedAt,
        contactId: m.contactId,
        buyer: m.contact,
        productType: 'membership',
        membershipPlanName: m.planName,
        amount: 0,
        paymentMethod: 'comped',
        paymentStatus: 'paid',
        invoiceId: null,
      }));
    // Apply same date filter to the extra entries
    if (start || end) {
      extra = extra.filter(m => {
        const d = m.purchasedAt ? m.purchasedAt.slice(0, 10) : '';
        return (!start || d >= start) && (!end || d <= end);
      });
    }
  }

  const all = [...purchases, ...extra].sort((a, b) => new Date(b.purchasedAt) - new Date(a.purchasedAt));
  renderOrders(all);
}

function renderOrders(purchases) {
  document.getElementById('statOrderCount').textContent = purchases.length;
  const total = purchases.reduce((sum, p) => sum + (p.amount || 0), 0);
  document.getElementById('statOrderTotal').textContent = fnFormatCurrency(total);

  const tbody = document.querySelector('#ordersTable tbody');
  tbody.innerHTML = '';
  if (purchases.length === 0) {
    document.getElementById('ordersTable').style.display = 'none';
    document.getElementById('ordersEmpty').style.display = 'block';
    return;
  }
  document.getElementById('ordersTable').style.display = 'table';
  document.getElementById('ordersEmpty').style.display = 'none';

  purchases.forEach(p => {
    const tr = document.createElement('tr');
    const paid = p.paymentStatus === 'paid';
    tr.innerHTML = `
      <td>${fnFormatDate(p.purchasedAt)}</td>
      <td class="a-cell-title">${(p.buyer && (p.buyer.company || p.buyer.name)) || '—'}<div class="a-note">${(p.buyer && p.buyer.email) || ''}</div></td>
      <td>${describeItem(p)}</td>
      <td>${p.amount !== null ? fnFormatCurrency(p.amount) : '—'}</td>
      <td><span class="a-pill a-pill-neutral">${p.paymentMethod}</span></td>
      <td><span class="a-pill ${paid ? 'a-pill-success' : 'a-pill-neutral'}">${p.paymentStatus}</span></td>
      <td>${p.invoiceId ? `<a href="admin-invoice-print.html?id=${p.invoiceId}" target="_blank">View</a>` : '—'}</td>
    `;
    tbody.appendChild(tr);
  });
}

function applyRange() {
  const start = document.getElementById('rangeStart').value;
  const end = document.getElementById('rangeEnd').value;
  if (!start || !end) { fnToast('Choose both a start and end date'); return; }
  loadOrders(start, end);
}

function clearRange() {
  document.getElementById('rangeStart').value = '';
  document.getElementById('rangeEnd').value = '';
  loadOrders();
}

(function init() {
  const params = new URLSearchParams(window.location.search);
  const start = params.get('start') || '';
  const end = params.get('end') || '';
  document.getElementById('rangeStart').value = start;
  document.getElementById('rangeEnd').value = end;
  loadOrders(start, end);
})();
</script>

</body>
</html>
