<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - My Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
:root{--cream:#FBF5EC;--teal:#164F4A;--teal-dark:#0E3733;--coral:#F26B4D;--coral-dark:#D9502F;--gold:#EBA657;--ink:#2A2420;--ink-soft:#6B5F55;--border:rgba(22,79,74,0.15);}
*{box-sizing:border-box;margin:0;padding:0;}
a{text-decoration:none;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;padding:28px 20px 60px;}
.wrap{max-width:820px;margin:0 auto;}
/* Header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
.brand{display:flex;align-items:center;}
.brand img{height:64px;width:auto;display:block;}
.header-right{display:flex;align-items:center;gap:12px;}
.btn-link{background:none;border:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
.btn-link:hover{color:var(--teal-dark);}
/* Hero */
.hero{background:linear-gradient(135deg,var(--teal-dark),var(--teal));border-radius:20px;padding:28px 30px;color:#fff;margin-bottom:28px;}
.hero h1{font-family:'Fraunces',serif;font-size:26px;margin-bottom:4px;}
.hero .classroom-name{font-size:14px;opacity:.75;}
/* Section */
.section-heading{font-family:'Fraunces',serif;font-size:18px;color:var(--teal-dark);margin-bottom:14px;}
/* Lesson cards */
.lesson-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:32px;}
.lesson-card{background:#fff;border-radius:16px;box-shadow:0 4px 16px -8px rgba(22,79,74,0.15);padding:18px 20px;display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;transition:transform .12s,box-shadow .12s;}
.lesson-card:hover{transform:translateY(-1px);box-shadow:0 8px 24px -10px rgba(22,79,74,0.22);}
.lc-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,rgba(22,79,74,0.12),rgba(22,79,74,0.06));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.lc-body{flex:1;}
.lc-title{font-weight:700;font-size:15px;margin-bottom:2px;}
.lc-series{font-size:12.5px;color:var(--ink-soft);}
.lc-status{flex-shrink:0;}
.pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;}
.pill-green{background:#d1fae5;color:#065f46;}
.pill-blue{background:#dbeafe;color:#1e40af;}
.pill-gray{background:#f3f4f6;color:#6b7280;}
/* Games */
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:32px;}
.game-card{background:#fff;border-radius:16px;box-shadow:0 4px 16px -8px rgba(22,79,74,0.15);padding:16px 18px;text-decoration:none;color:inherit;}
.game-card:hover{box-shadow:0 8px 24px -10px rgba(22,79,74,0.22);}
.gc-title{font-weight:700;font-size:14px;margin-bottom:4px;}
.gc-status{font-size:12px;color:var(--ink-soft);}
/* Goals */
.goals-card{background:#fff;border-radius:16px;box-shadow:0 4px 16px -8px rgba(22,79,74,0.15);padding:20px 22px;}
.goal-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.goal-item:last-of-type{border-bottom:none;}
.goal-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s;}
.goal-check.done{background:var(--teal);border-color:var(--teal);color:#fff;}
.goal-text{font-size:14px;flex:1;}
.goal-text.done{text-decoration:line-through;color:var(--ink-soft);}
.add-goal{display:flex;gap:8px;margin-top:14px;}
.add-goal input{flex:1;padding:10px 13px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:13.5px;outline:none;}
.add-goal input:focus{border-color:var(--teal);}
.add-goal button{padding:10px 16px;border-radius:10px;border:none;background:var(--teal);color:#fff;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;}
.add-goal button:hover{background:var(--teal-dark);}
.empty-state{text-align:center;color:var(--ink-soft);font-size:14px;padding:30px 20px;}
.nav-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;}
.nav-link{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;text-decoration:none;background:#fff;color:var(--ink-soft);box-shadow:0 2px 8px -4px rgba(22,79,74,0.12);}
.nav-link:hover{color:var(--teal-dark);}
.nav-link.active{background:var(--teal-dark);color:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand"><img src="logo-fne.png?v=2" alt="Fixer Nation Education"></div>
    <div class="header-right">
      <a href="student-achievements.html" style="font-size:13px;font-weight:600;color:var(--teal-dark);text-decoration:none;">My Goals &amp; History</a>
      <button class="btn-link" onclick="logout()">Sign Out</button>
    </div>
  </div>

  <div class="hero">
    <h1 id="greeting">Welcome!</h1>
    <div class="classroom-name" id="classroomLabel"></div>
  </div>

  <div class="section-heading">My Lessons</div>
  <div class="lesson-grid" id="lessonList"></div>

  <div class="section-heading" id="gamesHeading" style="display:none;">Brain Games</div>
  <div class="game-grid" id="gameGrid"></div>

  <div class="section-heading">My Goals</div>
  <div class="goals-card">
    <div id="goalList"></div>
    <div class="add-goal">
      <input id="goalInput" placeholder="Add a new goal…" onkeydown="if(event.key==='Enter')addGoal()">
      <button onclick="addGoal()">Add</button>
    </div>
  </div>
</div>

<script src="school-branding.js?v=1"></script>
<script>
var me = null;

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function load() {
  var r = await fetch('/api/classroom-auth/me', { credentials: 'include' });
  if (!r.ok) { location.href = 'student-login.html'; return; }
  me = await r.json();

  var name = me.student.displayName.split(' ')[0];
  document.getElementById('greeting').textContent = 'Hey, ' + name + '!';
  document.getElementById('classroomLabel').textContent = me.classroom.name;

  fetch('/api/student/branding', { credentials: 'include' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) { if (data) fnApplyBranding(data.branding, document.documentElement); })
    .catch(function () {});

  renderLessons();
  renderGames();
  loadGoals();
}

function renderLessons() {
  var el = document.getElementById('lessonList');
  var assignments = me.assignments || [];
  if (!assignments.length) {
    el.innerHTML = '<div class="empty-state">No lessons assigned yet. Check back soon!</div>';
    return;
  }
  var html = '';
  assignments.forEach(function(a) {
    var status = a.completed_at ? 'Complete' : (a.started_at ? 'In Progress' : 'Not Started');
    var pillClass = a.completed_at ? 'pill-green' : (a.started_at ? 'pill-blue' : 'pill-gray');
    var icon = a.completed_at ? '✅' : (a.started_at ? '📖' : '📚');
    html += '<a class="lesson-card" href="student-lesson.html?curriculum=' + a.curriculum_id + '">' +
      '<div class="lc-icon">' + icon + '</div>' +
      '<div class="lc-body">' +
        '<div class="lc-title">' + esc(a.title) + '</div>' +
        '<div class="lc-series">' + esc(a.series || '') + (a.due_date ? ' · Due ' + a.due_date : '') + '</div>' +
      '</div>' +
      '<div class="lc-status"><span class="pill ' + pillClass + '">' + status + '</span></div>' +
    '</a>';
  });
  el.innerHTML = html;
}

function renderGames() {
  var games = me.games || [];
  var heading = document.getElementById('gamesHeading');
  var el = document.getElementById('gameGrid');
  if (!games.length) { heading.style.display = 'none'; el.innerHTML = ''; return; }
  heading.style.display = '';
  var html = '';
  games.forEach(function(g) {
    var done = !!g.last_completed_at;
    html += '<a class="game-card" href="student-game.html?assignment=' + g.assignment_id + '&slug=' + encodeURIComponent(g.game_slug) + '&name=' + encodeURIComponent(g.game_title) + '">' +
      '<div class="gc-title">' + esc(g.game_title) + '</div>' +
      '<div class="gc-status">' + (done ? '<span class="pill pill-green">Played</span>' : '<span class="pill pill-gray">Not played yet</span>') + (g.due_date ? ' · Due ' + g.due_date : '') + '</div>' +
    '</a>';
  });
  el.innerHTML = html;
}

var goals = [];

async function loadGoals() {
  var r = await fetch('/api/student/goals', { credentials: 'include' });
  if (r.ok) goals = await r.json();
  renderGoals();
}

function renderGoals() {
  var el = document.getElementById('goalList');
  if (!goals.length) { el.innerHTML = '<div style="color:var(--ink-soft);font-size:13.5px;padding:8px 0 12px;">No goals yet — add one below!</div>'; return; }
  var html = '';
  goals.forEach(function(g) {
    html += '<div class="goal-item">' +
      '<div class="goal-check ' + (g.is_achieved ? 'done' : '') + '" onclick="toggleGoal(' + g.id + ',' + (g.is_achieved ? 'true' : 'false') + ')">' + (g.is_achieved ? '✓' : '') + '</div>' +
      '<div class="goal-text ' + (g.is_achieved ? 'done' : '') + '">' + esc(g.goal_text) + '</div>' +
    '</div>';
  });
  el.innerHTML = html;
}

async function addGoal() {
  var text = document.getElementById('goalInput').value.trim();
  if (!text) return;
  var r = await fetch('/api/student/goals', {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ goalText: text }),
  });
  if (r.ok) {
    var g = await r.json();
    goals.unshift(g);
    document.getElementById('goalInput').value = '';
    renderGoals();
  }
}

async function toggleGoal(id, wasAchieved) {
  var r = await fetch('/api/student/goals/' + id, {
    method: 'PUT', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ isAchieved: !wasAchieved }),
  });
  if (r.ok) {
    var updated = await r.json();
    goals = goals.map(function(g){ return g.id === id ? updated : g; });
    renderGoals();
  }
}

async function logout() {
  await fetch('/api/classroom-auth/logout', { method: 'POST', credentials: 'include', headers: {'Content-Type':'application/json'}, body: '{}' });
  location.href = 'student-login.html';
}

load();
</script>
</body>
</html>
