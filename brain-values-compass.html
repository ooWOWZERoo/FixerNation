<script>
  // Values Compass - Tune Your Brain (Challenge band, grades 6-8). Same Scenario
  // Choice engine as Strength Spotter and Feelings Detective: notice what really
  // happens in a short story, then pick every value that could fit (more than one
  // is usually right; nothing is scored and no value is ranked). Then a private
  // check about the student's own values, which is never logged, sent or saved.
  // The second direct game for NY SEL 1B (identity and agency), with 1C supporting,
  // and the Reflective and Future Focused attribute. At grades 3-5 the question is
  // "what am I good at?"; at grades 6-8 it is "what do I care about, and what do I
  // do when it costs something?" The engine's `feelings` list holds the values
  // here, and `contentPack.prompts` replaces the feelings wording. Design and
  // approved outline: docs/tune-your-brain/NEW_GAMES_FOR_GAPS.md and
  // VALUES_COMPASS_OUTLINE.md. A pool of 12 stories; 5 are drawn per run.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'challenge';

  const contentPack = {
    "title": "Values Compass",
    "roundsPerRun": 5,
    "prompts": {
      "cues": "What do you notice in this story?",
      "afterCues": "Now name the values behind it.",
      "pick": "Which values could this show? You can pick more than one.",
      "confirmCues": "These are my clues",
      "confirmPick": "These are my values",
      "multiLabel": "Times you saw more than one value"
    },
    "scenarios": [

          {

            "text": "She joins in on the jokes.",
            "present": false
          },

            "id": "v1-c2",
            "text": "She explains it once to a friend.",
            "present": true
          },

            "present": true

            "text": "Courage",

      {
        "context": "In a class debate, Jin argues one side, then hears a good point from the other team. He says, \"I was wrong about that,\" thanks the other student, and asks a question.",

      {

      {

        "illustration": "🃏",

      {
        "context": "After a busy week of tests and practices, Noor skips the weekend party. She turns off her phone, reads for an hour, and goes to bed early.",

      {
