<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Brain Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="brain-games.css">
<style>
  .progress-hero {
    background: var(--teal-dark); color: #fff; padding: 48px 32px 40px;
    text-align: center;
  }
  .progress-hero h1 { font-family: 'Fraunces', serif; font-size: 32px; margin-bottom: 6px; }
  .progress-hero p { opacity: .75; font-size: 15px; }
  .overall-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 16px; margin: 28px 0;
  }
  .o-stat { background: #fff; border-radius: 16px; border: 1px solid var(--border); padding: 18px 16px; text-align: center; }
  .o-stat .val { font-size: 28px; font-weight: 800; color: var(--teal-dark); font-family: 'Fraunces', serif; }
  .o-stat .lbl { font-size: 12px; color: var(--ink-soft); font-weight: 600; margin-top: 4px; }
  .level-hero-card {
    background: linear-gradient(135deg, var(--teal-dark), #1a6b64);
    color: #fff; border-radius: 20px; padding: 24px 28px; margin-bottom: 24px;
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  }
  .level-orb {
    width: 72px; height: 72px; border-radius: 50%;
    background: rgba(255,255,255,0.15); display: flex; flex-direction: column;
    align-items: center; justify-content: center; flex-shrink: 0;
    font-family: 'Fraunces', serif;
  }
  .level-orb .lnum { font-size: 26px; font-weight: 800; line-height: 1; }
  .level-orb .llbl { font-size: 10px; opacity: .7; font-weight: 600; margin-top: 1px; }
  .level-info { flex: 1; }
  .level-info h2 { font-family: 'Fraunces', serif; font-size: 22px; margin-bottom: 4px; }
  .level-info p { opacity: .75; font-size: 14px; margin-bottom: 10px; }
  .xp-bar-light { height: 8px; background: rgba(255,255,255,0.2); border-radius: 99px; overflow: hidden; }
  .xp-bar-fill { height: 100%; background: var(--gold); border-radius: 99px; transition: width 1s ease; }
  .xp-bar-caption { font-size: 12px; opacity: .6; margin-top: 5px; }
  .streak-badge {
    background: rgba(255,255,255,0.12); border-radius: 12px; padding: 10px 16px;
    text-align: center; flex-shrink: 0;
  }
  .streak-badge .s-num { font-size: 28px; font-weight: 800; font-family: 'Fraunces', serif; }
  .streak-badge .s-lbl { font-size: 11px; opacity: .7; font-weight: 600; }

  .game-progress-card {
    background: #fff; border-radius: 16px; border: 1px solid var(--border); padding: 20px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .gp-top { display: flex; align-items: center; gap: 12px; }
  .gp-icon { font-size: 28px; }
  .gp-title { font-weight: 800; font-size: 16px; color: var(--teal-dark); }
  .gp-skill { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
  .gp-level-chip { margin-left: auto; }
  .gp-stats { display: flex; gap: 16px; font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .gp-stats strong { display: block; font-size: 16px; font-weight: 800; color: var(--ink); }
  .gp-xp-bar { height: 5px; background: var(--cream-soft); border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .gp-xp-fill { height: 100%; border-radius: 99px; background: var(--teal); transition: width 1s ease; }
  .gp-play-btn { align-self: flex-end; }

  .history-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 0;
    border-bottom: 1px solid var(--cream-soft);
  }
  .history-row:last-child { border-bottom: none; }
  .history-icon { font-size: 22px; width: 36px; text-align: center; flex-shrink: 0; }
  .history-info { flex: 1; }
  .history-name { font-weight: 700; font-size: 14px; color: var(--ink); }
  .history-meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .history-score { font-weight: 800; font-size: 18px; color: var(--teal-dark); font-family: 'Fraunces', serif; }
  .history-pb { font-size: 10px; color: var(--coral); font-weight: 700; }
  .section-title { font-family: 'Fraunces', serif; font-size: 22px; color: var(--teal-dark); margin-bottom: 16px; font-weight: 700; }
</style>
</head>
<body>
<header></header>

<div class="progress-hero">
  <h1 id="heroName">My Brain Progress</h1>
  <p>Track your skills, streaks, and improvement across all games</p>
</div>

<div style="max-width:900px;margin:0 auto;padding:28px 24px 60px;" id="mainContent">

  <div id="notLoggedIn" style="display:none;text-align:center;padding:60px 24px;">
    <div style="font-size:56px;margin-bottom:16px;">🧠</div>
    <h2 style="font-family:'Fraunces',serif;color:var(--teal-dark);margin-bottom:10px;">Sign In to Track Progress</h2>
    <p style="color:var(--ink-soft);margin-bottom:24px;">Your scores, XP, and badges are saved to your account.</p>
    <button class="btn btn-primary" onclick="if(typeof fnAuthOpenModal==='function')fnAuthOpenModal('login')">Sign In</button>
    <a href="brain-games.html" class="btn btn-outline" style="margin-left:12px;">Play Games</a>
  </div>

  <div id="loggedInContent" style="display:none;">
    <!-- Level card -->
    <div class="level-hero-card" id="levelCard">
      <div class="level-orb"><div class="lnum" id="levelNum">—</div><div class="llbl">LEVEL</div></div>
      <div class="level-info">
        <h2 id="levelName">Loading…</h2>
        <p id="xpCaption"></p>
        <div class="xp-bar-light"><div class="xp-bar-fill" id="xpBarFill" style="width:0%"></div></div>
        <div class="xp-bar-caption" id="xpNext"></div>
      </div>
      <div class="streak-badge">
        <div class="s-num" id="streakNum">—</div>
        <div class="s-lbl">Day Streak 🔥</div>
      </div>
    </div>

    <!-- Overall stats -->
    <div class="overall-stats" id="overallStats"></div>

    <!-- Per-game progress -->
    <div class="section-title">Game Progress</div>
    <div class="game-grid" id="gameProgressGrid"></div>

    <!-- Recent sessions -->
    <div class="section-title" style="margin-top:36px;">Recent Sessions</div>
    <div style="background:#fff;border-radius:16px;border:1px solid var(--border);padding:8px 16px;" id="historyList">
      <div style="text-align:center;padding:24px;color:var(--ink-soft);">Loading…</div>
    </div>

    <div style="text-align:center;margin-top:28px;">
      <a href="brain-games.html" class="btn btn-primary">Play Games</a>
      <a href="brain-badges.html" class="btn btn-outline" style="margin-left:12px;">View All Badges</a>
    </div>
  </div>
</div>

<footer></footer>
<script src="nav.js?v=14"></script>
<script src="site-auth.js?v=4"></script>
<script src="footer.js?v=1"></script>
<script>
const LEVEL_NAMES = ['','Beginner','Learner','Challenger','Skilled','Advanced','Expert','Master'];
const XP_THRESHOLDS = [0,150,400,800,1500,2500,4000];
const GAME_META = {
  'memory-match':     { name:'Memory Match',     icon:'🃏', skill:'Working Memory' },
  'reaction-time':    { name:'Reaction Time',     icon:'⚡', skill:'Processing Speed' },
  'simon-sequence':   { name:'Simon Sequence',    icon:'🎵', skill:'Sequential Memory' },
  'stroop-challenge': { name:'Stroop Challenge',  icon:'🎨', skill:'Cognitive Flexibility' },
  'quick-math':       { name:'Quick Math',        icon:'➕', skill:'Numerical Reasoning' },
  'number-sequence':  { name:'Number Sequence',   icon:'🔢', skill:'Pattern Recognition' },
};

function levelFromXP(xp) {
  let level = 1;
  for (let i = XP_THRESHOLDS.length - 1; i >= 0; i--) {
    if (xp >= XP_THRESHOLDS[i]) { level = i + 1; break; }
  }
  return Math.min(level, 7);
}
function xpForNext(level) { return level < 7 ? XP_THRESHOLDS[level] : XP_THRESHOLDS[6]; }
function pctToNext(xp, level) {
  if (level >= 7) return 100;
  const base = XP_THRESHOLDS[level - 1], next = XP_THRESHOLDS[level];
  return Math.min(100, Math.round(((xp - base) / (next - base)) * 100));
}

async function loadPage() {
  try {
    const [progRes, histRes, streakRes] = await Promise.all([
      fetch('/api/brain-games/me/progress', { credentials:'include' }),
      fetch('/api/brain-games/me/history', { credentials:'include' }),
      fetch('/api/brain-games/me/streak', { credentials:'include' }),
    ]);
    if (!progRes.ok) { showNotLoggedIn(); return; }

    const prog = await progRes.json();
    const hist = histRes.ok ? await histRes.json() : [];
    const streak = streakRes.ok ? await streakRes.json() : { currentStreak: 0 };

    document.getElementById('notLoggedIn').style.display = 'none';
    document.getElementById('loggedInContent').style.display = '';

    renderLevel(prog, streak);
    renderOverallStats(prog, hist);
    renderGameGrid(prog);
    renderHistory(hist);
  } catch {
    showNotLoggedIn();
  }
}

function showNotLoggedIn() {
  document.getElementById('notLoggedIn').style.display = '';
  document.getElementById('loggedInContent').style.display = 'none';
}

function renderLevel(prog, streak) {
  const totalXp = prog.totalXP || 0;
  const level = levelFromXP(totalXp);
  const name = LEVEL_NAMES[level];
  document.getElementById('levelNum').textContent = level;
  document.getElementById('levelName').textContent = name;
  document.getElementById('xpCaption').textContent = `${totalXp} XP total`;
  const pct = pctToNext(totalXp, level);
  setTimeout(() => document.getElementById('xpBarFill').style.width = pct + '%', 100);
  const nextXp = xpForNext(level);
  document.getElementById('xpNext').textContent = level < 7
    ? `${totalXp} / ${nextXp} XP to Level ${level + 1}`
    : 'Master — Max Level Reached!';
  document.getElementById('streakNum').textContent = streak.currentStreak || 0;
}

function renderOverallStats(prog, hist) {
  const games = prog.games || [];
  const totalSessions = games.reduce((s, g) => s + (g.totalCompleted || 0), 0);
  const gamesWithLevel = games.filter(g => (g.level || 1) >= 3).length;
  const container = document.getElementById('overallStats');
  container.innerHTML = [
    { val: totalSessions, lbl: 'Total Sessions' },
    { val: prog.totalXp || 0, lbl: 'Total XP' },
    { val: games.length, lbl: 'Games Played' },
    { val: gamesWithLevel, lbl: 'Games at Level 3+' },
  ].map(s => `<div class="o-stat"><div class="val">${s.val}</div><div class="lbl">${s.lbl}</div></div>`).join('');
}

function renderGameGrid(prog) {
  const games = prog.games || [];
  const grid = document.getElementById('gameProgressGrid');
  if (!games.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:32px;">Play your first game to see progress here!</div>';
    return;
  }
  grid.innerHTML = games.map(g => {
    const meta = GAME_META[g.gameSlug] || { name: g.gameName, icon: '🎮', skill: '' };
    const level = g.level || 1;
    const xp = g.xp || 0;
    const pct = pctToNext(xp, level);
    return `
    <div class="game-progress-card">
      <div class="gp-top">
        <span class="gp-icon">${meta.icon}</span>
        <div>
          <div class="gp-title">${meta.name}</div>
          <div class="gp-skill">${meta.skill}</div>
        </div>
        <span class="gp-level-chip level-chip">Lvl ${level}</span>
      </div>
      <div class="gp-stats">
        <div><strong>${g.totalCompleted || 0}</strong>Sessions</div>
        <div><strong>${g.bestNormalizedScore || 0}</strong>Best Score</div>
        <div><strong>${xp}</strong>Game XP</div>
      </div>
      <div class="gp-xp-bar"><div class="gp-xp-fill" style="width:${pct}%"></div></div>
      <a href="brain-${g.gameSlug}.html" class="btn btn-outline gp-play-btn" style="font-size:13px;padding:8px 16px;">Play</a>
    </div>`;
  }).join('');
}

function renderHistory(hist) {
  const list = document.getElementById('historyList');
  if (!hist.length) {
    list.innerHTML = '<div style="text-align:center;padding:24px;color:var(--ink-soft);">No sessions yet — go play a game!</div>';
    return;
  }
  list.innerHTML = hist.slice(0, 20).map(h => {
    const meta = GAME_META[h.gameSlug] || { icon: '🎮', name: h.gameName };
    const date = new Date(h.completedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    return `
    <div class="history-row">
      <div class="history-icon">${meta.icon}</div>
      <div class="history-info">
        <div class="history-name">${meta.name}</div>
        <div class="history-meta">${h.difficulty} · ${date}</div>
      </div>
      <div style="text-align:right;">
        <div class="history-score">${h.normalizedScore}</div>
        ${h.isPersonalBest ? '<div class="history-pb">★ PB</div>' : ''}
      </div>
    </div>`;
  }).join('');
}

loadPage();
</script>
</body>
</html>
