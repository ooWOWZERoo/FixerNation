<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0;url=school-admin-roster.html">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - School Licenses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="school-admin-common.css?v=1">
<style>
  .util-summary { display:flex; gap:24px; flex-wrap:wrap; margin-bottom:24px; }
  .util-card { flex:1; min-width:140px; background:var(--sa-card); border:1.5px solid var(--sa-border); border-radius:12px; padding:16px 20px; }
  .util-card .lbl { font-size:12px; font-weight:600; color:var(--sa-text-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
  .util-card .val { font-size:26px; font-weight:800; color:var(--sa-text); }
  .empty-state { text-align:center; padding:48px 24px; color:var(--sa-text-soft); }
</style>
</head>
<body>
<div class="sa-shell">
  <aside class="sa-sidebar"></aside>
  <script src="school-admin-nav.js?v=2"></script>

  <div class="sa-main">
    <div class="sa-topbar">
      <h1>Licenses</h1>
      <div class="sa-user">
        <div class="avatar" id="saUserAvatar">?</div>
        <span id="saUserName">Loading…</span>
      </div>
    </div>

    <div class="sa-content">
      <div id="paymentBanner" class="sa-payment-banner" style="display:none;">
        <span class="icon">⚠️</span>
        <div><strong>License payment pending</strong> — Licenses are not yet active for this school.</div>
      </div>

      <!-- Utilization summary -->
      <div class="util-summary" id="utilSummary">
        <div class="util-card"><div class="lbl">Total Licenses</div><div class="val" id="sTotal">—</div></div>
        <div class="util-card"><div class="lbl">Active</div><div class="val" id="sActive" style="color:var(--sa-success);">—</div></div>
        <div class="util-card"><div class="lbl">Pending</div><div class="val" id="sPending" style="color:var(--sa-warn);">—</div></div>
        <div class="util-card"><div class="lbl">Available</div><div class="val" id="sAvail" style="color:var(--sa-accent);">—</div></div>
        <div class="util-card"><div class="lbl">Revoked</div><div class="val" id="sRevoked" style="color:var(--sa-danger);">—</div></div>
      </div>

      <!-- Utilization bar -->
      <div class="sa-card" style="margin-bottom:24px;">
        <div class="sa-card-head">
          <h2>Seat Utilization</h2>
          <span id="utilPct" style="font-weight:800;font-size:18px;color:var(--sa-accent);">—%</span>
        </div>
        <div class="sa-util-bar-wrap">
          <div class="sa-util-bar" id="utilBar" style="width:0%;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--sa-text-soft);margin-top:6px;">
          <span id="utilDetail">— of — seats assigned</span>
          <a href="school-admin-reports.html?type=utilization" class="sa-link">View full report →</a>
        </div>
      </div>

      <!-- Seat list -->
      <div class="sa-toolbar">
        <input class="sa-search" id="searchInput" type="search" placeholder="Search by name or email…" oninput="debounceLoad()">
        <select id="statusFilter" onchange="loadSeats()">
          <option value="">All seats</option>
          <option value="active">Active</option>
          <option value="pending">Pending (invited)</option>
          <option value="available">Available</option>
          <option value="revoked">Revoked</option>
        </select>
      </div>

      <div class="sa-card">
        <div id="seatsWrap">
          <div class="sa-loading"><div class="sa-spinner"></div> Loading…</div>
        </div>
        <div class="sa-pagination" id="pagination" style="display:none;">
          <button class="sa-btn sa-btn-ghost sa-btn-sm" id="prevBtn" onclick="changePage(-1)">← Prev</button>
          <span id="pageInfo" style="font-size:13px;color:var(--sa-text-soft);"></span>
          <button class="sa-btn sa-btn-ghost sa-btn-sm" id="nextBtn" onclick="changePage(1)">Next →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Revoke seat modal -->
<div class="sa-modal-overlay" id="revokeModal" style="display:none;">
  <div class="sa-modal" style="max-width:420px;">
    <div class="sa-modal-head">
      <h2>Revoke License Seat</h2>
      <button class="sa-modal-close" onclick="closeRevoke()">✕</button>
    </div>
    <p id="revokeMsg" style="font-size:14px;margin-bottom:16px;"></p>
    <div class="sa-form-group">
      <label>Reason <span style="color:var(--sa-danger)">*</span></label>
      <textarea id="revokeReason" placeholder="e.g. Teacher left the school, duplicate seat, etc."></textarea>
    </div>
    <div id="revokeErr" class="sa-alert sa-alert-danger" style="display:none;"></div>
    <div class="sa-modal-foot">
      <button class="sa-btn sa-btn-secondary" onclick="closeRevoke()">Cancel</button>
      <button class="sa-btn sa-btn-danger" id="revokeBtn" onclick="execRevoke()">Revoke Seat</button>
    </div>
  </div>
</div>

<script>
var page = 1, totalPages = 1, debounceTimer = null, revokeSeatId = null;

document.addEventListener('saReady', function () { loadSeats(); });
document.addEventListener('saSchoolChanged', function () { page = 1; loadSeats(); });

function debounceLoad() { clearTimeout(debounceTimer); debounceTimer = setTimeout(function () { page = 1; loadSeats(); }, 350); }

async function loadSeats() {
  const purchaseId = window.saActivePurchaseId ? window.saActivePurchaseId() : null;
  if (!purchaseId) return;
  const q = document.getElementById('searchInput').value.trim();
  const status = document.getElementById('statusFilter').value;
  const url = '/api/school-admin/licenses?purchaseId=' + purchaseId + '&page=' + page + '&limit=25' + (q ? '&q=' + encodeURIComponent(q) : '') + (status ? '&status=' + status : '');
  const wrap = document.getElementById('seatsWrap');
  try {
    const d = await saFetch(url);
    totalPages = d.pages || 1;
    if (d.paymentStatus && d.paymentStatus !== 'paid') document.getElementById('paymentBanner').style.display = 'flex';

    // Summary stats
    document.getElementById('sTotal').textContent = d.total || 0;
    document.getElementById('sActive').textContent = d.active || 0;
    document.getElementById('sPending').textContent = d.pending || 0;
    document.getElementById('sAvail').textContent = d.available || 0;
    document.getElementById('sRevoked').textContent = d.revoked || 0;

    const assigned = (d.active || 0) + (d.pending || 0);
    const pct = d.total ? Math.round(assigned / d.total * 100) : 0;
    const bar = document.getElementById('utilBar');
    bar.style.width = pct + '%';
    bar.className = 'sa-util-bar' + (pct >= 100 ? ' danger' : pct >= 75 ? ' warn' : '');
    document.getElementById('utilPct').textContent = pct + '%';
    document.getElementById('utilDetail').textContent = assigned + ' of ' + (d.total || 0) + ' seats assigned';

    renderSeats(d.seats || []);
    const pg = document.getElementById('pagination');
    if (totalPages > 1) {
      pg.style.display = 'flex';
      document.getElementById('pageInfo').textContent = 'Page ' + page + ' of ' + totalPages;
      document.getElementById('prevBtn').disabled = page <= 1;
      document.getElementById('nextBtn').disabled = page >= totalPages;
    } else { pg.style.display = 'none'; }
  } catch (e) {
    wrap.innerHTML = '<div class="sa-alert sa-alert-danger">' + esc(e.message) + '</div>';
  }
}

function renderSeats(seats) {
  const wrap = document.getElementById('seatsWrap');
  if (!seats.length) {
    wrap.innerHTML = '<div class="empty-state"><div class="icon" style="font-size:36px;">🪪</div><div>No seats found.</div></div>';
    return;
  }
  const statusBadge = {
    active: '<span class="sa-badge sa-badge-success">Active</span>',
    pending: '<span class="sa-badge sa-badge-warn">Pending</span>',
    available: '<span class="sa-badge">Available</span>',
    inactive: '<span class="sa-badge sa-badge-warn">Inactive</span>',
    revoked: '<span class="sa-badge sa-badge-danger">Revoked</span>',
  };
  wrap.innerHTML = '<table class="sa-table"><thead><tr><th>Teacher</th><th>Email</th><th>Registered</th><th>Status</th><th>Notes</th><th>Actions</th></tr></thead><tbody>' +
    seats.map(function (s) {
      const fullName = s.first_name ? (s.first_name + ' ' + (s.last_name || '')).trim() : '';
      const name = fullName || (s.invited_email ? '(pending)' : '(unassigned)');
      const email = s.email || s.invited_email || '—';
      const registered = s.registered_at ? new Date(s.registered_at).toLocaleDateString() : '—';
      const status = s.status === 'registered' ? 'active' : (s.status || 'available');
      const badge = statusBadge[status] || '<span class="sa-badge">' + status + '</span>';
      const notes = esc(s.revocation_reason || '—');
      const canRevoke = s.status === 'registered' || s.status === 'pending';
      // JSON.stringify() wraps the email in double quotes, which prematurely
      // terminates the onclick="..." attribute (also double-quoted) right
      // after it — same bug already fixed in admin-school-admins.html and
      // school-admin-invitations.html. esc() doesn't escape single quotes,
      // safe since email addresses can never contain one.
      const actions = canRevoke ? '<button class="sa-btn sa-btn-ghost sa-btn-sm sa-btn-danger-ghost" onclick="openRevoke(' + s.id + ',\'' + esc(email) + '\')">Revoke</button>' : '—';
      return '<tr><td style="font-weight:600;font-size:13px;">' + esc(name) + '</td><td style="font-size:13px;color:var(--sa-text-soft);">' + esc(email) + '</td><td style="font-size:13px;">' + registered + '</td><td>' + badge + '</td><td style="font-size:12px;color:var(--sa-text-soft);max-width:180px;">' + notes + '</td><td>' + actions + '</td></tr>';
    }).join('') +
    '</tbody></table>';
}

function changePage(dir) { page = Math.max(1, Math.min(totalPages, page + dir)); loadSeats(); }

function openRevoke(id, email) {
  revokeSeatId = id;
  document.getElementById('revokeMsg').textContent = 'Revoke the license seat assigned to ' + email + '? This will remove their access and free the seat for reassignment.';
  document.getElementById('revokeReason').value = '';
  document.getElementById('revokeErr').style.display = 'none';
  document.getElementById('revokeModal').style.display = 'flex';
}
function closeRevoke() { document.getElementById('revokeModal').style.display = 'none'; revokeSeatId = null; }
async function execRevoke() {
  const btn = document.getElementById('revokeBtn');
  const reason = document.getElementById('revokeReason').value.trim();
  const err = document.getElementById('revokeErr');
  if (!reason) { err.textContent = 'Reason is required.'; err.style.display = 'flex'; return; }
  btn.disabled = true;
  try {
    await saFetch('/api/school-admin/seats/' + revokeSeatId + '/revoke', { method: 'PUT', body: JSON.stringify({ purchaseId: window.saActivePurchaseId(), reason }) });
    closeRevoke();
    saToast('Seat revoked.', 'success');
    loadSeats();
  } catch (e) { err.textContent = e.message; err.style.display = 'flex'; }
  finally { btn.disabled = false; }
}

function esc(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
