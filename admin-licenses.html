<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Licenses — Fixer Nation Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="admin-common.css?v=7">
</head>
<body>

<div class="a-shell">
  <aside class="a-sidebar">
    <div class="a-logo"><div class="mark">FN</div><div class="word">FN Admin</div></div>
    <nav class="a-nav">
      <a href="admin-dashboard.html"><span class="ic">📊</span><span class="label">Dashboard</span></a>
      <a href="admin-books.html"><span class="ic">📚</span><span class="label">Books</span></a>
      <a href="admin-curriculum.html"><span class="ic">🎓</span><span class="label">Curriculums</span></a>
      <a href="admin-blogs.html"><span class="ic">📝</span><span class="label">Blogs</span></a>
      <a href="admin-newsletter.html"><span class="ic">✉️</span><span class="label">CRM</span></a>
      <a href="admin-licenses.html" class="active"><span class="ic">🏫</span><span class="label">Licenses</span></a>
      <a href="admin-campaigns.html"><span class="ic">📣</span><span class="label">Campaigns</span></a>
      <a href="admin-settings.html"><span class="ic">⚙️</span><span class="label">Settings</span></a>
    </nav>
    <div class="a-sidebar-foot">
      <a href="fixernation-redesign.html" target="_blank" rel="noopener"><span class="ic">↗</span><span class="label">View Site</span></a>
      <a href="#" onclick="fnLogout(); return false;"><span class="ic">⎋</span><span class="label">Log Out</span></a>
    </div>
  </aside>

  <div class="a-main">
    <div class="a-topbar">
      <h1>Licenses</h1>
      <div class="a-user"><div class="avatar">A</div> admin</div>
    </div>

    <div class="a-content">
      <div class="a-card">
        <div class="a-card-head">
          <h2>Find a School's Licenses</h2>
        </div>
        <div style="display:flex; gap:10px;">
          <input type="text" id="domainSearchInput" placeholder="e.g. lincolnhigh.edu" style="flex:1; padding:10px 14px; border-radius:10px; border:1px solid var(--a-border); font-size:14px;" onkeydown="if(event.key==='Enter'){event.preventDefault(); searchByDomain();}">
          <button type="button" class="a-btn a-btn-primary" onclick="searchByDomain()">Search</button>
        </div>
        <div class="a-note" style="margin-top:8px;">Only group (school) licenses that have a School Domain set are searchable here — set one from a purchase's edit panel in the CRM if it's missing.</div>
      </div>

      <div id="resultsWrap" style="margin-top:20px;"></div>
    </div>
  </div>
</div>

<script src="admin-common.js?v=7"></script>
<script>
fnRequireAuth();

async function searchByDomain() {
  const domain = document.getElementById('domainSearchInput').value.trim();
  const wrap = document.getElementById('resultsWrap');
  if (!domain) { fnToast('Enter a school domain first'); return; }

  const r = await fetch(`/api/newsletter/purchases/by-domain?domain=${encodeURIComponent(domain)}`, { credentials: 'include' });
  if (fnHandleUnauthorized(r)) return;
  const { purchases } = await r.json();

  if (!purchases.length) {
    wrap.innerHTML = `<div class="a-empty"><div class="big">🏫</div>No group licenses found for "${domain}". Add one for the school's contact from the CRM's Purchases &amp; Licenses screen, and set its School Domain there.</div>`;
    return;
  }

  wrap.innerHTML = purchases.map(licenseCard).join('');
}

function licenseCard(p) {
  const registered = p.seats.filter(s => s.status === 'registered');
  const available = p.seatCount - registered.length;
  const buyerLine = p.buyer ? `${p.buyer.name || p.buyer.email} (${p.buyer.email})` : 'Unknown buyer';

  const rosterRows = registered.length
    ? registered.map(s => `
        <tr>
          <td class="a-cell-title">${s.registeredName}</td>
          <td>${s.invitedEmail}</td>
          <td>${fnFormatDate(s.registeredAt)}</td>
        </tr>
      `).join('')
    : `<tr><td colspan="3" style="color:var(--a-text-soft);">No teachers have registered against this license yet.</td></tr>`;

  return `
    <div class="a-card" style="margin-bottom:20px;">
      <div class="a-card-head">
        <h2>🏫 ${p.schoolDomain}</h2>
      </div>
      <div class="a-note" style="margin-bottom:16px;">Purchased by ${buyerLine} · ${fnFormatDate(p.purchasedAt)}${p.notes ? ' · ' + p.notes : ''}</div>

      <div class="a-stat-grid" style="grid-template-columns:repeat(3,1fr); margin-bottom:18px;">
        <div class="a-stat-card"><div class="label">Total Seats</div><div class="value">${p.seatCount}</div></div>
        <div class="a-stat-card"><div class="label">Used</div><div class="value">${registered.length}</div></div>
        <div class="a-stat-card"><div class="label">Available</div><div class="value">${available}</div></div>
      </div>

      <div style="display:flex; align-items:flex-end; gap:10px; margin-bottom:20px;">
        <div class="a-field" style="margin-bottom:0;">
          <label>Set Available Seats</label>
          <input type="number" id="availableInput_${p.id}" min="0" value="${available}" style="width:120px;">
        </div>
        <button type="button" class="a-btn a-btn-primary" onclick="updateAvailable(${p.id}, ${registered.length})">Save</button>
      </div>

      <h3 style="font-size:14px; margin-bottom:10px;">Registered Teachers</h3>
      <table class="a-table">
        <thead><tr><th>Name</th><th>Email</th><th>Registered</th></tr></thead>
        <tbody>${rosterRows}</tbody>
      </table>
    </div>
  `;
}

async function updateAvailable(purchaseId, registeredCount) {
  const input = document.getElementById(`availableInput_${purchaseId}`);
  const newAvailable = Number(input.value);
  if (!(newAvailable >= 0)) { fnToast('Available seats cannot be negative'); return; }

  const r = await fetch(`/api/newsletter/purchases/${purchaseId}`, {
    method: 'PUT',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ seatCount: registeredCount + newAvailable }),
  });
  if (fnHandleUnauthorized(r)) return;
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    fnToast(err.error || 'Could not update available seats');
    return;
  }
  fnToast('Available seats updated');
  searchByDomain();
}
</script>

</body>
</html>
