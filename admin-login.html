<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/api/settings/favicon?size=32">
<link rel="icon" type="image/png" sizes="16x16" href="/api/settings/favicon?size=16">
<link rel="apple-touch-icon" href="/api/settings/favicon?size=180">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Admin Login</title>
<link rel="stylesheet" href="fonts.css?v=1">
<link rel="stylesheet" href="admin-common.css?v=22">
</head>
<body>

<div class="a-auth-wrap">
  <div>
    <div class="a-auth-card">
      <div class="a-auth-logo">
        <img src="logo-fne.png?v=2" alt="Fixer Nation Education">
      </div>
      <h1>Sign in</h1>
      <p class="sub">Your mission starts here. Support schools, inspire growth, and keep things moving.</p>

      <div class="a-error" id="loginError">Incorrect username or password. Please try again.</div>

      <form id="loginForm">
        <div class="a-field">
          <label>Username or Email</label>
          <input type="text" id="username" autocomplete="username" required>
        </div>
        <div class="a-field">
          <label>Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="a-btn a-btn-primary a-btn-block">Sign In</button>
      </form>
    </div>
    <a href="index.html" class="a-back-link">← Back to the site</a>
  </div>
</div>

<script src="admin-common.js?v=17"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const errorBox = document.getElementById('loginError');
  const submitBtn = e.target.querySelector('button[type="submit"]');
  errorBox.classList.remove('show');
  submitBtn.disabled = true;
  fnLogin(u, p).then(result => {
    if (result.ok) {
      window.location.href = 'admin-dashboard.html';
    } else {
      errorBox.textContent = result.error || 'Incorrect username or password. Please try again.';
      errorBox.classList.add('show');
      submitBtn.disabled = false;
    }
  });
});
</script>

</body>
</html>
