<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Fixer Nation Education - Peace Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preload" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">

<link rel="stylesheet" href="brain-games.css?v=7">
</head>
<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=17"></script>
<script src="site-auth.js?v=11"></script>
<script src="footer.js?v=10"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js?v=3"></script>
<script src="engine-sdk.js?v=5"></script>
<script src="engine-branching-scenario.js?v=6"></script>
<script>
  // Peace Table - Tune Your Brain (Explore band, grades 3-5). The five-step
  // story engine used as a peace-table cycle: say what happened and how you
  // feel, listen to the other side, find a fair plan, try it, and reflect.
  // Practises NY SEL 2D (resolving conflict), with 1A, 2A and 2C supporting.
  // The first conflict game below grade 6 (Group Chat Meltdown is grades 6-8).
  // Four situations, one per run (FnEngineSDK variants); both children in each
  // story have a fair point, nobody is a bully, and every story offers a
  // trusted-adult option. Design and approved outline:
  // docs/tune-your-brain/NEW_GAMES_FOR_GAPS.md and PEACE_TABLE_OUTLINE.md.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'explore';

  const contentPack = {
    title: 'Peace Table',
    steps: [
      {
        "key": "recognize",
        "prompt": "Mia and Ben want the last computer turn. Each says, \"I was here first.\" You are Mia. What do you do first?",
        "choices": [
          {
            "id": "tp1-1",
            "text": "Say how you feel: \"I'm frustrated. I think I was next.\"",
            "type": "responsible",
            "feedback": "Calm words let Ben listen. He hears the problem without feeling attacked."
          },
          {
            "id": "tp1-2",
            "text": "Tell Ben it is only a computer, so he should not care.",
            "type": "plausible_incomplete",
            "feedback": "It may feel small to you, but Ben cares. Telling him not to makes it worse."
          },
          {
            "id": "tp1-3",
            "text": "Tell Ben he always does this, so everyone knows.",
            "type": "plausible_incomplete",
            "feedback": "\"Always\" sounds like an attack. Ben will defend himself instead of listening."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "What do you notice about Ben's side?",
        "choices": [
          {
            "id": "tp1-4",
            "text": "Ben is in a hurry too and thinks he was next.",
            "type": "responsible",
            "feedback": "Seeing his side helps you find a plan for both of you."
          },
          {
            "id": "tp1-5",
            "text": "Ben is just being greedy, so there is nothing to understand.",
            "type": "plausible_incomplete",
            "feedback": "Calling him greedy shuts the conversation down. He may have a good reason too."
          },
          {
            "id": "tp1-6",
            "text": "Whoever talks the loudest should get the turn, like usual.",
            "type": "plausible_incomplete",
            "feedback": "Loud kids are not always right. A fair plan cannot depend on who is louder."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What are some ways to find a fair plan?",
        "choices": [
          {
            "id": "tp1-7",
            "text": "Share the turn, flip a coin, or split the time.",
            "type": "responsible",
            "feedback": "Both of you get something. A plan like this ends the argument fast."
          },
          {
            "id": "tp1-8",
            "text": "Ask the teacher to decide right away, before trying anything.",
            "type": "plausible_incomplete",
            "feedback": "A teacher can help. Try first, and save the teacher for when you are stuck."
          },
          {
            "id": "tp1-9",
            "text": "Grab the computer while Ben looks away, so it is over.",
            "type": "plausible_incomplete",
            "feedback": "That fixes it for you and makes a new problem for Ben. He will feel tricked."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What do you say or do now?",
        "choices": [
          {
            "id": "tp1-10",
            "text": "Suggest five minutes each, and say it kindly.",
            "type": "responsible",
            "feedback": "A calm offer with a clear plan is easy to accept. It treats you both fairly."
          },
          {
            "id": "tp1-11",
            "text": "Suggest a coin flip, and agree to accept what it says.",
            "type": "multiple_defensible",
            "feedback": "Also fair. A coin flip is quick, and agreeing first stops another argument."
          },
          {
            "id": "tp1-12",
            "text": "Grab the mouse and say the turn is yours.",
            "type": "unsafe",
            "feedback": "Grabbing makes Ben angry and may get you both in trouble. He may stop trusting you."
          },
          {
            "id": "tp1-13",
            "text": "Ask the teacher to help if you cannot agree.",
            "type": "seek_help",
            "feedback": "Asking an adult when you are stuck is smart. The teacher can help you both."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "What helps you stay calm when you want something badly?",
        "freeReflection": true
      }
    ],
  };

  // Four situations: two kids want the same turn (above), a borrowed thing gets broken, a hurtful misunderstanding, and an argument about a call.
  // Steps 1 to 3 offer three options; step 4 offers four. Option lengths are balanced on purpose (see server/scripts/audit-brain-games.js).
  contentPack.variants = [
    { steps: contentPack.steps },
    { steps: [
      {
        "key": "recognize",
        "prompt": "Priya borrowed Amir's special pencil case, and the zipper broke. Amir is upset. You are Priya. What do you do first?",
        "choices": [
          {
            "id": "tp2-1",
            "text": "Say you feel bad and tell him it broke in your hands.",
            "type": "responsible",
            "feedback": "Telling the truth right away shows you respect Amir and his things."
          },
          {
            "id": "tp2-2",
            "text": "Say it was already loose, so it is not your fault.",
            "type": "plausible_incomplete",
            "feedback": "It may have been loose, but it broke in your hands. Amir will feel brushed off."
          },
          {
            "id": "tp2-3",
            "text": "Hide the pencil case and hope Amir does not notice.",
            "type": "plausible_incomplete",
            "feedback": "He will notice, and hiding it makes the problem bigger. Honesty is easier."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "What do you notice about Amir's side?",
        "choices": [
          {
            "id": "tp2-4",
            "text": "It matters to him. He feels sad and a little angry.",
            "type": "responsible",
            "feedback": "Knowing how he feels helps you say sorry well."
          },
          {
            "id": "tp2-5",
            "text": "It is only a pencil case, so he should calm down.",
            "type": "plausible_incomplete",
            "feedback": "It may be small to you, but it is special to him. His feelings are real."
          },
          {
            "id": "tp2-6",
            "text": "He is overreacting, so wait it out and say nothing.",
            "type": "plausible_incomplete",
            "feedback": "Staying silent can feel like ignoring him. A short, honest sorry helps more."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What are some ways to make it right?",
        "choices": [
          {
            "id": "tp2-7",
            "text": "Say sorry, offer to fix it, and ask what he wants.",
            "type": "responsible",
            "feedback": "Offering a fix and asking what he wants gives Amir a say."
          },
          {
            "id": "tp2-8",
            "text": "Say sorry fast and walk away, so the awkward moment ends.",
            "type": "plausible_incomplete",
            "feedback": "Sorry is a good start. Walking away leaves Amir alone with the problem."
          },
          {
            "id": "tp2-9",
            "text": "Give him something else of yours, so you are even.",
            "type": "plausible_incomplete",
            "feedback": "A gift is kind, but it may not be what he wants. Ask first."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What do you say or do now?",
        "choices": [
          {
            "id": "tp2-10",
            "text": "Say sorry, offer to help, and ask what Amir would like.",
            "type": "responsible",
            "feedback": "You are honest and kind, and Amir gets a real choice."
          },
          {
            "id": "tp2-11",
            "text": "Say sorry again, and ask a grown-up to help fix the zipper.",
            "type": "multiple_defensible",
            "feedback": "Also a good idea. Fixing it together helps, and a grown-up may know a trick."
          },
          {
            "id": "tp2-12",
            "text": "Say it was already loose, and refuse to talk about it.",
            "type": "unsafe",
            "feedback": "Refusing to talk leaves Amir hurt and alone with the problem. It can end a friendship."
          },
          {
            "id": "tp2-13",
            "text": "Ask a teacher how to make it right if you are unsure.",
            "type": "seek_help",
            "feedback": "Asking is a good choice when you are unsure. Teachers have seen this before."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "How do you want people to treat something you lent them?",
        "freeReflection": true
      }
    ] },
    { steps: [
      {
        "key": "recognize",
        "prompt": "Zoe says, \"You are not in our group today.\" Leo feels unwanted. You are Leo. What do you do first?",
        "choices": [
          {
            "id": "tp3-1",
            "text": "Say what you heard and how it felt. Check you understood.",
            "type": "responsible",
            "feedback": "Zoe gets a chance to explain, and the hurt does not grow."
          },
          {
            "id": "tp3-2",
            "text": "Say nothing and walk away, and feel sad all day.",
            "type": "plausible_incomplete",
            "feedback": "Staying quiet protects you for now, but the hurt stays. Zoe never finds out."
          },
          {
            "id": "tp3-3",
            "text": "Say something mean back, so Zoe knows how it feels.",
            "type": "plausible_incomplete",
            "feedback": "It may feel fair, but it starts a fight. You might be wrong about what she meant."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "What do you notice about Zoe's side?",
        "choices": [
          {
            "id": "tp3-4",
            "text": "She may have meant something different than it sounded.",
            "type": "responsible",
            "feedback": "A short sentence can mean many things. Asking is the only way to find out."
          },
          {
            "id": "tp3-5",
            "text": "She meant to hurt you, so she must be mean. Stay away.",
            "type": "plausible_incomplete",
            "feedback": "That is a guess, and it may be wrong. A mix-up could end a friendship."
          },
          {
            "id": "tp3-6",
            "text": "It does not matter what she meant. It hurt either way.",
            "type": "plausible_incomplete",
            "feedback": "How it felt matters, and so does what she meant. You can talk about both."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What are some ways to find out what she meant?",
        "choices": [
          {
            "id": "tp3-7",
            "text": "Ask calmly: \"Did you mean I am not included?\"",
            "type": "responsible",
            "feedback": "A calm question gives her room to explain. It shows you want to understand."
          },
          {
            "id": "tp3-8",
            "text": "Ask friends to take your side, so Zoe knows they agree.",
            "type": "plausible_incomplete",
            "feedback": "Taking sides makes the problem bigger and pulls others in. Talking to Zoe works better."
          },
          {
            "id": "tp3-9",
            "text": "Avoid Zoe all day so you do not have to talk.",
            "type": "plausible_incomplete",
            "feedback": "Avoiding her keeps the hurt alive. It is easier now and harder tomorrow."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What do you say or do now?",
        "choices": [
          {
            "id": "tp3-10",
            "text": "Ask Zoe what she meant, and tell her how it sounded.",
            "type": "responsible",
            "feedback": "That is honest and kind. One question like this often clears up a mix-up."
          },
          {
            "id": "tp3-11",
            "text": "Ask to play next round, and say you felt left out.",
            "type": "multiple_defensible",
            "feedback": "Also a good choice. You say how you feel and ask for what you want."
          },
          {
            "id": "tp3-12",
            "text": "Tell other kids Zoe is unfair, so they take your side.",
            "type": "unsafe",
            "feedback": "That spreads the hurt and makes Zoe feel attacked. You also miss the truth."
          },
          {
            "id": "tp3-13",
            "text": "Tell a teacher if it still hurts after you talk.",
            "type": "seek_help",
            "feedback": "If it still hurts, tell a teacher. You do not have to carry it alone."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "When has something you said sounded different from what you meant?",
        "freeReflection": true
      }
    ] },
    { steps: [
      {
        "key": "recognize",
        "prompt": "Ana says the ball was in. Jin says out. They blame each other. You are Ana. What do you do first?",
        "choices": [
          {
            "id": "tp4-1",
            "text": "Say what you saw and how you feel. No name-calling.",
            "type": "responsible",
            "feedback": "Saying what you saw keeps the argument about the ball."
          },
          {
            "id": "tp4-2",
            "text": "Say Jin is a cheater, so everyone knows what he did.",
            "type": "plausible_incomplete",
            "feedback": "Name-calling turns a ball argument into one about who Jin is. That is hard to fix."
          },
          {
            "id": "tp4-3",
            "text": "Quit and say the game is no fun, so Jin feels bad.",
            "type": "plausible_incomplete",
            "feedback": "Quitting ends the argument for you. It ends the game for everyone else too."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "What do you notice about Jin's side?",
        "choices": [
          {
            "id": "tp4-4",
            "text": "Jin saw it differently, and he feels accused too.",
            "type": "responsible",
            "feedback": "Two people can watch the same play and see different things. Nobody has to be lying."
          },
          {
            "id": "tp4-5",
            "text": "He is lying, so there is no reason to hear his side.",
            "type": "plausible_incomplete",
            "feedback": "You cannot know that. Thinking he lies makes it hard to hear what he saw."
          },
          {
            "id": "tp4-6",
            "text": "Whoever has more friends here is probably right.",
            "type": "plausible_incomplete",
            "feedback": "More friends do not make a call right. A fair plan ignores popularity."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What are some ways to decide fairly?",
        "choices": [
          {
            "id": "tp4-7",
            "text": "Agree on a fair way, such as a do-over or a rule.",
            "type": "responsible",
            "feedback": "A rule for close calls helps this time and next time. Neither of you gives in."
          },
          {
            "id": "tp4-8",
            "text": "Let the loudest player decide, so the game keeps going fast.",
            "type": "plausible_incomplete",
            "feedback": "That is fast, but unfair. Loud players are not always right."
          },
          {
            "id": "tp4-9",
            "text": "Ask a bigger kid who was not there to decide.",
            "type": "plausible_incomplete",
            "feedback": "Someone who did not see it cannot know. Picking by size is not fair."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What do you say or do now?",
        "choices": [
          {
            "id": "tp4-10",
            "text": "Suggest a do-over, and agree on a rule for close calls.",
            "type": "responsible",
            "feedback": "A do-over and a rule settle this call and the next one. Nobody loses."
          },
          {
            "id": "tp4-11",
            "text": "Suggest asking a neutral player who watched the whole point.",
            "type": "multiple_defensible",
            "feedback": "Also fair. A neutral player helps if you both accept the answer."
          },
          {
            "id": "tp4-12",
            "text": "Shout that Jin cheats, and quit unless he admits it.",
            "type": "unsafe",
            "feedback": "Shouting makes Jin defend himself. The game ends, and the argument is still there."
          },
          {
            "id": "tp4-13",
            "text": "Ask the recess helper to hear both sides and help.",
            "type": "seek_help",
            "feedback": "A recess helper can listen without taking a side. That helps when you are stuck."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "How should people treat you when they think you did wrong?",
        "freeReflection": true
      }
    ] },
  ];

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'branchingScenario',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'peace-table-2d',
    header: {
      icon: '🕊️',
      title: 'Peace Table',
      description: 'Two kids disagree. Say what happened, listen, and find a fair plan together.',
    },
  });
</script>
</body>
</html>
