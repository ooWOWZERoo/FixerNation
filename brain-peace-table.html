<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

<title>Fixer Nation Education - Peace Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="brain-games.css?v=5">
</head>
<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=16"></script>
<script src="site-auth.js?v=10"></script>
<script src="footer.js?v=9"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js"></script>
<script src="engine-sdk.js?v=4"></script>
<script src="engine-branching-scenario.js?v=5"></script>
<script>
  // Peace Table - Tune Your Brain (Explore band, grades 3-5). The five-step
  // story engine used as a peace-table cycle: say what happened and how you
  // feel, listen to the other side, find a fair plan, try it, and reflect.
  // Practises NY SEL 2D (resolving conflict), with 1A, 2A and 2C supporting.
  // The first conflict game below grade 6 (Group Chat Meltdown is grades 6-8).
  // Four situations, one per run (FnEngineSDK variants); both children in each
  // story have a fair point, nobody is a bully, and every story offers a
  // trusted-adult option. Design and approved outline:
  // docs/tune-your-brain/NEW_GAMES_FOR_GAPS.md and PEACE_TABLE_OUTLINE.md.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'explore';

  const contentPack = {
    title: 'Peace Table',
    steps: [
      {
        "key": "recognize",
        "prompt": "Mia and Ben both want the last turn on the classroom computer, and the lunch bell is about to ring. Each says, \"I was here first.\" You are Mia. What do you do first?",
        "choices": [
          {
            "id": "tp1-1",
            "text": "Say what happened and how you feel: \"I am frustrated, and I think I was next.\"",
            "type": "responsible",
            "feedback": "Saying it calmly lets Ben hear you without feeling attacked, and it names the problem."
          },
          {
            "id": "tp1-2",
            "text": "Say that it is only a computer, so Ben should not care so much about it.",
            "type": "plausible_incomplete",
            "feedback": "It may be small to you, but Ben cares. Telling him not to care usually makes things worse."
          },
          {
            "id": "tp1-3",
            "text": "Tell Ben that he always does this, so everyone knows what he is like.",
            "type": "plausible_incomplete",
            "feedback": "\"Always\" feels like an attack, and it makes people defend themselves instead of listening."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "What do you notice about Ben's side?",
        "choices": [
          {
            "id": "tp1-4",
            "text": "Ben also wants a turn and is also in a hurry, and he feels that he was next.",
            "type": "responsible",
            "feedback": "Seeing his side does not mean giving in. It helps you find a plan that works for both of you."
          },
          {
            "id": "tp1-5",
            "text": "Ben is just being greedy, so there is nothing to understand about his side.",
            "type": "plausible_incomplete",
            "feedback": "Calling him greedy closes the conversation. He may have a good reason to want the turn too."
          },
          {
            "id": "tp1-6",
            "text": "Whoever talks the loudest should get the turn, since that is how it usually goes.",
            "type": "plausible_incomplete",
            "feedback": "Loud does not mean right. A fair plan does not depend on who is louder."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What are some ways to find a fair plan?",
        "choices": [
          {
            "id": "tp1-7",
            "text": "Share the turn, flip a coin, or split the time, so that both of you get something.",
            "type": "responsible",
            "feedback": "A plan that gives both of you something is easier to agree on, and it ends the argument quickly."
          },
          {
            "id": "tp1-8",
            "text": "Ask the teacher to decide right away, without trying to work it out first.",
            "type": "plausible_incomplete",
            "feedback": "A teacher can help, but trying first shows that you can solve it yourselves. Save the teacher for when you are stuck."
          },
          {
            "id": "tp1-9",
            "text": "Take the computer while Ben is not looking, so that the problem is over.",
            "type": "plausible_incomplete",
            "feedback": "That solves it for you and creates a new problem for Ben. He will feel tricked, and it will get worse."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What do you say or do now?",
        "choices": [
          {
            "id": "tp1-10",
            "text": "Suggest taking turns, five minutes each, and say it calmly and kindly.",
            "type": "responsible",
            "feedback": "A calm offer with a clear plan is easy to say yes to, and it treats you both fairly."
          },
          {
            "id": "tp1-11",
            "text": "Suggest a coin flip, and agree ahead of time to accept whatever it says.",
            "type": "multiple_defensible",
            "feedback": "Also fair. A coin flip is quick, and agreeing ahead of time keeps it from turning into another argument."
          },
          {
            "id": "tp1-12",
            "text": "Grab the mouse and say loudly that the turn is yours and Ben must wait.",
            "type": "unsafe",
            "feedback": "Grabbing makes Ben angry and may get you both in trouble. It also teaches him not to trust you."
          },
          {
            "id": "tp1-13",
            "text": "Ask the teacher to help you decide, if the two of you cannot agree.",
            "type": "seek_help",
            "feedback": "When you are stuck, asking an adult is smart, and it is not the same as giving up."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "What helps you stay calm when you want something badly?",
        "freeReflection": true
      }
    ],
  };

  // Four situations: two kids want the same turn (above), a borrowed thing gets broken, a hurtful misunderstanding, and an argument about a call.
  // Steps 1 to 3 offer three options; step 4 offers four. Option lengths are balanced on purpose (see server/scripts/audit-brain-games.js).
  contentPack.variants = [
    { steps: contentPack.steps },
    { steps: [
      {
        "key": "recognize",
        "prompt": "Priya borrows Amir's special pencil case, and the zipper breaks. Amir is upset. Priya feels bad, and she thinks the zipper was already loose. You are Priya. What do you do first?",
        "choices": [
          {
            "id": "tp2-1",
            "text": "Say what happened and that you feel bad, and be honest that it broke in your hands.",
            "type": "responsible",
            "feedback": "Telling the truth right away shows that you respect Amir and the thing that he lent you."
          },
          {
            "id": "tp2-2",
            "text": "Say that it was already broken, so it is not your fault at all, and move on.",
            "type": "plausible_incomplete",
            "feedback": "It may have been loose, but it broke in your hands. Saying it is not your fault makes Amir feel ignored."
          },
          {
            "id": "tp2-3",
            "text": "Hide the pencil case and say nothing, hoping that Amir will not notice it for a while.",
            "type": "plausible_incomplete",
            "feedback": "He will notice, and hiding it makes the problem bigger. Honesty is easier than a cover-up."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "What do you notice about Amir's side?",
        "choices": [
          {
            "id": "tp2-4",
            "text": "The pencil case matters to him, and he feels sad and a little angry.",
            "type": "responsible",
            "feedback": "Knowing how it feels for him helps you say sorry in a way that he can hear."
          },
          {
            "id": "tp2-5",
            "text": "It is only a pencil case, so he should not be so upset about it.",
            "type": "plausible_incomplete",
            "feedback": "It might be small to you, but it is special to him. His feelings are real either way."
          },
          {
            "id": "tp2-6",
            "text": "He is overreacting, so you can wait until he calms down and then say nothing.",
            "type": "plausible_incomplete",
            "feedback": "Waiting without saying anything can feel like ignoring him. A short, honest sorry helps more."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What are some ways to make it right?",
        "choices": [
          {
            "id": "tp2-7",
            "text": "Say sorry, offer to help fix or replace it, and ask what would help him most.",
            "type": "responsible",
            "feedback": "Offering to repair it and asking what he wants gives Amir a say in how this ends."
          },
          {
            "id": "tp2-8",
            "text": "Say sorry quickly and walk away, so that the awkward moment is over for both of you.",
            "type": "plausible_incomplete",
            "feedback": "Saying sorry is a good start, but walking away leaves Amir with the problem."
          },
          {
            "id": "tp2-9",
            "text": "Offer to give him something else of yours instead, so that you are even.",
            "type": "plausible_incomplete",
            "feedback": "A gift is kind, but it may not be what he wants. Asking first is better."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What do you say or do now?",
        "choices": [
          {
            "id": "tp2-10",
            "text": "Say sorry, say what you will do to help, and ask Amir what he would like.",
            "type": "responsible",
            "feedback": "This is honest, kind and clear, and it gives Amir a real choice."
          },
          {
            "id": "tp2-11",
            "text": "Ask a grown-up to help the two of you fix the zipper together, and say sorry again.",
            "type": "multiple_defensible",
            "feedback": "Also a good idea. Fixing it together is a way of making it right, and a grown-up may know a trick."
          },
          {
            "id": "tp2-12",
            "text": "Say that it was already broken, and refuse to talk about it any more.",
            "type": "unsafe",
            "feedback": "Refusing to talk leaves Amir hurt and alone with the problem. It can also end a friendship."
          },
          {
            "id": "tp2-13",
            "text": "Ask a teacher how to make it right, if you are not sure what to do.",
            "type": "seek_help",
            "feedback": "Asking for help is a good choice when you do not know what to do, and teachers have seen this before."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "How do you want people to treat something that you lent them?",
        "freeReflection": true
      }
    ] },
    { steps: [
      {
        "key": "recognize",
        "prompt": "At recess, Zoe says to Leo, \"You are not in our group today.\" Leo hears that he is not wanted, and it hurts. You are Leo. What do you do first?",
        "choices": [
          {
            "id": "tp3-1",
            "text": "Say what you heard and how it felt, and check that you understood her.",
            "type": "responsible",
            "feedback": "Saying what you heard gives Zoe a chance to explain, and it keeps hurt feelings from growing."
          },
          {
            "id": "tp3-2",
            "text": "Say nothing and walk away, and feel sad about it for the rest of the day.",
            "type": "plausible_incomplete",
            "feedback": "Staying quiet protects you for a moment, but the hurt stays, and Zoe never finds out."
          },
          {
            "id": "tp3-3",
            "text": "Say something mean back, so that Zoe knows how it feels to be hurt.",
            "type": "plausible_incomplete",
            "feedback": "It may feel fair, but it starts a fight, and you might be wrong about what she meant."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "What do you notice about Zoe's side?",
        "choices": [
          {
            "id": "tp3-4",
            "text": "She may not have meant to sting, and she might have meant something different.",
            "type": "responsible",
            "feedback": "A short sentence can mean different things. Asking is the only way to find out."
          },
          {
            "id": "tp3-5",
            "text": "She meant to hurt you, so she must be mean and you should stay away from her.",
            "type": "plausible_incomplete",
            "feedback": "That is a guess, and it may be wrong. Deciding she is mean can end a friendship over a mix-up."
          },
          {
            "id": "tp3-6",
            "text": "It does not matter what she meant, because it hurt either way and that is all that counts.",
            "type": "plausible_incomplete",
            "feedback": "How it felt does matter, and so does what she meant. Both can be true and both can be talked about."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What are some ways to find out what she meant?",
        "choices": [
          {
            "id": "tp3-7",
            "text": "Ask a calm question, such as \"Did you mean that I am not included?\"",
            "type": "responsible",
            "feedback": "A calm question gives her room to explain, and it shows that you want to understand."
          },
          {
            "id": "tp3-8",
            "text": "Ask your friends to take your side, so that Zoe knows that people agree with you.",
            "type": "plausible_incomplete",
            "feedback": "Taking sides makes the problem bigger and pulls other people in. Talking to Zoe herself works better."
          },
          {
            "id": "tp3-9",
            "text": "Avoid Zoe for the rest of the day, so that you do not have to talk about it.",
            "type": "plausible_incomplete",
            "feedback": "Avoiding her means that the hurt stays. It is easier now, and harder tomorrow."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What do you say or do now?",
        "choices": [
          {
            "id": "tp3-10",
            "text": "Ask Zoe what she meant, and tell her how it sounded to you.",
            "type": "responsible",
            "feedback": "This is honest and kind, and most mix-ups end with one question like this."
          },
          {
            "id": "tp3-11",
            "text": "Ask if you can play in the next round, and say that you felt left out.",
            "type": "multiple_defensible",
            "feedback": "Also a good choice. You say how you feel and ask for what you want, and Zoe can answer easily."
          },
          {
            "id": "tp3-12",
            "text": "Tell other kids that Zoe is unfair, so that they take your side.",
            "type": "unsafe",
            "feedback": "This spreads the hurt and makes Zoe feel attacked. It also keeps you from finding out the truth."
          },
          {
            "id": "tp3-13",
            "text": "Tell a teacher if the hurt feeling does not go away after you talk.",
            "type": "seek_help",
            "feedback": "If it still hurts, telling a teacher is a good idea. You do not have to carry it alone."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "When has something that you said sounded different from what you meant?",
        "freeReflection": true
      }
    ] },
    { steps: [
      {
        "key": "recognize",
        "prompt": "In a playground game, Ana says the ball was in and Jin says it was out. Ana says Jin always cheats. Jin says Ana always wins by arguing. You are Ana. What do you do first?",
        "choices": [
          {
            "id": "tp4-1",
            "text": "Say what you saw and that you are upset about the call, without any name-calling.",
            "type": "responsible",
            "feedback": "Saying what you saw keeps the argument about the ball, and not about Jin as a person."
          },
          {
            "id": "tp4-2",
            "text": "Say that Jin is a cheater, so that everyone knows what he did.",
            "type": "plausible_incomplete",
            "feedback": "Name-calling turns an argument about a ball into an argument about who someone is. It is much harder to fix."
          },
          {
            "id": "tp4-3",
            "text": "Quit the game and say that it is not fun anymore, so that Jin feels bad.",
            "type": "plausible_incomplete",
            "feedback": "Quitting ends the argument for you, but it ends the game for everyone else too."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "What do you notice about Jin's side?",
        "choices": [
          {
            "id": "tp4-4",
            "text": "Jin saw it differently, and he also feels accused, which is why he is upset.",
            "type": "responsible",
            "feedback": "Two people can watch the same play and see different things, and nobody has to be lying."
          },
          {
            "id": "tp4-5",
            "text": "He is lying, so there is nothing to listen to on his side and no reason to hear him.",
            "type": "plausible_incomplete",
            "feedback": "You cannot know that. Assuming he is lying makes it hard to hear what he actually saw."
          },
          {
            "id": "tp4-6",
            "text": "Whoever has more friends here is probably right, so it does not matter what he says.",
            "type": "plausible_incomplete",
            "feedback": "Having more friends does not make a call right. A fair plan does not depend on who is more popular."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What are some ways to decide fairly?",
        "choices": [
          {
            "id": "tp4-7",
            "text": "Agree on a fair way to decide, such as a do-over or a rule for close calls.",
            "type": "responsible",
            "feedback": "A rule for close calls helps this time and every other time, and neither of you has to give in."
          },
          {
            "id": "tp4-8",
            "text": "Let the loudest player decide, so that the game can keep going quickly.",
            "type": "plausible_incomplete",
            "feedback": "That is quick, but it is not fair. Loud is not the same as right."
          },
          {
            "id": "tp4-9",
            "text": "Ask a bigger kid who was not there to decide, so that someone with power chooses.",
            "type": "plausible_incomplete",
            "feedback": "Someone who did not see it cannot know. Choosing by size is not a fair way to decide."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What do you say or do now?",
        "choices": [
          {
            "id": "tp4-10",
            "text": "Suggest a do-over, and agree on a rule for close calls before you play again.",
            "type": "responsible",
            "feedback": "A do-over and a rule settle this call and the next one, and nobody loses."
          },
          {
            "id": "tp4-11",
            "text": "Suggest asking a neutral player who watched the whole point.",
            "type": "multiple_defensible",
            "feedback": "Also fair. Someone who watched without a side can help, as long as you both agree to accept their answer."
          },
          {
            "id": "tp4-12",
            "text": "Shout that Jin cheats, and refuse to play unless he says that he did.",
            "type": "unsafe",
            "feedback": "Shouting and demanding make Jin defend himself. The game ends, and the argument is still there."
          },
          {
            "id": "tp4-13",
            "text": "Ask the recess helper to listen to both sides and help you decide.",
            "type": "seek_help",
            "feedback": "A recess helper can listen without taking a side, which is exactly what you need when you are stuck."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "How do you want to be treated when somebody thinks that you did something wrong?",
        "freeReflection": true
      }
    ] },
  ];

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'branchingScenario',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'peace-table-2d',
    header: {
      icon: '🕊️',
      title: 'Peace Table',
      description: 'Two kids disagree. Say what happened, listen, and find a fair plan together.',
    },
  });
</script>
</body>
</html>
