<!DOCTYPE html>
<html lang="en">

<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=20"></script>
<script src="site-auth.js?v=11"></script>
<script src="footer.js?v=18"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js?v=3"></script>
<script src="engine-sdk.js?v=6"></script>
<script src="engine-voice.js?v=1"></script>
<script src="engine-scenario-choice.js?v=9"></script>
<script>
  // Know Your Triggers - Tune Your Brain (challenge band). GENERATED by server/scripts/build-core-games.js: change the content there, not here.
  // Engine: Scenario Choice (a "Your turn" check-in with no stories). Focus: self awareness. Release 141.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'challenge';

  const contentPack = {
    "title": "Know Your Triggers",
    "scenarios": [],
    "ownTurn": {
      "intro": "This check-in is about you. Only you see your answers.",
      "illustration": "🧭",
      "stepWord": "Your turn",
      "summaryLabel": "Questions you answered about yourself",
      "privateNote": "Your answers here are private and are not saved.",
      "steps": [
        {
          "id": "t1",
          "type": "pickMany",
          "max": 3,
          "prompt": "Pick up to three things that make stress rise for you.",
          "confirm": "These are mine",
          "options": [
            {
              "id": "deadlines",
              "text": "Deadlines"
            },
            {
              "id": "left-out",
              "text": "Being left out"
            },
            {
              "id": "arguments",
              "text": "Arguments"
            },
            {
              "id": "compared",
              "text": "Being compared to others"
            },
            {
              "id": "changes",
              "text": "Plans changing"
            },
            {
              "id": "grade",
              "text": "A bad grade"
            },
            {
              "id": "watched",
              "text": "Feeling watched"
            },
            {
              "id": "too-much",
              "text": "Too much to do"
            }
          ],
          "notSure": {
            "id": "not-sure",
            "text": "I'm not sure yet"
          }
        },
        {
          "id": "t2",
          "type": "pickOne",
          "prompt": "What do you notice first when stress rises?",
          "options": [
            {
              "id": "chest",
              "text": "My chest feels tight"
            },
            {
              "id": "thoughts",
              "text": "My thoughts race"
            },
            {
              "id": "short",
              "text": "I get short with people"
            },
            {
              "id": "quiet",
              "text": "I go quiet"
            },
            {
              "id": "avoid",
              "text": "I want to avoid it"
            },
            {
              "id": "sleep",
              "text": "I sleep badly"
            }
          ],
          "notSure": {
            "id": "not-sure",
            "text": "I'm not sure"
          }
        },
        {
          "id": "t3",
          "type": "pickOne",
          "prompt": "What could help you notice it sooner?",
          "options": [
            {
              "id": "body",
              "text": "A quick body check"
            },
            {
              "id": "name",
              "text": "Naming the feeling"
            },
            {
              "id": "pause",
              "text": "A short pause"
            },
            {
              "id": "write",
              "text": "Writing it down"
            },
            {
              "id": "tell",
              "text": "Telling someone I trust"
            }
          ],
          "notSure": {
            "id": "not-sure",
            "text": "I'm not sure"
          }
        }
      ],
      "result": {
        "heading": "My triggers",
        "lines": [
          {
            "text": "What raises my stress: {t1|lower}.",
            "needs": "t1"
          },
          {
            "text": "First I notice: {t2|lower}.",
            "needs": "t2"
          },
          {
            "text": "What could help me notice sooner: {t3|lower}.",
            "needs": "t3"
          }
        ],
        "emptyLine": "That is fine. Triggers can take time to spot.",
        "closing": "Noticing comes first. If stress feels too big, talk to an adult you trust.",
        "finish": "Finish"
      }
    }
  };

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'scenarioChoice',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'know-your-triggers-checkin',
    header: {
      icon: '🧭',
      title: 'Know Your Triggers',
      description: 'Notice what raises your stress.',
    },
  });
</script>
<script src="game-backlink.js?v=1" defer></script>
</body>
</html>
