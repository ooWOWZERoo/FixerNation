<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/api/settings/favicon?size=32">
<link rel="icon" type="image/png" sizes="16x16" href="/api/settings/favicon?size=16">
<link rel="apple-touch-icon" href="/api/settings/favicon?size=180">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Fixer Nation Education - Customer Hub Accounts</title>
<link rel="stylesheet" href="fonts.css?v=1">
<script>(function(){var t=localStorage.getItem('fnTheme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="admin-common.css?v=22">
<link rel="stylesheet" href="crm-common.css?v=3">
</head>
<body class="fn-mission-admin">

<div class="a-shell">
  <aside class="a-sidebar"></aside>
<script src="admin-nav.js?v=39"></script>

  <div class="a-main">
    <div class="a-topbar">
      <h1 id="pageTitle">Accounts</h1>
      <div class="a-theme-toggle" onclick="fnToggleTheme()" title="Toggle light/dark theme"><span class="ic-sun">☀️</span><span class="ic-moon">🌙</span></div>
      <div class="a-user"><div class="avatar">A</div> admin</div>
    </div>

    <div class="a-content">
      <div id="crmRoot"></div>
    </div>
  </div>
</div>

<script src="admin-common.js?v=17"></script>
<script src="crm-common.js?v=3"></script>
<script>
(function () {
  var C = FnCrm, esc = C.esc, root = document.getElementById('crmRoot');
  var q = C.readQuery();
  var staff = [];
  var st = { view: q.view === 'duplicates' ? 'duplicates' : 'list', role: q.role || '', license: q.license || '', parent: q.parent || '', q: q.q || '', type: q.type || '', owner: q.owner || '', relationship: q.relationship || '', archived: q.archived === 'true', page: Math.max(1, Number(q.page) || 1) };

  // G1: what an account is to us. Customer needs a paid, non-trial purchase placed on the school or district; Prospect needs an open deal or a Prospect or Customer person;
  // "Needs review" is separate: someone here owns a paid purchase that names no school.
  var REL = { suspect: ['Suspect', 'a-pill-neutral'], prospect: ['Prospect', 'a-pill-warning'], customer: ['Customer', 'a-pill-success'] };
  function relPills(a) {
    var r = REL[a.relationship];
    return (r ? '<span class="a-pill ' + r[1] + '">' + r[0] + '</span>' : '') + (a.needsReview ? ' <span class="a-pill a-pill-danger" title="A person on this account owns a paid purchase that names no school.">Needs review</span>' : '');
  }

  C.boot(root).then(function (me) {
    if (!me) return;
    C.staff().then(function (list) { staff = list; shell(); st.view === 'duplicates' ? fetchDupes() : fetchList(); });
  });

  function shell() {
    // G17: a second tab lists accounts that share a website address, so duplicates can be found and merged.
    var tabs = '<ul class="crm-views" aria-label="Accounts views"><li><a href="admin-crm-accounts.html"' + (st.view === 'list' ? ' aria-current="true"' : '') + '>All accounts</a></li><li><a href="admin-crm-accounts.html?view=duplicates"' + (st.view === 'duplicates' ? ' aria-current="true"' : '') + '>Possible duplicates</a></li></ul>';
    if (st.view === 'duplicates') { root.innerHTML = '<div class="a-card"><div class="a-card-head"><h2>Possible duplicates</h2></div>' + tabs + '<p class="crm-small crm-muted" style="margin:0 0 12px;">Accounts of the same type with the same website address (capitals, www, https and a trailing slash are ignored; a shared email domain is never used), and accounts whose names look alike (same words in any order, or one spelling slip; "Maple Elementary" and "Maple High" are never matched, and neither are two schools in different states). Name matches are only suggestions. Open each one to compare, and a CRM Admin can merge them from the account page. Nothing is merged for you. If two really are different organizations, mark them as separate and they stop being listed; you can undo that at the bottom of this page.</p><div id="dupBody" aria-live="polite"></div><div id="dupPager"></div></div>'; return; }
    root.innerHTML = '<div class="a-card"><div class="a-card-head"><h2>Accounts</h2>' +
      (C.can('write') ? '<button type="button" class="a-btn a-btn-primary" id="addAcct">+ Add account</button>' : '') + '</div>' +
      '<div class="crm-toolbar" role="search"><div class="grow"><label class="crm-sr" for="fQ">Search accounts</label><input type="search" id="fQ" placeholder="Search by name or website" value="' + esc(st.q) + '"></div>' +
      '<label class="crm-sr" for="fType">Type</label><select id="fType" class="a-filter-select">' + C.options(C.ACCOUNT_TYPES, st.type, 'Every type') + '</select>' +
      '<label class="crm-sr" for="fRel">What it is to us</label><select id="fRel" class="a-filter-select"><option value="">Every label</option>' + [['suspect', 'Suspects'], ['prospect', 'Prospects'], ['customer', 'Customers'], ['review', 'Needs review']].map(function (o) { return '<option value="' + o[0] + '"' + (st.relationship === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
      '<label class="crm-sr" for="fRole">Buying role</label><select id="fRole" class="a-filter-select">' + C.options({ champion: 'Has a champion', decision_maker: 'Has a decision maker', procurement: 'Has a procurement contact', finance: 'Has a finance contact' }, st.role, 'Any buying role') + '</select>' +
      '<label class="crm-sr" for="fLicense">Licence</label><select id="fLicense" class="a-filter-select">' + C.options({ paid: 'Has a live paid license', trial: 'Has a live trial', ended_trial: 'Only an ended trial', none: 'No license or trial' }, st.license, 'Any licence status') + '</select>' +
      '<label class="crm-sr" for="fOwner">Owner</label><select id="fOwner" class="a-filter-select"><option value="">Every owner</option><option value="none"' + (st.owner === 'none' ? ' selected' : '') + '>Nobody yet</option>' +
        staff.map(function (s) { return '<option value="' + esc(s.id) + '"' + (String(s.id) === st.owner ? ' selected' : '') + '>' + esc(s.username) + '</option>'; }).join('') + '</select>' +
      '<label class="crm-check" style="margin:0;"><input type="checkbox" id="fArch"' + (st.archived ? ' checked' : '') + '> Show archived</label></div>' +
      tabs + '<div id="acctReview"></div><div id="acctBody" aria-live="polite"></div><div id="acctPager"></div></div>';
    var go = C.debounce(function () { st.page = 1; fetchList(); }, 250);
    document.getElementById('fQ').addEventListener('input', function (e) { st.q = e.target.value; go(); });
    document.getElementById('fType').addEventListener('change', function (e) { st.type = e.target.value; st.page = 1; fetchList(); });
    document.getElementById('fRel').addEventListener('change', function (e) { st.relationship = e.target.value; st.page = 1; fetchList(); });
    document.getElementById('fRole').addEventListener('change', function (e) { st.role = e.target.value; st.page = 1; fetchList(); });
    document.getElementById('fLicense').addEventListener('change', function (e) { st.license = e.target.value; st.page = 1; fetchList(); });
    document.getElementById('fOwner').addEventListener('change', function (e) { st.owner = e.target.value; st.page = 1; fetchList(); });
    document.getElementById('fArch').addEventListener('change', function (e) { st.archived = e.target.checked; st.page = 1; fetchList(); });
    var add = document.getElementById('addAcct');
    if (add) add.addEventListener('click', addAccount);
  }

  function fetchList() {
    C.writeQuery({ role: st.role, license: st.license, parent: st.parent, q: st.q, type: st.type, owner: st.owner, relationship: st.relationship, archived: st.archived ? 'true' : '', page: st.page > 1 ? st.page : '' });
    var body = document.getElementById('acctBody');
    C.loading(body);
    C.api('GET', '/api/crm/accounts' + C.qstr({ q: st.q, type: st.type, owner: st.owner, relationship: st.relationship, role: st.role, license: st.license, parent: st.parent, today: C.todayLocal(), archived: st.archived ? 'true' : '', page: st.page, pageSize: 25 })).then(function (r) {
      if (!r.ok) { C.errorBox(body, C.problem(r)); return; }
      drawReview(r.data.relationshipCounts);
      if (!r.data.total) { body.innerHTML = C.empty(st.q || st.type || st.owner || st.relationship || st.role || st.license || st.parent ? 'No account matches those filters.' : 'No accounts yet. Add the first school or district you are working with.', '🏫'); document.getElementById('acctPager').innerHTML = ''; return; }
      body.innerHTML = '<table class="a-table" aria-label="Accounts"><thead><tr><th scope="col">Name</th><th scope="col">What it is to us</th><th scope="col">Type</th><th scope="col">State</th><th scope="col">Owner</th><th scope="col">People</th><th scope="col">Open deals</th><th scope="col">Paid purchases</th></tr></thead><tbody>' +
        r.data.accounts.map(function (a) {
          return '<tr><td><a class="crm-link" href="admin-crm-account.html?id=' + esc(a.id) + '">' + esc(a.name) + '</a>' + (a.archivedAt ? ' <span class="a-pill a-pill-neutral">Archived</span>' : '') + (a.websiteDomain ? '<div class="crm-small crm-muted">' + esc(a.websiteDomain) + '</div>' : '') + '</td><td>' + relPills(a) + '</td><td>' + esc(C.label(C.ACCOUNT_TYPES, a.accountType)) + '</td><td>' + esc(a.state || '') + '</td><td>' + (a.assignedAdminId ? esc(C.staffName(staff, a.assignedAdminId) || 'Former staff') : '<span class="crm-muted">Nobody yet</span>') + '</td><td>' + C.num(a.contactCount) + '</td><td>' + C.num(a.openDeals) + '</td><td>' + (a.paid && a.paid.count ? esc(C.num(a.paid.count)) + ' · ' + esc(C.money(a.paid.totalCents)) : '<span class="crm-muted">None</span>') + '</td></tr>';
        }).join('') + '</tbody></table>';
      C.pager(document.getElementById('acctPager'), r.data, function (n) { st.page = n; fetchList(); window.scrollTo(0, 0); });
    });
  }

  // G17: accounts that share a website address, grouped. Read only.
  function fetchDupes() {
    C.writeQuery({ view: 'duplicates', page: st.page > 1 ? st.page : '' });
    var body = document.getElementById('dupBody');
    C.loading(body);
    C.api('GET', '/api/crm/accounts/review/duplicates' + C.qstr({ page: st.page, pageSize: 20 })).then(function (r) {
      if (!r.ok) { C.errorBox(body, C.problem(r)); return; }
      var canMark = C.can('write') && r.data.memoryAvailable !== false;
      if (!r.data.total) { body.innerHTML = C.empty(r.data.markedCount ? 'No two accounts are left that might be the same one.' : 'No two accounts share a website address.', '✅') + marked(); document.getElementById('dupPager').innerHTML = ''; loadMarked(); return; }
      body.innerHTML = r.data.groups.map(function (g) {
        var ids = g.accounts.map(function (a) { return a.id; });
        var why = g.reason === 'similar_name' ? 'Similar names' : 'Same website: ' + g.domain;
        var pairBtns = '';
        if (canMark && g.accounts.length > 2) {
          g.accounts.forEach(function (x, i) { g.accounts.slice(i + 1).forEach(function (y) { pairBtns += '<button type="button" class="a-btn a-btn-outline a-btn-sm" data-sep="' + esc(x.id + ',' + y.id) + '">' + esc(x.name) + ' and ' + esc(y.name) + ' are separate</button> '; }); });
        }
        var bar = canMark ? '<p class="crm-row" style="gap:8px;flex-wrap:wrap;"><button type="button" class="a-btn a-btn-outline a-btn-sm" data-sep="' + esc(ids.join(',')) + '">' + (g.accounts.length > 2 ? 'None of these are duplicates' : 'Not a duplicate') + '</button> ' + pairBtns + '</p>' : '';
        return '<div class="a-card" style="margin-bottom:12px;"><p class="crm-small"><strong>' + esc(why) + '</strong> · ' + esc(g.accounts.length) + ' accounts</p><table class="a-table" aria-label="' + esc(why) + '"><thead><tr><th scope="col">Name</th><th scope="col">What it is to us</th><th scope="col">People</th><th scope="col">Open deals</th></tr></thead><tbody>' +
          g.accounts.map(function (a) { return '<tr><td><a class="crm-link" href="admin-crm-account.html?id=' + esc(a.id) + '">' + esc(a.name) + '</a><div class="crm-small crm-muted">' + esc(a.websiteDomain) + '</div></td><td>' + (REL[a.relationship] ? '<span class="a-pill ' + REL[a.relationship][1] + '">' + REL[a.relationship][0] + '</span>' : '') + '</td><td>' + C.num(a.people) + '</td><td>' + C.num(a.openDeals) + '</td></tr>'; }).join('') + '</tbody></table>' + bar + '</div>';
      }).join('') + marked();
      body.querySelectorAll('[data-sep]').forEach(function (b) {
        b.addEventListener('click', function () {
          b.disabled = true;
          C.api('POST', '/api/crm/accounts/review/not-duplicates', { accountIds: b.getAttribute('data-sep').split(',').map(Number) }).then(function (x) {
            if (!x.ok) { C.toast(C.problem(x)); b.disabled = false; return; }
            C.toast('Marked as separate. You can undo it from the list at the bottom.'); fetchDupes();
          });
        });
      });
      C.pager(document.getElementById('dupPager'), r.data, function (n) { st.page = n; fetchDupes(); window.scrollTo(0, 0); });
      loadMarked();
    });
  }

  // Pairs a person has said are separate organizations. Shown at the bottom of the tab so a mistake can be undone; undoing brings the pair back into the list above.
  function marked() { return '<details id="markedBox" style="margin-top:16px;"><summary>Marked as not a duplicate</summary><div id="markedBody" aria-live="polite" style="margin-top:8px;"></div></details>'; }
  function loadMarked() {
    var el = document.getElementById('markedBody'); if (!el) return;
    C.api('GET', '/api/crm/accounts/review/not-duplicates?pageSize=100').then(function (r) {
      if (!r.ok) { el.innerHTML = '<p class="crm-small crm-muted">' + esc(C.problem(r)) + '</p>'; return; }
      if (r.data.available === false) { el.innerHTML = '<p class="crm-small crm-muted">This is not available yet. Ask the person who runs the site to run the not-a-duplicate update.</p>'; return; }
      if (!r.data.pairs.length) { el.innerHTML = '<p class="crm-small crm-muted">Nothing is marked yet.</p>'; return; }
      el.innerHTML = '<ul class="crm-list">' + r.data.pairs.map(function (p) {
        return '<li><div class="crm-item-main"><a class="crm-link" href="admin-crm-account.html?id=' + esc(p.a.id) + '">' + esc(p.a.name) + '</a> and <a class="crm-link" href="admin-crm-account.html?id=' + esc(p.b.id) + '">' + esc(p.b.name) + '</a>' +
          '<div class="crm-small crm-muted">Marked ' + esc(C.date(p.decidedAt)) + (p.decidedBy ? ' by ' + esc(p.decidedBy) : '') + '</div></div>' +
          (C.can('write') ? '<button type="button" class="a-btn a-btn-outline a-btn-sm" data-undo="' + esc(p.id) + '">Undo</button>' : '') + '</li>';
      }).join('') + '</ul>' + (r.data.total > r.data.pairs.length ? '<p class="crm-small crm-muted">Showing the newest ' + C.num(r.data.pairs.length) + ' of ' + C.num(r.data.total) + '.</p>' : '');
      el.querySelectorAll('[data-undo]').forEach(function (b) {
        b.addEventListener('click', function () {
          b.disabled = true;
          C.api('DELETE', '/api/crm/accounts/review/not-duplicates/' + encodeURIComponent(b.getAttribute('data-undo')), {}).then(function (x) { if (!x.ok) { C.toast(C.problem(x)); b.disabled = false; return; } C.toast('Back in the list.'); fetchDupes(); });
        });
      });
    });
  }

  // D4: paid purchases that name no school cannot be placed on an account. The CRM never edits a purchase; the school is set in the old admin tool and the purchase leaves this list.
  function drawReview(counts) {
    var el = document.getElementById('acctReview');
    var n = counts ? Number(counts.review) : 0;
    el.innerHTML = n ? '<p class="crm-notice">' + C.num(n) + ' account' + (n === 1 ? '' : 's') + ' need' + (n === 1 ? 's' : '') + ' review: a person there owns a paid purchase that names no school. <button type="button" class="crm-link" id="showUnplaced">Show those purchases</button></p>' : '';
    var b = document.getElementById('showUnplaced');
    if (b) b.addEventListener('click', showUnplaced);
  }
  function showUnplaced() {
    C.api('GET', '/api/crm/accounts/review/unplaced?pageSize=100').then(function (r) {
      if (!r.ok) { C.toast(C.problem(r)); return; }
      C.dialog({
        title: 'Paid purchases that name no school (' + C.num(r.data.total) + ')',
        body: '<p class="crm-small crm-muted">Each of these counts for the buyer but cannot count for a school or district, because the purchase names no school. Set the school on the purchase in the old admin tool and it leaves this list. Nothing is linked automatically.</p>' +
          (r.data.purchases.length ? '<table class="a-table" aria-label="Purchases that name no school"><thead><tr><th scope="col">Buyer</th><th scope="col">School named</th><th scope="col">Bought</th><th scope="col">Amount</th><th scope="col">Accounts the buyer is on</th></tr></thead><tbody>' +
            r.data.purchases.map(function (p) {
              return '<tr><td><a class="crm-link" href="admin-crm-contact.html?id=' + esc(p.contactId) + '">' + esc(p.contactName || p.contactEmail) + '</a></td><td>' + (p.schoolDomain ? esc(p.schoolDomain) : '<span class="crm-muted">None</span>') + '</td><td>' + esc(C.date(p.purchasedAt)) + '</td><td>' + esc(C.money(p.amountCents, 'Unknown')) + '</td><td>' +
                (p.accounts.length ? p.accounts.map(function (a) { return '<a class="crm-link" href="admin-crm-account.html?id=' + esc(a.id) + '">' + esc(a.name) + '</a>'; }).join(', ') : '<span class="crm-muted">No account yet</span>') + '</td></tr>';
            }).join('') + '</tbody></table>' : C.empty('Nothing to review.', '✅'))
      });
    });
  }

  function addAccount() {
    var allowDup = false;
    C.dialog({
      title: 'Add an account', submit: 'Add account',
      body: C.field('Name', '<input type="text" id="aName" maxlength="255" required>', 'The school, district or organization.', 'aName') +
        '<div class="a-form-row">' + C.field('Type', '<select id="aType">' + C.options(C.ACCOUNT_TYPES, 'school') + '</select>', '', 'aType') + C.field('State', '<input type="text" id="aState" maxlength="64">', '', 'aState') + '</div>' +
        C.field('Website', '<input type="text" id="aWeb" maxlength="255" placeholder="example.org">', '', 'aWeb') +
        C.field('Owner', '<select id="aOwner">' + C.ownerOptions(staff, C.adminId, 'Nobody yet') + '</select>', '', 'aOwner'),
      onSubmit: function (f) {
        var body = { name: f.querySelector('#aName').value, accountType: f.querySelector('#aType').value, state: f.querySelector('#aState').value, websiteDomain: f.querySelector('#aWeb').value, assignedAdminId: f.querySelector('#aOwner').value ? Number(f.querySelector('#aOwner').value) : null, source: 'Added in the Customer Hub' };
        if (allowDup) body.allowDuplicate = true;
        return C.api('POST', '/api/crm/accounts', body).then(function (r) {
          if (r.ok) { window.location.href = 'admin-crm-account.html?id=' + r.data.id; return; }
          if (r.data.code === 'possible_duplicate') { allowDup = true; return r.data.error.replace(' Open it, or send allowDuplicate to create another.', '') + ' Choose Add account again to make a second one anyway.'; }
          return C.problem(r);
        });
      }
    });
  }
})();
</script>
<script src="admin-shell.js?v=12"></script>
</body>
</html>
