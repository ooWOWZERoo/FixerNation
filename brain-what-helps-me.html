<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/api/settings/favicon?size=32">
<link rel="icon" type="image/png" sizes="16x16" href="/api/settings/favicon?size=16">
<link rel="apple-touch-icon" href="/api/settings/favicon?size=180">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - What Helps Me</title>
<link rel="stylesheet" href="fonts.css?v=1">
<link rel="stylesheet" href="brain-games.css?v=7">
</head>
<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=20"></script>
<script src="site-auth.js?v=11"></script>
<script src="footer.js?v=18"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js?v=3"></script>
<script src="engine-sdk.js?v=6"></script>
<script src="engine-voice.js?v=1"></script>
<script src="engine-scenario-choice.js?v=9"></script>
<script>
  // What Helps Me - Tune Your Brain (explore band). GENERATED by server/scripts/build-core-games.js: change the content there, not here.
  // Engine: Scenario Choice (a "Your turn" check-in with no stories). Focus: self awareness. Release 141.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'explore';

  const contentPack = {
    "title": "What Helps Me",
    "scenarios": [],
    "ownTurn": {
      "intro": "This is about you. Only you see what you pick.",
      "illustration": "🧠",
      "stepWord": "Your turn",
      "summaryLabel": "Questions you answered about yourself",
      "privateNote": "Your answers here are private and are not saved.",
      "steps": [
        {
          "id": "w1",
          "type": "pickMany",
          "max": 2,
          "prompt": "Pick up to two things that help you learn.",
          "confirm": "These help me",
          "options": [
            {
              "id": "move",
              "text": "Moving a little first"
            },
            {
              "id": "draw",
              "text": "Drawing or doodling"
            },
            {
              "id": "talk",
              "text": "Talking it through"
            },
            {
              "id": "write",
              "text": "Writing it down"
            },
            {
              "id": "friend",
              "text": "Working with a friend"
            },
            {
              "id": "quiet",
              "text": "A quiet spot"
            },
            {
              "id": "break",
              "text": "A short break"
            },
            {
              "id": "list",
              "text": "A list of steps"
            }
          ],
          "notSure": {
            "id": "not-sure",
            "text": "I'm not sure yet"
          }
        },
        {
          "id": "w2",
          "type": "pickOne",
          "prompt": "When is it hardest to focus?",
          "options": [
            {
              "id": "noisy",
              "text": "When it is noisy"
            },
            {
              "id": "tired",
              "text": "When I am tired"
            },
            {
              "id": "long",
              "text": "When the work is long"
            },
            {
              "id": "worried",
              "text": "When I am worried"
            },
            {
              "id": "lost",
              "text": "When I do not get it"
            }
          ],
          "notSure": {
            "id": "not-sure",
            "text": "I'm not sure"
          }
        },
        {
          "id": "w3",
          "type": "pickOne",
          "prompt": "What could you try this week?",
          "options": [
            {
              "id": "spot",
              "text": "Ask for a quiet spot"
            },
            {
              "id": "breaks",
              "text": "Take a short break each 15 minutes"
            },
            {
              "id": "steps",
              "text": "Make a list of steps first"
            },
            {
              "id": "buddy",
              "text": "Work with a friend"
            },
            {
              "id": "sketch",
              "text": "Draw it before I write"
            }
          ],
          "notSure": {
            "id": "not-sure",
            "text": "I'm not sure"
          }
        }
      ],
      "result": {
        "heading": "What helps me",
        "lines": [
          {
            "text": "What helps me learn: {w1|lower}.",
            "needs": "w1"
          },
          {
            "text": "It is hardest for me to focus {w2|lower}.",
            "needs": "w2"
          },
          {
            "text": "This week I will try this: {w3|lower}.",
            "needs": "w3"
          }
        ],
        "emptyLine": "That is fine. You can find out what helps as you go.",
        "closing": "Knowing what helps is a strength. Only you see this card.",
        "finish": "Finish"
      }
    }
  };

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'scenarioChoice',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'what-helps-me-checkin',
    header: {
      icon: '🧠',
      title: 'What Helps Me',
      description: 'Find out what helps you learn.',
    },
  });
</script>
<script src="game-backlink.js?v=1" defer></script>
</body>
</html>
