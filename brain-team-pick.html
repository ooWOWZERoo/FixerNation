<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Team Pick</title>
<link rel="stylesheet" href="fonts.css?v=1">
<link rel="stylesheet" href="brain-games.css?v=7">
</head>
<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=17"></script>
<script src="site-auth.js?v=11"></script>
<script src="footer.js?v=10"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js?v=3"></script>
<script src="engine-sdk.js?v=5"></script>
<script src="engine-branching-scenario.js?v=6"></script>
<script>
  // Team Pick - Tune Your Brain SEL scaling slice (Explore band). Real
  // Issues-to-Answers 5-step cycle (section 6.6) on a being-picked-last
  // situation, per section 6.5's Explore progression (friendship repair,
  // inclusion, cooperation, separating intention from impact). Explore's
  // second SEL & Character game (already had Choice Quest) and its first
  // to cover Self-management - see docs/tune-your-brain/GAP_ANALYSIS_2026-09-17.md's
  // SEL x band table, which flagged Self-management as having zero
  // coverage in any band. Per the scenario-scoring rule, the "choose"
  // step's options span unsafe / plausible-incomplete / responsible /
  // multiple-defensible / seek-help, never scored as trivia. Per the
  // sensitive-scenario rules, this stays non-graphic, offers a
  // trusted-adult option, and never puts the student solely on the hook
  // for fixing it.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'explore';

  const contentPack = {
    title: 'Team Pick',
    steps: [
      {
        "key": "recognize",
        "prompt": "At recess, your two best friends pick teams for four-square. You are the last one picked.",
        "choices": [
          {
            "id": "notice-feeling",
            "text": "Notice you feel hurt and frustrated. That is normal.",
            "type": "responsible",
            "feedback": "Naming your feeling is the first step to handling it well."
          },
          {
            "id": "not-a-big-deal",
            "text": "It is just a game, so there is nothing to feel.",
            "type": "plausible_incomplete",
            "feedback": "You can feel something about a game. Hiding it will not make it go away."
          },
          {
            "id": "push-away",
            "text": "Your friends did not mean it, so push the feeling away.",
            "type": "plausible_incomplete",
            "feedback": "Maybe they did not mean it. Pushed-down feelings often come back later."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "If you hold the frustration in and do nothing, what might happen?",
        "choices": [
          {
            "id": "snap-later",
            "text": "Recess feels worse, and your friends never learn how you feel.",
            "type": "responsible",
            "feedback": "Both can happen. The feeling can grow, and friends cannot guess it."
          },
          {
            "id": "goes-away",
            "text": "Nothing. Feelings like this fade fast, and recess ends soon.",
            "type": "plausible_incomplete",
            "feedback": "Sometimes it fades fast. Other times it stays, so hoping is not a plan."
          },
          {
            "id": "friends-notice",
            "text": "Your friends will notice and come ask what is wrong.",
            "type": "plausible_incomplete",
            "feedback": "Some friends will. Many cannot tell how you feel unless you say so."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What could you do about feeling left out?",
        "choices": [
          {
            "id": "breathe-reframe",
            "text": "Take slow breaths. One moment does not mean they dislike you.",
            "type": "responsible",
            "feedback": "Calming down first helps you think clearly before you act."
          },
          {
            "id": "stay-quiet-hope",
            "text": "Stay quiet through recess and hope the feeling passes by lunch.",
            "type": "plausible_incomplete",
            "feedback": "That may work, but it is no plan if it returns."
          },
          {
            "id": "sit-out",
            "text": "Sit out the rest of recess to avoid seeing your friends.",
            "type": "plausible_incomplete",
            "feedback": "A short break can help. Sitting out all recess can feel even lonelier."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What is the best thing to do right now?",
        "choices": [
          {
            "id": "never-play-again",
            "text": "Say, \"Fine, I did not want to play anyway,\" and storm off.",
            "type": "unsafe",
            "feedback": "That protects you for now, but your friends only hear anger."
          },
          {
            "id": "play-then-mention",
            "text": "Take a breath, join the game, and talk to them later.",
            "type": "multiple_defensible",
            "feedback": "Good plan. You handle the moment now and talk when it is easier."
          },
          {
            "id": "calm-honest",
            "text": "Take a breath, then calmly say being picked last felt bad.",
            "type": "responsible",
            "feedback": "You manage your own feelings and help friends understand you."
          },
          {
            "id": "ask-trusted-adult",
            "text": "If the feeling stays, talk to a teacher or family member.",
            "type": "seek_help",
            "feedback": "A grown-up can help, especially if this keeps happening."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "What is one thing that calms you when you feel left out?",
        "freeReflection": true
      }
    ],
  };

  // Team Pick stories: picked last (above), the missed catch, the spelling test, the part in the play.
  // Phase 3: the original story above plus three more. The game picks one whole story per run (FnEngineSDK variants).
  // Step 4 offers four choices; steps 1 to 3 offer three. Option lengths are balanced on purpose (see server/scripts/audit-brain-games.js).
  contentPack.variants = [
    { steps: contentPack.steps },
    { steps: [
      {
        "key": "recognize",
        "prompt": "You miss an easy catch, and your team loses by one run. Teammates groan, and your face feels hot.",
        "choices": [
          {
            "id": "tp2-1-1",
            "text": "Notice you feel embarrassed and a bit angry. That is normal.",
            "type": "responsible",
            "feedback": "Naming the feeling helps you think clearly while it fades."
          },
          {
            "id": "tp2-1-2",
            "text": "Tell yourself you do not care. It is only a game.",
            "type": "plausible_incomplete",
            "feedback": "Saying you do not care feels safer. The feeling is still there."
          },
          {
            "id": "tp2-1-3",
            "text": "Decide it was not your fault. The sun was in your eyes.",
            "type": "plausible_incomplete",
            "feedback": "The sun may have made it harder. Blaming it all on outside things stops you learning."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "If the feeling takes over, what might happen at recess?",
        "choices": [
          {
            "id": "tp2-2-1",
            "text": "You may snap at someone, and people remember that, not the miss.",
            "type": "responsible",
            "feedback": "Yes. A big feeling can make a small moment feel bigger."
          },
          {
            "id": "tp2-2-2",
            "text": "You feel bad for a moment, then forget it. Nothing changes.",
            "type": "plausible_incomplete",
            "feedback": "Sometimes it fades fast. Ignored feelings often return at a worse time."
          },
          {
            "id": "tp2-2-3",
            "text": "Your teammates stay annoyed, and you cannot do anything about it.",
            "type": "plausible_incomplete",
            "feedback": "How teammates feel depends on what you do next. You have a say."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What could you do about the feeling?",
        "choices": [
          {
            "id": "tp2-3-1",
            "text": "Take slow breaths. One missed catch does not make you bad.",
            "type": "responsible",
            "feedback": "Calming your body first helps you choose, not just react."
          },
          {
            "id": "tp2-3-2",
            "text": "Stay quiet the rest of recess so nobody can say more.",
            "type": "plausible_incomplete",
            "feedback": "Quiet feels safe, but you keep the hot feeling to yourself."
          },
          {
            "id": "tp2-3-3",
            "text": "Joke about it loudly so everyone laughs and the moment passes.",
            "type": "plausible_incomplete",
            "feedback": "A joke can ease things. If it hides your feeling, it may return."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What is the best next step right now?",
        "choices": [
          {
            "id": "tp2-4-1",
            "text": "Say calmly, \"I missed that one. I will get the next.\"",
            "type": "responsible",
            "feedback": "Owning the miss shows you can handle mistakes. The groaning usually stops."
          },
          {
            "id": "tp2-4-2",
            "text": "Step aside to calm down, then rejoin when you are ready.",
            "type": "multiple_defensible",
            "feedback": "A short break is a good tool. Rejoining shows you are ready."
          },
          {
            "id": "tp2-4-3",
            "text": "Blame the ball and the sun. Say it was not your fault.",
            "type": "unsafe",
            "feedback": "Excuses feel safe. Teammates may think you do not take the game seriously."
          },
          {
            "id": "tp2-4-4",
            "text": "Tell the recess helper you are upset and need a minute.",
            "type": "seek_help",
            "feedback": "Telling a helper is strong, and you can do it any time."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "What can you tell yourself after a mistake in front of others?",
        "freeReflection": true
      }
    ] },
    { steps: [
      {
        "key": "recognize",
        "prompt": "You studied all week, but your spelling score was lower than hoped. Your friend next to you got every word right.",
        "choices": [
          {
            "id": "tp3-1-1",
            "text": "Notice you feel disappointed and a bit jealous. Both are normal.",
            "type": "responsible",
            "feedback": "Naming both feelings is a good start. You can be glad for a friend too."
          },
          {
            "id": "tp3-1-2",
            "text": "Decide you are just bad at spelling, since studying did not help.",
            "type": "plausible_incomplete",
            "feedback": "That puts a lot on one test. One score says little about you."
          },
          {
            "id": "tp3-1-3",
            "text": "Decide spelling tests do not matter, so you feel nothing.",
            "type": "plausible_incomplete",
            "feedback": "That feels better fast, but you did study, so it clearly mattered."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "If you decide you are bad at spelling, what might happen?",
        "choices": [
          {
            "id": "tp3-2-1",
            "text": "You may study less and miss the chance to get better.",
            "type": "responsible",
            "feedback": "Yes. What you believe about yourself changes how hard you try."
          },
          {
            "id": "tp3-2-2",
            "text": "You feel better right away, so you focus on other subjects.",
            "type": "plausible_incomplete",
            "feedback": "It feels better now. Giving up on a skill makes it harder later."
          },
          {
            "id": "tp3-2-3",
            "text": "Your teacher notices and gives you extra help without being asked.",
            "type": "plausible_incomplete",
            "feedback": "Teachers notice, but cannot always tell what you need. Asking works better."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What could you do about this?",
        "choices": [
          {
            "id": "tp3-3-1",
            "text": "Check which words you missed and practice a few tonight.",
            "type": "responsible",
            "feedback": "A small, clear plan gives you something to act on."
          },
          {
            "id": "tp3-3-2",
            "text": "Ask your friend to quiz you daily until you match their score.",
            "type": "plausible_incomplete",
            "feedback": "Practicing together is fun. Trying to match their score adds pressure."
          },
          {
            "id": "tp3-3-3",
            "text": "Study twice as long next week and take no breaks.",
            "type": "plausible_incomplete",
            "feedback": "A plan with no breaks is hard to keep. Small, steady goals work better."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What is the best next step right now?",
        "choices": [
          {
            "id": "tp3-4-1",
            "text": "Pick three missed words to practice tonight and check again Friday.",
            "type": "responsible",
            "feedback": "A small goal you can check is how people really get better."
          },
          {
            "id": "tp3-4-2",
            "text": "Ask your teacher for different ways to study your spelling words.",
            "type": "multiple_defensible",
            "feedback": "Teachers know many ways to study, and asking shows you care."
          },
          {
            "id": "tp3-4-3",
            "text": "Decide spelling is not for you and give up next time.",
            "type": "unsafe",
            "feedback": "Quitting feels like relief, but it stops you getting better."
          },
          {
            "id": "tp3-4-4",
            "text": "Congratulate your friend and ask how they like to study.",
            "type": "seek_help",
            "feedback": "A friend's tips can help, and they turn jealousy into something useful."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "What small goal could you set after an unexpected result?",
        "freeReflection": true
      }
    ] },
    { steps: [
      {
        "key": "recognize",
        "prompt": "The class play parts are out. Zoe gets the lead you wanted, and you get a small part.",
        "choices": [
          {
            "id": "tp4-1-1",
            "text": "Notice you feel jealous and let down, but happy for Zoe too.",
            "type": "responsible",
            "feedback": "Mixed feelings are normal. You can be let down and still care."
          },
          {
            "id": "tp4-1-2",
            "text": "Tell yourself it is not fair and the teacher chose badly.",
            "type": "plausible_incomplete",
            "feedback": "It is easy to feel that way. But you do not know the teacher's reasons."
          },
          {
            "id": "tp4-1-3",
            "text": "Tell yourself you are fine and it does not bother you.",
            "type": "plausible_incomplete",
            "feedback": "Saying you are fine feels safe, but hidden feelings pop out later."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "If you keep the feeling inside, what might happen?",
        "choices": [
          {
            "id": "tp4-2-1",
            "text": "You may pull away from Zoe and enjoy rehearsals less.",
            "type": "responsible",
            "feedback": "Yes. Hidden feelings can grow into distance between friends."
          },
          {
            "id": "tp4-2-2",
            "text": "It fades by the first rehearsal, so nothing else is needed.",
            "type": "plausible_incomplete",
            "feedback": "It might. If not, you may have pulled away without meaning to."
          },
          {
            "id": "tp4-2-3",
            "text": "Zoe notices you are upset and gives you a bigger part.",
            "type": "plausible_incomplete",
            "feedback": "Zoe cannot change the parts. Telling her how you feel is fairer."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "What could you do about this?",
        "choices": [
          {
            "id": "tp4-3-1",
            "text": "Say congratulations to Zoe, then work hard on your own part.",
            "type": "responsible",
            "feedback": "You keep the friendship and give yourself something good to work on."
          },
          {
            "id": "tp4-3-2",
            "text": "Ask Zoe to turn down the lead so you can have it.",
            "type": "plausible_incomplete",
            "feedback": "Being honest is good. Asking Zoe to give up her part is not fair."
          },
          {
            "id": "tp4-3-3",
            "text": "Keep away from Zoe at rehearsals until your feelings settle down.",
            "type": "plausible_incomplete",
            "feedback": "A little space can help for a day. Too much can become a lasting gap."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "What is the best next step right now?",
        "choices": [
          {
            "id": "tp4-4-1",
            "text": "Tell Zoe congratulations and do your best with your own part.",
            "type": "responsible",
            "feedback": "That shows kindness and gives you a clear job. Friends remember who cheered for them."
          },
          {
            "id": "tp4-4-2",
            "text": "Tell a trusted friend how you feel, then talk to Zoe later.",
            "type": "multiple_defensible",
            "feedback": "Talking first helps you speak calmly. Just be sure to talk to Zoe too."
          },
          {
            "id": "tp4-4-3",
            "text": "Tell others Zoe only got the lead as the teacher's favorite.",
            "type": "unsafe",
            "feedback": "Spreading that could hurt Zoe and make rehearsals tense for everyone."
          },
          {
            "id": "tp4-4-4",
            "text": "Ask the teacher how to earn a bigger part next time.",
            "type": "seek_help",
            "feedback": "This turns disappointment into a plan. Teachers usually like being asked."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "How can you keep jealousy from hurting a friendship?",
        "freeReflection": true
      }
    ] }
  ];

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'branchingScenario',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'team-pick-left-out',
    header: {
      icon: '🙋',
      title: 'Team Pick',
      description: 'Work through how it feels to be picked last, and what to do about it.',
    },
  });
</script>
</body>
</html>
