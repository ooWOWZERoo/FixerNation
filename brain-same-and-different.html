<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/api/settings/favicon?size=32">
<link rel="icon" type="image/png" sizes="16x16" href="/api/settings/favicon?size=16">
<link rel="apple-touch-icon" href="/api/settings/favicon?size=180">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Same and Different</title>
<link rel="stylesheet" href="fonts.css?v=1">
<link rel="stylesheet" href="brain-games.css?v=7">
</head>
<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=20"></script>
<script src="site-auth.js?v=11"></script>
<script src="footer.js?v=16"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js?v=3"></script>
<script src="engine-sdk.js?v=5"></script>
<script src="engine-audio-choice.js?v=4"></script>
<script>
  // Same and Different - Tune Your Brain (Discover band, grades K-2). Same Audio
  // Choice engine as Sharing Circle: a short scene is read aloud, the child taps
  // one of three picture choices, and a spoken line explains each choice. Three
  // kinds of round, four of each: what is the same, what is different, and what
  // is a kind choice. Practises NY SEL 2B (similarities and differences), with 2A
  // supporting. Design and approved outline:
  // docs/tune-your-brain/NEW_GAMES_FOR_GAPS.md and SAME_AND_DIFFERENT_OUTLINE.md.
  // A pool of 12 rounds; 4 are drawn per run and the picture choices are shuffled.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'discover';

  const contentPack = {
    "title": "Same and Different",
    "roundsPerRun": 4,
    "items": [
      {
        "stimulusType": "audio",
        "stimulusText": "Ana loves soccer. She has a dog. Ben loves drawing. He has a dog too. What is the same?",
        "transcript": "Ana loves soccer. She has a dog. Ben loves drawing. He has a dog too. What is the same?",
        "choices": [
          {
            "id": "dog",
            "label": "🐕",
            "aria": "a dog",
            "feedback": "Yes! Ana and Ben both have a dog.",
            "caption": "A dog"
          },
          {
            "id": "soccer",
            "label": "⚽",
            "aria": "soccer",
            "feedback": "Ana loves soccer, but Ben loves drawing. Look for something they both have.",
            "caption": "Soccer"
          },
          {
            "id": "drawing",
            "label": "🎨",
            "aria": "drawing",
            "feedback": "Ben loves drawing, but Ana loves soccer. Look for something they both have.",
            "caption": "Drawing"
          }
        ],
        "correctId": "dog",
        "explanation": "Friends are the same in some ways and different in others. Both are okay."
      },
      {
        "stimulusType": "audio",
        "stimulusText": "Mia wears glasses. Leo does not. They both like red. What is different?",
        "transcript": "Mia wears glasses. Leo does not. They both like red. What is different?",
        "choices": [
          {
            "id": "glasses",
            "label": "👓",
            "aria": "glasses",
            "feedback": "Yes! Mia wears glasses and Leo does not.",
            "caption": "Glasses"
          },
          {
            "id": "red",
            "label": "❤️",
            "aria": "red",
            "feedback": "They both like red, so that is the same. Look for something different.",
            "caption": "Red"
          },
          {
            "id": "class",
            "label": "🏫",
            "aria": "same class",
            "feedback": "They are in the same class, so that is the same too.",
            "caption": "Same class"
          }
        ],
        "correctId": "glasses",
        "explanation": "Glasses help Mia see. Being different is okay, and friends can still play together."
      },
      {
        "stimulusType": "audio",
        "stimulusText": "Kofi eats rice. Lena eats a sandwich. They both have a little sister. What is the same?",
        "transcript": "Kofi eats rice. Lena eats a sandwich. They both have a little sister. What is the same?",
        "choices": [
          {
            "id": "sister",
            "label": "👧",
            "aria": "little sister",
            "feedback": "Yes! Kofi and Lena both have a little sister.",
            "caption": "Little sister"
          },
          {
            "id": "rice",
            "label": "🍚",
            "aria": "eating rice",
            "feedback": "Kofi eats rice, but Lena eats a sandwich. Look for something they both have.",
            "caption": "Eating rice"
          },
          {
            "id": "sandwich",
            "label": "🥪",
            "aria": "sandwiches",
            "feedback": "Lena eats a sandwich, but Kofi eats rice. Look for something they both have.",
            "caption": "Sandwiches"
          }
        ],
        "correctId": "sister",
        "explanation": "Their lunches are different, and having a little sister is the same."
      },
      {
        "stimulusType": "audio",
        "stimulusText": "Sam is new. He speaks Spanish at home. Ana wants to play with him. What could Ana do?",
        "transcript": "Sam is new. He speaks Spanish at home. Ana wants to play with him. What could Ana do?",
        "choices": [
          {
            "id": "teach",
            "label": "🗣️",
            "aria": "ask for a word",
            "feedback": "Yes! Asking Sam to teach you a word is kind, and you learn something too.",
            "caption": "Ask for a word"
          },
          {
            "id": "wait",
            "label": "⏳",
            "aria": "wait and see",
            "feedback": "If you wait, Sam plays alone. You can play together right now.",
            "caption": "Wait and see"
          },
          {
            "id": "skip",
            "label": "🙈",
            "aria": "play without him",
            "feedback": "That leaves Sam out. Asking him to join is kinder.",
            "caption": "Play without him"
          }
        ],
        "correctId": "teach",
        "explanation": "You can play with a friend who speaks another language. You learn words from each other."
      },
      {
        "stimulusType": "audio",
        "stimulusText": "Nina has noodles. Omar has bread and cheese. They sit at the same table. What is different?",
        "transcript": "Nina has noodles. Omar has bread and cheese. They sit at the same table. What is different?",
        "choices": [
          {
            "id": "lunch",
            "label": "🍜",
            "aria": "their lunches",
            "feedback": "Yes! Nina has noodles, and Omar has bread and cheese.",
            "caption": "Their lunches"
          },
          {
            "id": "hungry",
            "label": "😋",
            "aria": "being hungry",
            "feedback": "They are both hungry, so that is the same.",
            "caption": "Being hungry"
          },
          {
            "id": "table",
            "label": "🪑",
            "aria": "the same table",
            "feedback": "They sit at the same table, so that is the same.",
            "caption": "The same table"
          }
        ],
        "correctId": "lunch",
        "explanation": "People eat different foods, and that is okay. You can still share a table."
      },
      {
        "stimulusType": "audio",
        "stimulusText": "Leo uses a wheelchair. His class plays tag. What could the class do?",
        "transcript": "Leo uses a wheelchair. His class plays tag. What could the class do?",
        "choices": [
          {
            "id": "change",
            "label": "🔁",
            "aria": "change the game",
            "feedback": "Yes! The class can change the rules so everybody can play.",
            "caption": "Change the game"
          },
          {
            "id": "watch",
            "label": "👀",
            "aria": "let leo watch",
            "feedback": "Watching leaves Leo out. He wants to play too.",
            "caption": "Let Leo watch"
          },
          {
            "id": "same",
            "label": "🏃",
            "aria": "play as usual",
            "feedback": "If the game stays the same, Leo cannot join. Change it so all can play.",
            "caption": "Play as usual"
          }
        ],
        "correctId": "change",
        "explanation": "Games can change so that everyone can play. Everybody belongs."
      },
      {
        "stimulusType": "audio",
        "stimulusText": "Zuri has braids. Eli has short hair. They both love to dance. What is the same?",
        "transcript": "Zuri has braids. Eli has short hair. They both love to dance. What is the same?",
        "choices": [
          {
            "id": "dance",
            "label": "💃",
            "aria": "dancing",
            "feedback": "Yes! Zuri and Eli both love to dance.",
            "caption": "Dancing"
          },
          {
            "id": "braids",
            "label": "💇",
            "aria": "braids",
            "feedback": "Zuri has braids, but Eli has short hair. Look for something they both have.",
            "caption": "Braids"
          },
          {
            "id": "short",
            "label": "✂️",
            "aria": "short hair",
            "feedback": "Eli has short hair, but Zuri has braids. Look for something they both have.",
            "caption": "Short hair"
          }
        ],
        "correctId": "dance",
        "explanation": "Hair can look different, and friends can love the same things."
      },
      {
        "stimulusType": "audio",
        "stimulusText": "Priya lives with her grandma and dad. Tom lives with his two moms. Both have people who love them. What is different?",
        "transcript": "Priya lives with her grandma and dad. Tom lives with his two moms. Both have people who love them. What is different?",
        "choices": [
          {
            "id": "live",
            "label": "🏠",
            "aria": "who they live with",
            "feedback": "Yes! Priya and Tom live with different people.",
            "caption": "Who they live with"
          },
          {
            "id": "love",
            "label": "🤗",
            "aria": "people who love them",
            "feedback": "They both have people who love them, so that is the same.",
            "caption": "People who love them"
          },
          {
            "id": "family",
            "label": "👪",
            "aria": "having a family",
            "feedback": "They both have a family, so that is the same.",
            "caption": "Having a family"
          }
        ],
        "correctId": "live",
        "explanation": "Families look different from each other. Every family can love a child."
      },
      {
        "stimulusType": "audio",
        "stimulusText": "Ben likes quiet games. Ana likes loud, running games. Ana wants to play with Ben. What could Ana do?",
        "transcript": "Ben likes quiet games. Ana likes loud, running games. Ana wants to play with Ben. What could Ana do?",
        "choices": [
          {
            "id": "quiet",
            "label": "🧩",
            "aria": "a quiet game",
            "feedback": "Yes! Asking Ben what he likes shows that you care.",
            "caption": "A quiet game"
          },
          {
            "id": "louder",
            "label": "📢",
            "aria": "be much louder",
            "feedback": "Ben likes quiet games. He does not have to change.",
            "caption": "Be much louder"
          },
          {
            "id": "alone",
            "label": "🏃",
            "aria": "play loud alone",
            "feedback": "Then Ana plays alone, and Ben is left out. You can play together.",
            "caption": "Play loud alone"
          }
        ],
        "correctId": "quiet",
        "explanation": "Friends can try one game they like, then one the other likes."
      },
      {
        "stimulusType": "audio",
        "stimulusText": "Hana grew up in a big city. Raul grew up in a small town. Both feel nervous on the first day. What is the same?",
        "transcript": "Hana grew up in a big city. Raul grew up in a small town. Both feel nervous on the first day. What is the same?",
        "choices": [
          {
            "id": "nervous",
            "label": "😟",
            "aria": "feeling nervous",
            "feedback": "Yes! They both feel nervous. Lots of kids do on the first day.",
            "caption": "Feeling nervous"
          },
          {
            "id": "city",
            "label": "🌆",
            "aria": "grew up in a city",
            "feedback": "Hana grew up in a city, but Raul grew up in a town.",
            "caption": "Big city"
          },
          {
            "id": "town",
            "label": "🏡",
            "aria": "grew up in a town",
            "feedback": "Raul grew up in a town, but Hana grew up in a city.",
            "caption": "Small town"
          }
        ],
        "correctId": "nervous",
        "explanation": "Feelings can be the same even when the places are different."
      },
      {
        "stimulusType": "audio",
        "stimulusText": "Ada's family puts candles on a cake. Jin's family eats long noodles. Both have a birthday and a treat. What is different?",
        "transcript": "Ada's family puts candles on a cake. Jin's family eats long noodles. Both have a birthday and a treat. What is different?",
        "choices": [
          {
            "id": "celebrate",
            "label": "🎂",
            "aria": "candles or noodles",
            "feedback": "Yes! Ada has candles, and Jin has long noodles.",
            "caption": "Candles or noodles"
          },
          {
            "id": "birthday",
            "label": "🎉",
            "aria": "having a birthday",
            "feedback": "They both have a birthday, so that is the same.",
            "caption": "Having a birthday"
          },
          {
            "id": "treat",
            "label": "🍬",
            "aria": "getting a special treat",
            "feedback": "They both get a special treat, so that is the same.",
            "caption": "A special treat"
          }
        ],
        "correctId": "celebrate",
        "explanation": "Families celebrate in different ways, and every way is special."
      },
      {
        "stimulusType": "audio",
        "stimulusText": "Maya wants blocks. Dev wants tag. They want to play together. What is a kind way to decide?",
        "transcript": "Maya wants blocks. Dev wants tag. They want to play together. What is a kind way to decide?",
        "choices": [
          {
            "id": "turns",
            "label": "🔄",
            "aria": "take turns",
            "feedback": "Yes! Taking turns means both friends get a game they like.",
            "caption": "Take turns"
          },
          {
            "id": "pick",
            "label": "👆",
            "aria": "pick your favorite",
            "feedback": "Then Dev does not get a turn. Taking turns is fairer.",
            "caption": "Pick your favorite"
          },
          {
            "id": "stop",
            "label": "🛑",
            "aria": "stop playing",
            "feedback": "Then nobody gets to play. Taking turns is better.",
            "caption": "Stop playing"
          }
        ],
        "correctId": "turns",
        "explanation": "Taking turns is a kind way to play when friends like different things."
      }
    ]
  };

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'audioChoice',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'same-and-different-2b',
    header: {
      icon: '🤝',
      title: 'Same and Different',
      description: 'Listen to the story. Tap your answer.',
    },
  });
</script>
</body>
</html>
