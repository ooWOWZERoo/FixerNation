<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/api/settings/favicon?size=32">
<link rel="icon" type="image/png" sizes="16x16" href="/api/settings/favicon?size=16">
<link rel="apple-touch-icon" href="/api/settings/favicon?size=180">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Animal Match</title>
<link rel="stylesheet" href="fonts.css?v=1">
<link rel="stylesheet" href="brain-games.css?v=7">
</head>
<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=21"></script>
<script src="site-auth.js?v=12"></script>
<script src="footer.js?v=18"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js?v=3"></script>
<script src="engine-sdk.js?v=6"></script>
<script src="engine-memory.js"></script>
<script>
  // Animal Match - Tune Your Brain (discover band). GENERATED by server/scripts/build-core-games.js: change the content there, not here.
  // Engine: Memory. Focus: thinking. Release 141.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'discover';

  const contentPack = {
    "title": "Animal Match",
    "items": [
      {
        "id": "cat",
        "display": "🐱"
      },
      {
        "id": "dog",
        "display": "🐶"
      },
      {
        "id": "rabbit",
        "display": "🐰"
      },
      {
        "id": "frog",
        "display": "🐸"
      },
      {
        "id": "lion",
        "display": "🦁"
      },
      {
        "id": "pig",
        "display": "🐷"
      },
      {
        "id": "cow",
        "display": "🐮"
      },
      {
        "id": "duck",
        "display": "🦆"
      }
    ],
    "pairCount": 4
  };

  // Animal Match: ?pairs=3, 4 or 6 sets the number of pairs (4 by default). No clock and no score to beat.
  const wantPairs = Number(params.get('pairs'));
  if ([3, 4, 6].includes(wantPairs)) contentPack.pairCount = wantPairs;

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'memory',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'animal-match-pairs',
    header: {
      icon: '🐱',
      title: 'Animal Match',
      description: 'Flip the cards. Find the pairs.',
    },
  });
</script>
<script src="game-backlink.js?v=1" defer></script>
</body>
</html>
