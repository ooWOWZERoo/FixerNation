<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Money Moves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="brain-games.css?v=5">
</head>
<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=16"></script>
<script src="site-auth.js?v=10"></script>
<script src="footer.js?v=9"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js"></script>
<script src="engine-sdk.js?v=4"></script>
<script src="engine-simulation.js?v=3"></script>
<script>
  // Money Moves (Challenge band, grades 6-8). Reworked 2026-11-01 (docs/reference/OWNER_DECISIONS_RECOMMENDATIONS.md):
  // a pool of 14 events with 6 drawn per run, percent and arithmetic in the choices (discounts, sales tax, a savings match,
  // a loan with 10 percent extra), needs versus wants, and an ending that uses BOTH counters, with several good endings.
  // `floor: 0` means a choice you cannot afford is shown but cannot be picked. Every event has a free option, so a run can
  // never get stuck. Fictional person and amounts; not financial advice.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'challenge';

  const contentPack = {
    title: 'Money Moves',
    goal: 'Your goal this season is to build your bike fund from $20 to $60 while keeping at least $10 of spending money.',
    startingResources: { Savings: 20, 'Spending Money': 20 },
    floor: 0,
    roundsPerRun: 6,
    events: [
      {
        "prompt": "Your $40 allowance arrives. The 10 percent rule says to save 10 percent first, which is $4. What do you do?",
        "options": [
          {
            "id": "rule",
            "label": "Save $4 (10 percent) and keep $36 to spend.",
            "delta": {
              "Savings": 4,
              "Spending Money": 36
            }
          },
          {
            "id": "half",
            "label": "Save half, $20, and keep $20 to spend.",
            "delta": {
              "Savings": 20,
              "Spending Money": 20
            }
          },
          {
            "id": "all",
            "label": "Save all $40.",
            "delta": {
              "Savings": 40
            }
          }
        ]
      },
      {
        "prompt": "A $32 helmet is 25 percent off at the bike shop, so it costs $24. Your old helmet still fits.",
        "options": [
          {
            "id": "helmet-spend",
            "label": "Buy the new helmet with spending money ($24).",
            "delta": {
              "Spending Money": -24
            }
          },
          {
            "id": "keep-old",
            "label": "Keep your old helmet and skip the sale.",
            "delta": {}
          },
          {
            "id": "helmet-save",
            "label": "Buy the new helmet with savings ($24).",
            "delta": {
              "Savings": -24
            }
          }
        ]
      },
      {
        "prompt": "Two shops sell the same $40 sneakers. Shop A takes 25 percent off, so they cost $30. Shop B takes $8 off, so they cost $32. Your sneakers are worn out.",
        "options": [
          {
            "id": "shop-a",
            "label": "Buy at Shop A for $30.",
            "delta": {
              "Spending Money": -30
            }
          },
          {
            "id": "shop-b",
            "label": "Buy at Shop B for $32.",
            "delta": {
              "Spending Money": -32
            }
          },
          {
            "id": "used",
            "label": "Buy a used pair for $12.",
            "delta": {
              "Spending Money": -12
            }
          },
          {
            "id": "wait-shoes",
            "label": "Keep wearing your old pair for now.",
            "delta": {}
          }
        ]
      },
      {
        "prompt": "A $25 game has 8 percent sales tax, so you would pay $27 at the register.",
        "options": [
          {
            "id": "game",
            "label": "Buy the game ($27).",
            "delta": {
              "Spending Money": -27
            }
          },
          {
            "id": "wait-game",
            "label": "Wait a month and decide then.",
            "delta": {}
          },
          {
            "id": "gift",
            "label": "Ask for it as a birthday present.",
            "delta": {}
          }
        ]
      },
      {
        "prompt": "Your family will add 10 percent to whatever you move into savings this month. If you move $20, they add $2.",
        "options": [
          {
            "id": "match20",
            "label": "Move $20 into savings and get $22 there.",
            "delta": {
              "Savings": 22,
              "Spending Money": -20
            }
          },
          {
            "id": "match10",
            "label": "Move $10 into savings and get $11 there.",
            "delta": {
              "Savings": 11,
              "Spending Money": -10
            }
          },
          {
            "id": "no-match",
            "label": "Skip it this month.",
            "delta": {}
          }
        ]
      },
      {
        "prompt": "Your bike tire goes flat. A repair costs $12.",
        "options": [
          {
            "id": "repair-spend",
            "label": "Pay from spending money.",
            "delta": {
              "Spending Money": -12
            }
          },
          {
            "id": "repair-save",
            "label": "Pay from savings.",
            "delta": {
              "Savings": -12
            }
          },
          {
            "id": "repair-chores",
            "label": "Do extra chores to earn the $12, then pay it.",
            "delta": {}
          }
        ]
      },
      {
        "prompt": "Your class is collecting $5 each for a teacher's gift.",
        "options": [
          {
            "id": "chip-in",
            "label": "Chip in $5.",
            "delta": {
              "Spending Money": -5
            }
          },
          {
            "id": "card",
            "label": "Make a card instead, with about $1 of supplies.",
            "delta": {
              "Spending Money": -1
            }
          },
          {
            "id": "skip-gift",
            "label": "Skip it this time.",
            "delta": {}
          }
        ]
      },
      {
        "prompt": "A game app costs $4 a month. You played it twice this month.",
        "options": [
          {
            "id": "keep-app",
            "label": "Keep it for another month.",
            "delta": {
              "Spending Money": -4
            }
          },
          {
            "id": "cancel",
            "label": "Cancel it.",
            "delta": {}
          },
          {
            "id": "cancel-save",
            "label": "Cancel it and move the $4 into savings.",
            "delta": {
              "Savings": 4,
              "Spending Money": -4
            }
          }
        ]
      },
      {
        "prompt": "Your lunch box broke. A plain one costs $10. A cartoon one costs $18.",
        "options": [
          {
            "id": "plain",
            "label": "Buy the plain one ($10).",
            "delta": {
              "Spending Money": -10
            }
          },
          {
            "id": "cartoon",
            "label": "Buy the cartoon one ($18).",
            "delta": {
              "Spending Money": -18
            }
          },
          {
            "id": "paper-bag",
            "label": "Use a paper bag for now.",
            "delta": {}
          }
        ]
      },
      {
        "prompt": "A neighbor pays you $30 for raking leaves.",
        "options": [
          {
            "id": "rake-save",
            "label": "Save all $30.",
            "delta": {
              "Savings": 30
            }
          },
          {
            "id": "rake-split",
            "label": "Save $20 and keep $10 to spend.",
            "delta": {
              "Savings": 20,
              "Spending Money": 10
            }
          },
          {
            "id": "rake-spend",
            "label": "Keep all $30 to spend.",
            "delta": {
              "Spending Money": 30
            }
          }
        ]
      },
      {
        "prompt": "A $20 toy is 30 percent off, so it costs $14. It was not on your list.",
        "options": [
          {
            "id": "toy",
            "label": "Buy it ($14).",
            "delta": {
              "Spending Money": -14
            }
          },
          {
            "id": "toy-save",
            "label": "Skip it and move the $14 you would have spent into savings.",
            "delta": {
              "Savings": 14,
              "Spending Money": -14
            }
          },
          {
            "id": "toy-wait",
            "label": "Wait a week and see if you still want it.",
            "delta": {}
          }
        ]
      },
      {
        "prompt": "School lunch costs $4 a day. Packing lunch from home costs about $2. That is a school week of 5 days.",
        "options": [
          {
            "id": "pack5",
            "label": "Pack lunch all week and save the $10 difference.",
            "delta": {
              "Savings": 10
            }
          },
          {
            "id": "pack3",
            "label": "Pack three days and buy two, saving $6.",
            "delta": {
              "Savings": 6
            }
          },
          {
            "id": "buy5",
            "label": "Buy lunch every day.",
            "delta": {}
          }
        ]
      },
      {
        "prompt": "You sell old toys and books at a garage sale and earn $15.",
        "options": [
          {
            "id": "sale-save",
            "label": "Save it all.",
            "delta": {
              "Savings": 15
            }
          },
          {
            "id": "sale-split",
            "label": "Save $8 and keep $7 to spend.",
            "delta": {
              "Savings": 8,
              "Spending Money": 7
            }
          },
          {
            "id": "sale-spend",
            "label": "Keep it all to spend.",
            "delta": {
              "Spending Money": 15
            }
          }
        ]
      },
      {
        "prompt": "A cousin offers to lend you $20 today if you pay back 10 percent extra later, which is $22.",
        "options": [
          {
            "id": "borrow20",
            "label": "Borrow $20 now and pay back $22 from savings.",
            "delta": {
              "Spending Money": 20,
              "Savings": -22
            }
          },
          {
            "id": "borrow10",
            "label": "Borrow $10 now and pay back $11 from savings.",
            "delta": {
              "Spending Money": 10,
              "Savings": -11
            }
          },
          {
            "id": "no-borrow",
            "label": "Do not borrow.",
            "delta": {}
          }
        ]
      }
    ],
    debrief(final) {
      const GOAL = 60, MIN_FUN = 10;
      const saved = final.Savings, fun = final['Spending Money'];
      const tally = ' You finished with $' + saved + ' in your bike fund and $' + fun + ' to spend.';
      if (saved >= GOAL && fun >= MIN_FUN) return 'You reached your goal and still have money to enjoy.' + tally + ' There is more than one way to get there, and you found one.';
      if (saved >= GOAL) return 'You reached your goal, and spending money got tight along the way.' + tally + ' That is a real tradeoff, and some people would choose it on purpose.';
      if (saved >= GOAL * 2 / 3) return 'You are close to your goal.' + tally + ' A little more saving next season would get you there.';
      if (fun >= 30) return 'You kept plenty to spend and built a smaller bike fund.' + tally + ' If the bike matters most, try moving a bit more to savings next time.';
      return 'You are off to a slow start, and that is normal for a first season.' + tally + ' Try a different mix and see how it changes.';
    },
  };

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'simulation',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'money-moves-savings-goal',
    header: {
      icon: '🚲',
      title: 'Money Moves',
      description: 'Manage your allowance and odd-job money toward a savings goal. Every run brings different choices, and there is more than one way to do it well.',
    },
  });
</script>
</body>
</html>
