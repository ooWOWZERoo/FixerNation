<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Fixer Nation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --cream:#FBF5EC; --teal:#164F4A; --teal-dark:#0E3733;
    --coral:#F26B4D; --coral-dark:#D9502F; --gold:#EBA657; --ink:#2A2420; --ink-soft:#6B5F55;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Plus Jakarta Sans', sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  h1{font-family:'Fraunces', serif; color:var(--teal-dark); font-size:26px; margin-bottom:8px;}
  a{color:var(--teal-dark);}
  .card{background:#fff; border-radius:22px; box-shadow:0 20px 45px -18px rgba(22,79,74,0.28); padding:38px; max-width:420px; width:100%;}
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:24px;}
  .brand-mark{width:38px; height:38px; border-radius:12px; background:linear-gradient(135deg, var(--coral), var(--gold)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800;}
  .brand-word{font-family:'Fraunces',serif; font-weight:700; font-size:18px; color:var(--teal-dark);}
  p.sub{font-size:14px; color:var(--ink-soft); margin-bottom:22px;}
  label{display:block; font-size:12px; font-weight:700; margin-bottom:6px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.03em;}
  input{width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(22,79,74,0.15); font-size:14px; margin-bottom:16px; font-family:inherit;}
  button{width:100%; padding:13px; border-radius:999px; border:none; background:var(--coral); color:#fff; font-weight:700; font-size:14.5px; cursor:pointer;}
  button:hover{background:var(--coral-dark);}
  .message{display:none; font-size:13px; font-weight:600; padding:10px 14px; border-radius:10px; margin-bottom:16px;}
  .back-link{display:block; text-align:center; margin-top:18px; font-size:13.5px; font-weight:600;}
</style>
</head>
<body>

<div class="card">
  <div class="brand"><div class="brand-mark">FN</div><div class="brand-word">Fixer Nation</div></div>
  <h1>Reset Your Password</h1>
  <p class="sub">Choose a new password for your account.</p>

  <div class="message" id="message"></div>

  <form id="resetForm">
    <label>New Password</label>
    <input type="password" id="newPassword" required minlength="8">
    <label>Confirm New Password</label>
    <input type="password" id="confirmPassword" required minlength="8">
    <button type="submit">Update Password</button>
  </form>

  <a href="index.html" class="back-link">← Back to Fixer Nation</a>
</div>

<script src="admin-common.js?v=13"></script>
<script>fnTrackPageview();</script>
<script>
function showMessage(text, kind) {
  const box = document.getElementById('message');
  box.textContent = text;
  box.style.display = 'block';
  box.style.background = kind === 'error' ? '#FDECEA' : '#E4F3EE';
  box.style.color = kind === 'error' ? '#B3261E' : '#164F4A';
}

const token = new URLSearchParams(window.location.search).get('token');
if (!token) {
  showMessage('This reset link is missing its token. Please use the link from your email.', 'error');
  document.getElementById('resetForm').style.display = 'none';
}

document.getElementById('resetForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (newPassword !== confirmPassword) {
    showMessage('Passwords do not match.', 'error');
    return;
  }

  const r = await fetch('/api/site-auth/reset-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, newPassword }),
  });
  const result = await r.json().catch(() => ({}));
  if (!r.ok) {
    showMessage(result.error || 'Could not reset your password.', 'error');
    return;
  }
  document.getElementById('resetForm').style.display = 'none';
  showMessage('Your password has been updated. You can now log in from the homepage.', 'success');
});
</script>

</body>
</html>
