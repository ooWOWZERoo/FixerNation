<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Sharing Circle</title>
<link rel="stylesheet" href="fonts.css?v=1">
<link rel="stylesheet" href="brain-games.css?v=7">
</head>
<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=17"></script>
<script src="site-auth.js?v=11"></script>
<script src="footer.js?v=11"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js?v=3"></script>
<script src="engine-sdk.js?v=5"></script>
<script src="engine-audio-choice.js?v=4"></script>
<script>
  // Sharing Circle - Tune Your Brain SEL scaling slice (Discover band).
  // Targets Social awareness and Relationship skills - both had ZERO
  // Discover-band coverage before this (Discover only had Self-awareness
  // via Feelings Detective and Self-management via Calm Down Corner - see
  // the corrected CASEL x band matrix, 2026-09-21, in
  // docs/tune-your-brain/GAP_ANALYSIS_2026-09-17.md). Uses
  // engine-audio-choice.js, same as Calm Down Corner, since Discover
  // requires no reading and spoken support (section 7.2) - Branching
  // Scenario's text-only cycle doesn't fit this band.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'discover';

  const contentPack = {
    title: 'Sharing Circle',
    items: [
      {
        stimulusType: 'audio',
        stimulusText: "A friend lost a toy. They are sad. What is kind?",
        transcript: "A friend lost a toy. They are sad. What is kind?",
        choices: [
          { id: "comfort", label: "🤗", caption: "Help look", aria: "ask if they are okay and help look" },
          { id: "walk-away", label: "🚶", caption: "Walk away", aria: "walk away" },
          { id: "laugh", label: "😂", caption: "Laugh", aria: "laugh" },
        ],
        correctId: "comfort",
      },
      {
        stimulusType: 'audio',
        stimulusText: "A new kid stands alone. Your friends are playing. What is kind?",
        transcript: "A new kid stands alone. Your friends are playing. What is kind?",
        choices: [
          { id: "invite", label: "🙋", caption: "Invite them", aria: "invite them to play" },
          { id: "ignore", label: "🙈", caption: "Ignore them", aria: "ignore them" },
          { id: "whisper", label: "🤫", caption: "Whisper", aria: "point and whisper about them" },
        ],
        correctId: "invite",
      },
      {
        stimulusType: 'audio',
        stimulusText: "Your friend dropped a tray. Kids laugh. What is kind?",
        transcript: "Your friend dropped a tray. Kids laugh. What is kind?",
        choices: [
          { id: "help", label: "🤝", caption: "Help pick up", aria: "help pick it up" },
          { id: "laugh-too", label: "😂", caption: "Laugh too", aria: "laugh too" },
          { id: "walk-away", label: "🚶", caption: "Walk away", aria: "walk away" },
        ],
        correctId: "help",
      },
      {
        stimulusType: 'audio',
        stimulusText: "Your little brother is scared of the storm. What is kind?",
        transcript: "Your little brother is scared of the storm. What is kind?",
        choices: [
          { id: "comfort", label: "🫂", caption: "Sit with him", aria: "sit with him and comfort him" },
          { id: "ignore", label: "📵", caption: "Keep playing", aria: "ignore him and keep playing" },
          { id: "dismiss", label: "😤", caption: "Say \"Stop it\"", aria: "tell him to stop being scared" },
        ],
        correctId: "comfort",
      },
    ],
  };

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'audioChoice',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'sharing-circle-kindness',
    header: {
      icon: '🤗',
      title: 'Sharing Circle',
      description: 'Listen. Pick the kind thing.',
    },
  });
</script>
</body>
</html>
