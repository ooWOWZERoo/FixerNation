<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Sharing Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="brain-games.css?v=1">
</head>
<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="nav.js?v=15"></script>
<script src="site-auth.js?v=6"></script>
<script src="footer.js?v=3"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js"></script>
<script src="engine-sdk.js"></script>
<script src="engine-audio-choice.js"></script>
<script>
  // Sharing Circle - Tune Your Brain SEL scaling slice (Discover band).
  // Targets Social awareness and Relationship skills - both had ZERO
  // Discover-band coverage before this (Discover only had Self-awareness
  // via Feelings Detective and Self-management via Calm Down Corner - see
  // the corrected CASEL x band matrix, 2026-09-21, in
  // docs/tune-your-brain/GAP_ANALYSIS_2026-09-17.md). Uses
  // engine-audio-choice.js, same as Calm Down Corner, since Discover
  // requires no reading and spoken support (section 7.2) - Branching
  // Scenario's text-only cycle doesn't fit this band.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'discover';

  const contentPack = {
    title: 'Sharing Circle',
    items: [
      {
        stimulusType: 'audio',
        stimulusText: 'A classmate is crying because they lost their favorite toy at recess.',
        transcript: 'A classmate is crying because they lost their favorite toy at recess. What is a kind thing to do?',
        choices: [
          { id: 'comfort', label: '🤗', aria: 'ask if they are okay and help look' },
          { id: 'walk-away', label: '🚶', aria: 'walk away' },
          { id: 'laugh', label: '😂', aria: 'laugh' },
        ],
        correctId: 'comfort',
      },
      {
        stimulusType: 'audio',
        stimulusText: 'Your friend group is playing a game, and a new kid is standing alone watching.',
        transcript: 'Your friend group is playing a game, and a new kid is standing alone watching. What is a kind thing to do?',
        choices: [
          { id: 'invite', label: '🙋', aria: 'invite them to play' },
          { id: 'ignore', label: '🙈', aria: 'ignore them' },
          { id: 'whisper', label: '🤫', aria: 'point and whisper about them' },
        ],
        correctId: 'invite',
      },
      {
        stimulusType: 'audio',
        stimulusText: 'Your friend trips and drops their lunch tray, and other kids start laughing.',
        transcript: 'Your friend trips and drops their lunch tray, and other kids start laughing. What is a kind thing to do?',
        choices: [
          { id: 'help', label: '🤝', aria: 'help pick it up' },
          { id: 'laugh-too', label: '😂', aria: 'laugh too' },
          { id: 'walk-away', label: '🚶', aria: 'walk away' },
        ],
        correctId: 'help',
      },
      {
        stimulusType: 'audio',
        stimulusText: 'Your little brother is scared of the thunderstorm outside.',
        transcript: 'Your little brother is scared of the thunderstorm outside. What is a kind thing to do?',
        choices: [
          { id: 'comfort', label: '🫂', aria: 'sit with him and comfort him' },
          { id: 'ignore', label: '📵', aria: 'ignore him and keep playing' },
          { id: 'dismiss', label: '😤', aria: 'tell him to stop being scared' },
        ],
        correctId: 'comfort',
      },
    ],
  };

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'audioChoice',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'sharing-circle-kindness',
    header: {
      icon: '🤗',
      title: 'Sharing Circle',
      description: 'Listen to what happened, then pick the kind thing to do.',
    },
  });
</script>
</body>
</html>
