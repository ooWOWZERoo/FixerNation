<script>
  // Sharing Circle - Tune Your Brain SEL scaling slice (Discover band).
  // Targets Social awareness and Relationship skills - both had ZERO
  // Discover-band coverage before this (Discover only had Self-awareness
  // via Feelings Detective and Self-management via Calm Down Corner - see
  // the corrected CASEL x band matrix, 2026-09-21, in
  // docs/tune-your-brain/GAP_ANALYSIS_2026-09-17.md). Uses
  // engine-audio-choice.js, same as Calm Down Corner, since Discover
  // requires no reading and spoken support (section 7.2) - Branching
  // Scenario's text-only cycle doesn't fit this band.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'discover';

  const contentPack = {
    title: 'Sharing Circle',
    roundsPerRun: 5,
    items: [
      {
        stimulusType: 'audio',
        stimulusText: "A friend lost a toy. They are sad. What is kind?",
        transcript: "A friend lost a toy. They are sad. What is kind?",
        choices: [
          { id: "help-look", label: "🤗", caption: "Help look", aria: "ask if they are okay and help look", feedback: "You got it!" },
          { id: "walk-away", label: "🚶", caption: "Walk away", aria: "walk away", feedback: "Try another one." },
          { id: "laugh", label: "😂", caption: "Laugh", aria: "laugh", feedback: "Try another one." },
        ],
        correctId: "help-look",
        explanation: "Helping a sad friend look shows you care.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "A new kid stands alone. Your friends are playing. What is kind?",
        transcript: "A new kid stands alone. Your friends are playing. What is kind?",
        choices: [
          { id: "invite-them", label: "🙋", caption: "Invite them", aria: "invite them to play", feedback: "You got it!" },
          { id: "ignore-them", label: "🙈", caption: "Ignore them", aria: "ignore them", feedback: "Try another one." },
          { id: "whisper", label: "🤫", caption: "Whisper", aria: "whisper about them", feedback: "Try another one." },
        ],
        correctId: "invite-them",
        explanation: "Inviting someone in helps them feel they belong.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "Your friend dropped a tray. Kids laugh. What is kind?",
        transcript: "Your friend dropped a tray. Kids laugh. What is kind?",
        choices: [
          { id: "help-pick-up", label: "🤝", caption: "Help pick up", aria: "help pick up the food", feedback: "You got it!" },

          { id: "walk-away", label: "🚶", caption: "Walk away", aria: "walk away", feedback: "Try another one." },
        ],
        correctId: "help-pick-up",
        explanation: "Helping is kinder than laughing.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "Your little brother is scared of the storm. What is kind?",
        transcript: "Your little brother is scared of the storm. What is kind?",
        choices: [
          { id: "sit-with-him", label: "🫂", caption: "Sit with him", aria: "sit with him", feedback: "You got it!" },

          { id: "say-stop-it", label: "😤", caption: "Say \"Stop it\"", aria: "tell him to stop it", feedback: "Try another one." },
        ],
        correctId: "sit-with-him",
        explanation: "Staying close helps a scared brother feel safe.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "A friend was sick and missed school. What is kind?",
        transcript: "A friend was sick and missed school. What is kind?",
        choices: [
          { id: "make-a-card", label: "💌", caption: "Make a card", aria: "make a get well card", feedback: "You got it!" },

          { id: "share-some", label: "🖍️", caption: "Share some", aria: "share some crayons", feedback: "You got it!" },

          { id: "say-too-bad", label: "😏", caption: "Say too bad", aria: "say too bad", feedback: "Try another one." },
        ],
        correctId: "share-some",
        explanation: "Sharing helps your friend join in.",

        stimulusType: 'audio',
        stimulusText: "A kid fell off the swing. They are crying. What is kind?",

          { id: "say-it-is-boring", label: "😛", caption: "Say it is boring", aria: "say the party is boring", feedback: "Try another one." },
        ],
        correctId: "say-happy-birthday",
        explanation: "Kind words make a special day happier.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "A grandma is carrying a heavy bag. What is kind?",

          { id: "help-carry-it", label: "🛍️", caption: "Help carry it", aria: "help carry the bag", feedback: "You got it!" },
          { id: "just-watch", label: "👀", caption: "Just watch", aria: "just watch", feedback: "Try another one." },
          { id: "walk-away", label: "🚶", caption: "Walk away", aria: "walk away", feedback: "Try another one." },
        ],
        correctId: "help-carry-it",
        explanation: "Offering to help makes the load lighter.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "A kid brings a lunch you have never seen. They look shy. What is kind?",
        transcript: "A kid brings a lunch you have never seen. They look shy. What is kind?",
        choices: [
          { id: "say-something-nice", label: "😊", caption: "Say something nice", aria: "say something nice about it", feedback: "You got it!" },

      {
        stimulusType: 'audio',
        stimulusText: "A new kid does not know where to go. What is kind?",
        transcript: "A new kid does not know where to go. What is kind?",
        choices: [
          { id: "show-them-around", label: "🗺️", caption: "Show them around", aria: "show them where to go", feedback: "You got it!" },
          { id: "point-and-leave", label: "👉", caption: "Point and leave", aria: "point and walk off", feedback: "Try another one." },
          { id: "look-away", label: "🙈", caption: "Look away", aria: "look away", feedback: "Try another one." },
        ],
        correctId: "show-them-around",
        explanation: "Showing the way helps a new kid feel welcome.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "Your friend feels shy about reading out loud. What is kind?",
        transcript: "Your friend feels shy about reading out loud. What is kind?",
        choices: [
          { id: "cheer-them-on", label: "👏", caption: "Cheer them on", aria: "cheer them on", feedback: "You got it!" },
          { id: "giggle", label: "🤭", caption: "Giggle", aria: "giggle", feedback: "Try another one." },
          { id: "look-bored", label: "😴", caption: "Look bored", aria: "look bored", feedback: "Try another one." },
        ],
        correctId: "cheer-them-on",
        explanation: "Cheering gives a shy friend courage.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "You have the last cookie. Your friend has none. What is kind?",
        transcript: "You have the last cookie. Your friend has none. What is kind?",
        choices: [
          { id: "break-it-in-half", label: "✂️", caption: "Break it in half", aria: "break it in half to share", feedback: "You got it!" },
          { id: "eat-it-fast", label: "😋", caption: "Eat it fast", aria: "eat it fast", feedback: "Try another one." },
          { id: "hide-it", label: "🙈", caption: "Hide it", aria: "hide the cookie", feedback: "Try another one." },
        ],
        correctId: "break-it-in-half",
        explanation: "Sharing a treat makes two people happy.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "A kid sits alone at lunch. They look sad. What is kind?",
        transcript: "A kid sits alone at lunch. They look sad. What is kind?",
        choices: [
          { id: "sit-with-them", label: "🪑", caption: "Sit with them", aria: "sit with them", feedback: "You got it!" },
          { id: "walk-past", label: "🚶", caption: "Walk past", aria: "walk past", feedback: "Try another one." },
          { id: "whisper-about-them", label: "🤫", caption: "Whisper about them", aria: "whisper about them", feedback: "Try another one." },
        ],
        correctId: "sit-with-them",
        explanation: "Sitting together helps lonely feelings go away.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "Your friend made a drawing. They look worried. What is kind?",
        transcript: "Your friend made a drawing. They look worried. What is kind?",
        choices: [
          { id: "say-something-nice", label: "🖼️", caption: "Say something nice", aria: "say something nice about it", feedback: "You got it!" },
          { id: "point-out-mistakes", label: "😬", caption: "Point out mistakes", aria: "point out mistakes", feedback: "Try another one." },
          { id: "say-it-is-bad", label: "🚫", caption: "Say it is bad", aria: "say it is bad", feedback: "Try another one." },
        ],
        correctId: "say-something-nice",
        explanation: "Kind words help a worried friend feel proud.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "A little kid cannot reach the water fountain. What is kind?",
        transcript: "A little kid cannot reach the water fountain. What is kind?",
        choices: [
          { id: "help-them-reach", label: "⬆️", caption: "Help them reach", aria: "help them reach the water", feedback: "You got it!" },
          { id: "go-ahead-first", label: "🙈", caption: "Go ahead first", aria: "go ahead of them", feedback: "Try another one." },
          { id: "walk-away", label: "🚶", caption: "Walk away", aria: "walk away", feedback: "Try another one." },
        ],
        correctId: "help-them-reach",
        explanation: "A little help makes a big difference.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "Your little cousin wants to hold your toy. What is kind?",
        transcript: "Your little cousin wants to hold your toy. What is kind?",
        choices: [
          { id: "let-them-hold-it", label: "🧸", caption: "Let them hold it", aria: "let them hold it gently", feedback: "You got it!" },
          { id: "yank-it-away", label: "🙅", caption: "Yank it away", aria: "yank it away", feedback: "Try another one." },
          { id: "say-mine", label: "😤", caption: "Say mine", aria: "say mine and hide it", feedback: "Try another one." },
        ],
        correctId: "let-them-hold-it",
        explanation: "Sharing with someone little is a kind way to play.",
      },
    ],
  };

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'audioChoice',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'sharing-circle-kindness',
    header: {
      icon: '🤗',
      title: 'Sharing Circle',
      description: 'Listen. Pick the kind thing.',
    },
  });
</script>
<script src="game-backlink.js?v=1" defer></script>
</body>
</html>
