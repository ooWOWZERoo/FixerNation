<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotes — Fixer Nation Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<script>(function(){var t=localStorage.getItem('fnTheme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="admin-common.css?v=16">
<style>
  .a-filter-select{padding:9px 12px; border-radius:10px; border:1px solid var(--a-border); font-size:13.5px; font-family:inherit; background:var(--a-card); color:var(--a-text);}
  .q-search{padding:9px 12px; border-radius:10px; border:1px solid var(--a-border); font-size:13.5px; font-family:inherit; background:var(--a-card); color:var(--a-text); width:220px;}
  .q-search:focus{outline:none; border-color:var(--a-accent);}
  .q-msg{font-size:13px; white-space:pre-wrap; color:var(--a-text-soft); border:1px solid var(--a-border); border-radius:8px; padding:10px 12px; background:var(--a-bg);}
  .q-notes{width:100%; min-height:80px; padding:9px 12px; border-radius:10px; border:1px solid var(--a-border); font-size:13.5px; font-family:inherit; background:var(--a-card); color:var(--a-text); resize:vertical;}
  .q-notes:focus{outline:none; border-color:var(--a-accent);}
  .q-label{font-size:12px; font-weight:600; color:var(--a-text-soft); text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px;}
  .q-field{margin-bottom:16px;}
</style>
</head>
<body>

<div class="a-shell">
  <aside class="a-sidebar"></aside>
<script src="admin-nav.js?v=1"></script>

  <div class="a-main">
    <div class="a-topbar">
      <h1>Quotes</h1>
      <div class="a-theme-toggle" onclick="fnToggleTheme()" title="Toggle light/dark theme"><span class="ic-sun">☀️</span><span class="ic-moon">🌙</span></div>
      <div class="a-user"><div class="avatar">A</div> admin</div>
    </div>

    <div class="a-content">

      <div class="a-stat-grid" style="grid-template-columns:repeat(4,1fr);">
        <div class="a-stat-card">
          <div class="label">Total Requests</div>
          <div class="value" id="statTotal">—</div>
        </div>
        <div class="a-stat-card">
          <div class="label">New</div>
          <div class="value" id="statNew">—</div>
        </div>
        <div class="a-stat-card">
          <div class="label">In Progress</div>
          <div class="value" id="statInProgress">—</div>
        </div>
        <div class="a-stat-card">
          <div class="label">Converted</div>
          <div class="value" id="statConverted">—</div>
        </div>
      </div>

      <div class="a-card">
        <div class="a-card-head">
          <h2>Quote Requests</h2>
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <input type="search" id="searchInput" class="q-search" placeholder="Search name, email, school…" oninput="applyFilters()">
            <select id="statusFilter" class="a-filter-select" onchange="applyFilters()">
              <option value="">All Statuses</option>
              <option value="new">New</option>
              <option value="contacted">Contacted</option>
              <option value="converted">Converted</option>
              <option value="closed">Closed</option>
            </select>
          </div>
        </div>
        <table class="a-table" id="quotesTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Name</th>
              <th>School</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="a-empty" id="quotesEmpty" style="display:none;">
          <div class="big">💬</div>
          No quote requests match your filters.
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Detail / edit modal -->
<div class="a-modal-overlay" id="quoteModalOverlay" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="a-modal" style="max-width:520px;">
    <div class="a-modal-head">
      <h3 id="modalTitle">Quote Request</h3>
      <button class="a-modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="a-modal-body" id="modalBody"></div>
    <div class="a-modal-foot">
      <button class="a-btn a-btn-outline" onclick="closeModal()">Close</button>
      <button class="a-btn a-btn-primary" onclick="saveModal()">Save Changes</button>
    </div>
  </div>
</div>

<script src="admin-common.js?v=15"></script>
<script>
fnRequireAuth();

let allQuotes = [];
let editingId = null;

const STATUS_LABELS  = { new: 'New', contacted: 'Contacted', converted: 'Converted', closed: 'Closed' };
const STATUS_CLASSES = { new: 'a-pill-neutral', contacted: 'a-pill-info', converted: 'a-pill-success', closed: 'a-pill-danger' };

async function loadQuotes() {
  const r = await fetch('/api/contact/quotes', { credentials: 'include' });
  if (fnHandleUnauthorized(r)) return;
  if (!r.ok) { fnToast('Could not load quotes'); return; }
  allQuotes = (await r.json()).quotes || [];
  updateStats();
  renderTable(allQuotes);
}

function updateStats() {
  document.getElementById('statTotal').textContent = allQuotes.length;
  document.getElementById('statNew').textContent = allQuotes.filter(q => q.status === 'new').length;
  document.getElementById('statInProgress').textContent = allQuotes.filter(q => q.status === 'contacted').length;
  document.getElementById('statConverted').textContent = allQuotes.filter(q => q.status === 'converted').length;
}

function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const filtered = allQuotes.filter(q => {
    const matchStatus = !status || q.status === status;
    const matchSearch = !search || [q.first_name, q.last_name, q.email, q.school].join(' ').toLowerCase().includes(search);
    return matchStatus && matchSearch;
  });
  renderTable(filtered);
}

function renderTable(quotes) {
  const tbody = document.querySelector('#quotesTable tbody');
  tbody.innerHTML = '';
  document.getElementById('quotesTable').style.display = quotes.length ? 'table' : 'none';
  document.getElementById('quotesEmpty').style.display  = quotes.length ? 'none'  : 'block';

  quotes.forEach(q => {
    const fullName = [q.first_name, q.last_name].filter(Boolean).join(' ') || '—';
    const pill = `<span class="a-pill ${STATUS_CLASSES[q.status] || 'a-pill-neutral'}">${STATUS_LABELS[q.status] || q.status}</span>`;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="white-space:nowrap;">${fnFormatDate(q.created_at)}</td>
      <td class="a-cell-title">${fnEscape(fullName)}</td>
      <td>${fnEscape(q.school || '—')}</td>
      <td><a href="mailto:${fnEscape(q.email)}">${fnEscape(q.email)}</a></td>
      <td>${fnEscape(q.phone || '—')}</td>
      <td>${pill}</td>
      <td><button class="a-btn a-btn-outline" onclick="openModal(${q.id})">View</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function openModal(id) {
  const q = allQuotes.find(x => x.id === id);
  if (!q) return;
  editingId = id;

  const fullName = [q.first_name, q.last_name].filter(Boolean).join(' ') || 'Quote Request';
  document.getElementById('modalTitle').textContent = fullName;

  document.getElementById('modalBody').innerHTML = `
    <div class="q-field">
      <div class="q-label">Submitted</div>
      <div>${fnFormatDate(q.created_at)}</div>
    </div>
    <div class="q-field">
      <div class="q-label">Contact</div>
      <div>${fnEscape(fullName)}</div>
      <div style="margin-top:2px;"><a href="mailto:${fnEscape(q.email)}">${fnEscape(q.email)}</a></div>
      ${q.phone ? `<div style="margin-top:2px;">${fnEscape(q.phone)}</div>` : ''}
    </div>
    ${q.school ? `<div class="q-field"><div class="q-label">School / Organization</div><div>${fnEscape(q.school)}</div></div>` : ''}
    ${q.message ? `<div class="q-field"><div class="q-label">Message</div><div class="q-msg">${fnEscape(q.message)}</div></div>` : ''}
    <div class="q-field">
      <label class="q-label" for="modalStatus">Status</label>
      <select id="modalStatus" class="a-filter-select" style="width:100%;">
        <option value="new"       ${q.status==='new'       ?'selected':''}>New</option>
        <option value="contacted" ${q.status==='contacted' ?'selected':''}>Contacted</option>
        <option value="converted" ${q.status==='converted' ?'selected':''}>Converted</option>
        <option value="closed"    ${q.status==='closed'    ?'selected':''}>Closed</option>
      </select>
    </div>
    <div class="q-field">
      <label class="q-label" for="modalNotes">Internal Notes</label>
      <textarea id="modalNotes" class="q-notes">${fnEscape(q.notes || '')}</textarea>
    </div>
  `;

  document.getElementById('quoteModalOverlay').style.display = 'flex';
}

function closeModal() {
  document.getElementById('quoteModalOverlay').style.display = 'none';
  editingId = null;
}

async function saveModal() {
  if (!editingId) return;
  const status = document.getElementById('modalStatus').value;
  const notes  = document.getElementById('modalNotes').value;
  const r = await fetch(`/api/contact/quotes/${editingId}`, {
    method: 'PUT',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status, notes }),
  });
  if (!r.ok) { fnToast('Could not save changes'); return; }
  const { quote } = await r.json();
  const idx = allQuotes.findIndex(q => q.id === editingId);
  if (idx !== -1) allQuotes[idx] = quote;
  updateStats();
  applyFilters();
  closeModal();
  fnToast('Quote updated');
}

function fnEscape(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadQuotes();
</script>

</body>
</html>
