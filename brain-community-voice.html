<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Community Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="brain-games.css?v=3">
</head>
<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=16"></script>
<script src="site-auth.js?v=10"></script>
<script src="footer.js?v=9"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js"></script>
<script src="engine-sdk.js?v=2"></script>
<script src="engine-branching-scenario.js?v=4"></script>
<script>
  // Community Voice - Tune Your Brain (Advance band, grades 9-12). The five-step
  // story engine used as a civic cycle: listen to who is affected, check the
  // facts, plan the ask, speak up (and handle a "no"), and reflect. Practises NY
  // SEL 3C (acting for school and community well-being), with 2C and 3B
  // supporting, and the Global Citizen and Effective Communicator attributes.
  // Four situations, one per run (FnEngineSDK variants), each with a different
  // decision maker and a different kind of pushback. Non-partisan: no party,
  // candidate or real organization. In this game "unsafe" means a move that
  // hurts the cause or treats people badly. Design and approved outline:
  // docs/tune-your-brain/NEW_GAMES_FOR_GAPS.md and COMMUNITY_VOICE_OUTLINE.md.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'advance';

  const contentPack = {
    title: 'Community Voice',
    steps: [
      {
        "key": "recognize",
        "prompt": "The last school bus leaves at 3:15, so students in clubs and sports cannot get home afterward. You want an activity bus at 5:00. The transportation office says that it is a cost question. What do you do first?",
        "choices": [
          {
            "id": "tp1-1",
            "text": "Ask different students, including some who are not your friends, who would use a later bus and why.",
            "type": "responsible",
            "feedback": "Hearing from a wide group gives you real needs, and it shows the office that this is not just your idea."
          },
          {
            "id": "tp1-2",
            "text": "Ask only your own club, since you know them best and they will say yes right away.",
            "type": "plausible_incomplete",
            "feedback": "They are easy to ask, but they all see it from the same side. A wider group makes a stronger case."
          },
          {
            "id": "tp1-3",
            "text": "Assume that most students want it, and move on to planning what you will say to the office.",
            "type": "plausible_incomplete",
            "feedback": "It may be true, but a guess is easy to question. You need to know who wants it."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "What do you need to know before you ask?",
        "choices": [
          {
            "id": "tp1-4",
            "text": "How many students stay late and what a bus costs, so that you know what you are asking for.",
            "type": "responsible",
            "feedback": "Numbers turn a wish into a request that someone can say yes or no to."
          },
          {
            "id": "tp1-5",
            "text": "A rough guess such as \"tons of kids\" is enough, because everyone knows that it is a problem.",
            "type": "plausible_incomplete",
            "feedback": "A rough guess can be challenged. A real count is much harder to dismiss."
          },
          {
            "id": "tp1-6",
            "text": "Skip the cost, because that is the school's job to figure out and not yours to worry about.",
            "type": "plausible_incomplete",
            "feedback": "The school does decide on the money, but knowing the cost helps you ask for something realistic."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "How could you shape your ask?",
        "choices": [
          {
            "id": "tp1-7",
            "text": "Prepare a short, specific ask with numbers and one clear request, such as a trial two days a week.",
            "type": "responsible",
            "feedback": "A small, clear ask is easier to approve than a big one, and a trial lowers the risk."
          },
          {
            "id": "tp1-8",
            "text": "Bring a long list of complaints about transportation, so that they see how many problems there are.",
            "type": "plausible_incomplete",
            "feedback": "A long list can sound like a complaint instead of a plan. One clear request is easier to answer."
          },
          {
            "id": "tp1-9",
            "text": "Ask for a full daily bus right away, since that would solve the problem completely for everyone.",
            "type": "plausible_incomplete",
            "feedback": "It would solve it, but it is the most expensive ask, and it is the easiest one to turn down."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "You meet the office and hear that cost is the problem. What do you do?",
        "choices": [
          {
            "id": "tp1-10",
            "text": "Present the ask calmly, listen to the cost concern, and ask what would make a trial possible.",
            "type": "responsible",
            "feedback": "Listening and asking what would work keeps the conversation going and shows that you take their limits seriously."
          },
          {
            "id": "tp1-11",
            "text": "Offer to count riders for two weeks, so that the office can see the real need for a later bus.",
            "type": "multiple_defensible",
            "feedback": "Also a strong move. Real numbers can change a no into a yes, and you are doing part of the work."
          },
          {
            "id": "tp1-12",
            "text": "Post a complaint about the office online, and ask classmates to flood their inbox with messages.",
            "type": "unsafe",
            "feedback": "This turns people against you and the request, and it can get you in trouble. It rarely helps your cause."
          },
          {
            "id": "tp1-13",
            "text": "Ask a teacher or advisor to help you find the right person and process for the request.",
            "type": "seek_help",
            "feedback": "An adult who knows the system can point you to the right door and help you prepare."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "What would you want someone to do if they disagreed with a decision you made?",
        "freeReflection": true
      }
    ],
  };

  // Four situations: a later activity bus (above), a quieter study space, fresh cafeteria options, and a crosswalk near the school.
  // Steps 1 to 3 offer three options; step 4 offers four. Option lengths are balanced on purpose (see server/scripts/audit-brain-games.js).
  contentPack.variants = [
    { steps: contentPack.steps },
    { steps: [
      {
        "key": "recognize",
        "prompt": "The library is loud after school, and students who need quiet cannot study. You would like a quiet room or a quiet hour. The librarian says that space is limited. What do you do first?",
        "choices": [
          {
            "id": "tp2-1",
            "text": "Ask students who study in the library, and students who go elsewhere, what they need.",
            "type": "responsible",
            "feedback": "Both groups matter. The ones who left tell you what is missing, and the ones who stayed tell you what works."
          },
          {
            "id": "tp2-2",
            "text": "Ask the students who are making the noise to stop, since they are the reason for the whole problem.",
            "type": "plausible_incomplete",
            "feedback": "It may help for a day, but it does not give anyone a place to go. A plan works better than a request."
          },
          {
            "id": "tp2-3",
            "text": "Assume that everyone agrees with you, and start planning what to ask for right away without checking.",
            "type": "plausible_incomplete",
            "feedback": "Maybe, but other students may like the library the way it is. Checking first avoids a surprise."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "What do you need to know before you ask?",
        "choices": [
          {
            "id": "tp2-4",
            "text": "How the room is used now and when it is loudest, so that you can propose a real time.",
            "type": "responsible",
            "feedback": "Knowing when and where the noise happens lets you ask for something that fits the space."
          },
          {
            "id": "tp2-5",
            "text": "That the library is always too loud, since that is how it feels to you on most school days.",
            "type": "plausible_incomplete",
            "feedback": "\"Always\" is easy to challenge. A specific time is easier to act on."
          },
          {
            "id": "tp2-6",
            "text": "Only the people who have complained, since they are the ones who care about it the most.",
            "type": "plausible_incomplete",
            "feedback": "Those who complain are only part of the picture. Others may want quiet and never say so."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "How could you shape your ask?",
        "choices": [
          {
            "id": "tp2-7",
            "text": "Suggest a small trial, such as a quiet table or hour, and say how you would measure it.",
            "type": "responsible",
            "feedback": "A small trial costs little and shows whether the idea works, so it is easy for the librarian to agree."
          },
          {
            "id": "tp2-8",
            "text": "Ask the library to ban talking altogether, since that would end the noise completely for everyone.",
            "type": "plausible_incomplete",
            "feedback": "It would end the noise, but many students use the library to talk and work together."
          },
          {
            "id": "tp2-9",
            "text": "Ask for a separate room, since that would be the best solution for everyone who needs quiet.",
            "type": "plausible_incomplete",
            "feedback": "It might be the best, but the librarian said that space is limited, so it is a harder ask."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "You meet the librarian and hear that space is the problem. What do you do?",
        "choices": [
          {
            "id": "tp2-10",
            "text": "Present the trial, thank the librarian for the limits, and ask what would work in the space.",
            "type": "responsible",
            "feedback": "Respecting the limit and asking what is possible shows that you are working with them, not against them."
          },
          {
            "id": "tp2-11",
            "text": "Offer to help set up signs and a sign-up sheet for the trial, so that it is easy to try out.",
            "type": "multiple_defensible",
            "feedback": "Also good. Offering to do the work makes it easier to say yes, and it shows you will follow through."
          },
          {
            "id": "tp2-12",
            "text": "Put up your own \"quiet only\" signs without asking, so that the change starts right away today.",
            "type": "unsafe",
            "feedback": "Acting on your own skips the people in charge, and the signs may be taken down. It can cost you trust."
          },
          {
            "id": "tp2-13",
            "text": "Ask the librarian or a teacher for the right way to propose a change like this one to the school.",
            "type": "seek_help",
            "feedback": "Asking for the right process is smart, and the librarian may become your best supporter."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "How do you decide whose needs come first when two groups want different things?",
        "freeReflection": true
      }
    ] },
    { steps: [
      {
        "key": "recognize",
        "prompt": "The cafeteria offers few fresh fruit and vegetable choices, and many students skip them. You want more. The food service director says that the budget and the rules limit what can be served. What do you do first?",
        "choices": [
          {
            "id": "tp3-1",
            "text": "Survey a wide group of students, not only friends, about what they would actually eat.",
            "type": "responsible",
            "feedback": "Asking a wide group shows what students would really choose, and it makes your case more convincing."
          },
          {
            "id": "tp3-2",
            "text": "Ask only the students who already eat fresh food, since they know what is good to serve there.",
            "type": "plausible_incomplete",
            "feedback": "They know what they like, but they cannot tell you what other students would try."
          },
          {
            "id": "tp3-3",
            "text": "Assume that students want what you want, and plan from there without checking with anyone.",
            "type": "plausible_incomplete",
            "feedback": "A guess is easy to dismiss. Asking others takes little time and gives you real answers."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "What do you need to know before you ask?",
        "choices": [
          {
            "id": "tp3-4",
            "text": "What the budget and the rules allow, so that your ask is something the director can approve.",
            "type": "responsible",
            "feedback": "A request that fits the limits is much easier to approve than one that ignores them."
          },
          {
            "id": "tp3-5",
            "text": "That the director just does not care, and that you will need to push until something changes.",
            "type": "plausible_incomplete",
            "feedback": "That is a guess, and it can sour the conversation. Limits are real, and many directors want to help."
          },
          {
            "id": "tp3-6",
            "text": "Nothing about the rules, since rules can change if enough people want them to change.",
            "type": "plausible_incomplete",
            "feedback": "Some rules do change, but slowly. A request that works inside the rules gets answered sooner."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "How could you shape your ask?",
        "choices": [
          {
            "id": "tp3-7",
            "text": "Suggest one small change, such as a fresh option two days a week, and a way to measure it.",
            "type": "responsible",
            "feedback": "A small change with a way to measure it is easy to try, and results can support a bigger ask later."
          },
          {
            "id": "tp3-8",
            "text": "Ask for a full menu change, since the whole cafeteria needs to be healthier than it is now.",
            "type": "plausible_incomplete",
            "feedback": "A big change is hard to approve, and it can feel like a criticism of everything they do."
          },
          {
            "id": "tp3-9",
            "text": "Bring a petition with lots of names and no plan, so that the director sees how many want it.",
            "type": "plausible_incomplete",
            "feedback": "Names show interest, but without a plan the director has nothing to say yes to."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "You meet the director and hear that rules limit the menu. What do you do?",
        "choices": [
          {
            "id": "tp3-10",
            "text": "Present your survey and the small change, and ask what would make it possible.",
            "type": "responsible",
            "feedback": "Your results and a clear request show that you did the work, and the question invites cooperation."
          },
          {
            "id": "tp3-11",
            "text": "Offer to run a taste test day, to show how many students would pick the fresh option.",
            "type": "multiple_defensible",
            "feedback": "Also a good idea. A real taste test gives the director evidence and makes the trial easier to approve."
          },
          {
            "id": "tp3-12",
            "text": "Pressure the director with a petition of names that students did not really agree to.",
            "type": "unsafe",
            "feedback": "Signing names that were not freely given is dishonest, and it would hurt your credibility."
          },
          {
            "id": "tp3-13",
            "text": "Ask a teacher or counselor to introduce you to the right person for the request.",
            "type": "seek_help",
            "feedback": "A teacher or counselor can open the door and tell you how requests like this are usually made."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "When have you had to accept a limit and still work for a change?",
        "freeReflection": true
      }
    ] },
    { steps: [
      {
        "key": "recognize",
        "prompt": "Students cross a busy road to reach the school, and it feels unsafe. You want a marked crosswalk. The town's traffic committee asks for data and a written request, and it meets once a month. What do you do first?",
        "choices": [
          {
            "id": "tp4-1",
            "text": "Talk to students, parents and neighbors who use the crossing, and note what they say.",
            "type": "responsible",
            "feedback": "People who use the crossing every day know things you will not see in one visit."
          },
          {
            "id": "tp4-2",
            "text": "Rely on your own feeling that it is dangerous, since you cross it every day yourself.",
            "type": "plausible_incomplete",
            "feedback": "Your experience matters, but a feeling is easy to dismiss. Other voices add weight."
          },
          {
            "id": "tp4-3",
            "text": "Ask only the people who already agree with you, since they will help you the most.",
            "type": "plausible_incomplete",
            "feedback": "They will help, but the committee will ask who else you talked to. A wider group is more convincing."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "What do you need to know before you ask?",
        "choices": [
          {
            "id": "tp4-4",
            "text": "When students cross and how many, and what the committee asks for in a request.",
            "type": "responsible",
            "feedback": "Facts about when and how many show the need, and knowing the format saves time."
          },
          {
            "id": "tp4-5",
            "text": "Nothing more, since it is obviously dangerous and everyone can see that for themselves.",
            "type": "plausible_incomplete",
            "feedback": "It may look obvious to you, but a committee needs evidence that it can point to."
          },
          {
            "id": "tp4-6",
            "text": "Stories about accidents, even if you are not sure that all of them are true or happened here.",
            "type": "plausible_incomplete",
            "feedback": "A story that is not true can ruin your credibility, so only use what you can check."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "How could you shape your ask?",
        "choices": [
          {
            "id": "tp4-7",
            "text": "Write a short request with the data and a clear ask, and plan to attend the next meeting.",
            "type": "responsible",
            "feedback": "A written request and a person at the meeting give the committee both the facts and a face."
          },
          {
            "id": "tp4-8",
            "text": "Send an angry email that explains how unsafe the road is, so that they feel the urgency.",
            "type": "plausible_incomplete",
            "feedback": "Urgency is understandable, but anger tends to put people on the defensive. A calm request works better."
          },
          {
            "id": "tp4-9",
            "text": "Wait for someone else to bring it up, since adults are better at handling these things.",
            "type": "plausible_incomplete",
            "feedback": "Adults help, but the committee also listens to students, and waiting leaves the crossing as it is."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "You are at the committee meeting. What do you do?",
        "choices": [
          {
            "id": "tp4-10",
            "text": "Present the facts calmly, and ask what the committee needs next to take up your request.",
            "type": "responsible",
            "feedback": "Calm facts and a question about next steps keep the door open and show that you are serious."
          },
          {
            "id": "tp4-11",
            "text": "Offer to count crossings for a week and share the results with the committee afterward.",
            "type": "multiple_defensible",
            "feedback": "Also a strong idea. Fresh numbers that you collected yourself can make a request much harder to ignore."
          },
          {
            "id": "tp4-12",
            "text": "Block the road or film drivers to make a point, so that the committee sees how serious it is.",
            "type": "unsafe",
            "feedback": "Blocking a road or filming drivers is risky and can get you in trouble. It can also turn people against you."
          },
          {
            "id": "tp4-13",
            "text": "Ask a teacher, a parent or the school's safety officer to help you with the request.",
            "type": "seek_help",
            "feedback": "An adult who knows the process can help you prepare, and a request from several people carries more weight."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "What would you do next if the committee said not yet?",
        "freeReflection": true
      }
    ] },
  ];

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'branchingScenario',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'community-voice-3c',
    header: {
      icon: '📣',
      title: 'Community Voice',
      description: 'Listen, check the facts, plan a respectful ask, and speak up for a change at school or in town.',
    },
  });
</script>
</body>
</html>
