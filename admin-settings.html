<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Fixer Nation Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="admin-common.css?v=7">
</head>
<body>

<div class="a-shell">
  <aside class="a-sidebar">
    <div class="a-logo"><div class="mark">FN</div><div class="word">FN Admin</div></div>
    <nav class="a-nav">
      <a href="admin-dashboard.html"><span class="ic">📊</span><span class="label">Dashboard</span></a>
      <a href="admin-books.html"><span class="ic">📚</span><span class="label">Books</span></a>
      <a href="admin-curriculum.html"><span class="ic">🎓</span><span class="label">Curriculums</span></a>
      <a href="admin-blogs.html"><span class="ic">📝</span><span class="label">Blogs</span></a>
      <a href="admin-newsletter.html"><span class="ic">✉️</span><span class="label">CRM</span></a>
      <a href="admin-campaigns.html"><span class="ic">📣</span><span class="label">Campaigns</span></a>
      <a href="admin-settings.html" class="active"><span class="ic">⚙️</span><span class="label">Settings</span></a>
    </nav>
    <div class="a-sidebar-foot">
      <a href="fixernation-redesign.html" target="_blank" rel="noopener"><span class="ic">↗</span><span class="label">View Site</span></a>
      <a href="#" onclick="fnLogout(); return false;"><span class="ic">⎋</span><span class="label">Log Out</span></a>
    </div>
  </aside>

  <div class="a-main">
    <div class="a-topbar">
      <h1>Settings</h1>
      <div class="a-user"><div class="avatar">A</div> admin</div>
    </div>

    <div class="a-content">
      <div class="a-card" style="max-width:480px;">
        <div class="a-card-head">
          <h2>Change Password</h2>
        </div>
        <form id="passwordForm">
          <div class="a-error" id="passwordError"></div>
          <div class="a-field">
            <label>Current Password</label>
            <input type="password" id="currentPassword" autocomplete="current-password" required>
          </div>
          <div class="a-field">
            <label>New Password</label>
            <input type="password" id="newPassword" autocomplete="new-password" required minlength="8">
          </div>
          <div class="a-field">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" autocomplete="new-password" required minlength="8">
          </div>
          <div class="a-note">At least 8 characters.</div>
          <button type="submit" class="a-btn a-btn-primary" style="margin-top:16px;">Update Password</button>
        </form>
      </div>

      <div class="a-card" style="margin-top:24px;">
        <div class="a-card-head">
          <h2>Registered Site Users</h2>
        </div>
        <table class="a-table" id="siteUsersTable">
          <thead><tr><th>Name</th><th>Email</th><th>Verified</th><th>Signed Up</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="a-empty" id="siteUsersEmpty" style="display:none;">No one has created a public account yet.</div>
      </div>
    </div>
  </div>
</div>

<script src="admin-common.js?v=7"></script>
<script>
fnRequireAuth();

document.getElementById('passwordForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const currentPassword = document.getElementById('currentPassword').value;
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const errorBox = document.getElementById('passwordError');
  errorBox.classList.remove('show');

  if (newPassword !== confirmPassword) {
    errorBox.textContent = 'New password and confirmation do not match.';
    errorBox.classList.add('show');
    return;
  }

  const r = await fetch('/api/auth/password', {
    method: 'PUT',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ currentPassword, newPassword }),
  });
  if (fnHandleUnauthorized(r)) return;
  const result = await r.json().catch(() => ({}));
  if (!r.ok) {
    errorBox.textContent = result.error || 'Could not update password.';
    errorBox.classList.add('show');
    return;
  }
  document.getElementById('passwordForm').reset();
  fnToast('Password updated');
});

async function loadSiteUsers() {
  const r = await fetch('/api/site-auth/site-users', { credentials: 'include' });
  if (fnHandleUnauthorized(r)) return;
  const { siteUsers } = await r.json();

  const tbody = document.querySelector('#siteUsersTable tbody');
  tbody.innerHTML = '';
  document.getElementById('siteUsersTable').style.display = siteUsers.length ? 'table' : 'none';
  document.getElementById('siteUsersEmpty').style.display = siteUsers.length ? 'none' : 'block';

  siteUsers.forEach(u => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="a-cell-title">${u.firstName} ${u.lastName}</td>
      <td>${u.email}</td>
      <td><span class="a-pill ${u.emailVerified ? 'a-pill-success' : 'a-pill-neutral'}">${u.emailVerified ? 'Verified' : 'Unverified'}</span></td>
      <td>${fnFormatDate(u.createdAt)}</td>
      <td><button class="a-icon-btn danger" title="Delete account" onclick="deleteSiteUser(${u.id}, '${u.email.replace(/'/g, "\\'")}')">🗑️</button></td>
    `;
    tbody.appendChild(tr);
  });
}

async function deleteSiteUser(id, email) {
  if (!confirm(`Delete the account for ${email}? Any license seat they'd claimed will reopen for someone else to use.`)) return;
  const r = await fetch(`/api/site-auth/site-users/${id}`, {
    method: 'DELETE',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: '{}',
  });
  if (fnHandleUnauthorized(r)) return;
  loadSiteUsers();
  fnToast('Account deleted');
}

loadSiteUsers();
</script>

</body>
</html>
