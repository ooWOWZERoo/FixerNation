<script>
  // Helper's Choice - Tune Your Brain SEL scaling slice (Discover band).
  // Targets Responsible decision-making, which had ZERO Discover-band
  // coverage before this (see the corrected CASEL x band matrix,
  // 2026-09-21, in docs/tune-your-brain/GAP_ANALYSIS_2026-09-17.md) -
  // together with Sharing Circle (Social awareness, Relationship
  // skills), this closes Discover's 3-competency gap. Uses
  // engine-audio-choice.js, same as Calm Down Corner/Sharing Circle,
  // since Discover requires no reading and spoken support (section 7.2).
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'discover';

  const contentPack = {
    title: "Helper's Choice",
    roundsPerRun: 5,
    items: [
      {
        stimulusType: 'audio',
        stimulusText: "You find a dollar on the floor. What is the right thing to do?",
        transcript: "You find a dollar on the floor. What is the right thing to do?",
        choices: [
          { id: "tell-the-teacher", label: "🙋", caption: "Tell the teacher", aria: "give it to the teacher", feedback: "You got it!" },
          { id: "keep-it-quiet", label: "🤫", caption: "Keep it quiet", aria: "keep it quietly", feedback: "Try another one." },
          { id: "into-your-bag", label: "🎒", caption: "Into your bag", aria: "put it in your own backpack", feedback: "Try another one." },
        ],
        correctId: "tell-the-teacher",
        explanation: "The teacher can find who lost it.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "You spilled paint on the table. What is the right thing to do?",
        transcript: "You spilled paint on the table. What is the right thing to do?",
        choices: [
          { id: "tell-and-clean-up", label: "🧽", caption: "Tell and clean up", aria: "tell a grown-up and clean up", feedback: "You got it!" },
          { id: "hide-it", label: "🙈", caption: "Hide it", aria: "hide it", feedback: "Try another one." },
          { id: "blame-someone", label: "👉", caption: "Blame someone", aria: "blame someone else", feedback: "Try another one." },
        ],
        correctId: "tell-and-clean-up",
        explanation: "Telling the truth and cleaning up fixes the problem.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "You said you would feed the fish. You are playing. What is the right thing to do?",
        transcript: "You said you would feed the fish. You are playing. What is the right thing to do?",
        choices: [
          { id: "feed-the-fish", label: "🐟", caption: "Feed the fish", aria: "feed the fish", feedback: "You got it!" },
          { id: "skip-it", label: "🙅", caption: "Skip it", aria: "skip it", feedback: "Try another one." },
          { id: "get-grumpy", label: "😤", caption: "Get grumpy", aria: "get grumpy", feedback: "Try another one." },
        ],
        correctId: "feed-the-fish",
        explanation: "Keeping a promise shows you can be trusted.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "Your friend says, \"Say we both finished.\" You did not finish. What is the right thing to do?",
        transcript: "Your friend says, \"Say we both finished.\" You did not finish. What is the right thing to do?",
        choices: [
          { id: "tell-the-truth", label: "✋", caption: "Tell the truth", aria: "tell the truth", feedback: "You got it!" },
          { id: "go-along", label: "🤐", caption: "Go along", aria: "go along with it", feedback: "Try another one." },
          { id: "get-mad", label: "😠", caption: "Get mad", aria: "get mad", feedback: "Try another one." },
        ],
        correctId: "tell-the-truth",
        explanation: "Telling the truth is right, even when it is hard.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "You broke a classmate's pencil by accident. What is the right thing to do?",
        transcript: "You broke a classmate's pencil by accident. What is the right thing to do?",
        choices: [
          { id: "say-sorry-and-tell", label: "🗣️", caption: "Say sorry and tell", aria: "say sorry and tell them", feedback: "You got it!" },
          { id: "hide-the-pieces", label: "🙈", caption: "Hide the pieces", aria: "hide the pieces", feedback: "Try another one." },
          { id: "blame-another-kid", label: "👉", caption: "Blame another kid", aria: "say another kid did it", feedback: "Try another one." },
        ],
        correctId: "say-sorry-and-tell",
        explanation: "Saying sorry fixes hurt feelings.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "The teacher gave you extra stickers by mistake. What is the right thing to do?",
        transcript: "The teacher gave you extra stickers by mistake. What is the right thing to do?",
        choices: [
          { id: "tell-the-teacher", label: "🙋", caption: "Tell the teacher", aria: "tell the teacher", feedback: "You got it!" },
          { id: "keep-them", label: "🤫", caption: "Keep them", aria: "keep them", feedback: "Try another one." },
          { id: "tuck-them-away", label: "🎒", caption: "Tuck them away", aria: "tuck them in your bag", feedback: "Try another one." },
        ],
        correctId: "tell-the-teacher",
        explanation: "Being honest is right, even when keeping them is easy.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "It is your turn to clean up the blocks. Friends want to play. What is the right thing to do?",
        transcript: "It is your turn to clean up the blocks. Friends want to play. What is the right thing to do?",
        choices: [
          { id: "clean-up-first", label: "🧱", caption: "Clean up first", aria: "clean up first", feedback: "You got it!" },
          { id: "run-off-to-play", label: "🏃", caption: "Run off to play", aria: "run off to play", feedback: "Try another one." },
          { id: "leave-it", label: "😒", caption: "Leave it", aria: "leave it for someone else", feedback: "Try another one." },
        ],
        correctId: "clean-up-first",
        explanation: "Doing your job first is fair to everyone.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "You see trash on the playground floor. What is the right thing to do?",
        transcript: "You see trash on the playground floor. What is the right thing to do?",
        choices: [
          { id: "put-it-in-the-bin", label: "🗑️", caption: "Use the bin", aria: "put it in the bin", feedback: "You got it!" },
          { id: "walk-past-it", label: "👀", caption: "Walk past it", aria: "walk past it", feedback: "Try another one." },
          { id: "kick-it-away", label: "🦶", caption: "Kick it away", aria: "kick it away", feedback: "Try another one." },
        ],
        correctId: "put-it-in-the-bin",
        explanation: "Caring for our space helps everyone.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "A friend left their lunch box at the park. What is the right thing to do?",
        transcript: "A friend left their lunch box at the park. What is the right thing to do?",
        choices: [
          { id: "return-it", label: "🧳", caption: "Return it", aria: "return it to your friend", feedback: "You got it!" },
          { id: "eat-the-snack", label: "🍎", caption: "Eat the snack", aria: "eat the snack inside", feedback: "Try another one." },
          { id: "leave-it-there", label: "🚶", caption: "Leave it there", aria: "leave it there", feedback: "Try another one." },
        ],
        correctId: "return-it",
        explanation: "Giving it back is the honest thing to do.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "You see a classmate taking something that is not theirs. What is the right thing to do?",
        transcript: "You see a classmate taking something that is not theirs. What is the right thing to do?",
        choices: [
          { id: "tell-a-teacher", label: "🙋", caption: "Tell a teacher", aria: "tell a teacher", feedback: "You got it!" },
          { id: "say-nothing", label: "🤐", caption: "Say nothing", aria: "say nothing", feedback: "Try another one." },
          { id: "take-one-too", label: "🎒", caption: "Take one too", aria: "take one too", feedback: "Try another one." },
        ],
        correctId: "tell-a-teacher",
        explanation: "Telling a teacher keeps things fair.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "You do not understand the work. What is the right thing to do?",
        transcript: "You do not understand the work. What is the right thing to do?",
        choices: [
          { id: "ask-for-help", label: "🙋", caption: "Ask for help", aria: "ask for help", feedback: "You got it!" },
          { id: "pretend-you-do", label: "😶", caption: "Pretend you do", aria: "pretend you understand", feedback: "Try another one." },
          { id: "copy-a-friend", label: "👀", caption: "Copy a friend", aria: "copy a friend", feedback: "Try another one." },
        ],
        correctId: "ask-for-help",
        explanation: "Asking for help is how we learn.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "You told a small lie. Now you feel bad. What is the right thing to do?",
        transcript: "You told a small lie. Now you feel bad. What is the right thing to do?",
        choices: [
          { id: "tell-the-truth", label: "🗣️", caption: "Tell the truth", aria: "tell the truth now", feedback: "You got it!" },
          { id: "tell-another-lie", label: "🤥", caption: "Tell another lie", aria: "tell another lie", feedback: "Try another one." },
          { id: "hope-it-goes-away", label: "🙈", caption: "Hope it goes away", aria: "hope it goes away", feedback: "Try another one." },
        ],
        correctId: "tell-the-truth",
        explanation: "The truth lets the bad feeling go.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "A toy is broken in the classroom. You did not do it. What is the right thing to do?",
        transcript: "A toy is broken in the classroom. You did not do it. What is the right thing to do?",
        choices: [
          { id: "tell-the-teacher", label: "🙋", caption: "Tell the teacher", aria: "tell the teacher", feedback: "You got it!" },
          { id: "say-nothing", label: "🤷", caption: "Say nothing", aria: "say nothing", feedback: "Try another one." },
          { id: "blame-a-friend", label: "😠", caption: "Blame a friend", aria: "blame a friend", feedback: "Try another one." },
        ],
        correctId: "tell-the-teacher",
        explanation: "Telling the teacher helps fix the toy.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "A friend asks you to pick on a kid. You do not want to. What is the right thing to do?",
        transcript: "A friend asks you to pick on a kid. You do not want to. What is the right thing to do?",
        choices: [
          { id: "say-no-thanks", label: "🙅", caption: "Say no thanks", aria: "say no thank you", feedback: "You got it!" },
          { id: "do-it", label: "😈", caption: "Do it", aria: "do it", feedback: "Try another one." },
          { id: "go-along-quietly", label: "🏃", caption: "Go along quietly", aria: "go along quietly", feedback: "Try another one." },
        ],
        correctId: "say-no-thanks",
        explanation: "It takes courage to say no to something unkind.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "A kid cuts in front of you in line. What is the right thing to do?",
        transcript: "A kid cuts in front of you in line. What is the right thing to do?",
        choices: [
          { id: "say-it-nicely", label: "🗣️", caption: "Say it nicely", aria: "say nicely that it is your turn", feedback: "You got it!" },
          { id: "shove-them", label: "👊", caption: "Shove them", aria: "shove them", feedback: "Try another one." },
          { id: "let-everyone-cut", label: "🤷", caption: "Let everyone cut", aria: "let everyone cut in", feedback: "Try another one." },
        ],
        correctId: "say-it-nicely",
        explanation: "Using kind words keeps the line fair.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "You borrowed a book. It is time to give it back. What is the right thing to do?",
        transcript: "You borrowed a book. It is time to give it back. What is the right thing to do?",
        choices: [
          { id: "give-it-back", label: "📚", caption: "Give it back", aria: "give the book back", feedback: "You got it!" },
          { id: "keep-it-longer", label: "🎒", caption: "Keep it longer", aria: "keep it longer", feedback: "Try another one." },
          { id: "say-you-lost-it", label: "🙈", caption: "Say you lost it", aria: "say you lost it", feedback: "Try another one." },
        ],
        correctId: "give-it-back",
        explanation: "Returning what you borrow keeps trust strong.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "Your team lost the game. Someone is crying. What is the right thing to do?",
        transcript: "Your team lost the game. Someone is crying. What is the right thing to do?",
        choices: [
          { id: "say-good-game", label: "🤝", caption: "Say good game", aria: "say good game and be kind", feedback: "You got it!" },
          { id: "tease-them", label: "😒", caption: "Tease them", aria: "tease the kid who is crying", feedback: "Try another one." },
          { id: "leave-the-team", label: "🚶", caption: "Leave the team", aria: "leave the team", feedback: "Try another one." },
        ],
        correctId: "say-good-game",
        explanation: "Being a good sport is the right thing to do.",
      },
      {
        stimulusType: 'audio',
        stimulusText: "You see a hurt bird on the path. What is the right thing to do?",
        transcript: "You see a hurt bird on the path. What is the right thing to do?",
        choices: [
          { id: "tell-a-grown-up", label: "🙋", caption: "Tell a grown-up", aria: "tell a grown-up", feedback: "You got it!" },
          { id: "poke-it", label: "🦶", caption: "Poke it", aria: "poke it with a stick", feedback: "Try another one." },
          { id: "run-past", label: "🏃", caption: "Run past", aria: "run past it", feedback: "Try another one." },
        ],
        correctId: "tell-a-grown-up",
        explanation: "A grown-up knows how to help a hurt animal.",
      },
    ],
  };

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'audioChoice',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'helpers-choice-responsibility',
    header: {
      icon: '✋',
      title: "Helper's Choice",
      description: 'Listen. Pick the right thing to do.',
    },
  });
</script>
<script src="game-backlink.js?v=1" defer></script>
</body>
</html>
