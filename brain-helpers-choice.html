<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/api/settings/favicon?size=32">
<link rel="icon" type="image/png" sizes="16x16" href="/api/settings/favicon?size=16">
<link rel="apple-touch-icon" href="/api/settings/favicon?size=180">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixer Nation Education - Helper's Choice</title>
<link rel="stylesheet" href="fonts.css?v=1">
<link rel="stylesheet" href="brain-games.css?v=7">
</head>
<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=20"></script>
<script src="site-auth.js?v=11"></script>
<script src="footer.js?v=15"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js?v=3"></script>
<script src="engine-sdk.js?v=5"></script>
<script src="engine-audio-choice.js?v=4"></script>
<script>
  // Helper's Choice - Tune Your Brain SEL scaling slice (Discover band).
  // Targets Responsible decision-making, which had ZERO Discover-band
  // coverage before this (see the corrected CASEL x band matrix,
  // 2026-09-21, in docs/tune-your-brain/GAP_ANALYSIS_2026-09-17.md) -
  // together with Sharing Circle (Social awareness, Relationship
  // skills), this closes Discover's 3-competency gap. Uses
  // engine-audio-choice.js, same as Calm Down Corner/Sharing Circle,
  // since Discover requires no reading and spoken support (section 7.2).
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'discover';

  const contentPack = {
    title: "Helper's Choice",
    items: [
      {
        stimulusType: 'audio',
        stimulusText: "You find a dollar on the floor. What is the right thing to do?",
        transcript: "You find a dollar on the floor. What is the right thing to do?",
        choices: [
          { id: "give-teacher", label: "🙋", caption: "Tell the teacher", aria: "give it to the teacher" },
          { id: "keep-quiet", label: "🤫", caption: "Keep it quiet", aria: "keep it quietly" },
          { id: "pocket", label: "🎒", caption: "Into your bag", aria: "put it in your own backpack" },
        ],
        correctId: "give-teacher",
      },
      {
        stimulusType: 'audio',
        stimulusText: "You spilled paint on the table. What is the right thing to do?",
        transcript: "You spilled paint on the table. What is the right thing to do?",
        choices: [
          { id: "tell-clean", label: "🧽", caption: "Tell and clean up", aria: "tell the teacher and help clean it up" },
          { id: "hide", label: "🙈", caption: "Hide it", aria: "hide it and walk away" },
          { id: "blame", label: "👉", caption: "Blame someone", aria: "blame someone else" },
        ],
        correctId: "tell-clean",
      },
      {
        stimulusType: 'audio',
        stimulusText: "You said you would feed the fish. You are playing. What is the right thing to do?",
        transcript: "You said you would feed the fish. You are playing. What is the right thing to do?",
        choices: [
          { id: "pause-feed", label: "🐟", caption: "Feed the fish", aria: "pause and feed the fish first" },
          { id: "skip", label: "🙅", caption: "Skip it", aria: "skip it, someone else will do it" },
          { id: "upset", label: "😤", caption: "Get grumpy", aria: "get upset that you have to" },
        ],
        correctId: "pause-feed",
      },
      {
        stimulusType: 'audio',
        stimulusText: "Your friend says, \"Say we both finished.\" You did not finish. What is the right thing to do?",
        transcript: "Your friend says, \"Say we both finished.\" You did not finish. What is the right thing to do?",
        choices: [
          { id: "tell-truth", label: "✋", caption: "Tell the truth", aria: "tell the truth that you are not done yet" },
          { id: "go-along", label: "🤐", caption: "Go along", aria: "go along with it" },
          { id: "get-mad", label: "😠", caption: "Get mad", aria: "get mad at your friend" },
        ],
        correctId: "tell-truth",
      },
    ],
  };

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'audioChoice',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'helpers-choice-responsibility',
    header: {
      icon: '✋',
      title: "Helper's Choice",
      description: 'Listen. Pick the right thing to do.',
    },
  });
</script>
</body>
</html>
