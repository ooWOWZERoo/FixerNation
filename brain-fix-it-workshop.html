<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico">

<title>Fixer Nation Education - Fix-It Workshop</title>

<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>

</head>
<body>
<header></header>

<div class="game-frame">
  <p id="loginHint" style="font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:12px;"></p>
  <div id="mount" class="game-card-panel band-aware"></div>
</div>

<footer></footer>
<script src="referral.js?v=1"></script>
<script src="nav.js?v=17"></script>
<script src="site-auth.js?v=11"></script>
<script src="footer.js?v=10"></script>
<script src="accessibility-utils.js"></script>
<script src="game-shell.js?v=3"></script>
<script src="engine-sdk.js?v=5"></script>
<script src="engine-branching-scenario.js?v=6"></script>
<script>
  // Fix-It Workshop - Tune Your Brain (Explore band, grades 3-5). The five-step
  // story engine used as a design cycle: listen, name the real problem,
  // brainstorm, try a small test, reflect. Practises the Creative Innovator
  // attribute and NY SEL 3C (acting for school and community well-being), with
  // 2A (empathy) and 3B (decisions) supporting. Design and approved outline:
  // docs/tune-your-brain/NEW_GAMES_FOR_GAPS.md and FIX_IT_WORKSHOP_OUTLINE.md.
  // Unlike the other story games, the idea step (consider) has no single best
  // answer: all three ideas are workable and the feedback names each one's
  // strength and cost. Per the sensitive-scenario rules, nothing here names a
  // child who is left out, and a trusted-adult option is always offered.
  const params = new URLSearchParams(location.search);
  const band = params.get('band') || 'explore';

  const contentPack = {
    title: 'Fix-It Workshop',
    stepLabels: { recognize: 'Spot the problem', impact: 'Hear from people', consider: 'Think of fixes', choose: 'Pick one to try', reflect: 'What you learned' },
    steps: [
      {
        "key": "recognize",
        "prompt": "The lunch line is so slow you get ten minutes to eat. You want to help. What do you do first?",
        "choices": [
          {
            "id": "fw1-1",
            "text": "Watch and time the line. Ask kids and lunch staff.",
            "type": "responsible",
            "feedback": "Timing the line gives you facts. Lunch staff see things you cannot."
          },
          {
            "id": "fw1-2",
            "text": "Ask only your best friends. They will agree with you.",
            "type": "plausible_incomplete",
            "feedback": "Friends see the line from your spot. Others may notice more."
          },
          {
            "id": "fw1-3",
            "text": "Decide kids are too slow. Tell everyone to hurry up.",
            "type": "plausible_incomplete",
            "feedback": "That is a guess that blames kids. Look first to find the cause."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "The line is slowest when everyone arrives at once. Only one register is open. What is the problem?",
        "choices": [
          {
            "id": "fw1-4",
            "text": "Everyone arrives at once and only one register is open.",
            "type": "responsible",
            "feedback": "Yes, that is what is happening. Now your ideas can aim at it."
          },
          {
            "id": "fw1-5",
            "text": "Kids take too long to pick their food at lunch.",
            "type": "plausible_incomplete",
            "feedback": "You timed it, and the register slowed things down. Blaming kids would not fix that."
          },
          {
            "id": "fw1-6",
            "text": "The room is too small, so nobody can fix the line.",
            "type": "plausible_incomplete",
            "feedback": "The room may be small, but you found something you can change."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "You have three ideas for fixing the line. Which one do you try first?",
        "choices": [
          {
            "id": "fw1-7",
            "text": "Open a second register for the first ten minutes.",
            "type": "multiple_defensible",
            "feedback": "Two lines move at once. It needs a staff member to agree."
          },
          {
            "id": "fw1-8",
            "text": "Send classes to lunch in two groups, five minutes apart.",
            "type": "multiple_defensible",
            "feedback": "It costs no money and spreads out the crowd. Teachers must agree."
          },
          {
            "id": "fw1-9",
            "text": "Add a grab-and-go cart with packaged lunches and snacks.",
            "type": "multiple_defensible",
            "feedback": "It helps kids who want something fast. Some foods do not fit on a cart."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "Before you change lunch for everyone, what is the best next step?",
        "choices": [
          {
            "id": "fw1-10",
            "text": "Test it for a week with one grade. Time the line again.",
            "type": "responsible",
            "feedback": "A small test shows if the idea works. You can fix problems early."
          },
          {
            "id": "fw1-11",
            "text": "Draw the plan. Show two kids and a lunch worker first.",
            "type": "multiple_defensible",
            "feedback": "A paper test finds mistakes cheaply. You still need a real trial."
          },
          {
            "id": "fw1-12",
            "text": "Make your class follow your plan Monday. Ask no one.",
            "type": "unsafe",
            "feedback": "This skips the people who run lunch. Even good ideas need a yes and a test."
          },
          {
            "id": "fw1-13",
            "text": "Ask the principal or lunch manager to help set up a trial.",
            "type": "seek_help",
            "feedback": "Adults can approve a change. They can make a real trial happen."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "Think about the kids in the long line. What surprised you when you listened to them?",
        "freeReflection": true
      }
    ],
  };

  // Four school problems: the lunch line (above), the quiet playground corner, the lost-and-found, and new students finding their way.
  // The game picks one whole problem per run (FnEngineSDK variants). Steps 1 to 3 offer three options; step 4 offers four.
  contentPack.variants = [
    { steps: contentPack.steps },
    { steps: [
      {
        "key": "recognize",
        "prompt": "At recess, the fence corner is always empty. The big games are loud and crowded. What do you do first?",
        "choices": [
          {
            "id": "fw2-1",
            "text": "Watch recess for two days. Ask kids what they do instead.",
            "type": "responsible",
            "feedback": "Watching and asking shows what is really happening at recess."
          },
          {
            "id": "fw2-2",
            "text": "Decide the kids are lazy. Tell them to use all the space.",
            "type": "plausible_incomplete",
            "feedback": "That blames kids too soon. They may have a good reason to stay away."
          },
          {
            "id": "fw2-3",
            "text": "Ask only kids in the big games. They are easy to find.",
            "type": "plausible_incomplete",
            "feedback": "They do not skip the corner. Ask the kids who stay away."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "The corner has no shade and nothing to do. Some kids stay inside to avoid loud games. What is the problem?",
        "choices": [
          {
            "id": "fw2-4",
            "text": "Kids who want calm have no good place to go.",
            "type": "responsible",
            "feedback": "That is the gap in the corner. Your ideas can fill it."
          },
          {
            "id": "fw2-5",
            "text": "Kids do not like quiet places, so skip the corner.",
            "type": "plausible_incomplete",
            "feedback": "Kids you asked want something calm. The corner needs something to offer."
          },
          {
            "id": "fw2-6",
            "text": "Loud games cause the problem, so stop them.",
            "type": "plausible_incomplete",
            "feedback": "Many kids love those games. Stopping them would help some kids and hurt others."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "You have three ideas for the corner. Which one do you try first?",
        "choices": [
          {
            "id": "fw2-7",
            "text": "Set up a chalk and drawing station with a small table.",
            "type": "multiple_defensible",
            "feedback": "Kids get a quiet activity right away. It needs chalk and a dry day."
          },
          {
            "id": "fw2-8",
            "text": "Start a reading nook with donated books and mats.",
            "type": "multiple_defensible",
            "feedback": "It is peaceful and lasts a long time. It needs books, mats, and a dry spot."
          },
          {
            "id": "fw2-9",
            "text": "Bring out a calm game box with cards and puzzles.",
            "type": "multiple_defensible",
            "feedback": "It is easy to store and fits many kids. It needs a grown-up to look after it."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "Before you change the corner, what is the best next step?",
        "choices": [
          {
            "id": "fw2-10",
            "text": "Try it a week. Count who comes and ask what to change.",
            "type": "responsible",
            "feedback": "A short trial shows if kids use it. Their answers tell you what to fix."
          },
          {
            "id": "fw2-11",
            "text": "Try one thing first, like chalk on dry days. Add more later.",
            "type": "multiple_defensible",
            "feedback": "Starting small costs less, and you learn which ideas kids like best."
          },
          {
            "id": "fw2-12",
            "text": "Move the benches and mats yourself at recess. Ask no adult.",
            "type": "unsafe",
            "feedback": "Moving school things alone could cause a mess or an accident. Ask an adult first."
          },
          {
            "id": "fw2-13",
            "text": "Ask a recess helper or teacher to say yes and help.",
            "type": "seek_help",
            "feedback": "An adult can say yes and find supplies. They can watch over everyone."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "Think of a time you wanted a calm place. What did you do, and what would have helped?",
        "freeReflection": true
      }
    ] },
    { steps: [
      {
        "key": "recognize",
        "prompt": "The lost-and-found box is overflowing with coats and lunch boxes. You want to fix it. What do you do first?",
        "choices": [
          {
            "id": "fw3-1",
            "text": "Check the box, ask classes what they lost, and ask the custodian.",
            "type": "responsible",
            "feedback": "Each person tells you a piece of the story. Together they show what is happening."
          },
          {
            "id": "fw3-2",
            "text": "Say kids are careless. Remind everyone to watch their things.",
            "type": "plausible_incomplete",
            "feedback": "Reminders may help a little. You still do not know why things stay."
          },
          {
            "id": "fw3-3",
            "text": "Ask only your own class. They are the easiest to reach.",
            "type": "plausible_incomplete",
            "feedback": "The box holds things from the whole school. Other classes may know more."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "Most things sit in the box all year. Nobody knows what is in there. What is the real problem?",
        "choices": [
          {
            "id": "fw3-4",
            "text": "Kids cannot see what is in the box to find their things.",
            "type": "responsible",
            "feedback": "Kids cannot get back what they cannot see. Your ideas can aim at that."
          },
          {
            "id": "fw3-5",
            "text": "Kids lose too many things because they do not care.",
            "type": "plausible_incomplete",
            "feedback": "Kids told you they want their things back. The trouble is finding them."
          },
          {
            "id": "fw3-6",
            "text": "The box is too small. A bigger box would fix it.",
            "type": "plausible_incomplete",
            "feedback": "A bigger box would hold more. It would not help kids find things."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "You have three ideas to help kids find their things. Which one do you try first?",
        "choices": [
          {
            "id": "fw3-7",
            "text": "Take photos of lost items and make a hallway photo board.",
            "type": "multiple_defensible",
            "feedback": "Everyone sees what is lost all week. Making photos and updating the board takes time."
          },
          {
            "id": "fw3-8",
            "text": "Set up a Friday table where kids can look for ten minutes.",
            "type": "multiple_defensible",
            "feedback": "It is simple and gives kids a real chance to look. It only works on Fridays."
          },
          {
            "id": "fw3-9",
            "text": "Hold a name-label day with stickers for coats and boxes.",
            "type": "multiple_defensible",
            "feedback": "This stops lost things before they start. It does not help what is in the box."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "Before you change the school, what is the best next step?",
        "choices": [
          {
            "id": "fw3-10",
            "text": "Try the photo board for two weeks and count what gets claimed.",
            "type": "responsible",
            "feedback": "Counting shows whether it works. The kids' answers tell you what to improve."
          },
          {
            "id": "fw3-11",
            "text": "Try the Friday table for three weeks. Compare pickups each week.",
            "type": "multiple_defensible",
            "feedback": "A few weeks of counting gives real numbers. You can switch ideas if it fails."
          },
          {
            "id": "fw3-12",
            "text": "Throw out everything that looks old. Start with a clean box.",
            "type": "unsafe",
            "feedback": "Those things belong to someone, and kids may still look. Ask before tossing anything."
          },
          {
            "id": "fw3-13",
            "text": "Ask the office staff for a wall board and photo helpers.",
            "type": "seek_help",
            "feedback": "Office adults can approve a spot. They can help make it work."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "Think about something you lost and got back. How did it feel? How could the school help that happen more?",
        "freeReflection": true
      }
    ] },
    { steps: [
      {
        "key": "recognize",
        "prompt": "On her first day, new student Ana got lost twice. The hallways all look alike. What do you do first?",
        "choices": [
          {
            "id": "fw4-1",
            "text": "Ask two new kids what was hard and what helped.",
            "type": "responsible",
            "feedback": "Kids who joined lately remember how it felt and what helped."
          },
          {
            "id": "fw4-2",
            "text": "Ask only kids who have been here since kindergarten.",
            "type": "plausible_incomplete",
            "feedback": "They know the building but may forget being new. New kids can tell you more."
          },
          {
            "id": "fw4-3",
            "text": "Tell new kids to just ask for help on day one.",
            "type": "plausible_incomplete",
            "feedback": "Asking is hard when you do not know who to ask. Telling them fixes nothing."
          }
        ]
      },
      {
        "key": "impact",
        "prompt": "Ana says the signs make sense only if you know the school. What is the real problem?",
        "choices": [
          {
            "id": "fw4-4",
            "text": "Signs and maps only work for kids who know the school.",
            "type": "responsible",
            "feedback": "That is what is going wrong. Your ideas can make the school clearer."
          },
          {
            "id": "fw4-5",
            "text": "New kids are too shy to ask, so they feel lost.",
            "type": "plausible_incomplete",
            "feedback": "New kids said the signs confuse them. Clearer signs would help shy kids too."
          },
          {
            "id": "fw4-6",
            "text": "Teachers give too few directions, so it is their job to fix.",
            "type": "plausible_incomplete",
            "feedback": "Teachers help a lot, but they cannot walk every new kid around. Signs help every day."
          }
        ]
      },
      {
        "key": "consider",
        "prompt": "You have three ideas to help new kids. Which one do you try first?",
        "choices": [
          {
            "id": "fw4-7",
            "text": "Draw a map with each hallway in its own color.",
            "type": "multiple_defensible",
            "feedback": "A map helps right away. It only works if kids read it and carry it."
          },
          {
            "id": "fw4-8",
            "text": "Give each new student a buddy for the first week.",
            "type": "multiple_defensible",
            "feedback": "A buddy gives kindness and directions. It needs ready helpers and a way to match them."
          },
          {
            "id": "fw4-9",
            "text": "Make a first-week passport with a stamp for each place.",
            "type": "multiple_defensible",
            "feedback": "Learning the school feels like a game. It takes time to make, and kids must bring it."
          }
        ]
      },
      {
        "key": "choose",
        "prompt": "Before you change things, what is the best next step?",
        "choices": [
          {
            "id": "fw4-10",
            "text": "Test your map with a new student, then fix what is missing.",
            "type": "responsible",
            "feedback": "A real test shows what you missed. Fixing it helps every new student."
          },
          {
            "id": "fw4-11",
            "text": "Have a buddy guide one new student through the passport.",
            "type": "multiple_defensible",
            "feedback": "You learn what works and what confuses. The buddy practices helping, too."
          },
          {
            "id": "fw4-12",
            "text": "Paint colored lines on the hallway floors during lunch.",
            "type": "unsafe",
            "feedback": "Painting school floors without permission could cause damage. Big changes need an adult's yes first."
          },
          {
            "id": "fw4-13",
            "text": "Ask the counselor to help match buddies and try your map.",
            "type": "seek_help",
            "feedback": "The counselor knows the new students. They can help your idea reach them."
          }
        ]
      },
      {
        "key": "reflect",
        "prompt": "Think about a time you were new. What helped you feel welcome? What do you wish someone had done?",
        "freeReflection": true
      }
    ] },
  ];

  fetch('/api/brain-games/me/progress').then((r) => {
    if (!r.ok) {
      document.getElementById('loginHint').textContent =
        'Playing without an account or classroom login, so progress won\'t be saved.';
    }
  }).catch(() => {});

  FnEngineSDK.run({
    container: document.getElementById('mount'),
    engineName: 'branchingScenario',
    engineVersion: 1,
    contentPack,
    band,
    activityId: 'fix-it-workshop-design-cycle',
    header: {
      icon: '🛠️',
      title: 'Fix-It Workshop',
      description: 'Find a problem at school, listen to the people it affects, and try a small fix.',
    },
  });
</script>
</body>
</html>
